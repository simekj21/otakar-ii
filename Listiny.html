 Rapoto, Wulfing, Konrad a Konrand von Altenburg vzdali cisterciáckému klášteru v Lilienfeldu. PO II také poskytl kompenzaci Dietrichu von Hohenbergovi za jeho nároky na 30. tal. příjmy ve Stranzendorfu (Dolní Rakousko od Vídně) pro bratry Rapoto, W na", "kurzes_regest": "PO II. hat eine bis heute nichte erhaltene Urkunde (Instrument) über die Besitze bei Türnitz (bei Lilienfeld) ausgestellt, die von Brüder Rapoto, Wulfing, Konrad und Konrand von Altenburg dem Zisterzienserkloster Lilienfeld verzichtet wurden. PO II. gab auch dem Dietrich von Hohenberg die Entschädigung für seine Ansprüche von 30. tal. Einkünften in Stranzendorf (nö. von Wien) für Brüder Rapoto, W auf den", "beschenkte_institution_text": "Brüder Rapoto, Wulfing, Konrad und Konrand von Altenburg; Dietrich von Hohenberg", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "12.2.1258", "lokalitat_name": "Wien", "cs-verze": "(Rapoto Wulfing, Konrad a Konrad bratři z Altenburgu), se vzdávají svých nároků vůči opatství Lilienfeld (Lylienvelde) na určité majetky výměnou za náhradu, o níž byla vydána i listina panovníka Přemysla Otakara. Ottokar je jedním ze svědků tohoto dokumentu", "kurzes_regest": "(Rapoto Wulfing, Konrad und Konrad Brüder von Altenburg), verzichten auf ihre Ansprüche gegenüber Kloster Lilienfeld )Lylienvelde) auf den bestimte Besitze gegen eine Entschädigung, worüber auch eine landesfürstliche Ottokars Urkunde ausgefertigt wurde. Ottokar ist unter der Zeugen dieser Urkunde", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "13.2.1258", "lokalitat_name": "Wien", "cs-verze": "Dietrich z Hohenbergu se zříká všech nároků vůči klášteru Lilienfeld na majetek (částečně dotýkající se předchozí Urky), o který se on a jeho předkové hádali s klášterem v Lilienfeldu, výměnou za náhradu 30 talů. příjem ve Stranzindorfu, PO II uveden. PO II byl také svědkem tohoto dokumentu", "kurzes_regest": "Dietrich von Hohenberg verzichtet auf alle Ansprüche gegenüber dem Kloster Lilienfeld auf Besitze (die vorige Urk. teilweise berührend) , über welche er und seine Vorfahren im Streit mit dem Kloster Lilienfeld waren, gegen eine Entschädigung von 30 tal. Einkünften in Stranzindorf, die PO II gegeben. PO II war auch der Zeuge dieser Urkunde", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "(am wahrscheinlich um 12.-13.2. ) 1258", "lokalitat_name": null, "cs-verze": "PO II potvrzuje darování čtyř panství v Güntersdorfu Alberem ́ von Niederleiss (Leiss - Liezze) opatství Heiligenkreuz", "kurzes_regest": "PO II bestätigt die Schenkung von vier Mansen zu Guntersdorf von Seite Albero´s von Niederleiss (Leiss - Liezze) an die Abbtei Heiligenkreuz", "beschenkte_institution_text": "Heiligenkreuz, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "25.3.1258+", "lokalitat_name": "Písek", "cs-verze": "PO II potvrzuje výměnu vsi břevnovského kláštera Sebranice a Sobotice Bohušů mezi Martinem opatem z Břevnova a Bohušem, synem šlechtice Cerha/Crha.", "kurzes_regest": "PO II. bestätigt den Tausch des Dorfes des Břevnover Klosters Sebranice (u Blanska) und Sobotice des Bohušs (u Brna) zwischen Martin Abt von Břevnov und Bohuš Sohn des Adeligen Cerho/Crha.", "beschenkte_institution_text": "Břevnov, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "12.5.1258 und 24. 51255", "lokalitat_name": "Wien", "cs-verze": "V tomto zákoně byl ve Vídni vysvěcen nově zvolený biskup Jan Pražský, Druhé pokračování Kosmovo str. 295 se o přítomnosti Přemysla Otakara nezmiňuje. V prvním Urk. Otto biskup pasovský, řezenský biskup Albert a hanrichský biskup Jatwesoniensis (Wersoviensis) v Litvě se souhlasem arcibiskupa Gerharda Mohučského s olomouckým biskupem Brunem dosvědčili, že Jan Elekt-biskup pražský byl vysvěcen. Ve druhém Urk. od tohoto dne Otto Bischof dosvědčuje, že tento akt nezakládá nárok na metropolitní právo arcibiskupů salcburského a mohučského. Ve třetím dokumentu je potvrzen tentýž Bruno, biskup olomoucký.", "kurzes_regest": "Im diesem Tat wurder der Bischof-Elekt Johann von Prag in Wien geweiht, Druhé pokračování Kosmovo s. 295 erwähnt nicht die Anwesenheit Ottokars. In ersten Urk. Otto Bischof von Passau, Albert Bischof von Regensburg und Hanrich Bischof Jatwesoniensis (Wersoviensis) im Litauen mit der Zustimmung des Erzbischofs Gerhard von Mainz mit dem Bruno, Bischof von Olomouc/Olmütz bezeugten, dass Johann Elekt-Bischof von Prag geweiht wurde. In der zweiten Urk. aus diesem Tag bezeugt Otto Bischof, dass dieser Akt keinen Anspruch gegen Metropolitanrecht der Erzbischöfe von Salzburg und Mainz gründet. Im driten Urkunde bestätigt dieselbe Bruno Bischof von Olmütz.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "15.5. (1255 oder 1256, aber am wahrscheinlichsten 1258)", "lokalitat_name": "Zvíkov", "cs-verze": "PO II nařizuje soudci, Hercelinovi, Francovi a písaři Fridrichovi, Cunzovi z Altplazu (Antiquo foro), občanům města Brna, aby nevybírali městskou daň (censum vel exactionem vel precariam civitatis) od sestry Herburgské a od kláštera (cella b. Marie V. v Brně/Brně), protože tento klášter se nachází v prostoru za městem,  a je od těchto poplatků osvobozen.", "kurzes_regest": "PO II gebietet dem Richter, Hercelin, Franco, un dem Schreiber Friedrich, Cunzo von Altplaz (Antiquo foro) Bürgern der Stadt Brünn, damit sie von dem Herburger Schwester und von dem Konvent (cella b. Marie V. in Brno/Brünn, die Stadtabgabe (censum vel exactionem vel precariam civitatis) nicht antreiben, weil dieses Kloster von dieser Kloster ist im Areal ausser Stadt liegt, und von diesen Abgaben befreit ist.", "beschenkte_institution_text": "Brno, Herburger Kloster (cella b. Marie V.), Dominikanerinstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "23.5.1258", "lokalitat_name": "Uherské Hradiště", "cs-verze": "PO II, se souhlasem opata a cisterciáckého kláštera na Velehradě a s radou olomouckého biskupa Bruna a také pěti baronů Jindřicha z Lichtenštejna, Viléma z Hustopeče, Kammerlinga Parduse, jeho bratra Sudmíra a Jana z Vyšňové (Brunonis, u Olomucensisv episcopi, Henrici de Lichtenstein, Wilhelmi de Huztopecz, Parduzonis camerarii, Zudmiri fratris sui et loannis de Wishenowe iudicis nostri) zřizuje a uděluje různé svobody.", "kurzes_regest": "PO II legt mit Zustimmung des Abtes und des Zisterzienserkloster in Velehrad und mit dem Rat des Bischofs Bruno von Olmütz/Olomouc und auch der fünf Baronen Heinrich von Lichtenstein, Wilhelm von Hustopeč, Kammerling Pardus, seinen Bruder Sudmir und Johann von Vyšňová (Brunonis, u Olomucensisv episcopi, Henrici de Lichtenstein, Wilhelmi de Huztopecz, Parduzonis camerarii, Zudmiri fratris sui et loannis de Wishenowe iudicis nostri) fest und schenkt verschiedene Freiheiten.", "beschenkte_institution_text": "Velehrad, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "23.5.1258", "lokalitat_name": "Uherské Hradiště", "cs-verze": "PO II, se souhlasem opata a cisterciáckého kláštera na Velehradě a s radou olomouckého biskupa Bruna a také pěti baronů Jindřicha z Lichtenštejna, Viléma z Hustopeče, Kammerlinga Parduse, jeho bratra Sudmíra a Jana z Vyšňové (Brunonis, u Olomucensisv episcopi, Henrici de Lichtenstein, Wilhelmi de Huztopecz, Parduzonis camerarii, Zudmiri fratris sui et loannis de Wishenowe iudicis nostri) zřizuje a uděluje různé svobody.", "kurzes_regest": "PO II legt mit Zustimmung des Abtes und des Zisterzienserkloster in Velehrad und mit dem Rat des Bischofs Bruno von Olmütz/Olomouc und auch der fünf Baronen Heinrich von Lichtenstein, Wilhelm von Hustopeč, Kammerling Pardus, seinen Bruder Sudmir und Johann von Vyšňová (Brunonis, u Olomucensisv episcopi, Henrici de Lichtenstein, Wilhelmi de Huztopecz, Parduzonis camerarii, Zudmiri fratris sui et loannis de Wishenowe iudicis nostri) fest und schenkt verschiedene Freiheiten.", "beschenkte_institution_text": "Uherské Hradiště, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "22.7. (am wahrscheinlichsten 1258, ganz nicht ausgeschlossen ist auch Jahr 1259", "lokalitat_name": "Wien", "cs-verze": null, "kurzes_regest": "PO II erklärt, dass, nach dem er mit dem Herzog Heinrich von Bayern den Vertrag geschlossen hatte, verziehe den Ministerialen des Erzbistums Salzburg den Schuld (culpam), die PO II gegen sie wegen ihres (feindlichen) Benehmens bei Mühldorf hatte, aber nicht Ihren Schuld gegen den Philipp Erzbischof-Elekt von Salzburg", "beschenkte_institution_text": "Salzburg, erzbischöfliche Ministerialen (Rundschreiben?)", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "(Am Anfang d. J. 1258 vor 1.2. / oder um 6.8.)1258", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II schenkt der Prager Domkirche als sein Vater Wenzel I. den Einzug der königlichen Abgaben (mensura regalis), die \"čtvrtně\" sind gennant, in Prager Stadt, und bestimt, das jeder für eine in der Prager Stadt verkaufte Flasche der Prager Domkirche ein \"obulus Pragensis monete\" bezahlen müssen.", "beschenkte_institution_text": "Praha, Domkirche", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "6.8.1258++ falsch ist nur teil der Urk.", "lokalitat_name": "Křivoklát", "cs-verze": "PO II přiznává městu Jevíčko a zejména soudci, jehož soudce tato práva přiznává", "kurzes_regest": "PO II erteilt der Stadt Jevíčko und vor allem dem Richter deren Richter die genannte Rechte", "beschenkte_institution_text": "Jevíčko, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "August (nach 6.8) 1258", "lokalitat_name": "Loket", "cs-verze": "Řád II. táhl do západních Čech k hranicím s Vogtlandem a Chebeckem (Umbeburng von Elbogen (Loket) a podrobil si pány Heinricha von Weida, Heinricha von Gera a Heinricha von Plauen.", "kurzes_regest": "PO II. zog nach Westböhmen zur Grenzem mit Vogtland und Egerland (die Umbeburng von Elbogen (Loket) und unterwarf den Herren Heinrich von Weida, Heinrich von Gera und Heinrich von Plauen.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "(Vor 1.10.1258)", "lokalitat_name": null, "cs-verze": "PO II přikazuje (speciali mandato) biskupovi Janu Pražskému a pražskému purkrabímu Jarošovi, aby prošetřili privilegia vyšehradského katedrálního kostela kvůli právům zdejšího kustoda Bartoloměje/Bartoloměje, který byl ve sporu s proboštem Vladislavem z Vyšehradu Var", "kurzes_regest": "PO II. gebietet (speciali mandato) dem Bischof Johann von Prag und Prager Burggraf Jaroš, damit sie die Privilegien der Vyšehrader Domkirche wegen der Rechte des dortigen Kustods Bartoloměj/Bartolomeus untersuchen, der im Streit mit dem Probst Vladislav von Vyšehrad Var", "beschenkte_institution_text": "Praha, Jaroš, Burggraf; Praha, Bischof Jan", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "(Kurz nach 1.10. sicher vor 17.10) 1258", "lokalitat_name": "Dobříš", "cs-verze": "PO II potvrzuje inzerované prohlášení biskupa Jana Pražského o právech vyšehradského kustoda Bartoloměje, jeho kaplana a jeho nástupce v kustodii vyšehradského kostela.", "kurzes_regest": "PO II bestätigt den inserierten Auspruch des Bischofs Johann von Prag über Rechte des Vyšehrader Kustodes Bartolomeus, seines Kaplan, und seines Nachfolger im Kustodsamt der Vyšehrader Kirche.", "beschenkte_institution_text": "Vyšehrad, Bartolomeus, Kustod der Vyšehrader Domkirche, Ottokars Kaplan", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "12.10.1258", "lokalitat_name": "Wels", "cs-verze": "Ulrich illustris regis Boemie prothonotarius, ecclesie sancti Andree in Frisiga (Freising) prohlašuje, že byl prokurátorem ve sporu mezi Ottou, biskupem pasovským, a Oldřichem kanovníkem z Freisingu. Rozhodčí soud byl dne 9.11.1258 v Brně/Brně", "kurzes_regest": "Ulrich illustris regis Boemie prothonotarius, ecclesie sancti Andree in Frisiga (Freising) erklärt dass er ein Prokurator im Streit ziwschen Otto bischof von Passau und Ulrich Kanoniker von Freising. Schiedgericht war am 9.11.1258 in Brno/Brünn", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "17.10.1258", "lokalitat_name": "Brno", "cs-verze": "PO II schvaluje rozhodnutí o patronátním právu kostela sv. Petra v Brně, o které se přel spor mezi klášterem v Tišnově a jeho abatyší na jedné straně a Albertem rektorem brněnského kostela sv. Petra v Brně, jmenovaným rozhodcem (se souhlasem olomouckého biskupa Bruna). PO II také potvrzuje Tišnovskému klášteru darování patronátních práv k tomuto kostelu od jeho otce Václava I.", "kurzes_regest": "PO II bewilligt den von (mit der Zustimmung Bischofs Bruno von Olmütz) bestimmten Schiedrichtern berurteilten Auschpruch über das Patronatsrecht der St. Peter-Kirche in Brno/Brünn, das streitig zwischen dem Kloster in Tišnov und dessen Äbtissin auf einer Seite und Albert Rektor der Brünner St. Peterskicher auf zweiter Seite war. PO II. bestätigt auch dem Kloster Tišnov die Schenkung des Patronatsrecht dieser Kirche von seinem Vater Wenzel I.", "beschenkte_institution_text": "Tišnov, Zisterzensienserinnenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "17.10.1258", "lokalitat_name": "Brno", "cs-verze": "PO II uděluje rozhodcům (Filipovi) opatovi skotského kláštera ve Vídni, minoritskému bratru Habernovi a mistru Gerhardu Pastorovi ve Vídni prohlášení o patronátu nad kostelem sv. Petra v Brně, který byl předmětem sporu mezi klášterem v Tišnově a jeho abatyší na jedné straně a Albertem rektorem brněnského kostela sv. Petra na straně druhé. Podle prohlášení náleží patronátní právo tišnovskému klášteru, ale rektor Albert si je může ponechat doživotně. Pád II požaduje, aby totéž potvrdil i olomoucký biskup Bruno.", "kurzes_regest": "PO II bewilligt den von bestimmten Schiedrichtern des (Philipp) Abtes des Schottenkloster in Wien, des Minoritenbruders Habern und Meister Gerhard Pfarrer in Wien Auschpruch über das Patronatsrecht der St. Peter-Kirche in Brno/Brünn, das streitig zwischen dem Kloster in Tišnov und dessen Äbtissin auf einer Seite und Albert Rektor der Brünner St. Peterskicher auf der zweiten Seite war. Nach dem Auspruch gehört das Patronatsrecht dem Kloster Tišnov aber Rektor Albert kann lebenslangig es halten.PO II. fordert, damit auch Bischof Bruno von Olmütz dasselbe bestätigt .", "beschenkte_institution_text": "Tišnov, Zisterzensienserinnenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "in mense Octobri (18/19-31.10) 1258", "lokalitat_name": "Wels", "cs-verze": "Na žádost místního opata Bertolda potvrzuje PO II. klášteru v Kremsmünsteru inzerovaný dokument vévody Leopolda (1189) o navrácení zboží ve Viechtwangu do kláštera Kremsmünster", "kurzes_regest": "PO II konfirmíert dem Kloster Kremsmünster auf der Bitte des dortigen Abtes Bertold die inserierte Urkunde Herzogs Leopolds (1189) über die Güterrückgabe in Viechtwang an das Stift Kremsmünster", "beschenkte_institution_text": "Kremsmünster, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "in mense Octobri (18/19-31.10) 1258", "lokalitat_name": "Wels", "cs-verze": "Na žádost místního opata (Bertolda) potvrzuje PO II. klášteru v Kremsmünsteru inzerovaný dokument vévody Fridricha II. (1236) o příjemcích ročních důchodů a vydání Vogtrechtského zákona.", "kurzes_regest": "PO II konfirmíert dem Kloster Kremsmünster auf der Bitte des dortigen Abtes (Bertold) die inserierte Urkunde Herzogs Friedrich II (1236) über die Gaber jährlicher Renten und Erlassung des Vogtrechtes.", "beschenkte_institution_text": "Kremsmünster, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "in mense Octobri (18/19-31.10) 1258", "lokalitat_name": "Wels", "cs-verze": "Na žádost místního opata Bertolda potvrzuje PO II. klášteru v Kremsmünsteru inzerovaný dokument vévody Fridricha II. (1236 - opět stejný Fridrichův dokument jako v předchozím potvrzení) o příjemcích ročních penzí a prominutí Vogtrechtu.", "kurzes_regest": "PO II konfirmíert dem Kloster Kremsmünster auf der Bitte des dortigen Abtes Bertold die inserierte Urkunde Herzogs Friedrich II (1236-nocheinmal dieselbe Friedrichs Urkunde als in der vorigen Konfirmation) über die Gaber jährlicher Renten und Erlassung des Vogtrechtes.", "beschenkte_institution_text": "Kremsmünster, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "2.11.1258", "lokalitat_name": "Jihlava", "cs-verze": "E(berhardus), T(itmarus), H(einricus), H(einricus) magistri monete tocius regni Bohemie iurati z města Jihlavy darovali a přičlenili špitál v Inglau opatovi Marsiliovi ze Želiva a faráři Štěpánovi (z kostela sv. Jakuba v Inglau).", "kurzes_regest": "E(berhardus), T(itmarus), H(einricus), H(einricus) magistri monete tocius regni Bohemie iurati der Stadt Iglau/Jihlava schenken und inkorporieren dem Abt Marsilius von Želiv udnd dem Pfarrer Stephan (der St.Jakob-Kirche in Inglau) das Spital in Inglau.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "(Vor 24.11.1258)", "lokalitat_name": null, "cs-verze": "PO II drží Jindřicha s úřadem Scheibera v Enns (Scriba Anasi) před 24.3.1255 a přikazuje mu, aby spojil roztříštěný Přemysl Otakarův v jednotnou enklávu (srov. záznam z 24.3.1255). Opat benediktinského kláštera Seitenstetten si však stěžoval u PO II a PO II ve své mandátní listině přikazuje Scriba Anasi Heinrich, aby opat mohl hájit své nároky a práva před zemským soudem v Ensu", "kurzes_regest": "PO II. bekleidet den Heinrich mit dem Amt Scheiber in Enns (Scriba Anasi) vor 24.3.1255 und gebietet ihm, damit die zersplitterte Ottokars Besitze in eine zusammenstehende Enklave vereint (vgl. Eintrag zum vor. 24.3.1255). Dagegen beklagte sich aber der Abt von Benediktinerkloster Seitenstetten bei PO II. und PO II. gebietet dem Scriba Anasi Heinrich in seinem Mandat-Urkunde, damit der Abt seine Ansprüche und Rechte vor dem Provinzialgericht in Ens beschützen kann", "beschenkte_institution_text": "Heinrich Schreiber in Enns", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "28.3.(1255-1257, 1259, am wahrscheinlichsten 1259)", "lokalitat_name": "Krems", "cs-verze": "PO II dominus regni Bohemie, dux Asustrie marchio Moravie prohlašuje, že opat a klášter ve Zwettlu si stěžovali, že tito úředníci se dvoří nad lidem (coloni) kláštera a tím klášter poškozují, proto PO II nařizuje úředníkům v Rakousku, aby propustili lid podle toho, jak je uvedeno v této listině, pokud k tomu nemají povolení nebo souhlas kláštera,  a vydej tyto lidi soudu tohoto kláštera.", "kurzes_regest": "PO II dominus regni Bohemie, dux Asustrie marchio Moravie erklärt, dass Abt und Konvent von Zwettl darüber sich beklagte, dass diese Beamten über Leute (coloni) des Kloster Gericht halten und damit das Kloster beschädigen, deshalb gebietet PO II. den Beamter in Österreich, damit sie die Leute nach dem Ansehen in dieser Urkundeentlassen, wenn sie dazu keine Bewilligung oder Zustimmung des Klosters haben, und diese Leute zum Gericht dieses Klosters übergeben.", "beschenkte_institution_text": "Zwettl, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "13. 4. (1257 oder wahrscheinlicher 1259)", "lokalitat_name": "Wien", "cs-verze": "PO II potvrzuje N(okolausovi), Probstu a klášteru Klosterneuburg jejich soudní svobody nad svým lidem", "kurzes_regest": "PO II bestättigt dem N(okolaus), Probst und der Stift Klosterneuburg ihre Gerichtsfreiheiten über seine Leute beurteilen", "beschenkte_institution_text": "Klosterneuburg, Augustiner-Chorherrenstift", "poII_aussteller": "ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "16.4.1259", "lokalitat_name": "Wien", "cs-verze": null, "kurzes_regest": "Wok/Vok von Rosenberg/Rožmberk, Marschall Böhmens bestätigt den Auschpruch der Schiedsgericht zwischen ihm und Bischof Otto von Passau über Burg Haichenberg. Schiedrichter dieses Streites waren Kadold der Waise/Sirotek, Otto von Haslau, Otto von Maissau, Konrad von Zagging, Heinricus de Merswanch.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "18.4.1259", "lokalitat_name": "Wien", "cs-verze": null, "kurzes_regest": "PO II befreit den Richter und die Bürger in St .Pölten von der Jährlichen Abgabe dem Richter der Stadt Wien", "beschenkte_institution_text": "St. Pölten, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "Vor 6.5.1259", "lokalitat_name": "Enns", "cs-verze": "PO II rozhoduje (actum), že potvrzuje Ukrunde pro benediktinský klášter v Erle", "kurzes_regest": "PO II. enstscheidet (actum), dass er die Ukrunde für das Benediktinerinnenkloster in Erla bestättigt", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "6.5.1259", "lokalitat_name": "Wels", "cs-verze": "Druhý řád potvrzuje benediktinskému klášteru v Erle privilegium rakouského vévody Fridricha II. na osvobození od cla a přikazuje jeho soudcům a úředníkům, aby toto nové právo respektovali.", "kurzes_regest": "PO II. bestätigt dem Benediktinerinnenkloster in Erla das Privilegium Herzogs Friedrich II. von Österreich über Zollfreiheit bestättigt und gebietet sienen Richtern und Beamter, damit sie dieses neues Recht sie respektieren.", "beschenkte_institution_text": "Erla, Benediktinerinnenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "10.5.1259", "lokalitat_name": "Wels", "cs-verze": "PO II potvrzuje notářskou listinu v Enns Heinrich (notarii Annasi) klášteru Seitenstetten", "kurzes_regest": "PO II konfirmiert dem Kloster Seitenstetten die Urkunde Notars in Enns Heinrich (notarii Annasi)", "beschenkte_institution_text": "Seitenstetten, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "Vor 27.7.1259", "lokalitat_name": "Hradec Králové", "cs-verze": "PO II rozhodl (actum), že udělil Ukrunde pro klášter v Litomyšli a dal práva novému městu Litomyšli", "kurzes_regest": "PO II. enstscheid (actum), dass er die Ukrunde für das Kloster in Litomyšl und gab die Rechte der neuen Stadt Litomyšl", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "27.7.1259", "lokalitat_name": "Praha", "cs-verze": "PO II přiznává premonstrátskému klášteru v Litomyšli všechna práva, která získal od svých předků, a zakládá práva města Litomyšle (volentes, ut civitas ipsorum in Lvthomicel omni iure et libertate gaudere debeat, qua nostre civitates per Boemiam sunt contente).", "kurzes_regest": "PO II erteilt der Prämonstratenserstift Litomyšl alle Rechte, die sie von seinen Vorfarhen bekamm, und legt die Rechte der Stadt Litomyšl fest (volentes, ut civitas ipsorum in Lvthomicel omni iure et libertate gaudere debeat, qua nostre civitates per Boemiam sunt contente).", "beschenkte_institution_text": "Litomyšl, Prämonstratenser-Chorherren-Stift; Litomyšl, Stadt", "poII_aussteller": "ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "27.7.1259++", "lokalitat_name": "Praha", "cs-verze": "Zákon PO II zakládá práva města Litomyšlského kláštera, obyvatel města a klášterního exilu (homines civitatis et monasterii) a potvrzuje všechna práva, která klášter získal od svých předků. Dal městu Litomyšl práva města Hradec Králové", "kurzes_regest": "PO II legt die Rechte der Stadt des Klosters Litomyšl, di Leute der Stadt und des Stiftes, eximiert (homines civitatis et monasterii, und bestätigt alle Rechte, die die Stift von seinen Vorfahren bekamen. Gab der Stadt Litomyšl die Rechte der Stadt Hradec Králové", "beschenkte_institution_text": "Litomyšl, Prämonstratenser-Chorherren-Stift; Litomyšl, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "(July) 1259", "lokalitat_name": "Praha", "cs-verze": "PO II. udělil svému kaplanu Barolomeovi, kustodovi a kanovníkovi na Vyšehradě, na jeho žádost rotundovou kapli na Vyšehradě, na královském dvoře (capellam nostram rotundam in Wissegrado in curia regis sitam) a dal souhlas k přenesení ostatků zlíchova.", "kurzes_regest": "PO II erteilt mit dem Zustimmung des Prager Bischofs Johann erteilt seinem Kaplan Barolomeus, Kustod und Kanoniker in Vyšehrad, auf dessen Bitten seine Rotundakapelle in Vyšehrad, in Königshof (capellam nostram rotundam in Wissegrado in curia regis sitam) und gab Zustimmung mit der Translatio der Reliquien von Zlíchov.", "beschenkte_institution_text": "Vyšehrad, Bartolomeus, Kustod der Vyšehrader Domkirche, Ottokars Kaplan", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "6.10.1259", "lokalitat_name": "Klosterneuburg", "cs-verze": "Na žádost svého kaplana Leopolda, rektora jeho kaple v Klosterneuburgu, PO II osvobozuje kapli Nejsvětější Trojice. Jana Křtitele z Klosterneuburgu od advokáta (Voigtamt) z Kastelane zu Greizenstein (Grischenstein, dnes Kreuzenstein) a přiděluje jej svrchovanému knížeti (sobě samému).", "kurzes_regest": "PO II befreit auf der Bitten seines Kaplans Leopold, Rektors seiner Kapelle in Klosterneuburg die Kapelledes heil. Johann des Täufers zu Klosterneuburg von der Advokatie (Voigtamt) der Kastelane zu Greizenstein (Grischenstein, heute Kreuzenstein) und teilt sie dem Landesfürsten (selbst) zu.", "beschenkte_institution_text": "Klosterneuburg, Augustiner-Chorherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "16.10.1259", "lokalitat_name": "Wien", "cs-verze": "PO II. vyzývá pasovského biskupa Ottu, aby provedl šetření (vizitace všech konventních a farních kostelů, a za tím účelem jmenuje delegáty, vídeňského faráře Gerhada a Konráda von Zagginga, kteří mají biskupa doprovázet.", "kurzes_regest": "PO II., fordert den Bischof Otto von Passau auf zu einer Untersuchung (Visitation aller Conventual- und Pfarrkirchen, und bestimmt seinerseits hiezu Abgeordnete den Pfarrer von Wien Gerhad, und den Konrad von Zagging, die den Bischof begleiten sollen.", "beschenkte_institution_text": "Passau, Bistum und Bischof Otto", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "16.10. (1259)", "lokalitat_name": "Wien", "cs-verze": "PO II žádá uherského krále Bélu IV., aby zaplatil odškodnění zvláštnímu kaplanovi (a plebanovi/pastorovi Vídně) magistra Gerharda Ottakara, který byl oloupen v Graslubu (mezi St. Lambrechtem a Neumarktem v Horním Štýrsku poblíž hranic s Korutany)", "kurzes_regest": "PO II ersucht den König Bela IV. von Ungarn , dem Magister Gerhard Ottakars speziellen Kaplan (und Pleban/Pfarrer zu Wien), der zu Graslub (zwischen St. Lambrecht und Neumarkt in Obersteiermark bei Grenze mit Kärnten) ausgeraubt worden, Schadenersatz zu ver schaffen", "beschenkte_institution_text": "Wien, Pfarrer in Wien", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "17.11.1259", "lokalitat_name": "Krems", "cs-verze": "Občanská sbírka II. uděluje svým obyvatelům v Emmersdorfu práva, která mají měšťané v Kremži a ve Steinu na řece Donnau a na jiných řekách.", "kurzes_regest": "PO II erteilt seiner Leuten in Emmersdorf Rechte, die die Bürger in Krems und in Stein auf dem Fluss Donnau und auf anderen Flussen haben.", "beschenkte_institution_text": "Emmersdorf, Leute", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "17.11.1259", "lokalitat_name": "Krems", "cs-verze": "PO II, aby se jeho lid mohl za určitých podmínek oženit s lidmi z kláštera v Tegersee", "kurzes_regest": "PO II bewilligt, damit seine Leute mit den Leuten des Klosters in Tegersee unter den bestimmten Bedinungen heiraten können", "beschenkte_institution_text": "Tegernsee, Benediktinerkloster in Bayern", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "17.11.(1254, 1255, 1256, 1258, am wahrscheinlichsten 1259)", "lokalitat_name": "Krems", "cs-verze": "PO II přikazuje (mandamus) Heinrichu von Panbruck (Tamprvkke), aby nenechával Ottovskému biskupovi pasovskému ve svém vlastnictví Wieselburg an der Erlauf (Wiselburch) jako Voigta, protože PO II tento majetek z Vogtamtu úplně vyjímá.", "kurzes_regest": "PO II gebietet (mandamus) dem Heinrich von Panbruck(Tamprvkke), damit er den Otto Bischof von Passau in seinem Besitz Wieselburg an der Erlauf (Wiselburch) als Voigt nicht, weil PO II. dieses Besitz von Vogtamt ganz befreit .", "beschenkte_institution_text": "Heinrich von Panbruck; Otto Bischof von Passau", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "(Um 28.3. oder am wahrscheinlichsten kurz vor oder genau 17.11.) 1259+", "lokalitat_name": "Krems", "cs-verze": "PO II listiny ve sporu mezi opatem ze Zwettlu a Rembert quondam officialem suum von Großotten (de Otten) a převádí rozhodnutí na Heinricha Schenka (Heinrico dapifero), Bertholda Toschloni de Winna et fratri Chunrado etemosinario. Rembert a jeho žena se zříkají svých nároků a spojí své síly za 30 talů. aby opata dále neobtěžoval.", "kurzes_regest": "PO II urkundet im Streit zwischen dem Abt von Zwettl und Rembert quondam officialem suum von Großotten (de Otten) und überträgt die Entscheidung an Heinrich Schenk (Heinrico dapifero), Bertholdo Toschloni de Winna et fratri Chunrado etemosinario. Rembert und seine Frau verzichten auf ihre Ansprüche und verbinden sich für 30 tal. den Abt nicht weiter zu belästigen.", "beschenkte_institution_text": "Zwettl, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "(wahrscheinlicher ist aber 18. 11) 17.11.1259", "lokalitat_name": "Znojmo", "cs-verze": null, "kurzes_regest": "PO II erkann das Zeugnis an, dass bestimmte Abgabe und Mautabgabe (decima decime nostre thelonei et census der (Mariä Geburt)Kirche Hlubčice /Głubczyce gehört, und gebietet (mandavimus) diese Abgabe sienen Kaplan Elias (Elye) und seien Nafolgern (also den Johannitern in Gröbnig) geben.", "beschenkte_institution_text": "Grobniki, Johanniten", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "2.12.1259", "lokalitat_name": "Zwettl", "cs-verze": null, "kurzes_regest": "PO II gebietet seinen Beamten (officialium suorum), damit sie Leute des Klosters Zwettl nich vor dem Gericht ziehen, ausser vor dem Herzog selbst oder vor von ihm bestimmtes Person Wohl der geschlossener Mandat.", "beschenkte_institution_text": "Zwettl, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "Nach Juny, wahrscheinlich Ende des Jahres 1259", "lokalitat_name": null, "cs-verze": "Občanská pobočka II posílá své vojsko na území salcburského arcibiskupství na podporu Filipa", "kurzes_regest": "PO II schickt seine Truppe in Salzburger Erzstiftsgebiet weger der Philipps Unterstützung", "beschenkte_institution_text": null, "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "Winter 1259/1260 (vor 30.1.1260)", "lokalitat_name": "Wien", "cs-verze": "PO II vzal štýrské ministeriály na radu hraběte Otto von Hardegga a pod svou ochranu rakouskou šlechtu a drobnou šlechtu moravské šlechty. PO II vyslal hraběte Otto von Hardegg do Štýrska do Vídně s vojskem a dalšími rakouskými a štýrskými šlechtici. Občanská platforma se však ještě nestala vládcem Štýrska.", "kurzes_regest": "PO II. nahm die steierische Ministerialen unter dem Rat des Grafen Otto von Hardegg und der österreichischen Adeligen und der kleinen Mänge der mährischen Adeligen in seinen Schutz. PO II. schickte in Wien den Grafen Otto von Hardegg nach Steiermark mit der Trupen und anderen österreichischen und steierischen Adelige Steiermark Nur Pettau (Ptuj) und andere Burgen bleiben noch in den ungarischen Hand. aber PO noch nicht der Herscherr Steiermarks wurde.", "beschenkte_institution_text": "Graf Otto von Hardegg - steierische Ministerialen", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "23.1. am wahrscheinlichsten 1260 (ganz auschliessen ist auch nicht das Jahr 1259", "lokalitat_name": "Gaming", "cs-verze": "PO II přikazuje svým úředníkům v Rakousku, aby lidé z pasovské diecéze chodili před dvůr pasovského biskupa, a ne před druhý soud, pokud chtějí přemyšští úředníci v Rakousku držet tyto lidi mimo soud", "kurzes_regest": "PO II gebietet seinen Beamten in Österreich, dass die Leute des Passauer Bistums nur vor dem Gericht des Bischofs von Passau ziehen sollen, und nicht vor dem anderen Gericht, falls die Ottokars Beamter in Österreich diese Leuten von Gericht halten möchten", "beschenkte_institution_text": "Passau, Bistum und Bischof Otto; österreichische Ottokarsbeamter", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "Zwischen November 1251-8.1.1260", "lokalitat_name": null, "cs-verze": "PO II přebírá hrad Ried am Riederberg od Albera V. z Kuenring-Dürnsteinu za účelem zástavy města Zwettl a získání léna obce Rossatz", "kurzes_regest": "PO II. übernimmt von dem Albero V. von Kuenring-Dürnstein die Burg Ried am Riederberg für die Verpfändung der Stadt Zwettl und die Belehnung des Dorfes Rossatz", "beschenkte_institution_text": "Albero V. von Kuenring-Dürnstein", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "30.1.1260", "lokalitat_name": "Wien", "cs-verze": "PO II dominus regni Boemie, dux Austrie et marchio Moravie, uděluje hraběti Otto von Hadegg, aby jeho manželka Valpurgis (dcera Oldřicha von Helfenstein) a jeho manželka po Ottově smrti mohly nadále držet celou jeho \"léno\", kterou Otto považoval za Přemysla Ottokara, \"feudali titulo. Jedná se o léna Raab, Leitzersdorf, Pulkau, Obermarkesdorf, Senning, Retz Weiden nebo Oberweiden", "kurzes_regest": "PO II dominus regni Boemie, dux Austrie et marchio Moravie, erteilt den Grafen Otto von Hadegg, damit seine Gattin Valpurgis (die Tochter Ulrichs von Helfenstein) und seine nach dem Ottos Tod alle seine \"feuda\", der Otto von dem Ottokar hielt, weiter \"feudali titulo halten. Es handetl sich um Lehen Raabs, Leitzersdorf, Pulkau, Obermarkesdorf, Senning, Retz Weiden oder Oberweiden", "beschenkte_institution_text": "Graf Otto von Hardegg", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "9.2.1260+", "lokalitat_name": "Wien", "cs-verze": "PO II \"dominus regni Bemie, dux Austrie et Stirie, marchio Morauie\" dává svým výběrčím daní v Rakousku příkaz, aby nevyžadovali žádné daně ani služby od skotského kláštera ve Vídni.", "kurzes_regest": "PO II \"dominus regni Bemie, dux Austrie et Stirie, marchio Morauie\" erteilt seinen Steuereinnehmern in Österreich den Befehl von dem Schottenkloster in Wien oder seien Untertanen keinerlei Abgaben oder leistungen zu fordern.", "beschenkte_institution_text": "Wien, Schottenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "13.2.1260", "lokalitat_name": "Sitzenberg", "cs-verze": "PO II \"dominus regni Boemie, dux Austrie et marchio Moravie\" se souhlasem své manželky uděluje kostelu v Leobendorfu patronátní právo nad (velmistrem) a špitálními bratry z řádu německých rytířů", "kurzes_regest": "PO II \"dominus regni Boemie, dux Austrie et marchio Moravie\" erteilt mit dem Zustimmung seiner Gattin dem (Gross)meister und den Spitalbruders des Deutschen Ordens die Kirche in Leobendorf mit dem Patronats recht", "beschenkte_institution_text": "Deutsches Orden (wohl in Wien)", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "(Nach 14.2.-um 4.3. 10.3.) 1260", "lokalitat_name": "Křivoklát", "cs-verze": "PO II dominus regni Bohemorum, dux Austrie, marchio Moravie, klášter ve Waldsassenu imunitu před světským soudem v Žatci a na dalších místech - již udělenou jeho otcem králem Václavem - a také daně pro dvůr za rány a další závazky, zejména mýtné v řece Egrovi/Ohři.", "kurzes_regest": "PO II dominus regni Bohemorum, dux Austrie, marchio Moravie, dem Kloster in Waldsassen die - schon von seinem Vater König Wenzel erteilte - Imunität von dem weltlichen Gericht in Žatec und anderen Orten, sowie von Abgaben für das Gericht für die Verwundeng und von anderen Pflichten, vor allem Maut in Flus Egra/Ohře.", "beschenkte_institution_text": "Waldsassen, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "4.3.1260", "lokalitat_name": null, "cs-verze": "PO II táhl z Čech se svým vojskem proti Uhrám. Když se tito vojáci potulovali po Osmanských říších, plenili.", "kurzes_regest": "PO II zog aus Böhmen mit seinen Truppen gegen Ungarn. Als diese Soldaten die Ottokars Länder durchgingern, sie plünderten.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "nach Mai 1254- vor. April 1260", "lokalitat_name": "????", "cs-verze": "PO II \"dominus Bohemie, dux Austrie et Marchio Moravie\" potvrdil svatofrantiškánskému špitálu vlastnictví obce Jeneč a patronátní právo v Řevnicích, které Přemyslův otec král Václav I. věnoval této nemocnici ve své zde inzerované listině.", "kurzes_regest": "PO II\"dominus Bohemie, dux Austrie et Marchio Moravie\" dem St. Franziskanerspital ihr Besitz das Dorf Jeneč und das Patronatsrecht in Řevnice bestätigt, die Ottokars Vater König Wenzel I. diesem Spital in seiner hier inserierten Urkunde schenkt.", "beschenkte_institution_text": "Praha, Franziskaner St. Franziskus-Spital (Kloster) in Prag.", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "1259-vor März/April 1260", "lokalitat_name": "Rohr", "cs-verze": "Na Přemyslovu žádost potvrzuje Bertold Marschall von Treun svou poslední vůli před válkou s Maďary.", "kurzes_regest": "Bertold Marschall von Treun bestätigt auf Forderung Ottokars sein Testament vor dem Krieg mit den Ungarn.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -309657600000, "lokalitat_name": null, "cs-verze": "PO II \"dominus regni Boemie, dux Austrie et Styrie, marchio Morauie\" bere klášter Reun pod svou ochranu a potvrzuje jeho svobody", "kurzes_regest": "PO II \"dominus regni Boemie, dux Austrie et Styrie, marchio Morauie\" nimmt das Kloster Rein/Reun in seinem Schutz und bestätigt dessen Freiheiten", "beschenkte_institution_text": "Zisterzienserstift Rein/Reun", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "19/21.3.1260 (datum)", "lokalitat_name": "Wien", "cs-verze": "PO II \"dominus regni Boemie, dux Austrie et Marchio Morauie\" pověřuje Konráda von Zagging urovnáním starého sporu (antiquo lis et controversia) mezi obyvateli (Groß-)Jedlersdorfu a opatství Klosterneuburg na naléhavou žádost probošta Nikolause z kláštera Klosterneuburg, o němž je tento dokument potvrzen v Leopoldau (Alpitowe) za přítomnosti probošta.", "kurzes_regest": "PO II \"dominus regni Boemie, dux Austrie et Marchio Morauie\" bestimmt Konrad von Zagging dazu, den alten Streit (antiquo lis et controversia) zwischen den Einwohnern von (Groß-)Jedlersdorf und dem Stift Klosterneuburg auf dringendes Bitten Propst Nikolaus des Stiftes Klosterneuburg, beizulegen, worüber die vorliegende Urkunde in Leopoldau (Alpitowe) unter Anwesenheit des Propstes bestätigt wird.", "beschenkte_institution_text": "Klosterneuburg, Augustiner Chorherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "4.4.1260", "lokalitat_name": "Písek", "cs-verze": "PO II. dominus regni Boemie, dux Austrie et Stirie, markýza Moravie, uděluje občanům města Opavy/Troppau desátek z hospod.", "kurzes_regest": "PO II. dominus regni Boemie, dux Austrie et Stirie, marchioque Moravie, bewilligt den Bürgern der Stadt Opava/Troppau das Zehnt aus Kneipen.", "beschenkte_institution_text": "Opava, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "26.4.1260", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II. dominus regni Boemie dux Austrie et Stirie, marchioque Moravie, erteilt dem Kloster Břevnov und dem dortigen Abt Martin das Land der Köche \"terra cocorum\" im Dorf Kuromrtvy (das untergegangene Dorf bei Ruzyně.)", "beschenkte_institution_text": "Benediktinerkloster Břevnov/Brewnow", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "26.4.1260", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II. bestätigt auf Bitte des Bischofs Brunno von Olmütz/Olomouc, Dekans Herbord und Probst von Olmütz den Testament des schon gestorbenen Probstes Nikolaus von Olmütz (+1.3.1260?) über die Schenkung des Hofes in Prag (Prag) und zwei Dörfer Nenakonice (Olmützer Teil), Rudeč (Mittelböhmen)", "beschenkte_institution_text": "Olomouc, Domkapitel", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "24.5.1260", "lokalitat_name": "Linz", "cs-verze": "PO II. dominus regni Boemie, dux Austrie et Stirie, markýza Moravie, přikazuje Jindřichovi z Lichtenštejna, hejtmanu (capitaneo) štýrského, aby chránil majetek kláštera Rein, jmenovitě hradu Helfenstein, v jejich právech a svobodách proti vetřelcům.", "kurzes_regest": "PO II. dominus regni Boemie, dux Austrie et Stirie, marchioque Moravie, gebietet dem Heinrich von Liechtenstein Hauptmann (capitaneo) Steiermarks , damit er die Besitze des Klosters Rein, namentlich die Burg Helfenstein in ihren Rechten und Freiheiten contra invasores schützt.", "beschenkte_institution_text": "Rein, Zisterzienserstift; Hauptmann von ..., Heinrich von Liechtenstein Hauptmann (capitaneo)", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Juny 1260", "lokalitat_name": "Vyšší Brod", "cs-verze": "Vok z Rožmberka, maršálek Království českého, a jeho manželka (Hedvika) potvrzují dřívější dary cisterciáckému klášteru ve Vyšším Brodě a darují nový. Je velmi pravděpodobné, že tento dar závisí na jeho podílu v následné válce s Maďarskem", "kurzes_regest": "Vok von Rosenberg/Rožmberk, Marschall des Königreiches Böhmen bestätigt mit seiner Gattin (Hedwig) dem Zisterzienserkloster Vyšší Brod frühere Schenkungen und schenkt neu . Sehr wahrscheinlich hängt diese Schenkung mit seiner Anteil an den nachfolgenden Krieg mit Ungarn", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "29.6.1260", "lokalitat_name": "Znojmo", "cs-verze": "Ekhard z Miroslavě uděluje cisterciáckému klášteru v Oslavanech patronátní právo v Troskovicích. Je možné, že tato donace závisí na jeho podílu v následné válce s Uhrami (jako Vok z Rožmberka)", "kurzes_regest": "Ekhard von Miroslav erteilt dem Zisterzienninnenserkloster in Oslavany das Patronatsrecht in Troskovice. Möglicherweise hängt diese Schenkung mit seiner Anteil an den nachfolgenden Krieg mit Ungarn (als Vok von Rosenberg)", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "29.6.1260", "lokalitat_name": "Oslavany", "cs-verze": "Vilém Strážce minoritů v Laa dosvědčuje, že Hartleb z Myslibořic daruje patronátní právo v Myslibořicích a sex laneorum v Troskovicích cisterciáckému klášteru v Oslavanech. Je možné, že tato donace závisí na jeho podílu v následné válce s Uhrami (jako Vok z Rožmberka)", "kurzes_regest": "Wilhelm guardianus der Minoriten in Laa bezeugt, dass Hartleb von Myslibořice schenkt dem Zisterzienserinnenkloster in Oslavany das Patronatsrecht in Myslibořice und sex laneorum in Troskovice .Möglicherweise hängt diese Schenkung mit seiner Anteil an den nachfolgenden Krieg mit Ungarn (als Vok von Rosenberg)", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "24.6.1260", "lokalitat_name": "Laa an der Thaya", "cs-verze": "PO II určuje okolí tohoto města a toto datum jako místo setkání a datum sběru svých vojsk. První rakouské jednotky stály před hradbami Laa, další ještě nebyly na místě setkání. (PO II. nebyl toho dne ještě v Laa.", "kurzes_regest": "PO II bestimmt die Umgebung dieser Stadt und dieses Datum als Sammlungsort und Sammlungstermin für seine Truppen. Als erste waren vor der Mauern Laa österreichische Truppen, andere noch nicht waren im Treffungspunkt. (PO II. war am diesem Tag bei Laa noch nicht.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "25.6.1260", "lokalitat_name": "Pohořelice", "cs-verze": "Olomoucký biskup Bruno byl s moravským a slezským vojskem knížetem Jindřichem Vratislavským a Vladislavem Opolským u Pohořelic.", "kurzes_regest": "Bischof Bruno von Olmütz/ Olomouc war mit mährischen und schlesischen Truppen Herzogen Heinrich von Breslau und Vladislav von Oppeln bei Pohořelice.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "26.6.1260", "lokalitat_name": "Laa an der Thaya", "cs-verze": "PO II už byl v tomto Tak táboře v Laa", "kurzes_regest": "PO II war schon in diesem Tak in Lager in Laa", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "26.6.1260", "lokalitat_name": "Staatz", "cs-verze": "Bitva u Stožc, v níž padli Oto a Konrád hrabata z Hardeggu/Hardecku (podle Druhého Kosmova pokračovatela a Otachera) a Ulrich Kraft a Kadolt Sirotek/Orpanus (podle Druhého pokračovatela a Otachera, po Otacherovi i Siegfried). Na bojiště dorazil PO II s pozdějším zpožděním po bitvě s biskupem Brunem z Olomouce a biskupem Ottou Braniborským.", "kurzes_regest": "Schlacht bei Stožce, in welcher Oto und Konrad Grafen von Hardegg/Hardeck (nach Druhý Kosmův pokračovatel und Otacher) und, Ulrich Kraft und Kadolt der Waise/Sirotek/Orpanus (nach Druhý pokračovatel und Otacher, nach Otacher auch Siegfried) gefallen. PO II. kam auf das Schlachtfeld mit der Verspätung nach der Schlacht mit dem Bischof Bruno von Olmütz/Olomouc und Magrafen Otto von Brandenburg.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "26.6.1260", "lokalitat_name": "Laa an der Thaya", "cs-verze": "Ze Staatz, PO II, se olomoucký biskup Bruno, markrabě Otto Braniborský přestěhovali zpět do táborů u Laa a Dyje", "kurzes_regest": "Von Staatz zog PO II., Bischof Bruno von Olmütz, Margraf Otto von Brandenburg zurück in die Lager bei Laa and der Thaya", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "(26.6.-4.7.)1260", "lokalitat_name": "Laa an der Thaya", "cs-verze": "PO II. a jeho manželka udělili léno Vokovi z Rožmberka s hrabstvím Raabs.", "kurzes_regest": "PO II. mit seiner Gattin belehnt den Vok von Rosenberg mit dem Grafschaft Raabs.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "4.7.1260", "lokalitat_name": "Laa an der Thaya", "cs-verze": "Zítra, v neděli, po mši svaté, opustil P. P. II. tábor v Laa an der Thaya, kam Filip Salcburský a Oldřich vévoda Korutanský přiš
