schental, Rabenstein; 3) Oldřich z Lichtenštejna, jemuž byly hrady zkonfiskovány nebo zničeny: Frauenburg, Murau, Lichtenštejnsko u Judenburgu; 4) Wulfing von Stubenberg, kterému byly hrady zkonfiskovány nebo zničeny: Kapfenberg, Katsch, \"Wulfingenstein\" (?), Stubenberg; 5) Herrant von Wildon, jemuž byly hrady zkonfiskovány nebo zničeny: \"Premarcpurc\" (?), Gleichenberg, Eppenstein; 6) Friedrich von Pettau/Ptuj, kterému byly hrady zkonfiskovány nebo zničeny: Wurmberg/Vurber, Bad Schwanberge 47.169121 14.672941", "kurzes_regest": "PO II. lud die sechs steierischen Adelige vor und nahm alle für circa 26 Wochen gefangen und kofisziert und besass bzw. erobert und zerstört ihre bestimmte Besitze und Burgen: konkret : 1) Bernard von Pfannberg, dem konfisziert bzw. zerstört wurden die Burgen: Pfannberg, \"Peckach\" (?), Sankt Peter am Kamerberg; 2) sein Bruder Heinrich von Pfannberg, dem konfisziert bzw. zerstört wurden die Burgen: Kaiserberg, \"Strazeck\" (?), Loschental, Rabenstein; 3) Ulrich von Liechtenstein, dem konfisziert bzw. zerstört wurden die Burgen: Frauenburg, Murau, Liechtenstein bei Judenburg; 4) Wulfing von Stubenberg, dem konfisziert bzw. zerstört wurden die Burgen: Kapfenberg, Katsch, \"Wulfingenstein\" (?), Stubenberg; 5) Herrant von Wildon, dem konfisziert bzw. zerstört wurden die Burgen: \"Premarcpurc\" (?), Gleichenberg, Eppenstein; 6) Friedrich von Pettau/Ptuj, dem konfisziert bzw. zerstört wurden die Burgen: Wurmberg/Vurber, Bad Schwanberge 47.169121 14.672941", "beschenkte_institution_text": "Bernard von Pfannberg - Heinrich von Pfannberg - Ulrich von Liechtenstein - Wulfing von Stubenberg - Herrant von Wildon - Friedrich von Pettau", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1263-vor 20.11.1268, möglicherweise März 1268", "lokalitat_name": "???", "cs-verze": "PO II daruje netolické panství klášteru Zlatá Koruna", "kurzes_regest": "PO II. schenkt dem Kloster Zlatá Korun ), aby uvedl biskupa Wernharda von Seckau do vlastnictví statků, které mu byly přiděleny v zemském statku ve Štýrském Hradci.", "kurzes_regest": "Der steirische Landrichter Truchsess Herbord von Füllstein/Fulštejn beauftragt sub obtentu gracie serenissimi domini nostri O(tachari) Albert von Horneck (IHornegg, w. Preding), den Bischof Wernhard von Seckau in den Besitz der ihm im Landtaiding in Graz zuerkannten Güter einzuführen.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "4.12.1268", "lokalitat_name": "Poděbrady", "cs-verze": "Korutanský vévoda Oldřich III., pán kraňského , ustanovuje PO II jako dědice svých pozemků. Zdá se velmi nepravděpodobné, že by v tento den nebyl v Poděbradech přítomen PO II., byli zde zejména jeho dvořané a významní hosté jako hrabě Albert Gorizsko-Tyrolský. Pro Ottokarovu přítomnost také hovoří to, že listinu sepsal Ottokarův notář Petr.", "kurzes_regest": "Herzog Ulrich III. von Kärnten Herr von Krain legt den PO II. als Erber seiner Länder fest. Scheint es sehr unwahrscheinlich, dass auch PO II. in Poděbrady in diesem Tag anwesend nicht wäre, vor allem hier seine Höflinge und wichtige Gäste als Graf Albert von Görzt-Tirol waren. Für Ottokars Anwesendheit spricht auch es, dass die Urkunde Ottokars Notar Peter verfasst.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "20.12.1268", "lokalitat_name": "Graz", "cs-verze": null, "kurzes_regest": "Der oberste Richter der Steiermark (iudex per Styriam generalis) Truchsess Herbord von Füllstein/Fulštejn beurkundet, dass der Spitaler Konrad am Pyhrn vor ihm die Rechte des Spitales am Pyhrn auf zwei von Hermann Tetlar dem Spital entfremdete Huben samt Weingärten in Hugstorff erwies, warauf Heinrich Wackercil mit der Besitzeinführung Konrads beauftragt wurde.", "beschenkte_instit 70 dauern und dann für zwei Jahren", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "10/27/1970", "lokalitat_name": "Wien", "cs-verze": "PO II potvrzuje privilegia města Tulnu.", "kurzes_regest": "PO II bestätigt der Stadt Tuln ihre Privilegien.", "beschenkte_institution_text": "Tuln, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "10/27/1970", "lokalitat_name": "Wien", "cs-verze": "PO II potvrzuje privilegia města Tulnu.", "kurzes_regest": "PO II bestätigt der Stadt Tuln ihre Privilegien.", "beschenkte_institution_text": "Tuln, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "10/28/1970", "lokalitat_name": "Wien", "cs-verze": "PO II potvrzuje své osvědčení pro Hyppolitský klášter", "kurzes_regest": "PO II bestätigt seine Urkunde für den Hyppoliten-Kloster", "beschenkte_institution_text": "St. Pölten, Augustiner Chorrherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "10/28/1970", "lokalitat_name": "Wien", "cs-verze": "PO II potvrzuje dokument pro Ortolfa, probošta ze Seckau, a pro jeho proboštský úřad.", "kurzes_regest": "PO II bestätigt die Urkunde für Ortolf, Probst von Seckau, und für seine Probstei.", "beschenkte_institution_text": "Seckau, Propstei", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 864000000, "lokalitat_name": "Wien", "cs-verze": "PO II potvrzuje dokument pro Plancha von Stadlau.", "kurzes_regest": "PO II bestätigt die Urkunde für Plancho von Stadlau.", "beschenkte_institution_text": "Schiffer, Stadlau", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Ra , {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Anfang Dezember 1270", "lokalitat_name": "???", "cs-verze": "Jmenování Albrechta von Fren (šlechtice z Kraňska) kapitánem v Korutanech králem Přemyslem Otakarem. Druhý Pád II. v této době získal také St. Weit, St. Georgen a Klagenfurt, které v roce 1268 vévoda Oldřich Korutanský daroval salcburskému arcibiskupství.", "kurzes_regest": "Einsetzung Albrechts von Fren (Adeligen aus Krain) als Hauptmann in Kärnten durch König Ottokar. PO II. gewonn in dieser Zeit gewonn auch St. Weit, St. Georgen und Klagenfurt, die im Jahre 1268 der Herzog Ulrich von Kärnten dem Erzbistum Salzburg erteilt.", "beschenkte_institution_text": null, "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "(Zwischen 6.12-12.12.)1270", "lokalitat_name": "Friesach", "cs-verze": "PO II dostává léna vévodů rakouských, štýrských a korutanských od zvoleného arcibiskupa Fridricha Salcburského a skládá lenní přísahu.", "kurzes_regest": "PO II. erhält vom Erzbischof-Elekt Friedrich von Salzburg die Lehen der Herzoge von Österreich, Steiermark und Kärnten und leistet den Lehenseid.", "beschenkte_institution_text": "Salzburg, Ezbischof-Elekt Friedrich", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 29808000000, "lokalitat_name": "Judenburg", "cs-verze": "PO II slibuje arcibiskupovi Elektu Friedrichovi, že se s ním setká.", "kurzes_regest": "PO II verspricht dem Erzbischof-Elekt Friedrich, sich mit ihm zu treffen.", "beschenkte_institution_text": "Salzburg, Ezbischof-Elekt Friedrich", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 29808000000, "lokalitat_name": "Judenburg", "cs-verze": "Občanská pobočka II slibuje svou podporu arcibiskupovi Elektovi Friedrichovi.", "kurzes_regest": "PO II verspricht dem Erzbischof-Elekt Friedrich seine Unterstützung.", "beschenkte_institution_text": "Salzburg, Ezbischof-Elekt Friedrich", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 29808000000, "lokalitat_name": "Judenburg", "cs-verze": "PO II slibuje arcibiskupovi Elektu Friedrichovi, že se s ním setká.", "kurzes_regest": "PO II verspricht dem Erzbischof-Elekt Friedrich, sich mit ihm zu treffen.", "beschenkte_institution_text": "Salzburg, Ezbischof-Elekt Friedrich", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Sehr kurz nach 12. 12.1270", "lokalitat_name": "Mariazell", "cs-verze": "Otakar chtěl táhnout přes severní Štýrsko do jihovýchodního Dolního Rakouska (pravděpodobně přes Semmering), ale od listopadu uherská vojska plenila jihovýchodní Dolní Rakousko a Moravu a čekala, až ho Přemysl Otakar zajme nebo zavraždí, a proto PO II musela projít přes Mariazell a Lilienfeld", "kurzes_regest": "Otakar wollte durch Nordsteiermark nach Südostniederösterreich (wohl durch Semmering) ziehen, aber von November plünderten ungarische Truppen Södostniederösterreich und Mähren und warten für Ottokar um ihn zu gefangnehmen oder ermorden und deshalb PO II. musste durch Mariazell und Lilienfeld zogen", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Kurz nach 12.12.1270", "lokalitat_name": "Lilienfeld", "cs-verze": "Druhá pobočka se přesunula ze Štýrska přes Lilienfeld do Mailbergu, protože Maďaři plenili východní Dolní Rakousko", "kurzes_regest": "PO II. zog aus Steiermark durch Lilienfeld nach Mailberg, weil Ungarn plündern die Ostniederösterreich", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach 12.12.1270", "lokalitat_name": "Mailberg", "cs-verze": "PO II se přesunula z Lilienfeldu přes Mailberg na Moravu, protože Maďaři plenili východní Dolní Rakousko", "kurzes_regest": "PO II. zog aus Lilienfeld durch Mailberg nach Mähren, weil Ungarn plündern die Ostniederösterreich", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Länger nach 12.12.1270", "lokalitat_name": "???", "cs-verze": "Pád II se přesunul ze Štýrska přes Mailberg přímo na Moravu, protože Maďaři plenili východní Dolní Rakousko", "kurzes_regest": "PO II. zog aus Steiermark durch Mailberg gerade nach Mähren, weil Ungarn plündern die Ostniederösterreich", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1270 oder kurz vorher", "lokalitat_name": "????", "cs-verze": "PO II drží Oldřich z Lobenštejna s úřadem purkrabství v Neuburgu am Inn", "kurzes_regest": "PO II. bekleidet den Ulrich von Lobenstein mit dem Burggrafsamt im Neuburg am Inn", "beschenkte_institution_text": "Ulrich von Lobenstein", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "wohl an der Wende der Jahren im Winter 1270/1271", "lokalitat_name": null, "cs-verze": "PO II mění majitele s hrabětem Oldřichem z Heunburgu a jeho manželkou Anežkou, vdovou po Oldřichovi III. Korutanském a dcerou Gertrudy Babenberské. Oldřich z Heunburgu s manželkou odstupují (podle jejich pozdějšího vyjádření byli nuceni rezignovat) do Drossendorfu/Drozďovic a Bernegu v severním Rakousku. Anežka získává zpět své babenberské nároky, stejně jako svůj vdovský majetek v Korutanech. PO II vyplácí obě náhrady za toto odstoupení", "kurzes_regest": "PO II. wechselt mit dem Grafen Ulrich von Heunburg und dessen Gattin Agnes, die Witwe nach Ulrich III. von Kärnten und Tochter der Gertrud von Babenberg die Besitze. Ulrich von Heunburg und seine Gattin resignieren (wurden zur Resignation gezwungen - laut ihrer späteren Ausdruck) an Drossendorf/ Drozdovice und Berneg in Nordösterreich. Agnes resiegniert an ihre babenbergische Ansprüche, so wie auch an ihre Witwegut in Kärnten. Für diese Resignation bezahlt PO II. beiden Kompensantionen", "beschenkte_institution_text": "Grafen Ulrich von Heunburg und dessen Gattin Agnes", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 5.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "3/22/1971", "lokalitat_name": "Brno", "cs-verze": "PO II potvrzuje imunitu kláštera Jungfau v Brně", "kurzes_regest": "PO II. bestätigt die Imunität des Jungfau-Klosters in Brno", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Vor April 1271", "lokalitat_name": null, "cs-verze": "Hartleb z Myslibořic vkládá svůj dar oslavanskému klášteru před tažením Přemyslů Otakarů do Uher. takže Hartleb byl účastníkem tohoto průvodu.", "kurzes_regest": "Hartleb von Myslibořeice legt seine Donation dem Kloster Oslavany vor dem Ottokars Zug nach Ungarn fest. also Hartleb war Teilnehmer dieses Zuges.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "vor 23.3.1271", "lokalitat_name": "????", "cs-verze": "PO II přebírá od opata Alberta z Admontu 12 stříbrných liber, které byly věnovány klášteru Düring a jeho manželce Markétě.", "kurzes_regest": "PO II. nimmt von dem Abt Albert von Admont 12 Silberpfunde, die das Kloster von During und seine Gattin Margarethe bekamm.", "beschenkte_institution_text": "Admont, Benediktinerkloster", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 42163200000, "lokalitat_name": "Brno", "cs-verze": null, "kurzes_regest": "PO II. bestätigt die Urkunden des Klosters Zábrdovice.", "beschenkte_institution_text": "Brno, Herburger Kloster (cella b. Marie V.), Dominikanerinstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "um 13.4.1271", "lokalitat_name": "Marchegg", "cs-verze": "PO II překračuje vybudovaným mostem řeku Moravu a jeho vojska dobývají hrady Děvín a Stupavu", "kurzes_regest": "PO II. überfurt durch die gebauten Brücke den Fluss March und seine Truppem erobern die Burgen Děvín und Stupava", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "zwischen 13-16.3.1271", "lokalitat_name": "Bratislava", "cs-verze": "PO II dobývá Prešpurk/Bratislavu", "kurzes_regest": "PO II. erobert Pressburg/Bratislava", "beschenkte_institution_text": "Bratislava/Pressburg", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "4/16/1971", "lokalitat_name": "Bratislava", "cs-verze": null, "kurzes_regest": "PO II beschenkt Otto von Perchtolsdorf, seinem österreichischen Kämerer.", "beschenkte_institution_text": "Perchtolsdorf, Otto von", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Sehr Kurz nach 16.4.1271", "lokalitat_name": "Svätý Júr", "cs-verze": null, "kurzes_regest": "PO II. erobert, sehr wohl persönlich Svätý Jur", "beschenkte_institution_text": "Svätý Júr", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "kurz nach 16.4.1271", "lokalitat_name": "Pezinok", "cs-verze": "PO II dobyl hrad Pezinok osobně.", "kurzes_regest": "PO II. erobert, sehr wohl persönlich die Burg Pezinok", "beschenkte_institution_text": "Pezinok", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "nach 16.4.1271", "lokalitat_name": "Červený Kámeň", "cs-verze": "PO II osobně dobyl hrad Červený Kámeň", "kurzes_regest": "PO II. erobert, sehr wohl persönlich die Burg Červený Kámeň /Bibersburg", "beschenkte_institution_text": "Červený Kámeň /Bibersburg", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Lang nach 16.4.1271", "lokalitat_name": "Trnava", "cs-verze": "PO II se přesunula k Trnavě, která kapitulovala.", "kurzes_regest": "PO II. zog zur Stadt Trnava, die kapituliert.", "beschenkte_institution_text": "Trnava", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Länger nach 16.4.1271 kurz vor 9.5.1271", "lokalitat_name": "Sereď", "cs-verze": "Přemyslova vojska překročila řeku Váh a přemyslovský biskup z Nitry a zástupci města navštívili tábor a vzdali se, zatímco Přemyslova vojska plenila až k řece Hron", "kurzes_regest": "Ottokars Truppen übergehen das Fluss Váh und den Ottokars Feldlager besuchte der Bischof von Nitra und Vertreter der Stadt und kapitulieren, danch Ottokars Truppen plündern bis zum Fluss Hron", "beschenkte_institution_text": "Nitra", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 52876800000, "lokalitat_name": "Bratislava", "cs-verze": "Bitva u Bratislavy", "kurzes_regest": "Schlacht in der Nähe von Bratislava", "beschenkte_institution_text": "Bratislava", "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "5/15/1971", "lokalitat_name": "Altenburg", "cs-verze": "Během obléhání hradu Magyaróvár došlo k bitvě a PO II přitáhl na pomoc blíže neurčenému místu \"Cherfellenburck\" a jeho vpád prý vedl k vítězství. Dan PO II ovládá \"Cherfellenburck, Oberwart/Ovár, Miesenburg/Wiesselburg/Moson, Magyaróvár/maďarský Altenburg. Oskarská posádka zůstala v Altenburgu a Moson byl zničen", "kurzes_regest": "Bei der Belagerung der Burg Magyaróvár kam es zum Schlacht und PO II. kam zum Hilfe von der nicht definierten Ort \"Cherfellenburck\" und sein sein Einfall soll zum Sieg führt. Dan PO II. beherrscht \"Cherfellenburck, Oberwart/Ovár, Miesenburg/Wiesselburg/Moson, Magyaróvár/Ungarisch Altenburg . Die Ottokars Besatzung blieb in Altenburg und Moson wurde zerstört", "beschenkte_institution_text": "Magyaróvár/Ungarisch-Altenburg", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "16.5.1271", "lokalitat_name": "Moson", "cs-verze": "PO II byl v táboře před Mosonem a posly uherského krále Pavla, biskupa z Vespremu a jistým a \"banem\" Rolandem s žádostí o příměří na tři dny. PO II pak prodlužuje toto příměří na další dva dny.", "kurzes_regest": "PO II. war in der Lager vor Moson und die Boten des Ungarischen Königs Pavel Bischof von Vesprem und gewisser und \"ban\" Roland mit der Bitte um den Waffenstillstand für drei Tage. PO II. verlängt dan dieses Waffenstillstand fur nächste zwei Tage.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "5/21/1971", "lokalitat_name": null, "cs-verze": "Bitva u Rábnice", "kurzes_regest": "Schlacht bei Rábnice", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "21.5.1271 oder kurz danach", "lokalitat_name": "Bratislava", "cs-verze": "Z Rábcy se PO II přesunula na dřevěný most u Bratislavy a překročila Dunaj zpět", "kurzes_regest": "PO II. zog von Rábca zum Holzbrücke bei Bratislava und überging Donau zurück", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "um 24.5.1271", "lokalitat_name": "Wien", "cs-verze": "Přemysl Otakar a jeho vojáci se stahují z Maďarska do Vídně, protože ještě nemají žádné jídlo.", "kurzes_regest": "Ottokar und seine Truppen rücken aus Ungarn nach Wien zurück, weil keine Lebensmittel schon haben.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 42336000000, "lokalitat_name": "Wien", "cs-verze": null, "kurzes_regest": "PO II schenkt dem Kloster Lilienfeld zwei Lehen.", "beschenkte_institution_text": "Lilienfeld, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 60825600000, "lokalitat_name": "Wien", "cs-verze": null, "kurzes_regest": "PO II bestätigt die Freiheiten des Schottenklosters in Wien", "beschenkte_institution_text": "Wien, Benediktiner Schottenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Juny 1271", "lokalitat_name": null, "cs-verze": "Maďarská vojska plení Rakousko a Uhersko a bavorská vojska vévody Jindřicha Dolního Bavorska plení Dolní Rakousko mezi Welsem a Vöcklabruckem.", "kurzes_regest": "Ungarische Truppen plündern Österreich und Ungarn und bayerische Truppen des Herzogs Heinrich von Niederbayern plündern Niederösterreich zwischen Wels und Vöcklabruck.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Kurz vor 3.7.1271", "lokalitat_name": null, "cs-verze": "PO II pověřuje biskupa Bruna z Olomouce, bratra Hartperna, mistra řádu minoritů v Rakousku, Hartleba komořího (Morava), maršála Bohuše a moravského Schenka Nezamysla, aby v Bratislavě vyjednali mírovou smlouvu s emisary uherského krále Štěpána V.", "kurzes_regest": "PO II. beauftragt den Bischof Bruno von Olomouc/Olmütz, den Bruder Hartpern, Ordensmeister der Minoriten in Österreich, Hartleb Kämmerer (Mährens), den Marschall Bohuš, den mährischen Schenk Nezamysl, damit sie den Friedvertrag mit den Emmisaren des Königs Stephan V. von Ungarn in Pressburg/Bratislava verhandeln.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "07.14.1971", "lokalitat_name": "Bratislava", "cs-verze": null, "kurzes_regest": "Vertrag zwischen Stephan von Ungarn und PO II", "beschenkte_institution_text": "König Stephan V. von Ungarn", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Kurz nach 15.7.-vor 31.8.1271", "lokalitat_name": "Tal des Flusses Drava in Ostkärnten (wohl Umgebung von Völkermarkt, ein herzogliche Burg und Stadt an Drau in Ostkärnten)", "cs-verze": null, "kurzes_regest": "PO II. zog druch das Tal des Flusses Drau/Drava in Ostkärnten na osten abwärs des Flusses nach Südsteiermark.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach 15.7.-vor 31.8.1271", "lokalitat_name": "Maribor", "cs-verze": null, "kurzes_regest": "PO II. zog abwärts des Flusses Drau/Drava nach Maribor/Marburg, wo die höfliche Feier (vor allem Tanzfeier) stattgefunden wurden.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach 15.7.-vor 31.8.1271", "lokalitat_name": "???", "cs-verze": "PO II, po uzavření míru s uherským králem Štěpána V., zkonfiskoval štýrské državy Mikuláše Lvova, který byl v předchozí válce na straně Uher a bojoval proti Osmanům při invazi do Uher.", "kurzes_regest": "PO II. konfisziert, nachdem er den Fried mit dem König von Stephan V. von Ungarn abgeschlossen hatt, die steierische Besitze des Nikolaus´von Lemberg, der in der vorigen Krieg auf der ungarischen Seite war und gegen die Ottokars in Ungarn einfallenden Truppen gekämpft hat.", "beschenkte_institution_text": "Nikolaus von Lemberg (Grad Lemberg)", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Vor. 29.9.1271, wahrscheinlich zwischen 15.7. und 31.8.1271", "lokalitat_name": "????", "cs-verze": "PO II velí svému štýrskému župnímu písaři a správci Konrádovi (písař... per Stiriam et provisor), aby mohl přidělit 57 marek příjmů v okrese Marburg jižně od Drávy své sestře Žofii a klášteru Studenitz jako náhradu za Clie Burg Sonnegg ve východních Korutanech.", "kurzes_regest": "PO II. gebietet seinem steirischen Landschreiber und Verweser Konrad (scriba...per Stiriam et provisor) um er der Schwester Sophie un dem Kloster Studenitz als Ersatz für clie Burg Sonnegg in Ostkärnten 57 Mark Einkünfte im Amt Marburg südlich der Drau zugewiesen.", "beschenkte_institution_text": "Studenice/ Studenitz, Dominikanerinnenkloster", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Länger nach 15.7.-vor 31.8.1271", "lokalitat_name": "Hartberg", "cs-verze": "PO byl krátce v Hartberu na cestě z Mariboru/Marburgu do Vídně", "kurzes_regest": "PO war kurz in Hartber während seines Weges aus Maribor/Marburg nach Wien", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Länger nach 15.7.-kurz vor 31.8.1271", "lokalitat_name": "Wien", "cs-verze": "PO II byl krátce přítomen ve Vídni", "kurzes_regest": "PO II. war kurz in Wien anwesend", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Länger nach 15.7.-sehr kurz vor 31.8.1271", "lokalitat_name": "Praha", "cs-verze": "DNO. II se rychle přesunula z Vídně do Prahy a do Prahy. Podle Ottocharovy rýmované kroniky trvá tato cesta pouze jeden den a jednu noc (ale pravděpodobně je to jen básníkova licence)", "kurzes_regest": "PO. II. zog schnell aus Wien nach Prag nach Prag. Nach Ottochars Reimchronik dauert dieser Weg nur ein Tag und ein Nacht (aber es handelt wahscheinlich nur um Dichterlizenz)", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "(Nach 1.9.1271, aber antedatiert zu 21.8.1270)", "lokalitat_name": null, "cs-verze": "PO II potvrzuje listinu pro klášter Hradisko u Olomouce.", "kurzes_regest": "PO II. bestätigt die Urkunde für Kloster Hradisko bei Olomouc.", "beschenkte_institution_text": "Hradisko, Prämonstratenser-Chorherren-Stift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1 oder 2.9.1271", "lokalitat_name": "Praha", "cs-verze": "PO II potvrzuje dar klášteru Chotěšov", "kurzes_regest": "PO II bestätigt die Schenkung an Kloster Chotěšov", "beschenkte_institution_text": "Chotěšov, Prämonstratenserinnenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 34905600000, "lokalitat_name": "Praha", "cs-verze": "PO II potvrzuje dar klášteru Chotěšov", "kurzes_regest": "PO II bestätigt die Schenkung an Kloster Chotěšov", "beschenkte_institution_text": "Chotěšov, Prämonstratenserinnenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Vor 14.9.1271", "lokalitat_name": "???", "cs-verze": "PO II žádá občany Chebu, aby františkánskou nemocnici v Chebu podřídili (jako její patroni) špitálu Bratří s červenou hvězdou na mostě v Praze a občané Chebu a Gozwin, rektor chebské nemocnice, žádají o to biskupa Lva z Řezna.", "kurzes_regest": "PO II. bittet die Bürger in Cheb/Eger, damit sie das Franziskanerspital in Cheb (als dessen Patronen) dem Spital der Bruder mit dem roten Stern bei der Brücke in Praha/Prag unterstellen und Egerer Bürger und Gozwin Rektor des Egerer Sptitals bitten dafür den Bischof Leo von Regensburg.", "beschenkte_institution_text": "Eger, Stadt und FranziskanerSpital - Bruder \"stelliferorum\" Brüder mit dem (roten) Stern/Franziskanerspital in Prag", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "10/13/1971", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II beschenkt das Kloster Rein.", "beschenkte_institution_text": "Rein, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 5.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "14.10.1271", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "Kunigunde Königin bestätigt dem Franziskaner-Sptial in Prag das Patronatsrecht in Řevnice.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": "FALZUM ++"}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "10/16/1971", "lokalitat_name": "Praha", "cs-verze": "PO II potvrzuje svobody svatojiřského kláštera na Pražském hradě.", "kurzes_regest": "PO II bestätigt die Freiheiten des Klosters St. George in Prager Burg.", "beschenkte_institution_text": "Praha, St.-Georg Stift, Prager Burg", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "11/24/1971", "lokalitat_name": "Wrocław", "cs-verze": "PO II potvrzuje práva města Opava.", "kurzes_regest": "PO II bestätigt die Rechte der Stadt Opava.", "beschenkte_institution_text": "Opava, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 68256000000, "lokalitat_name": "Praha", "cs-verze": "PO II prodává práva (sephenfieh) občanům Jihlavy.", "kurzes_regest": "PO II verkauft den Bürgern von Jihlava die Rechte (sephenlehen).", "beschenkte_institution_text": "Jihlava, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1/19/1972", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II gibt die Rechte den Johanitenbrüdern.", "beschenkte_institution_text": "Praha, Johaniten in Prag", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "2/22/1972", "lokalitat_name": "Zbraslav", "cs-verze": "PO II Wernhardum, episcopum Secoviensem, rogat ut commissionem a [Friderico] archielecto Salzeburgensi sibi datam sequens, negotium claustri sanctimonialium in Kirchberg [am Wechsel] exsequatur.", "kurzes_regest": "PO II Wernhardum, episcopum Secoviensem, rogat ut commissionem a [Friderico] archielecto Salzeburgensi sibi datam sequens, negotium claustri sanctimonialium in Kirchberg [am Wechsel] exsequatur.", "beschenkte_institution_text": "Seckau, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach 6. 12.1271- länger vor 26.2.1272", "lokalitat_name": "Praha", "cs-verze": "PO II nařizuje zajetí Siegfrieda von Merenberg/Mahrenberg/Radlje z Prahy. S pomocí Ortolfa von Windischgraze byl zajat, uvězněn v Praze a poté popraven", "kurzes_regest": "PO II gebietet aus Prag den Siegfried von Merenberg/ Mahrenberg/Radlje gefangen nehmen. Er wurde mit der Hilfe von Ortolf von Windischgraz gefangen genomen und in Prag inhaftiert und dann hingerichtet", "beschenkte_institution_text": "Siegfried von Merenberg/ Mahrenberg/Radlje", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Um 26.2.1272, oder danach", "lokalitat_name": "????", "cs-verze": "PO II vynáší verdikt (arbitrio recommisit) pro Richardis, vdovu po Siegfriedu von Mahrenberg/Merenberg/Radlje, že si musí vybrat (z majetku svého popraveného manžela) buď příjem v Mahrenbergu, nebo příjem v Korutanech, zejména v Kienbergu (ne obojí). (Richardis si vybírá korutanské panství, zejména Kienberg).", "kurzes_regest": "PO II. fällt den Urteilsspruch (arbitrio recommisit) für Richardis, die Witwe nach Siegfried von Mahrenberg/Merenberg/Radlje, dass sie (aus Besitze ihres hingerichtenen Gatten) entweder Einkünfte in Mahrenberg oder die Einkünfte in Kärnten, vor allem in Kienberg auswählen muss (nicht beide). (Richardis wählt die kärntnische Gütter, vor allem Kienberg).", "beschenkte_institution_text": "Richardis die Witwe nach Siegfried von Merenberg/ Mahrenberg/Radlje", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Um 26.2.1272, oder danach", "lokalitat_name": "????", "cs-verze": "PO II napsal (suas litteras vobis destinaverit) Oldřichovi von Drnholec/Dürrenholz, hejtmanu v Korutanech, Kraňsku, ve Windischer Marku a Friuli, jakož i tamním šlechticům vdovy Richardis po Siegfriedu von Mahrenberg, po volbě, kterou jí udělil král PO, aby převedli příjmy do Korutan, zejména do Kienbergu u Unterdrauburgu.", "kurzes_regest": "PO II. schrieb (suas litteras vobis destinaverit) dem Ulrich von Drnholec/Dürrenholz, dem Hauptmann in Kärnten, Krain, in der windischer Mark und Friaul, sowie den dortigen Adeligen der Witwe Richardis nach Siegfried von Mahrenberg nach der ihr vom König PO freigestellten Wahl Einkünfte in Kärnten, vorzüglich in Kienberg bei Unterdrauburg anzuweisen.", "beschenkte_institution_text": "Ulrich von Drnholec/Dürrenholz, dem Hauptmann in Kärnten, Krain, in der windischer Mark und Friaul", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "3/5/(1972)", "lokalitat_name": "Poděbrady", "cs-verze": "PO II žádá, aby práva na kostel sv. Benedikta v Praze byla postoupena Řádu německých rytířů.", "kurzes_regest": "PO II bittet darum, den Deutschen Rittern die Rechte zur St.-Benediktkirche in Prag zu übergeben.", "beschenkte_institution_text": "Praha, Bistum Prag - Deutschordensritter in Prag", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "14.3. (am wahrscheinlichsten 1272, nicht ganz ausgeschlossen 1273)", "lokalitat_name": "Praha", "cs-verze": "PO II pověřuje delegáta Františkánské nemocnice v Praze, aby shromáždil almužnu na opravu Pražského mostu.", "kurzes_regest": "PO II. beauftragt den Delegaten des Franziskaner Spital in Prag mit der Almosensammlung für die Reparierung der Prager Brücke.", "beschenkte_institution_text": "Praha, Franziskaner St. Franziskus-Spital (Kloster) in Prag.", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "3/16/1972", "lokalitat_name": "Poděbrady", "cs-verze": "PO II potvrzuje privilegia cisterciáckého kláštera v Oseku.", "kurzes_regest": "PO II bestätigt die Privilegien des Zisterzienserklosters Osek.", "beschenkte_institution_text": "Osek, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "4/22/1972", "lokalitat_name": "Praha", "cs-verze": "PO II bere klášter v Radlje pod svou ochranu.", "kurzes_regest": "PO II nimt das Nonnenkloster in Radlje unter sein Schutz.", "beschenkte_institution_text": "Merenberg/ Mahrenberg/Radlje Dominikanerinnenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 63417600000, "lokalitat_name": "Praha", "cs-verze": "PO II potvrzuje majetky občanů Litoměřic", "kurzes_regest": "PO II bestätigt die Güter der Bürger von Litoměřice", "beschenkte_institution_text": "Litoměřice, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Wohl Mai 1272", "lokalitat_name": "???", "cs-verze": "Ulrich von Drnholec/Dürrenholz Ottokars, kapitán v Korutanech, táhl zpět do Friuli, dobyl ztracené město Pordenone, jako kapitán v Pordenone držel Kornad Wendelof. Kapitula v Aquileii jmenovala Páda II. gerenarlem kapitánem/kapitánem Friuli (pravděpodobně na začátku roku 1272), jehož zástupcem (vicedominus) byl Heinrich Probst von Werd (u moci byl až do léta 1274", "kurzes_regest": "Ulrich von Drnholec/Dürrenholz Ottokars, Hauptmann in Kärnten zog nach Friaul erobert zurück die verlorene Stadt Pordenone als Hauptman in Pordenone bekleidet den Kornad Wendelof. Kapitel von Aquileia nannte PO II. zum Gerenarl-Kapitän/Hauptmann von Friaul (wohl am Anfang des Jahres 1272) , dessen Stellvertretter (vicedominus) wurde Heinrich Probst von Werd (er hielt die Macht bis zum Sommer 1274", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "8. und 14.5.1272", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "Ulrich von Drnholec/Dürrenholz Ottokars Hauptmann in Kärnten besezt am 8.5.1272 die Stadt Cividale und am 14. wurde ihm und dem König PO II. die Stadt untergeworfen.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "vor 27.6.1272", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. legt fest dass in Neufelden (Velden) ein Schiedgericht, der den Streit zwischen dem Záviš/Zawisch von Falkenstein/Falkenstein und Bischof Peter von Passau entscheiden soll.", "beschenkte_institution_text": "Záviš von Falkenstein/Falkenstein - Bischov Peter von Passau", "poII_aussteller": "m", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "7/13/1972", "lokalitat_name": "Praha", "cs-verze": "PO II potvrzuje hrad Kraslice Jindřichu II. z Plavna (padělek)", "kurzes_regest": "PO II bestätigt Heinrich II von Plauen die Burg Kraslice (Fälschung)", "beschenkte_institution_text": "Heinrich II von Plauen", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "7/13/1972", "lokalitat_name": "Praha", "cs-verze": "PO II osvobozuje poddané osekského kláštera od pravomoci purkrabího v Lokti.", "kurzes_regest": "PO II befreit die Hörigen des Klosters Osek von Befugnis des Burggrafen in Loket.", "beschenkte_institution_text": "Osek, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "7/14/1972", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II bestätigt die Privilegien des Klosters Osek.", "beschenkte_institution_text": "Osek, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "7/14/1972", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II bestätigt die Privilegien des Klosters Osek.", "beschenkte_institution_text": "Osek, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach 6.8.1272", "lokalitat_name": "???", "cs-verze": "Po smrti uherského krále Štěpána V. přišel ke králi PO II. jeho hlavní rádce Egidius a předal mu město Bratislava a další uherské hrady. Občanské sdružení mu k daním dalo také Laa an der Thaya, Stockerau, Kreuzenstein a Korneuburg", "kurzes_regest": "Nach dem Tod des Königs Stephan V. von Ungarn kam sein Hauptrat Egidius zum König PO II. und übergab in seinem Macht die Stadt Pressburg/Bratislava und andere ungarische Burgen. PO II. gab ihm dafür ausser Abgaben Laa an der Thaya, Stockerau, Kreuzenstein und Korneuburg", "beschenkte_institution_text": "Egidius", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Vor 1.9.1272", "lokalitat_name": "???", "cs-verze": "PO II pověřuje purpura ve Znojmě Radoslava z Heraltic a Čúžkraj Zudaria ve Znojmě k urovnání sporu mezi proboštem Dietrichem/Theodorikem z Louky a měšťany města Znojma", "kurzes_regest": "PO II. bestimmt den Burgraf in Znaim/Znojmo Radoslav von Heraltice und Čúžkraj Zudarius in Znojmo um den Streit zwischen dem Probst Dietrich/Theodorik von Louka und den Bürger der Stadt Znojmo zu entscheiden", "beschenkte_institution_text": "Znojmo, Stadt - Prämonstratenserchorherrenstift Louka - Radoslav von Heraltice und Čúžkraj Zudarius in Znojmo", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 79488000000, "lokalitat_name": "Wien", "cs-verze": "PO II dává náhradu klášteru ve Studenicích.", "kurzes_regest": "PO II gibt die Kompensation dem Kloster in Studenice.", "beschenkte_institution_text": "Dominikanerinnenkloster Studenitz/Studenice", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "9/14/1972", "lokalitat_name": "Bisamberg", "cs-verze": "PO II osvobozuje klášter Lilienfeld od cla.", "kurzes_regest": "PO II befreit das Kloster Lilienfeld vom Zoll.", "beschenkte_institution_text": "Lilienfeld, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "10/29/1972", "lokalitat_name": "Brno", "cs-verze": "PO II přiznává občanům Uherského Brodu stejná práva jako městu Hlubčice.", "kurzes_regest": "PO II erteilt den Bürgern von Uherský Brod dieselben Rechte, die die Stadt Hlubčice bekommen hat.", "beschenkte_institution_text": "Uherský Brod, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "12/16/1972", "lokalitat_name": "Krems", "cs-verze": "PO II přebírá fojtství kláštera Melk v Radendorfu.", "kurzes_regest": "PO II übernimt die Vogtei in Radendorf des Klosters Melk.", "beschenkte_institution_text": "Melk, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1271 oder 1272", "lokalitat_name": "???", "cs-verze": "PO II daruje dům ve Wiener Neustadt Otto von Perchtoldesdorf/Perchtoldsdorf, protože jeho majitel, bývalý občan Bernard Liebemann, odešel do Maďarska.", "kurzes_regest": "PO II. schenkt dem Otto von Perchtoldesdorf/Perchtoldsdorf das Haus in Wiener Neustadt, weil dessen Besitzer der ehemalige dortige Bürger Bernard Liebemann nach Ungarn abgegangen ist.", "beschenkte_institution_text": "Otto von Perchtolsdorf", "poII_aussteller": "m", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1271 oder 1272", "lokalitat_name": "???", "cs-verze": "Po PO II připadl dům ve Wiener Neustadtu Otto von Perchtoldesdorf/Perchtoldsdorf po bývalém měšťanu Bernardu Liebemannovi, který odešel do Maďarska, mniši z Heiligenkreuzu se proti tomuto rozhodnutí odvolali ke králi PO II, protože bývalý měšťan Bernard daroval svůj dům klášteru Heiligenkreuz. PO II. Tato záležitost byla projednávána před králem, který uznal její práva a nařídil soudci vídeňského Neustatdu Rudolfovi, aby dům předal klášteru.", "kurzes_regest": "Nach dem PO II. schent dem Otto von Perchtoldesdorf/Perchtoldsdorf das Haus in Wiener Neustadt nach dem ehemaligen Dortigen Bürger Bernard Liebemann, der nach Ungarn abgegangen ist, berufen die Mönche von Heiligenkreuz bei dem König PO II. gegen diese Entscheidigung, weil der ehemalige Bürger Bernard schenk sein Haus dem Kloster Heiligenkreuz. PO II. Es kam zur Besprechung dieser Sache vor dem König, der ihre Rechte anerkannt und gebietet dem Richter der Wiener Neustatd Rudolf das Haus dem Kloster übergeben.", "beschenkte_institution_text": "Heiligenkreuz, Zisterzienserkloster - Rudolf Richter in Wiener Neustadt", "poII_aussteller": "m", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Um 31.12.1272- um 4.1.1273", "lokalitat_name": "???", "cs-verze": "PO II jedná osobně o míru s vévodou Jindřichem Bavorským se svým prostředníkem biskupem Lvem z Pasova a Siegfriedem ze Sigenhofenu.", "kurzes_regest": "PO II. handelt persöhnlich über den Fried mit dem Herzog Heinrich von Bayern mit seinem Vermittler Bischof Leo von Passau und Siegfried von Sigenhofen.", "beschenkte_institution_text": null, "poII_aussteller": "m", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1/14/1973", "lokalitat_name": "Zbraslav", "cs-verze": "PO II daruje obec Dřenice chebskému klášteru sv. Kláry.", "kurzes_regest": "PO II schenkt dem Egerer Kloster St. Klara das Dorf Dřenice.", "beschenkte_institution_text": "Cheb, Klarissenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach Anfang Januars 1273", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. beherrscht nach dem Friedvertrag mit dem Herzog Heinrich von Bayern Gütter Sušice, Gräfenstein und Ehrenbrunn (Shutehoven, Gesensteyn, Erensprune)", "beschenkte_institution_text": "Sušice", "poII_aussteller": "m", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1/25/1973", "lokalitat_name": "Myšenec", "cs-verze": null, "kurzes_regest": "PO II verwechselt mit dem Kloster Vyšši Brod die Güter.", "beschenkte_institution_text": "Vyšší Brod, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach 2.2. und Mai 1273", "lokalitat_name": "???", "cs-verze": "Maďaři padli do rukou Moravy, Rakouska, Štýrska a Korutan a synové rakouských šlechticů Werhhard von Pruzlin, Markward de Hekkinge a Konrad de Sancto loco dobyli a vyplenili Raab Györ. Rakouská a moravská šlechta také v květnu vpadla do Uher severně od Dunaje a dobyla a vyplenila Nitru. (Tato místa byla pravděpodobnější, ale dlouho neobsazená", "kurzes_regest": "Ungarn sind nach Mähren, Österreich, Steiermark und Kärnten gefallen und österreichische Adelige Söhne Werhhard von Pruzlin , Markward de Hekkinge, und Konrad de Sancto loco erobern und plündern Raab Györ. Auch Österreichische und mährische Adelige sind in Mai nordlich Donau nach Ungarn gefallen und Nitra erobern und plündern. (Diese Örte waren wahrscheinlicher aber nich besetzt für längere Zeit", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "wohl nach Februar 1273", "lokalitat_name": "???", "cs-verze": "Maďar přichází Egidius, který obdržel od Pádu II před půl rokem Laa an der Thaya, Stockerau, Kreuzenstein a Korneuburg za odevzdání Bratislavského hradu a dalších uherských hradů králi PO II, zrazuje českého krále a vrací Bratislavský hrad a ostatní hrady Ungernu.", "kurzes_regest": "Der ungarischer comes Egidius, der von PO II. vor einem halben Jahr bekam Laa an der Thaya, Stockerau, Kreuzenstein und Korneuburg für die Übergebung der Burg Pressburg/Bratislava und anderen ungarischen Burgen dem König PO II., verrät den böhmischen König und übergab zurück den Ungern die Burg Pressburg/Bratislava und andere Burgen.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 118454400000, "lokalitat_name": "Zvíkov", "cs-verze": null, "kurzes_regest": "PO II bestätigt Stanimir´s von Zhoř Schenkungen an Kloster Kladruby.", "beschenkte_institution_text": "Kladruby, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "17.3. (am wahrscheinlichsten 1273, nichg ganz ausgeschlossen 1271, 1274)", "lokalitat_name": "Milevsko", "cs-verze": null, "kurzes_regest": "PO II gibt dem Kloster Heiligenkreuz das Ministerialrecht und ordnen seinen Beamten in Österreich an, alle seine Streite mit dem Kloster zu stopen.", "beschenkte_institution_text": "Heiligenkreuz, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Vor. 19.4.1273", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. gebietet seinem Generalhauptmann in Kärnten, Krain, der Mark und Friaul Ulrich von Drnholec/Dürrenholz das Kloster Viktring wieder in Besitz der von Alram von Weißenstein geschenkten, aber von den verschiedenen Nachfolgern Alrams und Festhaltern des Schlosses entfremdeten drei Huben bei Weißenstein (bei Paternion) und in Mooswald (bei Paternion). Dieses Befehl soll Ulrich erfühlen, nachdem er sich im königlichen Auftrag durch glaubwürdige Leute über den Tatbestand informiert hatte.", "beschenkte_institution_text": "Viktring, Zisterzienserkloster -- Nachfolger Alrams von Weißenstein", "poII_aussteller": "m", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "4/19/1973", "lokalitat_name": "???", "cs-verze": "PO II daruje obec Přešovice kostelu Panny Marie v Rouchovanech a jeho správci, svému kaplanovi Wernherovi.", "kurzes_regest": "PO II schenkt dias Dorf Přešovice der Jungfraukirche in Rouchovany und ihrem Verwalter, seinem Kapellan Wernher.", "beschenkte_institution_text": "Rouchovany, Kirche /Kapellan Wernher", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "4/20/1973", "lokalitat_name": "Praha", "cs-verze": "PO II potvrzuje prodej svého zboží klášteru Marienthal.", "kurzes_regest": "PO II bestätigt dem Kloster Marienthal Verkauf seiner Güter.", "beschenkte_institution_text": "Marienthal, Zisterzienserinnenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "vor 23.5.1273", "lokalitat_name": "???", "cs-verze": "PO II obsadila bez náhrady obec Ovenec (dnes Bubeneč) premonstrátského kláštera Teplá.", "kurzes_regest": "PO II. besatzte das Dorf Ovenec (heute Bubeneč) des Prämonstratenserstift Teplá ohne einem Ersatz.", "beschenkte_institution_text": "Teplá, Prämonstratenser-Chorherren-Stift", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "5/28/1973", "lokalitat_name": "Zbraslav", "cs-verze": "PO II potvrzuje prodej hradu Unterlaa.", "kurzes_regest": "PO II bestätigt den Verkauf der Burg Unterlaa.", "beschenkte_institution_text": "Bürger Paltram, Wien - Heinrich von Bocksberg, Meister der Johanniten", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "6/17/1973", "lokalitat_name": "Znojmo", "cs-verze": "PO II dává dary církvi v Ardaggeru.", "kurzes_regest": "PO II beschenkt die Kirche in Ardagger.", "beschenkte_institution_text": "Ardagger, Kollegiatstift St. Margarethe", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Länger Zeit vor 21.6.1273", "lokalitat_name": "???", "cs-verze": "PO II dal Jindřichovi, bratrovi zesnulého Jindřicha Truchsesse von Lengbach, částku na stavbu nebo obnovu hradeb kolem města Tulln. (Heinrich tento rozkaz nedal a nic se nepostavilo)", "kurzes_regest": "PO II. gab dem Heinrich, Bruder der gestorbenen Heinrichs Truchseß von Lengbach eine Summe damit er um die Stadt Tulln die Mauern baut oder erneuert. (Heinrich versäumte diesen Befehl und nichts baute)", "beschenkte_institution_text": "Tulln - Heinrich von Lengbach (Bruder der Truchsess)", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "17.6.1273", "lokalitat_name": "???", "cs-verze": "Po Jindřichovi, bratru zemřelého Jindřicha, Truchseß z Lengbachu nepostavil a neobnovil žádné hradby kolem města Tulln, i když obdržel částku od PO II, bylo město rozděleno mezi krále a město. PO II věnoval svou část určené městské plochy svému štýrskému písaři Konrádovi (von Tulln), který má z tohoto daru od krále a s jeho souhlasem díky okamžitým částkám postavit a obnovit městské hradby. (Konrád tomuto příkazu vyhověl.)", "kurzes_regest": "Nach dem Heinrich Bruder des gestorbenen Heinrichs, Truchseß von Lengbach bautet und erneuert keine Mauern um die Stadt Tulln, trotzdem eine Summe von PO II. dazu bekam, wurde die Stadtparzel zwischen dem König und der Stadt geteilt. PO II. gab sein Teil der bestimmten Stadtareal seinem steierischen Schreiber Konrad (von Tulln), der die Stadtmauern aus dieser Donation des Königs und mit seiner Zustimmung dank der prompten Summen erbauen und erneuern soll. (Konrad erfüllte diesen Befehl).", "beschenkte_institution_text": "Tulln - Der steierische Schreiber Konrad von Tulln", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 102988800000, "lokalitat_name": "Brno", "cs-verze": "PO II přiznává klášteru Žďár nad Sázavou příjmy z jurisdikce nad jeho poddanými a zakazuje jeho služebníkům rušit poddané kláštera.", "kurzes_regest": "PO II erteilt dem Kloster Žďár nad Sázavou die Einnahmen aus der Gerichtsbarkeit über seine Hörigen und verbietet seinen Dienern, die Untertanen des Klosters zu stören.", "beschenkte_institution_text": "Žďár nad Sázavou, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "7/17/1973", "lokalitat_name": "Bratislava", "cs-verze": "PO II uděluje léno Ulricus de Kappling dvěma farmami.", "kurzes_regest": "PO II belehnt Ulricus de Kappling mit zwei Höfen.", "beschenkte_institution_text": "Ulrich von Capellen/Kapellen/Kappling", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 110937600000, "lokalitat_name": "Laa an der Thaya", "cs-verze": null, "kurzes_regest": "PO II in der Nähe von Laa", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Um 7.8.1273 oder kurz danach", "lokalitat_name": "Marchegg", "cs-verze": null, "kurzes_regest": "Nordostniederösterreich", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Um 10.8.1273 und kurz danach", "lokalitat_name": "Bratislava", "cs-verze": "Následoval PO II s dobytím Uher a dobyl Bratislavu/Prešpurk a jeho vojska Svätý Jur a Trnavu, \"Schafpurch/ a \"Tyburtzpurch\". Celý okres Prešpurk. Jeho vojska plenila až k Váhu", "kurzes_regest": "PO II. zog nach mit seiner Eroberungsmaschienen nach Ungarn und erobert Bratislava/Pressburg und seine Truppen Svätý Jur und Trnava, \"Schafpurch/ und \"Tyburtzpurch\", bzw. Ganz Komität Pressburg. Seine Truppen plündern bis zum Váh", "beschenkte_institution_text": "Bratislava und Umbebung/Presburger Kömität", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "August und September 1273", "lokalitat_name": "Magyaróvár", "cs-verze": "PO II překračuje Dunaj po dřevěném mostě a dobývá Magyaróvár/Maďar-Altenburg", "kurzes_regest": "PO II. übertritt durch die Holzbrücke Donau und erobert Magyaróvár/Ungarisch-Altenburg", "beschenkte_institution_text": "Magyaróvár/Ungarisch-Altenburg", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Länger vor. 3.10.1273", "lokalitat_name": "Györ", "cs-verze": "PO II bojuje u města Raab/Györ, které dobývá (ačkoli toto místo nezůstalo u moci od doby předchozí invaze rakouských vojsk). Zde PO II porazil kromě rytířů také 50 svých spolubojovníků, včetně svého syna Mikuláše. (Krátce poté byl však Raab ztracen)", "kurzes_regest": "PO II. kämpft bei der Stadt Raab/Györ, der er erobert (wenn diese Ort seit der Zeit der vorigen Einfalles der österreichischen Soldaten, in der Macht sienier nicht blieb). Hier PO II. schlug zu den Rittern 50 seiner Mitkämpfer, auch seinen Sohn Nikolaus. (Kurz danach wurde aber Raab verloren)", "beschenkte_institution_text": "Györ/Raab Stadt", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Vor 3.10.1273", "lokalitat_name": "Pannonhalma", "cs-verze": "PO II dobývá klášter Pannonhalma po dobytí Györ/Raab", "kurzes_regest": "PO II. erobert nach der Eroberung von Györ/Raab das Kloster Pannonhalma", "beschenkte_institution_text": "Pannonhalma, Benediktinerkloster", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 100569600000, "lokalitat_name": "Sopron", "cs-verze": "PO II daruje vinice klášteru Imbach.", "kurzes_regest": "PO II beschenkt das Kloster Imbach mit Weinbergen.", "beschenkte_institution_text": "Imbach, Dominikanerinnenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "um 3.10.1273", "lokalitat_name": "Sopron", "cs-verze": "PO II. dobývá hrad a město Šoproň, které mu byly darovány Kateřinou Petrou, a hrady a města kolem jezera Nordsiedl byly dány pod jeho vládu.", "kurzes_regest": "PO II. erobert die Burg und Stadt Sopron, die ihm von Katellan Peter übegeben wurden, und die Burgen und Städte um Nordsiedlersee seiner Herrschaft untergestellt wurden.", "beschenkte_institution_text": "Sopron und Westungarn", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "10/14/1973", "lokalitat_name": "Krems and der Donau", "cs-verze": "PO II obnovuje svobody kláštera Raitenhaslach", "kurzes_regest": "PO II erneurt die Freiheiten des Klosters Raitenhaslach", "beschenkte_institution_text": "Raitenhaslach, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "18.10.(1273)", "lokalitat_name": "Krems and der Donau", "cs-verze": "Kunhuta, česká královna a vévodkyně rakouská, bere opatství Österhofen pod svou ochranu a uděluje mu status bezplatného mýtného", "kurzes_regest": "Kunigunde, Königin von Böhmen und Herzogin von Österreich nimmt den Stift Osterhofen in seinem Schutz und erteilt ihm die Mautfreiheit", "beschenkte_institution_text": "Osterhofen, Prämonstratenserchorherrenstift", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "22.10.1273 oder ein par Tage vorher", "lokalitat_name": null, "cs-verze": "PO II spolu s dominikánskými jeptiškami z Imbachu žádá biskupa Petra z Pasova, aby jako diecézní pán potvrdil nákup desátku z Melku, který uskutečnil klášter v Imbachu", "kurzes_regest": "PO II. bittet zusammen mit den Dominikanerinnen aus Imbach den Bischof Peter n tím, že v té době obchodoval i s Přemyslem Otakarem, ale otázkou je, zda se toto vyjednávání uskutečnilo v Domažlicích, nebo zda mu byl doklad vydán až při cestě z Čech nebo do Čech. Nemůžeme tedy říci, jak Šusta, s. 160, že PO II pojednává o knížeti Jindřichovi v Domažlicích kolem roku 16.3.", "kurzes_regest": "Am 16.3.1274 ist Heinrich Herzog von Bayern in Domažlice/Taus an einer Urkunde für Kloster Chotěšov ausgestellt. Heinrich war ein enger Verbündete des Königs Ottokars und im Herbst 1274 hat mit Ottokar in Písek gehandelt. Scheint es, dass sein Aufenthalt in Domažlice hat die Ursache dass er auch mit Ottokar handelte in dieser Zeit, aber Frage ist, ob zu dieser Verhandlung in Domažlice kam, oder seine Urkunde war nur bei seinem Weg aus oder nach Böhmen ausgestellt. Also können wir nicht sagen, wie Šusta, s. 160, dass PO II. handelt mit Herzog Heinrich in Domažlice um 16.3.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 131587200000, "lokalitat_name": "Wien", "cs-verze": "PO II potvrzuje dokument pro klášter Melk.", "kurzes_regest": "PO II bestätigt die Urkunde für das Kloster Melk.", "beschenkte_institution_text": "Melk, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "4/13/1974", "lokalitat_name": "Graz", "cs-verze": null, "kurzes_regest": "PO II ordnet allen seinen Hauptmanen, das Kloster Viktrig zu schützen.", "beschenkte_institution_text": "Viktring, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "4/16/1974", "lokalitat_name": "Graz", "cs-verze": "PO II bere pod svou ochranu klášter v Gornji Gradu.", "kurzes_regest": "PO II nimmt das Kloster in Gornji Grad unter sein Schutz.", "beschenkte_institution_text": "Gornji Grad/ Oberbur  "PO II. konfirmiert den gesendeten Gerichsspruch des steierischen Landrichter Konrad (von Tulln) und Otto dem Jüngeren von Liechtenstein über 30 mansen in Geula, die zwischen Dietmar von Strettweg und Bischof Wernhard von Seckau streitig waren. Der Streit wurde in Graz zugunsten des Bischofs Wernhards von Seckau entscheidet.", "beschenkte_institution_text": "Seckau, Bischov Wernhard; Dietmar von Strettweg", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Zwischen um 29.9.1271 und um 4.12.1274, kurz nach der vorigen Akt", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. lehnt die Berufung von Dietmar von Strettweg gegen den Scheidspruch von steierischen Landrichter Konrad von Tulln und Otto dem Jüngeren von Liechtenstein im Streit zwischen Dietmar von Strettweg und Bischof Wernhard von Seckau über 30 mansen in Geula ab.", "beschenkte_institution_text": "Seckau, Bischov Wernhard; Dietmar von Strettweg", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 153446400000, "lokalitat_name": "Neuburg", "cs-verze": "PO II přebírá léna od Petra z Pasova.", "kurzes_regest": "PO II nimmt von Peter von Passau die Lehen über.", "beschenkte_institution_text": "Passau, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Jahr 1274", "lokalitat_name": "???", "cs-verze": "U PO II přišel o milost Boreš z Rýzmburka.", "kurzes_regest": "Bei PO II. verlor Boreš von Rýzmburk die Gnade.", "beschenkte_institution_text": "Boreš von Rýzmburk", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 1274, "lokalitat_name": "???", "cs-verze": "PO II uděluje léno Friedrichu von Pettau/Ptuj s domem ve Wiener Neustadtu.", "kurzes_regest": "PO II. belehnt Friedrich von Pettau/Ptuj mit einem Hause in Wiener Neustadt.", "beschenkte_institution_text": "Friedrich von Pettau/Ptuj", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "um 1265-um1269 oder1270-1274", "lokalitat_name": "???", "cs-verze": "PO II, prostřednictvím svého protonotáře Ulricha, přikazuje rakouskému okresnímu písaři Marchlinovi (písař Austrie), aby propustil syna Gertrudy de Polam (pravděpodobně Pölla, nebo Altpölla nebo Neupölla), která byla uvězněna po smrti svého otce, a aby vrátila Gertrudin majetek.", "kurzes_regest": "PO II. gebietet durch seinem Protonotar Ulrich dem österreichischen Landschreiber Marchlin (scribe Austrie) um den Sohn der Gertruda de Polam (wohl Pölla, oder Altpölla oder Neupölla), der nach dem Tod seines Vaters inhaftiert wurde, freizulassen, und die Gütter der Gertrude zu restituieren.", "beschenkte_institution_text": "Gertruda und ihr Sohn de Polam (wohl Pölla,Altp ölloder Neupölla), - Ottokars Protonotar Ulrich - Merchlin/Merklin österreichischer Landschreiber", "poII_aussteller": "M", "verfalscht": "Formelstück"}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "wohl wahrscheinlich nach 1270 - vor Anfang des Jahres 1275", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. gebietet dem österreichischen Landschreiber Johann, die in Osterreich gelegene Güter der Deutschordensbrüder von Friesach zu schützen.", "beschenkte_institution_text": "Deutschordensbrüder von Friesach - österreichische Landschreiber Johann", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 173404800000, "lokalitat_name": "Uherský Ostroh", "cs-verze": null, "kurzes_regest": "PO II entscheidet, dass von den Hörigen des Klosters Hradisko kein Geld als Kompensation für die Erneuerung der Brücken einbezogen werden sollte", "beschenkte_institution_text": "Hradisko, Prämonstratenser-Chorherren-Stift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "an der Wende von Jahren 1275 und 1276, sicher vor 26.1.1276", "lokalitat_name": "???", "cs-verze": "PO II vyslal své vojsko do Rakouska a do Štýrska a Korutan v přestrojení za nového hejtmana Milota z Dědic", "kurzes_regest": "PO II. schickte sein Truppen nach Österreich und in Steiermark und Kärnten, bekleidet den neuen Hauptmann Milota von Dědice", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Anfang des Jahres 1275 oder kurz vor", "lokalitat_name": "???", "cs-verze": "PO II blokuje příjmy ze svého majetku ve svých zemích biskupovi Fridrichu Salcburskému", "kurzes_regest": "PO II. sperrt dem Ezbischof Friedrich von Salzburg seine Einkünfte aus seinen Besitze in seinen Ländern", "beschenkte_institution_text": "Salzburg Erzbistum", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1/26/(1975)", "lokalitat_name": "Wien", "cs-verze": "PO II nařizuje Milotovi z Dědic chránit práva biskupství sečkovského.", "kurzes_regest": "PO II ordnet Milota von Dědice an, die Rechte des Bistum Seckau zu schützen.", "beschenkte_institution_text": "Seckau, Bistum -- Dietrich von Fulm/Fülme auf Offenburg - Hauptmann von Steiermark Milota von Dědice", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1/26/(1975)", "lokalitat_name": "Wien", "cs-verze": "PO II nařizuje svým úředníkům ve Štýrsku, aby nerušili proboštský úřad v Seckau a jeho úředníky na svých statcích", "kurzes_regest": "PO II ordnet seinen Beamten in Steiermark an, die Propstei in Seckau und seine Beamten in ihren Gütern nicht zu stören", "beschenkte_institution_text": "Seckau, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1/26/(1975)", "lokalitat_name": "Wien", "cs-verze": "PO II nařizuje různým osobám umožnit prodej alkoholických nápojů v restauraci kostela v Seckau.", "kurzes_regest": "PO II ordnet verschiedenen Leuten an, in einer Gastätte der Seckauer Kirche den Verkauf der alkoholischen Getränke zu ermöglichen.", "beschenkte_institution_text": "Seckau, (Bischofs)kapitel/Chorherrenstift- Burggrafen Dietrich von (Fulm/Fülme, Burgraff auf) Offenburg - Stadt Knittelfeld", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 170899200000, "lokalitat_name": "Wien", "cs-verze": "PO II vyhání nevolníky z osekského kláštera \"sarcina\"/osada.", "kurzes_regest": "PO II eximiert die Hörigen des Klosters Osek von \"sarcina\"/osada.", "beschenkte_institution_text": "Osek, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "6.2.(1275)", "lokalitat_name": "Wien", "cs-verze": "PO II nařizuje svým úředníkům, aby je v jurisdikci kláštera v Osku neobviňovali.", "kurzes_regest": "PO II. gebietet seinen Beamtern um sie dem Kloster Osek im Jurisdiktion nicht zu belasten.", "beschenkte_institution_text": "Osek, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "27.2.1275", "lokalitat_name": "???", "cs-verze": "Král Rudorf oznamuje hrabatům, baronům, šlechticům, ministeriálům a vazalům v Korutanech, Kraňsku a Marce, že udělil vévodovi Filipovi Korutanskému léno se všemi statky a právy, na které má právo od říše, a přikazuje jim, aby ho poslouchali a pomáhali mu jako jeho princi a princi království.", "kurzes_regest": "König Rudorf verkündet den Grafen, Barone, Edlen, Ministerialen und Vasallen in Kärnten, Krain und der March, dass er den Herzog Philipp von Kärnten mit allen Besitzungen und Rechten, die ihm von rechtswegen vom Reiche zustehen, belehnt habe und gebietet ihnen, demselben als seinem und des Reiches Fürsten zu gehorchen und beizustehen.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Anfang des Jahres 1275", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. musste am Anfang des Jahres 1275 den Aufstand der Ministerialen Wernhards von Wolkersdorf, Ulrichs von Viehofen und der steierischen und \"oberöstereichischen\" Ministerial Hartnid von Wildon unterdrücken und ihre zwei Burgen erobern", "beschenkte_institution_text": "Wernhards von Wolkersdorf- Ulrichs von Viehofen - Hartnid von Wildon", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "2/28/1975", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II nimmt dem Abt des Klosters St. Petr und sein Kloster unter seinem Schutz.", "beschenkte_institution_text": "Salzburg, Benediktinerkloster St. Peter", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Vor 9.3.1275", "lokalitat_name": "???", "cs-verze": "PO II zaujímá majetek biskupa Lva z Řezna v Rakousku, konkrétně Haringsee v Marchfeldu, patronátní práva na kostel v Michelhausenu u Tullnu, \"forum\" Atzelldorf u Tullnu, Aisthofen in Riedmark", "kurzes_regest": "PO II. besetzt die Besitze des Bischofs Leo von Regensburg in Österreich, konkret Haringsee in Marchfeld, Patronatsrecht zur Kirche in Michelhausen bei Tulln, \"forum\" Atzelldorf bei Tulln, Aisthofen in Riedmark", "beschenkte_institution_text": "Regensburg, Bistum", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 178934400000, "lokalitat_name": "Praha", "cs-verze": "PO II píše papeži Řehoři X. Král křížovou výpravu slibuje a žádá o odložení převodu svých práv na rakouské země na dobu po plánované křížové výpravě", "kurzes_regest": "PO II schreib dem Papst Gregor X. Der König verspricht den Kreruzzug und bittet um die zeitliche Verlegung der Beruteilung seiner Rechte zu den österreichischen Ländern in die Zeit nach dem geplanten Kreuzzug", "beschenkte_institution_text": null, "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 178934400000, "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II verspricht an Kreuzzug aufzubrehen und bittet um finanzielle Unterstützung", "beschenkte_institution_text": null, "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 181526400000, "lokalitat_name": "Praha", "cs-verze": "PO II potvrzuje, že od chotěšovského pána obdržel 230 stříbrných známek.", "kurzes_regest": "PO II bestätigt, dass er vom Prost in Chotěšov 230 Silbermarken bekommen hat.", "beschenkte_institution_text": "Chotěšov, Prämonstratenserinnenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "3/15/1975", "lokalitat_name": "Praha", "cs-verze": "PO II dává klášteru Raitenhaslach celní privilegia", "kurzes_regest": "PO II gibt dem Kloster Raitenhaslach die Zollprivilegien", "beschenkte_institution_text": "Raitenhaslach, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "vor 18.3.1275", "lokalitat_name": "???", "cs-verze": "PO II rozhoduje, že kostel v Plané má být předán klášteru Waldsassen a zdejšímu opatovi Johannovi, jak je uvedeno v listině krále Václava I. (ze dne 13.3.1251 - CDB IV, č. 207) a vyřízení této záležitosti provedli biskup Jan Pražský, Dietrich děkan v Kadani a kněz Siegfried v Ostrově (u Karlových Varů).", "kurzes_regest": "PO II. entscheidet, damit die Kirche in Plana dem Kloster Waldsassen und dem dortigen Abt Johann übergegeben wurde, wie es die Urkunde des König Wenzel I. (von 13.3.1251 - CDB IV, Nr. 207) und die Erledigung dieser Sache füren der Bischof Johann von Prag, Dietrich Dekan in Kadan und Siegfried Pfarrer in Ostrov (bei Karlsbad) durch.", "beschenkte_institution_text": "Waldsassen, Zisterzienserkloster - Planá Pfarkirche", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "3/19/1975", "lokalitat_name": "Praha", "cs-verze": "PO II potvrzuje dar Klášteru Kladruby", "kurzes_regest": "PO II bestätigt die Schenkunkg an Kloster Kladruby", "beschenkte_institution_text": "Kladruby, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "vor 29.3.1275", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "Königin Kunigunde bittet mit dem Voigt das Stadt Kłodsko/Kladsko/Glatz den Prager Bischof Johann von Prag um er das Spital der Bruder mit dem (roten) Stern in Kładsko (auch auf deren Bitten), der unter dem Sptal in Wrocław/Breslau/Vratislav untergestellt ist, in dem Schutz seiner Diöze nimmt.", "beschenkte_institution_text": "Kłodsko/Kladsko/Glatz", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 171072000000, "lokalitat_name": "Brno", "cs-verze": "PO II bere pod svou ochranu klášter sv. Lambrechta a kostel v Mariahof", "kurzes_regest": "PO II nimmt das Kloster St. Lambrecht und die Kirche in Mariahof unter sein Schutz", "beschenkte_institution_text": "St.Lambrecht, Benediktinerkloste (St. Lambrecht) - Burgraf zu Neumarkt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "kurz vor 15.5.1275", "lokalitat_name": "???", "cs-verze": "PO II posílá králi Rudolfovi své posly Wernharda biskupa ze Seckau, Heinricha probošta Heinricha von Maria Wörth (Werden), komentátora Řádu německých rytířů pro Rakousko, Wulfinga mistra johanitského špitálu v Mailbergu", "kurzes_regest": "PO II. schickt zum König Rudolf seine Boten Wernhard Bischof von Seckau, Heinrich Probst Heinrich von Maria Wörth (Werden), Kommendator des Deutschordens für Österreich, Wulfing Maister des Johanniterspitals in Mailberg", "beschenkte_institution_text": null, "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "wohl April 1275", "lokalitat_name": "???", "cs-verze": "PO II, stejně jako korutanský kapitán Henrich von Pfannberg poslal Konrada von Scbranchpovm (kabinetní strom?) (pravděpodobně i jiné), aby vyplenili majetek arcibiskupství salcburského řádem Friesach.", "kurzes_regest": "PO II., sowie Kärntner Hauptmann Henrich von Pfannberg schickten dem Konrad von Scbranchpovm (Schrankbaum?) (wahrscheinlichen auch anderen) mit dem Befehl Friesach das Besitz des Erzbistums Salzburg zu plündern.", "beschenkte_institution_text": "Konrad von Scbranchpovm (Schrankbaum?)", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "5/29/1975", "lokalitat_name": "Praha", "cs-verze": "PO II souhlasí s přijetím mírových podmínek ve svém sporu s arcibiskupem salcburským.", "kurzes_regest": "PO II ist damit einverstanden, die Friedenbedingungen in seinem Streit mit dem Erzbischof von Salzburg zu akzeptieren.", "beschenkte_institution_text": "Salzburg, Erzbistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "5/29/1975", "lokalitat_name": "Praha", "cs-verze": "PO II slibuje salcburskému arcibiskupovi, že neposkytne svým oponentům úkryt a ochranu.", "kurzes_regest": "PO II verspricht dem Erzbischof von Salzburg, seinen Gegnern Schirm und Schutz nicht zu geben.", "beschenkte_institution_text": "Salzburg, Erzbistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "April und Mai 1275", "lokalitat_name": "???", "cs-verze": "PO II přikazuje svému štýrskému hejtmanovi Milotovi z Dědic, aby vyplenil a dobyl državy salcburských držav, zejména Friesachu, a Milota to v dubnu a květnu 1275 plní. Tohoto boje se zúčastnil i korutanský kapitán Heinrich von Pfannberg", "kurzes_regest": "PO II gebietet seinem steierischen Hauptmann Milota von Dědice Besitz des Salzburgers Besitztums vor allem Friesach zu plündern und erobern und Milota erfüllt es im April bzw. Mai 1275. Der Teilname an diesem Kampf hate auch der Kärtner Hauptmann Heinrich von Pfannberg", "beschenkte_institution_text": "Friesach und andere salzburgische Enklaven", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 160876800000, "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II bestätigt die Belehnung von Eckerich, sohn des Herbord´s von Fulstein.", "beschenkte_institution_text": "Olomouc, Bischof Bruno; Eckerich, Sohn Herbord´s von Fulstein", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 168566400000, "lokalitat_name": "Kamenec", "cs-verze": null, "kurzes_regest": "PO II eximiert die Bürger der Stadt Uherský Brod von Zoll.", "beschenkte_institution_text": "Uherský Brod, Bürger", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "zwischen 5.6.1275- vor Ende Juny 1275/sicher vor 29..8.1275", "lokalitat_name": "Wien", "cs-verze": "Pád II. přijal ve Vídni posla krále Rudol
