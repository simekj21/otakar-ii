!"}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "9.5.1263", "lokalitat_name": "Olomouc", "cs-verze": "Olomoucký biskup Bruno potvrzuje srovnání faráře kostela v Blučině a žďárského kláštera nad obcí Novošice", "kurzes_regest": "Bischof Bruno von Olomouc/Olmütz bestätigt den Vergleich zwischen dem Johann Rektor der Kirche in Blučina und dem Kloster Žďár über das Dorf Novošice", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "(Am wahrscheinlichsten nach 6.4. - vor 25.5.)1263 \n", "lokalitat_name": null, "cs-verze": "PO II zakládá klášter Zlatá Koruna.", "kurzes_regest": "PO II. gründet das Kloster Zlatá Koruna.", "beschenkte_institution_text": "Zlatá Koruna, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "25.5.1263", "lokalitat_name": null, "cs-verze": "Olomoucký biskup Bruno pečetí listinu Žofii, vdově po Richerovi von Jaunegg (u Jauntálu v Korutanech). Sopie daruje dominikánskému klášteru ve Studenitz (jižně od Windischfeistritzu v tehdejším jižním Štýrsku) statky a uzavře se svými příbuznými vyrovnání na základě vzájemných dědických nároků.", "kurzes_regest": "Bischof Bruno von Olomouc/Olmütz besiegelt die Urkunde Sophie, der Witwe nach Richer von Jaunegg (bei Jauntal in Kärnten). Sopie stattet das Dominikanerkloster Studenitz (südlich von Windischfeistritz) in damaligen Südsteiermark) mit Gütern aus und trifft mit ihren Verwandten einen Ausgleich über die gegenseitigen Erbansprüche.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "15. 6. 1962 nebo 1963", "lokalitat_name": "Nučice", "cs-verze": "PO II bere pod svou ochranu soudní exekutory v Dolním Rakousku.", "kurzes_regest": "PO II. nimmt die Vogte in Niederösterreich unter sein Schutz.", "beschenkte_institution_text": "Oberösterreich (super Anasum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -217728000000, "lokalitat_name": "Plasy", "cs-verze": "PO II obnovuje imunitu kláštera Plasy.", "kurzes_regest": "PO II. erneuert die Imunitäten des Klosters Plasy.", "beschenkte_institution_text": "Plasy, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -217728000000, "lokalitat_name": "Plasy", "cs-verze": "PO II obnovuje imunitu kláštera Plasy.", "kurzes_regest": "PO II. erneuert die Imunitäten des Klosters Plasy.", "beschenkte_institution_text": "Plasy, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "7/25/1963", "lokalitat_name": "Wiener Neustadt", "cs-verze": null, "kurzes_regest": "PO II. befehlt seinen Administratoren, die Güter der Kirche in Seckau nicht zu stören.", "beschenkte_institution_text": "Seckau, Propstei", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "7/26/1963", "lokalitat_name": "Wiener Neustadt", "cs-verze": "PO II potvrzuje dar proboštovi v Seckau.", "kurzes_regest": "PO II. bestätigt die Beschenkung der Propstei Seckau.", "beschenkte_institution_text": "Seckau, Propstei", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "(3.7-12.9.) 1263", "lokalitat_name": "Lilienfeld", "cs-verze": "PO II, Otto biskup pasovský, opat Otto von Lilienfeld, Ulrich von Pillichsdorf zapečetil listinu Eufemia (Ofmya) (von Kuenring), vdova po Rudolfu von Pottendorf, která se souhlasem svých synů Rudolfa, Konrada, Heinricha Sibota von Pottendorf a dcer Alheid Efemia, darovala majetek v Girmendorf iusta fluvium Pyela (u řeky Pielach) klášteru St. Pölten pro záchranu svého manžela Rudolfa von Pottendorf.", "kurzes_regest": "PO II., Otto Bischof von Passau, Abt Otto von Lilienfeld, Ulrich von Pillichsdorf besiegelten die Urkunde Eufemia (Ofmya) (von Kuenring), der Wittwe nach Rudolf von Pottendorf, die mit der Zustimmung seiner Söhne Rudolf, Konrad, Heinrich Siboto von Pottendorf und Töchter Alheid Efemia für das Heil ihres Gatten Rudolf von Pottendorf dem Kloster St. Pölten Besitze in Girmendorf iusta fluvium Pyela (bei dem Fluss Pielach) schenkt.", "beschenkte_institution_text": "St. Pölten, Augustiner Chorrherrenstift", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "14.8.1263", "lokalitat_name": "Graz", "cs-verze": "Olomoucký biskup Bruno potvrzuje urovnání sporu mezi biskupem Bertholdem z Bamberku a bratry Wulfingingem a Örtlinem von Trennstein (dolnorakouské Weiz-Jižní Štýrsko) o bamberské statky Rottenmannovy rozhodčím nálezem ve prospěch biskupa.", "kurzes_regest": "Bischof Bruno von Olmütz/Olomouc beurkundet die Schlichtung des Streites zwischen Bischof Berthold von Bamberg und den Brüdern Wulfing und Örtlin von Trennstein (nö Weiz- Südsteiermark) um die Bamberger Besitzungen zu Rottenmann durch Schiedsspruch zugunsten des Bischofs.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "(Vor 17.8.1263", "lokalitat_name": "xxx", "cs-verze": "PO II přikazuje olomouckému biskupovi, svému hejtmanovi ve Štýrsku, aby kompenzoval klášteru Admont za novou výstavbu a rozšíření města Bruck an der Mur.", "kurzes_regest": "PO II. gebietet dem Bischof von Olmütz/Olomouc seinem Hauptmann in Steiermark, damit er das Kloster Admont für die neue Errichtung und Erweiterung der Stadt Bruck an der Mur entschädigt.", "beschenkte_institution_text": "die Stadt Bruck an der Murau - Hauptmann von Steiermark, Bischof Bruno von Olomouc", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "17.8.1263", "lokalitat_name": "Graz", "cs-verze": "Z pověření krále Přemysla Otakara odškodňuje olomoucký biskup klášter Admont a zdejšího opata Oldricha za novou výstavbu a rozšíření města Bruck an der Mur (novellam plantationem oppidi de Brücke) příjmy ze Stadlhofu a statků v Öblarnu a Strastetenu v Ennstallu", "kurzes_regest": "Bischof von Olmütz/Olomouc entschädigt im Auftrage des Königs Ottokars das Kloster Admont und den dortigen Abt Ulrich für die neue Errichtung und Erweiterung der Stadt Bruck an der Mur (novellam plantationem oppidi de Brucke) herangezogenen Güter durch Einkünfte zu Stadlhof und Güter in Öblarn und Strasteten in Ennstall", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "17.8.1263", "lokalitat_name": "Graz", "cs-verze": null, "kurzes_regest": "Bischof Bruno von Olmütz befiehlt aus der Ottokars Autorität, die Gerichtsfreiheit des Klosters Admont zu achten, dessen Güter, wie durch Gerichtsspruch erwiesen, ausschliesslich der landesfürstlichen Gerichtsbarkeit unterstehen, sofern das Kloster nicht freiwillig auf Zeit einen anderen Vogt und\nRichter bestellt hat.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "11.9.1263", "lokalitat_name": "xxx", "cs-verze": "Abatyše Kunhuta van Goß žádá olomouckého biskupa Bruna, aby neposlouchal výzvu opata z Admontu, která mu byla adresována v žádosti o desátky, která je projednávána před arcijáhnem horní marky v Ottě. (Z dokumentu vyplývá, že Bruno byl v té době pravděpodobně ještě ve Štýrsku)", "kurzes_regest": "Äbtissin Kunigunde van Goß bittet Bischof Bruno von Olmütz, der an ihn gerichteten Appellation des Abtes von Admont in einem vor dem Archidiakon der oberen Mark Otta anhangig gemachten Zehentstreít kein Gehor zu schenken. (Die Urkunde zeigt, dass Bruno in dieser Zeit wahrscheinlich in Steiermark noch war)", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "8. 9. (wahrschenlich 1262 oder 1263, ganz ausgeschlossen sind nicht die Jahren 1264, 1265, 1267, 1269).", "lokalitat_name": "Gaming", "cs-verze": "PO II bere klášter Mondsee pod svou ochranu, prohlašuje jeho opata za svého zvláštního dvorního kaplana a uděluje klášteru osvobození od mýta pro jeho potřeby potravin v Kremži, Steinu a Dunaji, Ybbsu, Mauthausenu a Linci. PO II informuje soudce, mýtné úředníky a ministerské úředníky Rakouska per superiorem ac inferiorem Austriam", "kurzes_regest": "PO II nimt das Kloster Mondsee unter sein Schutz, erklärt den Abbt desselben zu seinem besondern Hofkaplan und erteilt dem Kloster die Mautfreiheit für dessen Bedarf an Lebensmitteln in Krems, Stein and Donau, Ybbs, , Mauthausen und Linz. Darübert informiert der PO II. seienn Richtern, Mautbeamter und ministerialen Österreichs per superiorem ac inferiorem Austriam", "beschenkte_institution_text": "Mondsee, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "13. 9. 1263", "lokalitat_name": "Písek", "cs-verze": "PO II potvrzuje darování statků johanitům (heredittis in Hrobníky/Grobniki v Opavsku).", "kurzes_regest": "PO II. bestätigt den Johanniten die Schenkung der Güter (heredittis in Hrobníky/Grobniki in Troppauer Provinz (Opava).", "beschenkte_institution_text": "Grobniki, Johaniten Kommende", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "12.10.1263", "lokalitat_name": "Modřice", "cs-verze": "Olomoucký biskup Bruno potvrdil patronátní právo cisterciáckého kláštera Oslavany v Troskovicích", "kurzes_regest": "Bischof Bruno von Olomouc/Olmütz bestätigt dem Zisterzienserinnenkloster Oslavany das Patronats recht in Troskovice", "beschenkte_institution_text": "Oslavany, Zisterzienserinnenkloster", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "(Die zweite Hälfte des Jahres, wohl nach 12.10.1263)", "lokalitat_name": null, "cs-verze": "Papež Urb IV. svěřil správu arcibiskupství salcburského do ochrany Přemysla Otakara a olomouckého biskupa Bruna. PO II obsadil državy salcburského biskupství ve Štýrsku a Korutanech, konkrétně v Korutanech Friesach, Hüttenbergu, Reisbergu, Deutschlandsbergu, Jakingu a ve Štýrsku Pettau, Leibnitz. PO II jmenuje Herborda z Fulštejna správcem ve Frieschi, kde se v té době razily Přemyslovy mince. PO II byl uznán za správce některými salcburskými ministeriales", "kurzes_regest": "Papst Urb IV. vertraute die Verwaltung des Erzstiftes Salzburg in den Schutz Přemysl Ottokars und Bischofs Bruno von Olomouc/Olmütz. PO II. besetzte die Besitze des Salzburger Bistums in Steiermark und Kärnten, konkret in Kärnten Friesach, Hüttenberg, Reisberg, Deutschlandsberg, Jaking und in Steiermar Pettau, Leibnitz. PO II. bestimmt den Herbord von Fulštejn/Füllstein den Verwalter in Friesch, wo in dieser Zeit die Ottokars Münzen geprägt wurden. PO II. wurde als Verwalter von einem Teil der Salzburger Ministerialen anerkannt", "beschenkte_institution_text": "Salzburg, Erzbistum", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "(Die zweite Hälfte des Jahres, wohl nach 12.10.)1263", "lokalitat_name": null, "cs-verze": "Patriarcha Řehoř Akvilejský uděluje olomouckému biskupovi Brunovi (d. Brunum, Dei gratia Olomucensem episcopum, capitaneum illustris Regis Bohemie et Styrie) jako zástupci krále Přemysla Otakara (recipientem nomine et vice ipsius domini O. regis Bohemie, de feudo) léno darovacího úřadu, který již rakouský vévoda Fridrich II. měl jako léno církve v Aquileji.", "kurzes_regest": "Patriarcha Gregor von Aquileia investiert den den Bischof Bruno von Olomouc/Olmütz (d. Brunum, Dei gratia Olomucensem episcopum, capitaneum illustris Regis Bohemie et Styrie) als den den Verträter des Königs Ottokar (recipientem nomine et vice ipsius domini O. regis Bohemie, de feudo) mit dem Lehen des Schenkamtes, den als Feudum von der Kirch Aquileia schon der Herzog Friedrich II. von Österreich hatte.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "nicht lang vor 6.1. (am wahrscheinlichsten 1264, möglicherweise 1262, nicht ganz ausgeschlossen 1265", "lokalitat_name": null, "cs-verze": "II. přikazuje Otovi z Maissau a Otovi z Haslau, aby oznámili okresním soudcům v Rakousku mír, který sjednal mezi šlechtou, ministeriales, rytíři a občany rakouskými, a přikazuje jim, aby se k němu nedostavili dne 6. ledna nikoli do Bítova, nýbrž na místo určené králem a aby až do jeho příchodu obdrželi tvrz.", "kurzes_regest": "PO II. gebietet Otto von Maissau und Otto von Haslau Landrichtern in Österreich, den von ihm unter den Edlen, Ministerialen, Rittern und Bürgern Österreichs gesetzen Frieden kundzutun und gebietet den beiden zu ihm nicht nach Bítov, sondern im Ort, das König bestimmt, am 6.1., und den Landfried bis zu seiner Ankunft erhahlaten.", "beschenkte_institution_text": "Landrichter Österreichs Otto von Maissau und Otto von Haslau", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1/25/1964", "lokalitat_name": "Praha", "cs-verze": "PO II jmenuje Heinricha de Scharfenberg jako dárce Aquilejského patriarchátu.", "kurzes_regest": "PO II. ernennt Heinrich de Scharfenberg zum Schenk der Aquileier Patriarchats.", "beschenkte_institution_text": "Scharfenberg, Heinrich von Heinrich de Scharfenberg/Schärfenberg (Svibno)", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1/30/1964", "lokalitat_name": null, "cs-verze": null, "kurzes_regest": "PO II. ernennt dem Olmützer Bürger Heinrich zum Richter in Velký Týnec.", "beschenkte_institution_text": "Olomouc, Bürger Heinrich", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1.2.1264", "lokalitat_name": "Friesach", "cs-verze": null, "kurzes_regest": "Dietrich von Füllstein/Fulštejn (Vulmen, b. Hotzenplotz, Schlesien), Burggraf in der Stadt Friesach, Besitz des Salzburger Erzstiftes, die in der Ottokars Macht ist (civitas Fricacensis in potesttem domini regis Boemorum declinavit.), verpflichtet sichals vom Bischofe (Bruno) von Olmütz hierzu bestellter Vogt, Ulrich von Zeltschach (Celsach) in den ihm vom Truchsess von Kraig gewaltsam vorenthaltenen, aber nur gerichtlich vor dem Dompropst von Salzburg zugesprochenen Gütern ob Althofen insolange zu schützen, bis ein rechtmäßiger Erzbischof der Salzburger Kirche vorstehen wird. Als Richter dem Ulrich wurde Bestimt Herbord Truchsess des Königs Ottokar, Bischof Bruno von Olomouc.", "beschenkte_institution_text": "Zeltschach, Ulrich von", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1.2.1264", "lokalitat_name": "Friesach", "cs-verze": "Dietrich z Füllsteinu/Fulštejna (Vulmen), purkrabí ve městě Friesachu, majetek arcibiskupství salcburského, které je v moci Přemysla Otakara, přebírá jako hofmistr jmenovaný olomouckým biskupem (Brunem) statky Oldřicha ze Zeltschachu (Celsach) kolem Althofenu, které získal zpět před dvůr Bruna z Olomouce, Herbordova Ottokara Truchsesse a probošta salcburského,  proti Truchsessovi von Kraigovi a proti všem obecně.", "kurzes_regest": "Dietrich von Füllstein/Fulštejn (Vulmen), Burggraf in der Stadt Friesach, Besitz des Salzburger Erzstiftes, die in der Ottokars Macht ist, verpflichtet sich als vom Bischofe (Bruno) von Olmütz hierzu bestellter Vogt, die Güter des Ulrich von Zeltschach (Celsach) um Althofen, die er vor dem Gericht Brunos von Olomouc, Herbords Ottokars Truchsess und Probst von Salzburg zurück bekamm, gegen den Truchsess von Kraig und überhaupt gegen jedermann zu schützen.", "beschenkte_institution_text": "Zeltschach, Ulrich von", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -160272000000, "lokalitat_name": "Jihlava", "cs-verze": "PO II privileguje žďárský klášter.", "kurzes_regest": "PO II. privilegiert das Kloster Žďár.", "beschenkte_institution_text": "Žďár nad Sázavou, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "(Vor 17.3.1264)", "lokalitat_name": "??", "cs-verze": "Konšelé Ottokar Otto von Maissau (O. de Meissowe), Otto von Haslau (O. Haslowe), Heinrich von Seefeld (H. de Sevelde), Heinrich von Liechtenstein (H. de Lihtenstein), Heinrich, Truchsess von Lengbach (H. dpifer in Lengenpach) a Bernhard Preuzel (W.-Werhnardus dictus Prevzel) podávají králi zprávu o spletité finanční situaci opatství Göttweig a radí mu, aby  spokojit se s 200 odvahou z Vogthaferu jako každoroční službou a vrátit klášterní statky, které byly zkonfiskovány.", "kurzes_regest": "Die Räte Ottokars Otto von Maissau (O. de Meissowe), Otto von Haslau (O. Haslowe), Heinrich von Seefeld (H. de Sevelde), Heinrich von Liechtenstein (H. de Lihtenstein), Heinrich, Truchsess von Lengbach (H. dpifer in Lengenpach) und Bernhard Preuzel (W.-Werhnardus dictus Prevzel) erstatten dem König Bericht über die tratrige finnzielle Lage des Stiftes Göttweig und raten ihm n, sich mit 200 Mut Vogthafer als jährlicher Leistung zu begnügen und die mit Beschlag belegten Stiftsgüter wieder herauszugeben.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "3/17/1964", "lokalitat_name": "Wien", "cs-verze": "PO II osvobozuje klášter Göttweig od březnové píce.", "kurzes_regest": "PO II. befreit das Kloster Göttweig vom Marchfutter.", "beschenkte_institution_text": "Göttweig, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "23.3.1264", "lokalitat_name": "Graz", "cs-verze": "Herbord von Fulštejn/Füllstein, olomoucký biskup Truchsesse Bruna se svým příbuzným Theodorichem von Fulštejn/Füllstein, prodal majetek Johannu Saxovi von Eisbergen v Rintelnu. Herbordovi synové Johannes, Ekkericus, Herbordus a Henricus de Brukke s tím souhlasí", "kurzes_regest": "Herbord von Fulštejn/Füllstein, Truchsess Brunos Bischofs von Olomouc mit seinem Verwandten Theodorich von Fulštejn/Füllstein verkauften dem Johann Saxo von Eisbergen Besitze bie Rinteln. Dazu stimmen Herbords Söhne Johannes, Ekkericus, Herbordus et Henricus de Brukke zu", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "29.4.1264", "lokalitat_name": "Olomouc", "cs-verze": null, "kurzes_regest": "Bruno Bischof von Olomouc erteilt seinem Diener Höxter mit der Zustimmung der Olmützer Domkapitel das Dorf Býkovice", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "29.4.1264", "lokalitat_name": "Olomouc", "cs-verze": "Olomoucký biskup Bruno uděluje se souhlasem olomouckých katedrálních kapitul svému služebníku Tomášovi obec Staré Čivice", "kurzes_regest": "Bruno Bischof von Olomouc erteilt seinem Diener Tomas mit der Zustimmung der Olmützer Domkapitel das Dorf Staré Čivice", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -160099200000, "lokalitat_name": "Písek", "cs-verze": "PO II zaměňuje panství se Stiro de Kvítkovice.", "kurzes_regest": "PO II. verwechselt mit Stiro de Kvítkovice die Güter.", "beschenkte_institution_text": "Stiro de Kvítkovice", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "4.6.1264", "lokalitat_name": null, "cs-verze": "Papež Urban IV. uděluje pražskému kanovníkovi Petrovi, notáři krále PO II., že může ze své prebendy pobírat daň po dobu tří let za své služby králi, ale stále bude nepřítomen.", "kurzes_regest": "Papst Urban IV bewilligt dem Prager Kanoniker Peter, Notar des Königs PO II. dass er wegen des Dienstes für König für drei Jahren Abgabe aus seiner Prebende bekommen kann, trotzdem wird er abwesend sein.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 5.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "6/23/1964", "lokalitat_name": "Praha", "cs-verze": "PO II daruje hrad Sokolčí Vokovi z Rožmberka.", "kurzes_regest": "PO II. schenkt Vok von Rosenberg die Burg Sokolčí.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": "Totalfalsum"}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "7.7.126(4)", "lokalitat_name": null, "cs-verze": "Papež Urban IV. pověřuje biskupa van Olomouce, aby pomohl notáři českého krále, faráři Konrádu von Hartberg v jižním Štýrsku (Dilectus filius Chunradus rector ecclesie sancti Martini in Hartperch Salceburgensis diocesis notarius karissimi in Christo filii nostri regis Boemie) získat od opata z Melku beneficium, které pro něj již bylo určeno papežem Alexandrem IV.", "kurzes_regest": "Papst Urban IV. beauftragt den Bischof van Olmütz, dem Notar des Königs von Böhmen, Pfarrer Konrad von Hartberg in Südsteiermark (Dilectus filius Chunradus rector ecclesie sancti Martini in Hartperch Salceburgensis diocesis notarius karissimi in Christo filii nostri regis Boemie) zu helfen, von dem Abt von Melk ein ihm bereits van Papst Alexander IV. zugedacht gewesenes Benefizium zu erlangen.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "7/17/1964", "lokalitat_name": "Písek", "cs-verze": "PO II potvrzuje vůli Voka z Rožmberka a bere vyšebrodský klášter pod svou ochranu.", "kurzes_regest": "PO II. bestätigt das Testament von Vok von Rosenberg und nimmt das Kloster Vyšší Brod uner sein Schutz.", "beschenkte_institution_text": "Vyšší Brod, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": "#ERROR!"}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "17.7.1264", "lokalitat_name": null, "cs-verze": "Papež Urban IV. vyzývá krále Páda II., aby poskytl svou ochranu Otto Probstovi a katedrální kapitule v Salcburku. (Pravděpodobně to souvisí s Oldřichovou rezignací na salcburské biskupství v polovině roku 1264. V této době Přemysl Otokarův vliv v Salcburku zesílil (srov. Novotný, s. 124-125. Oldřich, později pouze biskup ze Seckau, byl s Přemyslem Otakarem21.4.1265", "kurzes_regest": "Papst Urban IV fordert den König PO II. auf, damit er dem Otto Probst und Domkapitel in Salzburg sein Schutz gibt. (Es wahr wahrscheinlich mit dem Zusammenhang mit der Resignation Ulrichs auf Salzburger Bischofsstuhl in der Mitte des Jahres 1264. In dieser Zeit wurde der Ottokars Einfluss in Salzburg stärker (Vgl. Novotný, S. 124-125. Ulrich später nur Bischof von Seckau war bei Ottokar21.4.1265", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "24.9.1264", "lokalitat_name": "Kroměříž", "cs-verze": "Olomoucký biskup Bruno, na žádost vdovy za sirotka Kadolta, potvrzuje Alžběta, bratr řádu německých rytířů, patronátní právo v Bytýšce.", "kurzes_regest": "Bruno Bischof von Olmütz bestätigt auf der Bitte der Witwe nach Kadolt der Waise/Sirotek, Elisabeth, dem Bruder des Deutschordens das Patronatsrecht in Bytýška.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "28.9.1264", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO. feiert den St.Wenzelsfest in Prag und tritt mit des Geistlichen und Laiken in den Bischofsdom in der Prager Burg", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Kurz nach 28.9-vor 4.10.1264", "lokalitat_name": "Čáslav", "cs-verze": null, "kurzes_regest": "PO II. fährt nach Časlav, wo ist er mit Markgraf Otto von Brandenburg, seiner Gattin Božena (Přemysls Schwester) und ihr Tochter Kunigunde und danach zogen alle nach Bratislava/Prešpurk", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "5.10. und um 5.10.1264", "lokalitat_name": "Bratislava", "cs-verze": "PO II, biskup Jan Pražský, biskup Brunno Olomoucký, biskup Jindřich Braniborský, vévoda slezský/polský markrabě Otto Braniborský a jeho manželka Božena (sestra Přemysla Otakara) slavili v táborech u Bratislavy/Prešpurku svatbu dcery posledně jmenované Kunhuty s Bělou, synem uherského krále Bély IV. Z uherské strany zde nadále platili srbští králové Halič, Anna Mutterová, zde mladý markrabě Jan Braniborský, zvaný pražský", "kurzes_regest": "PO II., Bischof Johann von Prag, Bischof Brunno von Olomouc, Bischof Heinrich von Brandenburg, einem Herzog von Schlesien/Polen Margraf Otto von Brandenburg und seine Gattin Božena (Ottokars Schwester) faierten die Hochzeit der Tochter der lezt gennanten Kunigunde mit dem Bela Sohn des Königs Bela IV. von Ungarn in Lagern bei Bratislava/Pressburg. Aus der Ungarischen Seite waren hier Könige von Serbien, Halitsch, Anna Mutter weiter wahr hier der junge Margraf Johann von Brandenburg genannt von Prag", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Nach 6.5.- vor 22.10.1264", "lokalitat_name": "Praha", "cs-verze": "PO II se po svatbě své neteře Kunhuty Braniborské přestěhoval zpět do Prahy, jak uvádí věrohodná zpráva z Druhého pokračování Kosmova", "kurzes_regest": "PO II. zog nach der Hochzeit seiner Nichte Kunigunde von Brandenburg zurück nach Prag wie die glaubwürdige Nachricht von Druhé pokračování Kosmovo erwähnt", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "10/22/1964", "lokalitat_name": "Písek", "cs-verze": "PO II lokalizuje 100 kopyt v lese u Bezdězu, kde mají Konrád a Hartwig z Kravař založit nové město (Starý Bezděz - Doksy, později převedeno do Bělé pod Bezdězem). PO II dále nařizuje, aby Konrád a jeho potomci zastávali úřad soudce v tomto městě dědičný, aby město vládlo podle práva města Prahy.", "kurzes_regest": "PO II. lokalisiert 100 Hufen in der Wald bei Bezděz, wo Konrad und Hartwig von Kravaře eine neue Stadt (Starý Bezděz - Doksy, später nach Bělá pod Bezdězem ubergetragene Stadt) gründen sollen. PO II. bestimmt auch, dass Konrad und seine Nachkommen das Richteramt in dieser Stadt erblich halten sollen, dass die Stad nach dem Recht der Prager Stadt richten soll.", "beschenkte_institution_text": "Die Stad im Ort Doksy (später nach Bělá pod Bezdězem Lokatoren Konrad und Hartwig von Kravaře (bei Česká lípa 49.931904N, 18.004721E)", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -162172800000, "lokalitat_name": "Olomouc", "cs-verze": "PO II rozhodl spor mezi tišnovským klášterem a jeho rytířem Drahoslavem.", "kurzes_regest": "PO II. entscheider den Streit zwischen dem Kloster Tišnov und seinem Ritter Drahoslav.", "beschenkte_institution_text": "Tišnov, Zisterzensiennerinenkloster - Drahoslav (Lukov)", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 5.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "11/14/1964", "lokalitat_name": "Praha", "cs-verze": "PO II daruje klášter Zlatá Koruna Vokovi z Rožmberka a jeho dědicům.", "kurzes_regest": "PO II. schenkt Vok de Rosenberg und seine Erben das Kloster Zlatá Koruna.", "beschenkte_institution_text": "Rosenberg, Vok von", "poII_aussteller": "Nein", "verfalscht": "Totalfalzum"}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "12/14/1964", "lokalitat_name": "Brno", "cs-verze": null, "kurzes_regest": "PO II. verleigt Jakub de Ragogna und seinem Brüdern erneut ihre Güter.", "beschenkte_institution_text": "Jakob de Ragogna", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": 1264, "lokalitat_name": "??", "cs-verze": "Královna Markéta potvrzuje opatství Zwettl statky a svobody získané podle dokumentů krále Konráda III. a vévodů Leopolda VI. a Fridricha II. Rakouského, zejména vynětí z jurisdikce panovníka; určuje soudní právo nakládky a zaručuje svobodu klášterních vesnic u okresního soudu v Pölle.", "kurzes_regest": "Königin Margarete bestätigt dem Kloster Zwettl die nach dem Zeugnis der Urkunden König Konrads III. und der Herzoge Leopold VI. und Friedrich II. von Österreich erlangten Besitzungen und Freiheiten, insbesondere die Befreiung von der landesfürstlichen Gerichtsbarkeit; bestimmt das richterliche Laderecht und gewährt Freiung für die Klosterdörfer in dem Landgericht Pölla.", "beschenkte_institution_text": "Zwettl, Zisterzienserkloster", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1262-1264", "lokalitat_name": null, "cs-verze": "PO II vyřešil spor mezi C. von Viehofenem a Heinrichem von Kuenring-Weitra, který uvěznil svůj lid", "kurzes_regest": "PO II. löste den Streit zwischen C. von Viehofen und Heinrich von Kuenring-Weitra, der seine Leute gefangengesetzt habe", "beschenkte_institution_text": "C. von Viehofen - Heinrich der Ältere von Kuenring-Weitra", "poII_aussteller": "M", "verfalscht": "fiktives Formelstück"}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1262-1264", "lokalitat_name": null, "cs-verze": "PO II svěřil poručnictví nezletilého Kadoltovi z Wehingu a Königsbrunnu (na Wagramu) jeho příbuzným Siegfriedovi II. z Hundsheimu, synovi Kadoltova strýce (avunkula) Siegfrieda I. z Hundsheimu a Anežce z Brunnu", "kurzes_regest": "PO II. vertraute dem Kadolt von Wehing und Königsbrunn (am Wagram) die Vormundschaft über den minderjährigen seinen Verwandten Siegfried II. von Hundsheim , Sohn Kadolts Onkel (avunculus) Siegfried I. von Hundsheim und Agnes von Brunn", "beschenkte_institution_text": "Kadolt von Wehing und Königsbrunn (am Wagram) - Siegfried II. von Hundsheim", "poII_aussteller": "M", "verfalscht": "fiktives Formelstück"}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1262-1264", "lokalitat_name": null, "cs-verze": "PO II přikazuje kadoltu z Wehingu a Königsbrunnu (na Wagramu), aby ukončil spor mezi bratry Razezausem a Ortolfem von Neuruppersdorf buď rozsudkem, nebo vyrovnáním.", "kurzes_regest": "PO II. gebietet dem Kadolt von Wehing und Königsbrunn (am Wagram) den Streit zwischen Brüder Razezaus und Ortolf von Neuruppersdorf entweder durch eien Sentenz oder durche einen Vergleich zu beenden.", "beschenkte_institution_text": "Kadolt von Wehing und Königsbrunn (am Wagram) - Brüder Radslav und Ortolf von Neuruppersdorf", "poII_aussteller": "M", "verfalscht": "fiktives Formelstück"}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1262-1264", "lokalitat_name": null, "cs-verze": "Druhý odp. Nadace jmenuje Otto von Haslau a Otto von Meissau soudci ve sporu mezi Kadoltem von Wehingem a Heinrichem von Liechtenstein o hrad Falkenstein", "kurzes_regest": "PO II. bestimmt den Otto von Haslau und Otto von Meissau als Richter im Streit zwischen Kadolt von Wehing und Heinrich von Liechtenstein über die Burg Falkenstein", "beschenkte_institution_text": "Kadolt von Wehing und Königsbrunn (am Wagram) - Heinrich von Liechtenstein", "poII_aussteller": "M", "verfalscht": "fiktives Formelstück"}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1262-1264", "lokalitat_name": null, "cs-verze": "PO II svěřuje Cadoldu z Wehingu ochranu viceplebanu v Gaubitsch", "kurzes_regest": "PO II. vertraut dem Kadold von Wehing in den Schutz den Vizepleban in Gaubitsch", "beschenkte_institution_text": "Kadolt von Wehing- Vizepleban in Gaubitsch", "poII_aussteller": "M", "verfalscht": "Formelstück"}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Um 1264-1265", "lokalitat_name": null, "cs-verze": "PO II žádá mělnického probošta, aby pomohl svému protonatarovi P. (pravděpodobně Petrovi) do arcijáhenství v Praze", "kurzes_regest": "PO II. bittet den Probst von Mělník auf, seinem Protonatar P. (wohl Peter) zu einem Archidiakonat in Prag zu verhelfen", "beschenkte_institution_text": "Mělník, Peter, protonotar", "poII_aussteller": "M", "verfalscht": "Formelstück"}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -157766400000, "lokalitat_name": "Praha", "cs-verze": "PO II uděluje privilegia občanům Ottensheimu.", "kurzes_regest": "PO II. erteilt den Bürgern von Ottensheim die Privilegien.", "beschenkte_institution_text": "Ottensheim, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "2.-3.2.1265", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II. feierte die Taufe seiner Tochter Kunigunde , die Bischof Johann von Prag, Bischof Bruno von Olomouc/Olmütz und Bischof Bertold von Bamberg. PO II. hat zur dieser Feierlichkeiten Adeligen aus Böhmen, Mähren und Österreich eingeladen. PO II. wurde festgekrönt und triit Prager Bischofsdom ein und dan folgt das Mahl in königlichem Saal (aula regia). Diese Feierlichkeiten dauerten zwei Tage", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -152582400000, "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II. beschenkt die Propstei Kroměříž mit dem Dorf Lešice.", "beschenkte_institution_text": "Kroměříž, Propstei", "poII_aussteller": "Ja", "verfalscht": "#ERROR!"}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -152582400000, "lokalitat_name": "Praha", "cs-verze": "PO II uděluje Herbordu von Fulsteinovi, hostinskému u Bruna, jurisdikci nad jeho statky.", "kurzes_regest": "PO II. erteilt Herbord von Fulstein, dem Schenk Bruno´s, Jurisdiktion an seinen Gütern.", "beschenkte_institution_text": "Fulstein/Fulštejn, Herbord von (Bruno interveniert)", "poII_aussteller": "Ja", "verfalscht": "#ERROR!"}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "25.2.1265", "lokalitat_name": "Kroměříž", "cs-verze": "Biskup Bruno na Olomouci rozhoduje o vyrovnání mezi ním a velehradským klášterem o daních.", "kurzes_regest": "Bischof Bruno on Olomouc bestimmt den Vergleich zwischen ihm und das Kloster Velehrad um die Abgaben.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Vor 10.3.1265", "lokalitat_name": "???", "cs-verze": "PO II přikazuje purkrabímu Hirzovi ze Zvíkova, aby jeho jménem daroval dominikánům pozemky ve svém nově založeném městě Českých Budějovicích. (vice et nomine domini mei regis Bohemie)", "kurzes_regest": "PO II. gebietet dem Burggraf Hirzo/Hrz von Klingenberg/Zvíkov, damit er in seinem Namen den Dominikaner das Areal in seiner neu gegründeten Stadt České Budějovice erteilt.(vice et nomine domini mei regis Bohemie)", "beschenkte_institution_text": "České Budějovice, Stadt - Hirzo/Hrz von Klingenberg/Zvíkov,", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "10.3.1265", "lokalitat_name": "???", "cs-verze": "Hrz/Hirzo Burgraf ze Zvíkova/Klingenberu, místo a jménem krále PO II (vice et nomine domini mei regis Bohemie), uděluje dominikánům prostor pro rozvoj kláštera v obci, kde je vybudováno nové město České Budějovice.", "kurzes_regest": "Hrz/Hirzo Burgraf von Zvíkov/Klingenber erteilt anstatt und in der Name Königs PO II. (vice et nomine domini mei regis Bohemie) den Dominikanen das Areal für Erbaung des Klosters im Ort, wo die neue Stadt České Budějovice erbauet ist.", "beschenkte_institution_text": "České Budějovice, Dominikanen in der Stadt", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "18.3.(am wahrscheinlichsten 1265, ganz ausgeschossen ist nicht 1266)", "lokalitat_name": "Wien", "cs-verze": "Zákon o II. kapitole přiznává klášteru Heiligenkreuz ministerské právo a nařizuje všem jeho zástupcům v Rakousku, aby projednali všechny spory s klášterem, které mu byly předloženy.", "kurzes_regest": "PO II. erteilt dem Kloster Heiligenkreuz das Ministerialrecht und befehlt allen seinen Beauftragten in Österreich, alle Striten mit dem Kloster bevor ihm zu besprechen.", "beschenkte_institution_text": "Heiligenkreuz, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -149731200000, "lokalitat_name": "Wien", "cs-verze": null, "kurzes_regest": "PO II. erteilt Conrad von Freising \"iudicium provinciale\" in Waidhofen.", "beschenkte_institution_text": "Freising, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -141868800000, "lokalitat_name": "Wien", "cs-verze": "PO II daruje 20 kopyt občanům města Hlubčice.", "kurzes_regest": "PO II. beschenkt die Bürger in Hlubčice mit 20 Hufen.", "beschenkte_institution_text": "Glubczycze, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -131241600000, "lokalitat_name": "Wien", "cs-verze": "PO II uděluje klášteru Lilienfeld svobody.", "kurzes_regest": "PO II. erteilt dem Kloster Lilienfeld Freiheiten.", "beschenkte_institution_text": "Lilienfeld, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Nach 3.2.- vor 21.4., oder nicht ganz ausgeschlossen nach 26.4.-vor 25.6.) 1265", "lokalitat_name": "Wien", "cs-verze": "PO II nechal uvěznit Otu z Maissau, Milotu z Dědic a jeho bratra Beneše ze Cvílína (bývalého purgrafa ze Znojma) a PO II začal plenit některé hrady v Rakousku. Otto a Beneš byli později popraveni nebo zemřeli ve vězení ve Veveří (před začátkem roku 1268) a opustili Milotu před 16.2.1268.", "kurzes_regest": "PO II. liess (den ehemaligen Landsrichter) Otto von Maissau, Milota z Dědic und sein Bruder Beneš von Cvilín (ehemaliger Burgraf von Znaim) gefangnehmen und PO II. beginnt manche Burgen in Österreich verplündern. Otto und Beneš wurden später hingerichtet oder gestorben im Gefängniss in Veveří (vor Amfang des Jahres 1268) und Milota vor 16.2. 1268 verlassen.", "beschenkte_institution_text": "Otto von Maissau - Beneš von Cvilín - Milota z Dědic", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "4/21/1965", "lokalitat_name": "Graz", "cs-verze": "PO II potvrzuje privilegia kláštera Garsten.", "kurzes_regest": "PO II. bestätigt die Privilegien des Klosters Garsten.", "beschenkte_institution_text": "Garsten, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "4/21/1965", "lokalitat_name": "Graz", "cs-verze": "PO II potvrzuje privilegia kláštera Seckau.", "kurzes_regest": "PO II. bestätigt dem Kloster Seckau seine Privilegien.", "beschenkte_institution_text": "Seckau, Propstei", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "4/23/1965", "lokalitat_name": "Graz", "cs-verze": "PO II vyhání některé poddané diecéze Freising.", "kurzes_regest": "PO II. eximierteinige Untertanen des Bistums Freising.", "beschenkte_institution_text": "Freising, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "4/26/1965", "lokalitat_name": "Neunkirchen", "cs-verze": "PO II potvrzuje práva opatství Garsten.", "kurzes_regest": "PO II. bestätigt dem Kloster Garsten seine Rechte.", "beschenkte_institution_text": "Garsten, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Kurz vor 1.5. - die zweite Hälfte von April 1265", "lokalitat_name": "???", "cs-verze": "II. odp. nařizuje olomouckému biskupovi Brunovi, aby odškodnil klášter Admont za rozšíření města Bruck an der Murau", "kurzes_regest": "PO II. gebietet dem Bischof Bruno von Olomouc wegen der Erweiterung der Stadt Bruck an der Murau das Kloster Admont neu entschädigen", "beschenkte_institution_text": "Admont, Benedektinerkloster; Hauptmann von Steiermark, Bischof Bruno von Olomouc; Bruck an der Mur, Stadt", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1.5.1265", "lokalitat_name": "Judenburg", "cs-verze": null, "kurzes_regest": "Bischof Bruno von Olomouc/Olmütz überträgt über Auftrag König Ottokars (ad petitionem domini nostri regis) dem Kloster Admont als weitere Entschädigung für seine durch die Erweiterung der Stadt Bruckk besonders an Leuten erlittenen Verluste den Rudolf Dorfmeister von Öblarn mit allen Rechten.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1.5.1265", "lokalitat_name": "Friesach", "cs-verze": null, "kurzes_regest": "Dietrich von Füllstein/Fulštejn und der Richter Konrad von Friesach, als Verträter Königs Ottokar und Bischofs Brunno, Verwalter der Besitze des vakanten Erzbischofsstuhles Salzburg, mit den Besseren der Stadt bezeiigen, dass Ulrich von Zeltschach sein ihm vom Truchsess von Kreig strittig gemachtes Besitzrecht an zwei Huben bei Altenhofen vor ihnen erwiesen habe.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "19. 5. ( wahrscheinlich 1262 oder 1265, ganz nicht ausgeschlossen Jahren 1263, 1267, 1268, 1269)", "lokalitat_name": "Wien", "cs-verze": "PO II přikazuje Dietrichu Schenkovi von Dobra, aby klášter Mondsee svěřil do tichého vlastnictví jemu darovaných statků v Ischlu a chránil jej v něm, protože PO II dal tomuto majetku imunitu soudu a soudního vykonavatele, jakož i osvobození od daní a imunitu Salzmeisteru.", "kurzes_regest": "PO II. gebietet dem Dietrich Schenk von Dobra, das Kloster Mondsee in den ruhigen Besitz der ihm bei Ischl geschenkten Güter zu setzen und es darin zu schützen, weil PO II. gab zu diesem Besitz Gerichs- und Vogtamtsimunität, sowie Steuerfreiheit und Imunität von Salzmeister.", "beschenkte_institution_text": "Mondsee, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "31.5.1265", "lokalitat_name": "???", "cs-verze": "Jindřich z Lichtenštejna vydal svou závěť, kterou PO II. a Vladislav biskup pasovský společně zpečetili. PO II se v té době s největší pravděpodobností nacházel ještě v Dolním Rakousku, jak dokládá velký počet dolnorakouských svědků.", "kurzes_regest": "Heinrich von Liechtenstein hat sein Testament ausgestellt, das PO II. und Wladislav Bischof von Passau mitsiegelten. PO II. in dieser Zeit am wahrscheinlichsten in Niederösterreich noch war, wie die grosse Menge der niederösterreichischen Zeugen zeigt.", "beschenkte_institution_text": "Heinrich von Liechtenstein", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "vor 7.6.1265", "lokalitat_name": "???", "cs-verze": "Královna Markéta žádá Dietricha von Hohenberg, aby opustil klášter Lilienfeld Hube u Türnitz.", "kurzes_regest": "Königin Margarethe fordert den Dietrich von Hohenberg um dem Kloster Lilienfeld Hube bei Türnitz abzutretten.", "beschenkte_institution_text": "Lilienfeld, Zisterzienserkloster; Dietrich von Hohenberg", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "23.6.1265", "lokalitat_name": "Maribor", "cs-verze": "Bruno, biskup olomoucký, prohlašuje, že na všeobecném soudním dni (generali iudicio) v Marburgu/Mariboru hrad Hörberg (Podsreda), o kterém se vyjádřili pan Heinrich von Scharfenberg (Svibno - Kraňsko/Slovinsko) a paní NN. Ten pověřil pana Luitolda/Leopolda z Lichtenecka, aby dal tentýž Scharfenberg do vlastnictví hradu ve jménu krále Přemysla Otakara (potestate domini nostri regis).", "kurzes_regest": "Bruno, Bischof von Olmütz/Olomouc erklärt, dass auf dem allgemeinen Gerichtstage (generali iudicio) zu Marburg/Maribor die Burg Hörberg (Podsreda) worüber Herr Heinrich von Scharfenberg (Svibno - Krain/Slownien) un die Frau NN. von Lemberg sich stritten dem erstern zugeschprochen wurde und er den Herrn Luitold/Leopold von Lichteneck beauftragt habe, denselben Scharfenberg im Namen des Königs Ottokar (potestate domini nostri regis ) in den Besitz des Schlosses zu setzen.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "23.6.1265", "lokalitat_name": "Maribor", "cs-verze": "Biskup Bruno pečetí dokument, ve kterém Oldřich Svobodný ze Lvova potvrzuje smírné urovnání svého sporu s biskupem Dietrichem von Gurkem.", "kurzes_regest": "Bischof Bruno besiegelt die Urkunde, in welcher Ulrich der Freie von Lemberg berurkundet die gütliche Beilegung seines Streites mit dem Bischof Dietrich von Gurk.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "(Nach 3.2.- vor 21.4., oder nach 26.4.-vor 25.6.) 1265", "lokalitat_name": "Wien", "cs-verze": "Občanská sbírka PO II potvrzuje práva kláštera ve Vornbachu (Forembacensis) a potvrzuje inzerované privilegium rakouského vévody Fridricha II. na osvobození od mýta na jeho pozemcích", "kurzes_regest": "PO II. bestätigt die Rechte des Klosters Vornbach (Forembacensis)und konfiermiet das inserierte Prvilegiums des Herzogs Friedrich II. von Österreich über Mautfreiheit in seinen Ländern", "beschenkte_institution_text": "Vornbach, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "25.6.1265", "lokalitat_name": "Beroun", "cs-verze": "PO II uděluje ostrovskému klášteru patronát nad ženami v kostele Panny Marie a kostela sv. Jakuba a kapli (pravděpodobně Zvěstování Panny Marie) v Domažlicích.", "kurzes_regest": "PO II. erteilt dem Kloster Ostrov Patronat über die Frauen Mariä-Kirche und St. Jakob-Kirche und die Kappele (wohl der Verkündigung Mariä) in der Stadt Domažlice/Taus.", "beschenkte_institution_text": "Ostrov, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -130982400000, "lokalitat_name": "České Budějovice", "cs-verze": "PO II potvrzuje privilegium pro klášter Melk.", "kurzes_regest": "PO II. bestätigt das Privilegium für das Kloster Melk.", "beschenkte_institution_text": "Melk, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "25.7.1265", "lokalitat_name": "Písek", "cs-verze": "Královna Kunhuta darovala vinici u Blučiny klášteru ve Žďáru nad Sázavou", "kurzes_regest": "Königin Kunigunde schenkt dem Kloster Žďár nad Sázavou Weinberg bei Blučina", "beschenkte_institution_text": "Žďár nad Sázavou, Zisterzienserkloster", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "8/25/1965", "lokalitat_name": "Praha", "cs-verze": "PO II chce rozšířit práva a svobody udělené jeho otcem Václavem I. z města sv. Havla na Starém Městě pražském, které se staví kolem kostela sv. Havla, uděluje právo mincmistrovi Eberhardovi a jeho přátelům, kteří se podíleli na založení Starého Města pražského. (scholae) v kostele sv. Galla.", "kurzes_regest": "PO II. will die von seinem Vater Wenzel I. erteilten Rechte und Freiheiten der Gallusstadt in der Prager Altstadt, die um St. Gall-Kirche gebaut wird, erweitern, erteilt dem Münzmeister Eberhard und seinen Freunden, die an die Gründung der Prager Altstadt teilnahmen, das Recht Geschäftsorte? (scholae) bei St. Gall-Kirche zu errichten.", "beschenkte_institution_text": "Münzmister Eberhard und andere Gründer und Lokatoren der Gallusstadt in der Prager Altstadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "31.8.1265", "lokalitat_name": "Wien", "cs-verze": "Mistr Ulrich Přemysl Otakar II. Protonotar dosvědčuje, že na Přemyslův rozkaz (ad petitionem) vedl opata a konvent skotského kláštera ve Vídni a Gerharda, plebana ve Vídni, přemyslovského kaplana u Friedů. Obě strany jsou povinny dostavit se před něho osmého dne po Přemyslově vjezdu do Vídně.", "kurzes_regest": "Meister Ulrich Přemysl Ottokars II. Protonotar bezeugt, dass er nach dem dem Befehl (ad petitionem) Ottokars er den Abt und Konvent des Schottenklosters in Wien und Gerhard, Pleban i n Wien, den Ottokars Kaplan zum Fried führt. Beide Seiten sind verpflichten den achten Tag nach dem Ottokars Eintritt in Wien vor ihm zu zu vortretten.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -146707200000, "lokalitat_name": null, "cs-verze": "PO II povoluje Ludmile ze Staré Říše prodat své statky klášteru Heiligenkreuz.", "kurzes_regest": "PO II. erlaubt Ludmila von Stará Říše, seine Güter dem Kloster Heiligenkreuz zu verkaufen.", "beschenkte_institution_text": "Stará Říše, Ludmila von - Heiligenkreuz, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "5.9.(am wahrscheinlichsten das Jahr 1265, troztdem ist in der Urkunde das Jahr 1266, was sehr wahrscheinlich nur Fehler ist)", "lokalitat_name": null, "cs-verze": "PO II povoluje Ludmile ze Staré Říše prodat své statky klášteru Zwettl.", "kurzes_regest": "PO II. erlaubt Ludmila von Stará Říše, seine Güter dem Kloster Zwettl zu verkaufen.", "beschenkte_institution_text": "Stará Říše, Ludmila von - Zwettl, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "23.9.1265", "lokalitat_name": "Kroměříž", "cs-verze": "Olomoucký biskup Bruno potvrzuje patronátní právo v Kostelní Myslové na Alberta presbytera premonstrátského kláštera v Gerasu", "kurzes_regest": "Bischof Bruno von Olomouc, bestätigt dem Albert Presbyter des Prämonstratenserstiftes Geras das Patronatsrecht in Kostelní Myslová", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Vor 27.9.1265", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. gründet die Stadt Vysoké Mýto und befreit sie von Abgaben für drei Jahren und erteilt der Stadt Gerichsexemption", "beschenkte_institution_text": "Vysoké Mýto, Stadt", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Kurz vor 27.9.1265", "lokalitat_name": "Nižbor", "cs-verze": null, "kurzes_regest": "PO II. entschied, dass er Konrad von Limberk die Gründung der Stadt Polička vertraut (actum)- siehe nächste Urkunde CDB V/1, Nr. 457, S. 673-674", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "9/27/1965", "lokalitat_name": "Nižbor", "cs-verze": "PO II pověřuje Konráda z Limbberka obnovením Poličky.", "kurzes_regest": "PO II. vetraut Conrad von Limberg die Neugründung von Polička an.", "beschenkte_institution_text": "Polička, Stadt - Konrad von Limberg/Limberk", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "6.10.1265", "lokalitat_name": "Salzburg", "cs-verze": "V uprázdněném salcburském arcibiskupství, oficiálně pod správou Přemysla Otakara a biskupa Bruna wa, skutečným PO II, byl novým arcibiskupem zvolen Ottokův bratranec Václav Slezský, vyšehradský probošt. V této době tedy skončila osmanská správa arcibiskupství v Salcburku, které bylo ve skutečnosti hlavně v salcburském vlastnictví ve Štýrsku, a Korutanech, zejména ve Friesagu.", "kurzes_regest": "Im vakanten Erzbistum Salzburg, das offiziel in der Verwaltung Ottokars und Bischof Bruno wa, real PO II. wurde der neue Erzbischof erwählt Ottokas Vetter Wladislav von Schlesien, Probst von Vyšehrad. Mit dieser Zeit endet also der Ottokars Verwaltung des Erzbistums Salzburg, der real vor allem war nur im Salzburgischer Besitzer in Steiermark, und Kärnten, vor allem in Friesach.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "14.10.1265", "lokalitat_name": "Graz", "cs-verze": "Herbord z Fulštejna/Füllsteinu Truchsess olomoucký biskup, Bruno štýrského hejtmana (capitaneus Styrie), který byl z papežského mandátu administrátorem salcburské arcidiecéze (ex mandato apostolico gubernacionem Salztpurgensis ecclesie tenebat), soudně přiznává klášteru Admondt některé nové desátky, které Bruno vybral ve prospěch salcburského kostela.", "kurzes_regest": "Herbord von Fulštejn/Füllstein Truchsess der Olmützer Bischofs Bruno des Hauptmans Steiermark (capitaneus Styrie), der aus dem päpstlichen Mandat der Verwalter der Salzburger Erzbistums war (ex mandato apostolico gubernacionem Salztpurgensis ecclesie tenebat) spricht gerichtlich dem Kloster Admondt gewisse von Bruno zugunsten der Salzburger Kirche eingezogene Neubruchzehnten zu.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "vor 23.10.1265", "lokalitat_name": "???", "cs-verze": "Královna Markéta vyzývá Alžbětu ze Sitzenbergu ve prospěch kláštera v Lilienfeldu, aby se vzdala okresního soudu, na který se nezákonně domáhala.", "kurzes_regest": "Königin Margarethe fordert Elisabeth von Sitzenberg zugunsten des Klosters Lilienfeld auf das von ihr widerrechtlich beanspruchte Landgericht zu verzichten.", "beschenkte_institution_text": "Lilienfeld, Zisterzienserkloster - Elisabeth von Sitzenberg", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -146534400000, "lokalitat_name": "Freistadt", "cs-verze": "PO II uzavírá spojenectví s diecézí a městem Freising.", "kurzes_regest": "PO II. schliesst das Bündniss mit dem Bistum und Stadt Freising.", "beschenkte_institution_text": "Freising, Bistum ; Freising, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "5.11.1265", "lokalitat_name": "Freistadt", "cs-verze": "Bruno biskup olomoucký/olomoucký, jako soudce jmenovaný papežským stolcem (iudex a sede apostolica delegatus), oznamuje (bývalému) arcibiskupovi Oldřichovi salcburskému (v té době již pouze biskupovi sečkovskému), že jednání mezi ním a farářem Wernherem o farnosti v Piberu posunul na 21. ledna 1266 a nikoli na 11. prosince 1265 do Štýrského Hradce.", "kurzes_regest": "Bruno Bischof von Olomouc/Olmütz, als der von dem päpstlichen Stuhl bestimmter Richter (iudex a sede apostolica delegatus), erklärt dem (ehemaligen) Erzbischof Ulrich von Salzburg (in dieser Zeit real nur Bischof von Seckau) ,dass er die Verhandlung zwischen diesem und dem Priester Wernher um die Pfarre in Piber auf den 21. Janner 1266 und nicht an 11.12.1265 nach Graz verlegt habe.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "6.11.1265", "lokalitat_name": "Freistadt", "cs-verze": "Olomoucký biskup Bruno pověřuje probošta Friedricha Probsta von Gurka provedením výslechu ve sporu mezi Oldrichem, bývalým arcibiskupem salcburským a biskupem v Gurgu, a farářem Wernherem, farností v Piberu.", "kurzes_regest": "Bruno Bischof von Olomouc/Olmütz bevollmächtigt den Probst Friedrich Probst von Gurk in der Streitsache zwischen dem Ulrich ehemaligen Erzbischof von Salzburg und Bischof von Gurg und dem Priester Wernher um die Pfarre in Piber das Verhör durchzuführen.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "6.12.1265", "lokalitat_name": "Kelč", "cs-verze": "Olomoucký biskup Bruno přikazuje prelátům své diecéze, aby přijímali určité posly (nuntios)", "kurzes_regest": "Bruno, Bischof von Olomouc/Olmütz gebietet den Prälaten seiner Diözese um bestimmte Boten (nuntios) empfangen", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "12/30/1965", "lokalitat_name": "Praha", "cs-verze": "PO II uděluje privilegia městu Žatec.", "kurzes_regest": "PO II. erteilt die Privilegien der Stadt Žatec.", "beschenkte_institution_text": "Žatec, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Ende des Jahres 1265", "lokalitat_name": null, "cs-verze": "PO II vysílá své šlechtice z Čech a Moravy na hranice s Bavorskem, tedy do oblastí jihozápadních Čech a Horního Rakouska. a na počátku příštího roku 1266, asi 2.1266, táhli tito vojáci přes Čechy. Doba této operace je uvedena v Přemyslovském dokumentu z 5.11.1265 ve Freistadtu, ve kterém je zmíněno veřejné nepřátelství mezi Občanskou platformou II a bavorskými vévody.", "kurzes_regest": "PO II. sendet seine Adeligen aus Böhmen und Mähren an der Grenze mit Bayern, also in die Regionen Südwestböhmen und Oberösterreich. und am Anfang des nächsten Jahres 1266, um 2.1266 zogen durch Böhmen diese Soldaten zurück. Der Zeit dieser Operation zeigt die Ottokars Urkunde aus 5.11.1265 in Freistadt, in die ist öfentliche Feindschaft Zwischen PO II. und Herzöge von Bayern erwähnt.", "beschenkte_institution_text": null, "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Ende des Jahres 1265- Anfang des Jahres 1266, sicher vor Mai 1266", "lokalitat_name": null, "cs-verze": "Poté, co král Richard jmenoval Přemysla Otakara ochráncem říšských statků východně od Rýna, obsadil Přemysl Otakar Chebsko", "kurzes_regest": "Nach der Ernennung des Ottokars zum Schützer der Reichsgüter östlich von Rhein durch den den Könich Richard besetz Ottokar Egerland", "beschenkte_institution_text": "Egerland", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1.1.1266", "lokalitat_name": "Modřice", "cs-verze": "Olomoucký biskup Bruno uděluje bohatství a svobody všem, kteří nacházejí vinice v blízkosti Kroměříže.", "kurzes_regest": "Bruno Bischof von Olomouc/Olmütz erteilt die Reichte und Freiheiten allen die Weinberge bei Kroměříž lokieren.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "21.1.1266", "lokalitat_name": "Graz", "cs-verze": "Probošt Friedrich von Gurk, jako auditor jmenovaný olomouckým biskupem Brunem (auditorie deputato a viro venerabili Olmucensi), mu podává zprávu o výslechu, který před ním probíhal ve sporu mezi biskupem Oldřichem von Seckau a knězem Wernerem o farnost Piber.", "kurzes_regest": "Propst Friedrich von Gurk als von Bischof Bruno von Olmütz/Olomouc (auditorie deputato a viro venerabili Olmucensi ) bestimmter Auditor berichtet diesem über das vor ihm abgeführte Verhör im Streit zwischen Bischof Ulrich von Seckau und dem Priester Werner um die Pfarre Piber.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1/21/1966", "lokalitat_name": "Praha", "cs-verze": "PO II bere pod svou ochranu Petra, nově zvoleného biskupa pasovského.", "kurzes_regest": "PO II. nimmt Petr, dem Bischof-Elekt von Passau, unter sein Schutz.", "beschenkte_institution_text": "Passau, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "1/22/1966", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II. befehlt seinen Beauftragten in Österreich, die Güter der kirchliche Institutionen nicht zu stören.", "beschenkte_institution_text": "Kirche in Österreich/Provinz- und Stadtrichter in Österreich,", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "3/15/1966", "lokalitat_name": "Eggenburg", "cs-verze": null, "kurzes_regest": "PO II. befehlt seinen Beauftragten in Österreich, die Güter der Kirche in Passau nicht zu stören.", "beschenkte_institution_text": "Passau, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "15.3.1266", "lokalitat_name": "Šlapanice", "cs-verze": "Olomoucký biskup Bruno vysvětluje hraběti Gerhardovi Holštýnskému v Kause patronátní právo v Rendsburgu na proboštství v Hamburku", "kurzes_regest": "Bischof Bruno von Olomouc erklärt den Grafen Gerhard von Holstein in der Kause der Patronatsrechts in Rendsburg der Probstei im Hamburg", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "14.4.(am wahrscheinlichsten 1266), ganz nicht auschliessen 1262-1265)", "lokalitat_name": "Praha", "cs-verze": "Kunhuta vysvětluje olomouckému biskupovi Brunovi, že dala abatyši (pravděpodobně Jutě) a cisterciáckému klášteru v Oslavanech patronátní právo nad kostelem v Nowa Cerekwia (Nuwenkirghen, v části Troppau).", "kurzes_regest": "Kunigunde erklärt dem Bischof Bruno von Olomouc/Olmütz, dass sie der Äbtissin (wohl Juta) und dem Zisterzienserinnenkloster Oslavany das Patronastrecht der Kirche in Nowa Cerekwia (Nuwenkirghen, in Troppauer Teil) übergab.", "beschenkte_institution_text": "Oslavany, Zisterzienserinnenkloster - Bischof Bruno von Olomouc", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -118108800000, "lokalitat_name": "Cheb", "cs-verze": "PO II potvrzuje práva města Chebu.", "kurzes_regest": "PO II. bestätigt der Stadt Cheb seine Rechte.", "beschenkte_institution_text": "Cheb, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "13.5.1266", "lokalitat_name": "Litoměřice", "cs-verze": "PO II svědčí mimo jiné o listině hraběte Alberta Gorici-Tyrolského, který jako věno odkázal hrady Eberstein a Schönberg v Kraňsku své manželce Eufemii, dceři slezského vévody Konráda.", "kurzes_regest": "PO II. bezeugt unter anderen die Urkunde des Grafen Albert von Görz und Tirol, der seiner Gattin Euphemia, Tochter Herzog Konrads von Schlesien die Burgen Eberstein und Schönberg in Krain als Mitgift verscheibt.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "26.5.1266", "lokalitat_name": "Mírov", "cs-verze": "Olomoucký biskup Bruno předává Kamennou Horku Laíkovi Ulrichu Dörflovi", "kurzes_regest": "Bruno Bischof von Olomouc schenkt dem Laik Ulrich Dorfl Kamenna Horka", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "2.6.1266", "lokalitat_name": "Olomouc", "cs-verze": "Olomoucký biskup Bruno potvrdil dar Bendy z Dubíčka", "kurzes_regest": "Bruno Bischof von Olomouc bestätigt die Donation Bendas von Dubíčko", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "3.6.1266", "lokalitat_name": "Kroměříž", "cs-verze": "Biskup Bruno potvrzuje dopis královny Kunikunde (viz 14.4.1266), potvrzuje a zveřejňuje na synodě, že udělila cisterciáckému klášteru v Oslavanech patronátní právo nad kostelem v Nowé Cerekwii (Troppovská oblast).", "kurzes_regest": "Bischof Bruno konfirmiert das Brief der Königin Kunikunde (siehe 14.4.1266), bestätigt und veröfentlicht in der Synode, dass sie dem Zisterzienserinenkloster Oslavany das Patronatsrecht der Kirche in Nowa Cerekwia (Troppauer Land) übergab.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "7. 6. (1966)", "lokalitat_name": "Stříbro", "cs-verze": "PO II přebírá nemocnici v Böhmischbrucku pod svou ochranu.", "kurzes_regest": "PO II. nimmt das Spital in Böhmischbruck unter sein Schutz.", "beschenkte_institution_text": "Böhmischbruck Spital", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Nicht lang vor 5.6.1266", "lokalitat_name": null, "cs-verze": "Druhý odp. přikázal Gottschalku von Neuberg a Erchengu von Landsee ve svém mandátním dokumentu (litteris et mandato gloriosi domini nostri Otachari), aby stanovili hranici v hraničním sporu mezi kláštery St. Lambrecht a Lilienfeld", "kurzes_regest": "PO II. gebieten in seiner Mandatsurkunde (litteris et mandato gloriosi domini nostri Otachari) den Gottschalk von Neuberg und Erchenger von Landsee, damit sie die Grenze im Grenzstreit zwischen den Klostern St. Lambrecht und Lilienfeld festsezten", "beschenkte_institution_text": "St. Lambrecht, Benediktinerkloster; Lilienfeld, Zisterzienserkloster; Gottschalk von Neuberg; Erchenger von Landsee", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "5.6.1266", "lokalitat_name": "Mariazell", "cs-verze": "Gottschalk von Neuberg a Erchenger von Landsee z pověření krále Ottokara (litteris et mandato gloriosi domini nostri Otachari) zřizují Salzu od Gölleru po Zellerhüten, Mummenalm a rozvodí od Malého a Velkého Ötscheru po Hochstadel v hraničním sporu mezi kláštery St. Lambrecht a Lilienfeld jako hranici oblasti darované vévodou Leopoldem VI. rakouským klášteru Lilienfeld a svěřují rytíře Konráda von Nussdorf jako vyslance nepřítomného hraběte z Hardecku se zavedením vlastnictví kláštera Lilienfeld.", "kurzes_regest": "Gottschalk von Neuberg und Erchenger von Landsee setzen über Auftrag Konig Ottokars (litteris et mandato gloriosi domini nostri Otachari) im Grenzstreit zwischen den Klostern St. Lambrecht und Lilienfeld als Grenze des von Herzog Leopold VI. von Österreich dem Kloster Lilienfeld gestifteten Gebietes die Salza vom Göller bis zu den Zellerhüten, die Mummenalm und die Wasserscheide vom kleinen und grossen Ötscher bis zum Hochstadel fest und betrauen den Ritter Konrad von Nussdorf als Abgesandten des abwesenden Grafen von Hardeck mit der Besitzeinführung des Klosters Lilienfeld.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "6/26/1966", "lokalitat_name": null, "cs-verze": "PO II uděluje jeptiškám v Chotěšově patronátní právo nad kostelem sv. Vavřince u Plzně.", "kurzes_regest": "PO II. erteilt den Nonnen in Chotěšov das Patronantsrecht zur St.-Laurentius-Kirche in der Nähe von Pilsen.", "beschenkte_institution_text": "Chotěšov, Prämonstratenserinnenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "2.7.1266", "lokalitat_name": "Praha", "cs-verze": "Andreas Kämmerer a Zdislav, maršálek krále Přemysla Otakara II., prohlašují, že opat Martin z Břevnova kupuje od místního fojta Wichera Voigtamt/Richteramt v Broumově.", "kurzes_regest": "Andreas Kämmerer und Zdislav Marschall des Königs Přemysl Ottokars II. deklarieren, dass Abt Martin von Břevnov Voigtamt/Richteramt in Broumov von dem dortigen Vogt Wicher kauft.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "7/24/1966", "lokalitat_name": "Domažlice", "cs-verze": "PO II uzavírá spojenectví s městem Regensburg.", "kurzes_regest": "PO II. schliesst das Bündniss mit der Stadt Regensburg.", "beschenkte_institution_text": "Regensburg, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "7.8.1266", "lokalitat_name": "Zwischen Taus und böhmisch-bayerische Grenze", "cs-verze": "PO II zahájil svůj pochod do Bavorska 7.8.1266 s vojsky z Čech, Moravy, Rakouska a pomocnými vojsky z Korutan a Polska. Předsunuté jednotky se stáhly již 3.8.1266 (Ann. Zwett). A ze Štýrska se do Bavorska přestěhoval olomoucký biskup Bruno.", "kurzes_regest": "PO II. beginnt am 7.8.1266 sein Zug nach Bayern mit den Truppen aus Böhmen, Mähren, Österreich, und Hilfstruppen von Kärnten und Polen. Vortruppen zogen schon am 3.8.1266 (Ann. Zwett.) Und aus Steiermark zog nach Bayern Bischof Bruno von Olomouc.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Kurz nach 7.8.1266", "lokalitat_name": "Cham", "cs-verze": null, "kurzes_regest": "PO II. zog aus Böhmen zu Cham und versuchte die Stadt mit der Eroberungsmaschienen misserfolg erobern", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Sehr kurz nach 7.8.1266", "lokalitat_name": "Nittenau", "cs-verze": null, "kurzes_regest": "PO II. erobert und zerstört die Burg Nittenau", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Nach 7.8.1266", "lokalitat_name": "Regenstauf", "cs-verze": "PO II dobývá zámek Regenstauf a plení oblast až k Dunaji", "kurzes_regest": "PO II. erobert die Burg Regenstauf und plündert das Gebiet bis zum Donau", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Länger nach 7.8.1266", "lokalitat_name": "Regensburg", "cs-verze": "PO II má svůj tábor před městem Regensburg a navštěvuje mimo jiné Svatopetrský klášter / Klášter svatého Petra ve městě", "kurzes_regest": "PO II. hat sein Lager vor der Stadt Regensburg und besucht unter anderen St. Peter-Kloster/ Das Kloster Weih Sankt Peter in der Stadt", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko", "Datum": "(wohl August) 1266", "lokalitat_name": "Bad Reichenhall", "cs-verze": "Olomoucký biskup Brun na příkaz krále Přemysla Otakara přitáhl z Horních Rakous a Štýrska do Bavorska a dobyl město Bad Reichenhall, ale vévoda Jindřich Bavorský ho donutil k ústupu a vyplenil Horní Rakousy.", "kurzes_regest": "Bischof Bruno von Olomouc/Olmütz nach dem Befehl des Königs Ottokar zog nach Bayern aus Oberösterreich bzw. Steiermark und erobert die Stadt Bad Reichenhall, aber Herzog Heinrich von Bayern hat ihn zurückzuziehen gezwungen und Oberösterreich geplündert.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Kurz vor 6.9.1266", "lokalitat_name": "Eger", "cs-verze": "PO II se přesunula z Bavorska zpět do Čech přes Eger. Podle Ann. Vindob. Tato válka trvá asi měsíc. To je podpořeno i faktem, že PO II byl v Praze již 6.9.1266.", "kurzes_regest": "PO II. zog aus Bayern zurück nach Böhmen durch Eger. Nach Ann. Vindob. Dauert dieses Krieg circa ein Monat. Dafür spricht, dass PO II. in Prag schon war am 6.9.1266.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -112492800000, "lokalitat_name": "Praha", "cs-verze": "P. II. nařizuje opatovi z Kremsmünsteru, aby při vybírání desátků v Gerstenthalu nenarušoval majetek špitálu v Pyhrnu.", "kurzes_regest": "PO II. befehlt dem Abt von Kremsmünster, dass er bei Einziehen von Zehnten in Gerstenthal die Gütern des Spitals in Pyhrn nicht stören soll.", "beschenkte_institution_text": "Spital am Pyhrn, Kolegiatstift/Chorherrenstift Spital", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "27.10.1266", "lokalitat_name": "Krummau am Kamp", "cs-verze": "Královna Markéta daruje panství Grafenberg u Eggenburgu klášteru Lilienfeld, kde si vybrala svého Brabstätte", "kurzes_regest": "Königin Margarete schenkt dem Kloster Lilienfeld, in dem sie sich ihre Brabstätte erwählt hat , das Gut Grafenberg bei Eggenburg", "beschenkte_institution_text": "Lilienfeld, Zisterzienserkloster", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "29.10.1266", "lokalitat_name": "Krummau am Kamp", "cs-verze": "Zemřela královna Markéta, první Přemyslova manželka", "kurzes_regest": "Königin Margarete, erste Ottokars Gattin ist gestorben", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "vor 30.11.1266", "lokalitat_name": "???", "cs-verze": "PO II se 30.11.1266 krátce přesunula z Horního Rakouska do Bavorského Innviertelu, nebo tento pochod organizovala v Horních Rakousích, takže PO II. musela být přítomna v Horních Rakousích před 30.11.1266. (viz další záznam)", "kurzes_regest": "PO II. zog am 30.11.1266 kurz in bayerisches Innviertel aus Oberösterreich, bzw. organisierte in Oberösterreich dieser Zug, also PO II. muste vor 30.11. 1266 in Oberösterreich awesend sein. (vgl. Nächste Eintrag)", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "30.11.1266", "lokalitat_name": "Ried im Innkreis", "cs-verze": "PO II shromáždil tažení proti Bavorsku, které pod vedením vévody Jindřicha Bavorského vyplenilo Passauerland. PO II vyplenil sousední bavorské území Innviertel a obsadil hrad Ried, ale krátce nato musel kvůli zimám ustoupit (Přemyslovo osobní rozdělení není zcela jisté, jak ukazuje Novotný, ČD I/4, s. 147, pozn. 4). Hrad Ried však zůstal součástí rodu Přemyslů Otakarů.", "kurzes_regest": "PO II. hat den Zug gegen Bayern versammelt, die unter der Führung des Herzogs Heinrich von Bayern Passauer Land geplündert haben. PO II. plünderte bayerische Nachbargebiet Innviertel und besetzte die Burg Ried, aber kurz danach muss er wegen der Winter zurückziehen (der persönliche Anteilung Ottokars ist nicht ganz sicher, wie schon Novotný, ČD I/4, S.147, Anm. 4, zeigt.).Burg Ried blieb aber ein Teil der Ottokar Herschaft. ", "beschenkte_institution_text": "Burg Ried im Innkreis", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -117504000000, "lokalitat_name": "Freistadt", "cs-verze": "PO II povoluje biskupovi z Freisingu lov na svých statcích.", "kurzes_regest": "PO II. erlaubt dem Bischof von Freising, in seinen Gütern zu jägen.", "beschenkte_institution_text": "Freising, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -117504000000, "lokalitat_name": "Linz", "cs-verze": "Zákon PO II zakazuje rozdělování dětí narozených v manželství.", "kurzes_regest": "PO II. verbietet, dass die Kinder, die ehelich geboren sind, geteilt werden.", "beschenkte_institution_text": "Freising, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": -117504000000, "lokalitat_name": "Linz", "cs-verze": "II. PO pověřuje Heinricha von Hardegga, aby vyřešil spor mezi kostelem ve Freisingu a Eufemií von Pottendorf.", "kurzes_regest": "PO II. ordnet Heinrich von Hardegg an, den Streit zwischen der Kirche in Freising und Euphemia von Pottendorf zu lösen.", "beschenkte_institution_text": "Freising, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "(5.-31.) 12. 1966", "lokalitat_name": "Graz", "cs-verze": "PO II : 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "Um 14.1.1267", "lokalitat_name": "Lilienfeld", "cs-verze": "PO II táhl přes Lilienfeld", "kurzes_regest": "PO II. zog durch Lilienfeld", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko", "Datum": "(am 14.1 oder 15.1.1267)", "lokalitat_name": "Wilhemsburg", "cs-verze": "Opat z Lilienfeldu si stěžoval u PO II ve Wilhelmsburgu u sestry bratrů Konráda staršího, Konráda mladšího, Rapota a Wulfinga z Altenburgu. Výše zmínění Schesterové si nárokují majetek kláštera v Lilienfeldu, i když PO II tento spor rozhodl již dříve. PO II předvolal bratry z Altenburgu a Dieticha von Hackenberg/Hachenberg ke slyšení (na této schůzi nebo později) a nařídil jim a jejich sestrám, aby nezatěžovali klášter v Lilienfeldu. Dále prostřednictvím PO II., celý juridikt tohoto sporu rakouskému okresnímu soudci Heinrichu Grafu von Hardeck, a Albero Truchsesovi z Feldsbergu/Valtice, jakož i komorníkovi Otto von Perchtodlsdorf, aby tento spor s účastí obou stran na svátek svatého Martina (11.11.1267) ve Vídni u vévodského soudu se statkáři soudili a rozhodli.", "kurzes_regest": "Der Abt von Lilienfeld beklagte sich dem PO II. in Wilhelmsburg an Schwester der Brüder Konrad des Elteren, Konrad dea Jüngeren, Rapoto und Wulfing von Altenburg. Die genannte Schester spruchen die Besitze des Klosters Lilienfeld an, trotzdem PO II. schon früher entscheid diesen Streit. PO II. lud die Brüder von Altenburg und Dietich von Hackenberg/Hachenberg zur Verhandlung (bei dieser Treffung oder später) vor, und gebietet ihnen und ihren Schwestern das Kloster Lilienfeld nicht belasten. Dann über PO II. die ganze Iuridikton dieses Streites den österreichischen Landrichter Heinrich Graf von Hardeck, und Albero Truchsess von Feldsberg/Valtice, sowie den Kämmerer Otto von Perchtodlsdorf, damit diesen Streit mit der Teilnahme beider Seiten am Martinstag (11.11.1267) in
