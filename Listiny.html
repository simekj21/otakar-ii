kýza Moravie, se souhlasem své manželky Markéty, přenechává patronátní právo Mutmannsdorfu západně od Wiener-Neustadtu biskupovi Oldřichovi von Seckau", "kurzes_regest": "PO II., dominus regni Boemie, dux Austrie et Stirie, marchioque Moravie überlässt mit der Zustimmung seiner Gattin Margarete dem Bischof Ulrich von Seckau das Patronatsrecht von Mutmannsdorf westlich bei Wiener-Neustadt", "beschenkte_institution_text": "Seckau, Bistum und Bischof Ulrich", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "1.5.1254 - wahrscheinlichsten kurz vor 31.5.1254", "lokalitat_name": "Znojmo", "cs-verze": null, "kurzes_regest": "Actum der Urkunde dessen Datum ist 31.5.1254 in Brno", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "31.5.1254", "lokalitat_name": "Brno", "cs-verze": null, "kurzes_regest": "PO II. dominus regni Bohemie, dux Austrie et marchio Moravie schenkt dem Johanniter-Spital Weinbergsrecht bei Brno", "beschenkte_institution_text": "Brno, Johanniterspital", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "9.7.1254", "lokalitat_name": "Praha", "cs-verze": "PO II dominus regni Bohemie, dux Austrie et Stirie (sic) daruje svému kaplanovi Bartoloměji, arcijáhnovi v Olomouci, kustodovi na Vyšehradě, hospodu s medovinou (s medovinou) pod hradbami města Prahy", "kurzes_regest": "PO II. dominus regni Bohemie, dux Austrie et Stirie (sic) schenkt seinem Kaplan Bartholomeus, dem Erzdiakon in Olomouc/Olmütz dem Kustod in Vyšehrad/Wischegrad zu seinem Kustodamt die Kneipe mit Met (s medovinou) unter Mauern der Prager Stadt", "beschenkte_institution_text": "Bartholomeus, Ottokars Kapelan, Erzdiakon in Olomouc, Kustod in Vyšehrad", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "10.7.1254", "lokalitat_name": "Praha", "cs-verze": "PO II obnovuje práva a povolení svého otce Václava I. k opatovi a klášteru v Oseku a také svého otce Schenunga, aby jejich četné statky, které byly poškozeny za války mezi králem Václavem I. a PO II., mohly být obnoveny klášterem v Oseku.", "kurzes_regest": "PO II. erneuert die Rechte und Bewilligung seines Vaters Wenzels I. dem Abt und dem Kloster Osek und auch seines Vates Schenung en, damit ihre viele Güter, die während des Krieges zwischen König Wenzel I. und PO II. beschädigt wurden, Kloster Osek renoviert kann.", "beschenkte_institution_text": "Osek, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "10.7.1254", "lokalitat_name": "Praha", "cs-verze": "Bartolomějskou kapli (pravděpodobně na Pražském hradě) daroval PO II. pražskému katedrálnímu kostelu, který již jeho otec Václav vyměnil za jiné zboží.", "kurzes_regest": "PO II. gab die St.Bartolomeus-Kapele (wohl in der Prager Burg) der Prager Domkirche, welche schon sein Vater Wenzel ausser andere Gütter tauschte.", "beschenkte_institution_text": "Praha, St.-Bartolomeus-Kapelle", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "Zwischen November 1251-17.8.1254", "lokalitat_name": null, "cs-verze": "PO II nařizuje olomouckému vojvodovi Štěpánovi, aby svým kaplanům Arnoldovi a Vojslavovi (Vojzlaovi) předal dva pozemky na předměstí Olomouce.", "kurzes_regest": "PO II. gebietet dem Olmützer Voigt Stephan, damit er seinen Kaplanen Arnold und Vojslav (Woyzlao) zwei Parzelen in Olmützer/Olomoucer Vorstadt übergab.", "beschenkte_institution_text": "Ottokars Kaplanen Arnold und Vojslav (Woyzlao) - Olmützer Voigt Stephan in Olomouc", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "17.8.1254+", "lokalitat_name": "Olomouc", "cs-verze": "PO II dává olomouckému kostelu (Olomouc) dva pozemky olomouckých předměstí, které olomoucký Voigt Štěpán podle Přemyslova rozkazu předal svým kaplanům Arnoldovi a Vojslavovi (Vojzlaovi).", "kurzes_regest": "PO II. schenkt der Olmützer Kircher (Olomouc) zwei Parzelen Olmützer Vorstadt, die Olmützer Voigt Stephan nach dem Ottokars Befehl, seinen Kaplanen Arnold und Vojslav (Woyzlao) übergab.", "beschenkte_institution_text": "Olomouc, Domkirche", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "(wohl um 17.8.) 1254", "lokalitat_name": "Olomouc", "cs-verze": "PO II. dominus regni Bohemiae, dux Austrie et Styrie, markýza Moravie Moravie potvrzuje dar katedrálnímu kostelu v Olomouci (terram duorum camerariorum z Moravských Loděnic a blízkého lesa na žádost a podporu přemyslovského kaplana Řehoře, Kostoda z olomouckého kostela za podmínky, že pokud Řehořovi synovci Vojslav (Vojslav) a Johann budou chtít tyto kusy odkoupit zpět,  tyto kusy si pak musí koupit z olomoucké katedrály za 3 SIlberpfunda.", "kurzes_regest": "PO II. dominus regni Bohemiae, dux Austrie et Styrie, marchio Moravie bestätigt der Domkirche in Olomouc/Olmütz die Donation (terram duorum camerariorum von Moravská Loděnince und das nähaliegende Wald auf der Bitte und Unterstützung von Ottokars Kaplans Gregor, Kostods der Olmützer Kirche unter Bedinungen, dass, wenn Gregors Neffen Vojslav (Woyzlaus) und Johann diese Stücke zurückkaufen wollen werden, sie dann von der Olmutzer Domkirche für 3 SIlberpfunda diese Stücke kaufen müssen.", "beschenkte_institution_text": "Olomouc, Domkirche", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "1.9.1254", "lokalitat_name": "Grimma", "cs-verze": "Heinrich von Plauen, Heinrich von Gera Voigten uzavírají spojenectví s markrabětem Heinrichem von Meisen proti odpůrcům, především proti českému králi Přemyslu Otakarovi a proti arcibiskupovi Wilbrandovi z Magdenburgu. Magraf Heinrich von Meissen musí vojmistrům pomoci především v případě, že do jejich země vtrhne Pád II.", "kurzes_regest": "Heinrich von Plauen, Heinrich von Gera Voigten schliessen den Bund mit Markgrafen Heinrich von Meisen gegen Gegner, vor alem gegen König von Böhmen Ottokar und gegen Erzbischof Wilbrand von Magdenburg. Magraf Heinrich von Meissen muss den Voigten vor allen helfen, falls PO II. in ihren Land einfällt.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "13.9.1254+", "lokalitat_name": null, "cs-verze": "V Čechách byli Poppo Velikonocní, velmistr německých rytířů/magister domus hospitalis s. Mariae Theutonicorum, Albertus archiepiscopus Livoniensis, Theodor de Grüningen commendator Alemaniae. Pravděpodobně s Ottokarem.", "kurzes_regest": "Poppo von Ostern, velmistr německých rytířů/Grossmeister des Deutschen Ordens/magister domus hospitalis s. Mariae Theutonicorum, Albertus archiepiscopus Livoniensis, Theodor de Grüningen commendator Alemaniae waren in Böhmen. Wohl bei Ottokar.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "23.10.1254 (actum)", "lokalitat_name": "Sadská", "cs-verze": "PO II přikazuje svým soudcům, aby uplatňovali židovské záležitosti podle dvou dokumentů Pastes Inocenc II.", "kurzes_regest": "PO II. gebietet seinen Richtern, damit die Judenanglelegenheiten nach der zwei Urkunden Pastes Innozenz II. applizierent.", "beschenkte_institution_text": "universis fidelibus regni nostri per Boemiam, baronibus, supanis, villicis, iudicibus et aliis a nobis habentibus iudiciariam potestatem", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "17.11.1254 (actum)", "lokalitat_name": "Krems", "cs-verze": "PO II obnovuje a potvrzuje privilegia udělená klášteru Garsten jeho předky, rakouskými vévody, a to i za přispění jeho manželky Markéty", "kurzes_regest": "PO II. erneuert und bestätigt die von seinen Vorfarhen, den Herzogen von Österreich, dem Kloster Garsten erteilten Privilegien, auch mit der Asistenz seiner Gattin Margarete", "beschenkte_institution_text": "Garsten, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "18.12.1254 (actum)", "lokalitat_name": null, "cs-verze": "Druhý d.o. uděluje opatství Heiligenkreuz patronátní právo a právo prezentace nad farností Alland jako náhradu za škody způsobené klášteru během vpádů Maďarů a pohanů.", "kurzes_regest": "PO II. verleiht der Abbtei Heiligenkreuz das Patronats und Präsentationsrecht über die Pfarre Alland als Ersatz für die Schaden, die dasl Kloster während der Einfälle der Ungarn und der Paganen.", "beschenkte_institution_text": "Heiligenkreuz, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "Im Jahr 1254, aber vor dem 25.12.1254", "lokalitat_name": null, "cs-verze": "PO II dal uvěznit šlechtu pro malitiam a dva z nich nechal popravit (iussit decolari), a tak iillum de Ekkartsowe et quendam nomine Eberanum, a také Cunradus Chamber a Chriegeler popraveni na příkaz Přemysla Otakara (decollati sunt.", "kurzes_regest": "PO II. liess die Adeligen gefangenomen pro malitiam, und zwei liess er hingerichten (iussit decolari), und so iillum de Ekkartsowe et quendam nomine Eberanum, und auch Cunradus Chamber und Chriegeler auf dem Ottokars Befehl hingerichtet (decollati sunt.", "beschenkte_institution_text": null, "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "25.12.1254", "lokalitat_name": "Wrocław", "cs-verze": "Přemyslova křížová výprava se koná na místě, kde se křížová výprava koná", "kurzes_regest": "Ottokars Kreuzzug ist im Treffungsort der Kreuzzuges", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 5.0, "Periode": "Rakousko, české země", "Datum": "2.1.1255++", "lokalitat_name": "Brno", "cs-verze": "PO II potvrzuje strýcovu listinu pro tišnovský klášter", "kurzes_regest": "PO II. bestätigt die Urkunde seines Onkels für das Kloster Tišnov", "beschenkte_institution_text": "Tišnov, Zisterzensiennerinenkloster", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "10.1.1255", "lokalitat_name": "Voitsberg", "cs-verze": null, "kurzes_regest": "Herzogin Gertrud von Babernberg verleiht dem steierischen Landschreiber Witigo und dessen Bruder Rudeger das Schloss Halbenrain.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "13.1.1255", "lokalitat_name": "Graz", "cs-verze": null, "kurzes_regest": "Der ungarische Landrichter Gottfired von Marburg (iudex provinciális und der ungarische königlicher Marschall in Steiermark Friedrich der Jüngere von Pettau ziehen Gütter der genannten Personen und angegebenen Werthes zu Gunsten des von denselben benachteiligten Deutschordens in Graz, dessen Brüder in den vorigen unruhigen Zeiten beschädigt wurden, für so lange ein, bis selbe dem Orden entsprechende Genugthuung geleistet hätten. Konfisziert wurden Gütter von Henrich von Puchheim in \"Nurdinch\", Gotschalcus de Stange Gütter in Einogesdorf, Ludwice/Ludwig de Chaphenstein (Ludwig von Kapfenstein) Gütter unter Chaphenstein, Otlin de Perthotesstein (Berchtoldstein) in Oberndorf;;Ulrich von Winchel (Winkel)Gütter in Rabaw; Werenhere de Havs (Bernard von Haus) Gütter in Bochew; Gebharde de Chunrigesdorf (Gebhard von Kurinsdorf) Gütter in Eynokendorf; Gotschalce de Neytperch (Gotschalk von Neutperg Neutberg) Gütter in Chundorf; Vvluing de Trewnstein (Wulfing von Freystein) Gütter bei Puhelern und Ditrichesdorf bei Vansdorf", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "17.1.1255", "lokalitat_name": "Elblag", "cs-verze": "PO II bere do své ochrany bratry Řádu německých rytířů v Čechách, Rakousku, na Moravě a v sousedních zemích a potvrzuje jim veškerý jejich majetek, svobody a imunity. Promlouvá k velkému starostovi Poppo o Velikonocích", "kurzes_regest": "PO II. nimmt in seinen Schutz Brüder des Deutschordnes in Böhmen, Österreich, Mähren und in den Nachbarnländern, und alle ihre Besitze, Freiheiten, Immuniteten bestätigt. Adresiert den Grossmaister Poppo von Ostern", "beschenkte_institution_text": "Deutschordensritter in Böhmen Grossmeister Poppo von Ostern,", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "Kurz nach 17.1.1255", "lokalitat_name": "Logvino", "cs-verze": "PO II plení území Medenau Novotného, České dějiny I/4, s. 24.; Tabulky Oliva, Scriptores rerum Prussicarum I, str. 685. https://books.google.de/books?id=YX8OAAAAYAAJ&printsec=frontcover&source=gbs_ge_summary_r&cad=0#v=onepage&q&f=false", "kurzes_regest": "PO II. plündert das Bereich Medenau Novotný, České dějiny I/4, s. 24.; Die Schrifttafeln von Oliva, Scriptores rerum Prussicarum I, s. 685. https://books.google.de/books?id=YX8OAAAAYAAJ&printsec=frontcover&source=gbs_ge_summary_r&cad=0#v=onepage&q&f=false", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "Kurz nach 17.1.1255", "lokalitat_name": "Mel'nikovo", "cs-verze": "PO II dobývá pevnost v Samland Rudau (Novotný, České dějiny I/4, s. 24.Olivovy tabulky, Scriptores rerum Prussicarum I, s. 685. ; https://reader.digitale-sammlungen.de/de/fs1/object/display/bsb10000801_00207.html Dusburg", "kurzes_regest": "PO II. erobert Festung in Samland Rudau (Novotný, České dějiny I/4, s. 24.Die Schrifttafeln von Oliva, Scriptores rerum Prussicarum I, s. 685. ; Dusburg https://reader.digitale-sammlungen.de/de/fs1/object/display/bsb10000801_00207.html", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "Kurz nach 17.1.1255", "lokalitat_name": "Sewernaja Gora", "cs-verze": "PO II přesunuto do Quednau Novotný, České dějiny I/4, s. 25Tabulky Oliva, Scriptores rerum Prussicarum I, s. 685.", "kurzes_regest": "PO II. zog nach Quednau Novotný, České dějiny I/4, s. 25Die Schrifttafeln von Oliva, Scriptores rerum Prussicarum I, s. 685.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "Nach 17.1.1255", "lokalitat_name": "Nisowje", "cs-verze": "PO II přestoupil do Waldau Novotný, České dějiny I/4, s. 25; Tabulky Oliva, Scriptores rerum Prussicarum I, str. 685.", "kurzes_regest": "PO II. zog nach Waldau Novotný, České dějiny I/4, s. 25;; Die Schrifttafeln von Oliva, Scriptores rerum Prussicarum I, s. 685.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "Nach 17.1.1255", "lokalitat_name": "Gwardeisk", "cs-verze": "PO II přesunuto do Waldau Novotného, České dějiny I/4, s. 25Olivovy tabulky, Scriptores rerum Prussicarum I, s. 685. žemlička, Přemysl Otakar 99-100", "kurzes_regest": "PO II. zog nach Waldau Novotný, České dějiny I/4, s. 25Die Schrifttafeln von Oliva, Scriptores rerum Prussicarum I, s. 685. žemlička, Přemysl Otakar 99-100", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "Nach 17.1.1255", "lokalitat_name": "Kaliningrad", "cs-verze": "PO II byl na tomto místě a byl zde při založení města", "kurzes_regest": "PO II. war in diesem Ort und war hier bei der Stadtgründung", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "2.2.1255", "lokalitat_name": null, "cs-verze": "PO II zpečetil listinu, ve které Heinrich von Seefeld (Sevelde) daruje kostel v Grossharras (Dolní Rakousko) Johanniterspitalu v Mailbergu (Dolní Rakousko) se souhlasem spoludědiců.", "kurzes_regest": "PO II. besiegelt die Urkunde, in der Heinrich von Seefeld (Sevelde) dem Johanniterspital in Mailberg (Niederösterreich)die Kirche in Grossharras (Niederösterreich) mit Zustimmung der Miterben schenkt.", "beschenkte_institution_text": "Mailberg, Das Spital des Johannitenordens - Heinrich von Seefeld", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "(Um 2.2.)1255", "lokalitat_name": null, "cs-verze": "Hadmar von (de Werde) uzavírá se souhlasem své manželky a dětí smlouvu s rytířem ze St. John v Mailbergu (Mewerperge), podle které prodává své zboží ve Schwarzbachu (Swartcenbach) za 12 talentů a zboží v Hausleitenu (Hausliuten), které Eberan dává do zástavy johanitům.", "kurzes_regest": "Hadmar von (de Werde) schliess mit der Zustimmung seiner Gattin und KInder mit dem Johanniter in Mailberg (Mewerperge) den Vertrag, nach dem er dem Kommende seine Gütter in Schwarzbach (Swartcenbach) ffür 12 talentů und Gütter in Hausleiten (Hausliuten), die Eberan den Johanniter verpfändt, verkauft.", "beschenkte_institution_text": "Mailberg, Das Spital des Johannitenordens", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "4.2.1255", "lokalitat_name": "Ujazd", "cs-verze": "Bratr Heirich von Fürstenberg, praeceptor (praeceptor) johanitů v Německu, Čechách, Polsku a na Moravě, potvrzuje potvrzení biskupa Cyypriana biskupem Tomášem I. z Brslau, kterým byl johanitům udělen Neubruchzehnt z jejich držav v oblasti Striegau a Lossner. Tuto záležitost potvrdil téhož dne v Ujaždu i biskup Tomáš z Vratislavi (Vratislavi).", "kurzes_regest": "Bruder Heirich von Fürstenberg, Präzeptor (praeceptor) der Johaniter in Deutschlnad, Böhmen und Polen und Mähren ratificiert die durch den Bischof Thomas I. von Brslau geschehene Bestätigung des Privilegs des Bischoffs Cyyprianus, wodurch den Johannitern der Neubruchzehnte von ihren Besitzungen in der Striegauer und Lossner Gegend verliehen worden war. Diese Sache bestätigt Bischof Thomas von Breslau (Wrocław/Vratislav) auch am denselben Tag in Ujazd auch.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "6.2.1255", "lokalitat_name": "Opava", "cs-verze": "Po návratu se přestěhoval do Opavy, odkud se přesunul do Rakouska", "kurzes_regest": "PO II. zog nach seinem Rückkehr nach Opava, wovon zog nach Österreich", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "18.2.1255", "lokalitat_name": "Brno", "cs-verze": "PO II potvrzuje darování kaple sv. Michala od jeho otce Václava I. dominikánským bratřím v Olomouci.", "kurzes_regest": "PO II. bestätigt dem Dominikaner Brüder in Olomouc/Olmütz die Schenkung der St. Michael-Kappelle von seinem Vater Wenzel I.", "beschenkte_institution_text": "Olomouc, Dominikaner", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "2.3.1255", "lokalitat_name": "Krems", "cs-verze": "Heinrich von Habsbach, soudce v Rakousku, který byl jmenován PO II, opravuje spor mezi Rupertem Chornlerem, občanem Steinu, a Konrádem, konventuálem v Lambachu, o vlastnictví vinice.", "kurzes_regest": "Heinrich von Habsbach, Richter in Österreich, der durch PO II. bestimmt war, berichtiget einen Streit zwischen Rupert Chornler, Bürger von Stein, und Konrad , Conventualen von Lambach, wegen des Besitzes eines Weingartens.", "beschenkte_institution_text": "Lambach, Benediktinerkloster", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "Vor 7.3.1255", "lokalitat_name": null, "cs-verze": "PO II, městský soudce Otto a jeho bratr mincmistr Chuno právně uznali dům ve Vídni, který patřil vdově po Wilchindi", "kurzes_regest": "PO II., Stadtrichter Otto und dessen Bruder Münzmeister Chuno erkenn rechtlich das Haus in Wien der Wittwe Wilchindis gehört", "beschenkte_institution_text": "Wien, Wittwe Wilchindis", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "7.3.1255", "lokalitat_name": "Wien", "cs-verze": null, "kurzes_regest": "Abt Bohuzlaus von Zwettl und Wilchindis vidua Johannis cementarii beurkunden, daß sie durch richterlichen Spruch vom Fürsten Ottokar, Stadtrichter Otto und dessen Bruder, Münzmeister Chuno, ein Haus zurückerhalten haben, das der Witwe von Hz. Friedrich entzogen worden war; das Haus liegt in Wien beim Friedhof in dote ecclesie sancti Stephani, gehört nach altem Recht dem Kloster Zwettl und war vom Kloster Johanni cementaio nostro und dessen Frau zu Leibgeding überlassen worden; die vertriebene Witwe wurde von genannten Zeugen wieder in ihr Recht gesetzt, verzichtet aber zum Seelenheil ihres Mannes auf ihr Leibgeding zugunsten des Klosters.", "beschenkte_institution_text": "Zwettl, Zisterzienserkloster; Cilchindis Wittze nach Johann.", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "8.3.1255", "lokalitat_name": "Krems", "cs-verze": null, "kurzes_regest": "PO II. bestimmt die Rechte für Juden in seiner Herrschaft.", "beschenkte_institution_text": "Juden in Böhmen, Mähren, Österreich", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "18.3.1255", "lokalitat_name": "Krems", "cs-verze": "Občanské sdružení II dává augustiniánským kanovníkům v St. Nikola in Passau osvobození od mýta na všech jeho pozemcích.", "kurzes_regest": "PO II. gibt den Augustiner-Chorherren im St. Nikola in Passau die Mautfreiheit in allen seinen Länder.", "beschenkte_institution_text": "St. Nikola bei Passau, Augustiner Chorrherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "(Vor 23.3.1255)", "lokalitat_name": null, "cs-verze": "PO II drží Jindřicha s úřadem Scheibera v Enns (Scriba Anasi) a přikazuje mu, aby spojil roztříštěný Přemyslův majetek v jednotnou enklávu.", "kurzes_regest": "PO II. bekleidet den Heinrich mit dem Amt Scheiber in Enns (Scriba Anasi) und gebietet ihm, damit die zersplitterte Ottokars Besitze in eine zusammenstehende Enklave vereint.", "beschenkte_institution_text": "Heinrich Scheiber in Enns", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "23.3.1255", "lokalitat_name": "Seitenstetten", "cs-verze": "PO II dává benediktinskému klášteru Seitenstetten a jeho opatovi Heřmanovi svobodu posuzovat svůj lid na svých statcích.", "kurzes_regest": "PO II. gibt dem Benediktiner Kloster Seitenstetten und seinem Abt Hermann die Freiheiten über Gerichte über ihre Leute in ihren Gütter.", "beschenkte_institution_text": "Seitenstetten, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "24.3.1255", "lokalitat_name": "Steyr", "cs-verze": "PO II. potvrdil svá práva na špitál ve Spital am Pyhrn (poblíž hory Pyhrn) a na pána tohoto domu Pertolda/Bertolda (Pertholdi magistri domus eiudem).", "kurzes_regest": "PO II. dem Spital in Spital am Pyhrn (bei dem Berg Pyhrn) und dem Meister dieses Hauses Pertold/Bertold (Pertholdi magistri domus eiudem)seine Rechte bestätigt.", "beschenkte_institution_text": "Spital am Pyhrn, Kolegiatstift/Chorherrenstift Spital", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "(Um 24.3.)1255", "lokalitat_name": "Steyr", "cs-verze": "Magistr Gotschalk, vévoda rakouský (notarius curie domini ducis Austrie), magistr H., kanovník z Ardackeru (kanovnický klášter Ardagger v Rakousku) a Witigo, písař z Ens (Enns) (scriba anesi), dosvědčují, že opat Gerung von Garsten (Gerungus venerabilis abbas de Gersten) udělil knězi Ulrichu von Taversheim, synu Hidmara z Lince, kapli v Haselbachu spolu se dvěma statky na doživotí.", "kurzes_regest": "Magister Gotschalk, des Herzogs von Österreichs (notarius curie domini ducis Austrie), Magister H., Kanoniker von Ardacker (Chorherrenstift Ardagger in Österreich) und Witigo, der Schreiber von Ens (Enns) (scriba anesi, bezeugen, dass Abbt Gerung von Garsten (Gerungus venerabilis abbas de Gersten) dem Pfarrer Ulrich von Taversheim, dem Sohn Hidmars von Linz, auf Lebensdauer die Capelle zu Haselbach sammt zwei Gütern verliehen hat.", "beschenkte_institution_text": "Pfarrer Ulrich von Taversheim, Sohn Hdimars von Linz", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "30.3.1255", "lokalitat_name": "Linz", "cs-verze": "Na žádost berchtesgadenského probošta slibuje PO II. kostelu v Berchtesgadenu (Perchtoldesgaden), že nezcizí žádný Voigtämte na jeho statcích, který připadl PO II.", "kurzes_regest": "PO II. verspricht auf der Bitte des Probstes von Berchtesgaden, der Kirche in Berchtesgaden (Perchtoldesgaden), dass er in ihren Güttern keine Voigtämte, die an den PO II. heimgefallen ist, endfremden will.", "beschenkte_institution_text": "Berchtesgaden, Augustiner Chorrherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "(Um 30. 3.)1255, (genauer zwischen 24.3-4.4.1255)", "lokalitat_name": "Linz", "cs-verze": "PO II na žádost místního opata Gerunga předepisuje klášteru Garsten dva talenty příjmů (příjmy) ze svých statků v amtu Ternberg (in oficio Ternperch), kde je to vlastnictví predium Leonis in Erzperge et mansum Pilgrimi grupel curiam in Gerstn, a v Amt Molln (in officio Moln), kromě Marquarda a Heinricha v Geizbergu a vlastnictví Konrada in Weg a in über Puhel (predia Marquardi et Heinrici in Gaizperge,  prediola Chunradi in uia et vidue super Puhel) for the purpose of tithe elevation (výběru desátku)", "kurzes_regest": "PO II. verschreibt dem Kloster Garsten auf der Bitte des dortigen Abtes Gerung zwei Talente an Einkünften (příjmy) auf seinen Gütern im Amt Ternberg (in oficio Ternperch), wo es handelt um das Besitz predium Leonis in Erzperge et mansum Pilgrimi grupel curiam in der Gerstn, und im Amt Molln (in officio Moln), Besite Marquards und Heinrichs in Geizberg und Besitz Konrads in Weg und in über Puhel (predia Marquardi et Heinrici in Gaizperge, prediola Chunradi in uia et vidue super Puhel) zum Behufe der Zehenteinhebung (výběru desátku)", "beschenkte_institution_text": "Garsten, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "4.4.1255", "lokalitat_name": null, "cs-verze": "PO II vstupuje do Čech z Rakouska (z Lince), tj. musel projít jižními Čechami v říjnu Velikonoc, tj. 4.4.1254, jak píše Druhé pokračování Kosmovo, FRB II, s. 309", "kurzes_regest": "PO II. tritt aus Österreich (von Linz) in Böhmen, also er muste durch Südböhmen in Oktab von Ostern, also 4.4.1254, wie schreibt Druhé pokračování Kosmovo, FRB II, s. 309", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "8.4.1255", "lokalitat_name": "Praha", "cs-verze": "PO II vstupuje do Prahy a na Pražský hrad a byl přivítán biskupem Mikulášem a jeho kanovníky u sv. Víta a Pražany (Druhé pokračování Kosmovo, FRB II.s. 309-310)", "kurzes_regest": "PO II. tritt in Prag und in die Prager Burg und wurde von Bischof Mikuláše a und seine Domherren in St.Veits-veitskirche und Prager Bürger willgekommen (Druhé pokračování Kosmovo, FRB II.s. 309-310)", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "10.5.1255+", "lokalitat_name": "Praha", "cs-verze": "DNO. Boemorum rex, dux Austrie et marchio Morauie potvrzuje inzerovaný (údajný) doklad knížete Boleslava II. břevnovskému klášteru na žádost opata Martina, jeho kaplana, a potvrzuje privilegia králů Přemysla Otakara I. a Václava I.", "kurzes_regest": "PO. Boemorum rex, dux Austrie et marchio Morauie konfirmiert dem Kloster Břevnov auf der Bitte des Abtes Martin, seinem Kaplaner die inserierte (angebliche) Urkunde des Herzogs Boleslav II. un bestätigt die Privilegien der Könige Přemysl Ottokars I. und Wenzels I.", "beschenkte_institution_text": "Břevnov, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "7.6.1255", "lokalitat_name": "Praha", "cs-verze": "PO II potvrzuje nemocnici sv. Františka v Praze na žádost františkánů v Praze darování obce Tursko od vdovy (Bohuslavy) Zvestovi.", "kurzes_regest": "PO II. bestätigt dem St. Franciskus-Spital in Prag auf der Bitte der Franziskaner in Prag die Schenkung des Dorfes Tursko von (Bohuslava) die Witwe nach Zvesto (nobilis domina relicta Zwestonis).", "beschenkte_institution_text": "Praha, St. Franciskus-Spital in Prag; Franziskaner in Prag", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "(wohl um 7.6.)1255 (vor 17.6.1255)", "lokalitat_name": "Křivoklát", "cs-verze": "PO II potvrzuje pro kapitulu na Vyšehradě určení otce Václava I. na výročí, které Václav postavil v St. Margareta-Kappel (v Machow).", "kurzes_regest": "PO II. bestätigt für Kapitel in Vyšehrad, die Bestimmung seines Vaters Wenzel I. über das Anniversario, das Wenzel in St. Margareta-Kappel (in Machow) errichtete.", "beschenkte_institution_text": "Vyšehrad, Kapitel (Empfänger in der Urkunde ist nicht erwähnt, aber die Urkunde in wyšehrader archiv und vyšehrader Kopiar aus dem 14. Jh. Ist.", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "17.6.(1255)", "lokalitat_name": null, "cs-verze": "PO II. dominus regni Boemie, dux Austrie et marchio Moravie., má-li mít ve své zvláštní ochraně vojenský úřad kláštera S. Petri v Salcburku, chce ponechat jejich biskupství ve své zemi pod mírovou ochranou", "kurzes_regest": "PO II. dominus regni Boemie , dux Austrie et marchio Moravie., wenn er das Voigtamt des Klosters S. Petri in Salzburg in seinemspezielen Schutz haben soll, will er, damit ihre Bisitze in seinem Länder in friedlichen Schutz bleiben", "beschenkte_institution_text": "Salzburg, Benediktinerkloster St. Peter", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "26.6.1255", "lokalitat_name": "Wien", "cs-verze": "PO II obnovuje osvobození kláštera Raitenhaslach od mýta za potraviny na vodě a na souši.", "kurzes_regest": "PO II. erneuert dem Kloster Raitenhaslach seine Mautfreiheiten für Lebensmittel zu Wasser und zu Lande.", "beschenkte_institution_text": "Raitenhaslach, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "10.7 und 11.7.1255", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "Margaretha von Babenberg besuchte (wohl estenmal) Böhmen. Am 10.7.1255 wurde vor Toren der Prager Städte von Bürgen begrüsst. Am nächsten Tag 11.7.1255 tritt sie in Prager Burg, wo sie von Bischof Nikolaus von Prag, Prager Domherren, Abt Martin von Břevnov, Probst Johan von Sion/Strahov und anderen dortigen Chorherren begrüsst. Laut Druhé pokračování Kosmovo, FRB II. Problem aber ist, dass diese Nachricht den Eintritt Ottokars nicht erwähnt, also scheint es dass in diesen Tagen war Ottokar in Prag nicht sicher wissen wir, dass er zurück von Wien in Prag am 19. 7.1255 war.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "19.7.1255 (Version I)", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II. in Erinnerung an die ihm während seines Zuges gegen die Preussen zu Teil gewordene Fürbitte des heiligen Stanislaus von dessen Körper er durch Herzog Boleslaus von Krakau einen Arm erhielt , sihet er von den Gebietsverletzungen besondersi in Troppau ab, wogegen die Polen die Gefangene zurückgeben sollen. Über diese sache versichert PO II. den Bischof Prandota von Krakau (I. version der Urkunde)", "beschenkte_institution_text": "Kraków, Bischof Prandota", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "(vor 25.7.1255)", "lokalitat_name": null, "cs-verze": "PO II oznamuje německým velikánům, že se z uvedených důvodů nezúčastní sjednaného setkání v Norimberku ve dvou týdnech po svátku sv. Jakuba.", "kurzes_regest": "PO II. meldet den deutschen Grossen, dass er aus angegeben Gründen die verabredete Zusammenkunft in Norimberg in den zwei Wochen nach Jakobstag nicht besuchen werde.", "beschenkte_institution_text": null, "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "4.10.1255 (Version II)", "lokalitat_name": "Praha", "cs-verze": "PO II., pamětliv přímluvy sv. Stanislava při jeho tažení proti Prusům, z jehož těla dostal paži od vévody Boleslava Krakovského, upouští od porušování území, zejména v Troppau, zatímco Poláci mají vrátit zajatce. PO II ujišťuje o této záležitosti biskupa Prandota z Krakova (II. verze dokumentu)", "kurzes_regest": "PO II. in Erinnerung an die ihm während seines Zuges gegen die Preussen zu Teil gewordene Fürbitte des heiligen Stanislaus von dessen Körper er durch Herzog Boleslaus von Krakau einen Arm erhielt , sihet er von den Gebietsverletzungen besondersi in Troppau ab, wogegen die Polen die Gefangene zurückgeben sollen. Über diese sache versichert PO II. den Bischof Prandota von Krakau (II. version der Urkunde)", "beschenkte_institution_text": "Kraków, Bischof Prandota", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "(April 1254- vor 6.11.1255; möglich ist die Wende Januar/Februar 1255)", "lokalitat_name": null, "cs-verze": "Občanská pobočka II podepsala smlouvu s knížetem Vladislavem/Vladislavem z Oppu", "kurzes_regest": "PO II. hat den Vertrag mit dem Fürsten Wladislaw/Vladislav von Opp", "beschenkte_institution_text": "Opole-Ratibor, Fürst Wladislaw I.", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "12.12.1255", "lokalitat_name": "Krems", "cs-verze": "PO II uděluje benediktinskému klášteru v Kremsmünsteru jeho panství, tzv. marchfůter, výplatu marťáku z majetku St. Martinsbergu", "kurzes_regest": "PO II. erlässt dem Benediktinerkloster Kremsmünster sein landesherrlichen Reicht sogenannte marchfůter,die Entrichtung des Marchfutters von der Besitzung St. Martinsberg", "beschenkte_institution_text": "Kremsmünster, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "(um 12.12.)1255", "lokalitat_name": "Krems", "cs-verze": "PO II poskytuje benediktinskému klášteru Kremsmünster bezplatnou linku", "kurzes_regest": "PO II. verleihet dem Benediktinerkloster Kremsmünster Mautfreiheit", "beschenkte_institution_text": "Kremsmünster, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "(wohl nach12.12.1255-25.12/31.12.) 1255", "lokalitat_name": "Brno", "cs-verze": "PO II prohlašuje, že louka mezi Hrdibořicemi (jižně od Olomouce) a Cralicensem (Gralicensem) pontem Kralický most v Kralicích náležící k olomouckému katedrálnímu kostelu, jak je uvedeno ve všeobecném kolokviu a ve zveřejněném soudu před Přemyslovskou beneficientskou komorou Pardus, Burgrafen Ydik, soudcem Johannem, zemským úředníkem Hinzonem a dalšími olomouckými beneficienty", "kurzes_regest": "PO II. erklärt , dass die Wiese zwischen Hrdibořice (südlich von Olomouc) und Cralicensem (Gralicensem) pontem Kralicer Brücke in Kralice zum dem Olmüzter Domkirche gehören soll, weill es in generalen Kolloqium und im veröffentlichen Gericht vor Ottokars Benefiziaren Kammer Pardus, Burgrafen Ydik, Richter Johann, Provinzofficial Hinzone und anderen Olmützer Benefiziaren", "beschenkte_institution_text": "Olomouc, Domkirche", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 5.0, "Periode": "Rakousko, české země", "Datum": "1255++", "lokalitat_name": "Brno", "cs-verze": "PO II žádá papeže Alexandra II. o potvrzení inzerovaného dokumentu biskupa Roberta z Olomouce pro tišnovský klášter.", "kurzes_regest": "PO II. bittet den Papst Alexander II., um die inserierte Urkunde der Bischof Robert von Olmütz/Olomouc für das Kloster Tišnov zu konfirmeren.", "beschenkte_institution_text": "Tišnov, Zisterzensiennerinenkloster", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "1.1.1256", "lokalitat_name": "Brno", "cs-verze": "PO II potvrdil závěť zesnulého Bočka (purkrabího znojemského) klášteru ve Žďáru nad Sázavou", "kurzes_regest": "PO II. dem Kloster Žďár nad Sázavou das inserierte Testament von gestorbenen Bočko (Burggrafen von Znaim/Znojmo) konfirmiert", "beschenkte_institution_text": "Žďár nad Sázavou, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "5.1.1256", "lokalitat_name": "Linz", "cs-verze": "Heinricus scriba Anasi (písař z Ens) vysvětluje záležitost Spital am Pyhrn, který již dříve obdržel dokument PO II. Kromě toho ve Wartbergu ve fóru v dnešním Wokone (Wok/Vok de Rosenberg)", "kurzes_regest": "Heinricus scriba Anasi (Schreiber von Ens) erklärt die Sache des Spital am Pyhrn, der vorher die Urkunde von PO II. bekam. Dazu kam in Wartberg in forum in der Anwesend Wokone (Wok/Vok de Rosenberg)", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "(25.12.1255/1.1.1256-15.1.)1256", "lokalitat_name": "Brno", "cs-verze": "PO II potvrzuje odkoupení vsi Zlatníky od Smila z Bílkova cisterciáckému klášteru Welehrad/Velehrad.", "kurzes_regest": "PO II. bestätigt dem Zisterzienserkloster Welehrad/Velehrad der Kauf den Ankauf der Dörfer Zlatníky von Smil von Bílkov.", "beschenkte_institution_text": "Velehrad, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "16.1.1256", "lokalitat_name": "Olomouc", "cs-verze": "PO II potvrzuje cisterciáckému klášteru na Velehradě inzerovaná privilegia Přemysla Otakara I. a Václava I.", "kurzes_regest": "PO II. konfirmert dem Zisterzienserkloster Velehrad die inserierte Privilegien von Přemysl Otakar I. und Wenzel I. .", "beschenkte_institution_text": "Velehrad, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "28.1.1256++", "lokalitat_name": "Olomouc", "cs-verze": "PO II na žádost Smila z Brumova, Burgrafona (z Přerova) přerovských občanů různé svobody a práva města Olomouce", "kurzes_regest": "PO II. auf der Bitte Smilo von Brumov, Burgrafon (von Přerov) der Bürger in Přerov verschiedene Freiheiten und Rechte der Stadt Olomouc", "beschenkte_institution_text": "Přerov, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "Nach 6.2.1256", "lokalitat_name": "St. Florian", "cs-verze": "Wittigo Schreiber ob der Enns (scriba Anesi; scriba ducis) byl zavražděn 6. února 1256 v jídelně kláštera sv. Floriána von Ortolf von Volkersdorf-Weißenberg a jeho vnuků Otto a Dietricha von Rohr. Druhý Občanské bratrstvo vykázal vrahy ze svých pozemků, zkonfiskoval jejich statky, zbořil jejich hrady a zámky", "kurzes_regest": "Wittigo Schreiber ob der Enns (scriba Anesi; scriba ducis) ist am 6. Februar 1256 im Speisesaal des Stiftes St. Florian von Ortolf von Volkersdorf-Weißenberg und desen Enkeln Otto und Dietrich von Rohr ermordet worden. PO II. verbannte die Mörder aus seinen Landen, zog ihre Güter ein zerbrach ihre Burgen und Schlösser", "beschenkte_institution_text": "Ortolf von Volkersdorf-Weißenberg - Otto und Dietrich von Rohr (Rohr im Kremstal)", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "15.3.1256", "lokalitat_name": "Praha", "cs-verze": "PO II osvobozuje moravské državy johanitů od všech práv, která náleží jemu a jeho nástupcům, a potvrzuje johanitům právo předané velehradskému klášteru.", "kurzes_regest": "PO II befreit die mährische Besitze der Johanniter von allen Rechte , die ihm und seinen Nachfolgern gehört, und bestätigt den Johanniter das Recht, das dem Kloster Velehrad gegeben wurde.", "beschenkte_institution_text": "Mähren, Johanniten", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "Um 25.3.1256", "lokalitat_name": null, "cs-verze": null, "kurzes_regest": "Wenn Herzog Heinrich von Bayern in Ungarn bei seinem arpadischen Schwager war, auf dem Ottokars Befehl seine Leute sind aus Böhmen zum Stadt Cham/Kouba und dort geplündert haben. Gleichzeitig Vok von Rosenberg/Rožmberk mit anderen Böhmen und anderen Adeligen von Ennstahl bis zum Burghausen und Weilhart (Innviertel)", "beschenkte_institution_text": null, "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "27.3.1256", "lokalitat_name": "Sadská", "cs-verze": null, "kurzes_regest": "PO II ernennt den Probst Arnold von St. Florian zu seinem Hofkaplan (in sollempnem curie nostre recepimus capellanum ipsum) und nimt dessen Kirche in seinen spezielen Schutz, sowie PO II bestätigt die Privilegien seines Augustiner-Stiftes , namentilch wegen der Exemption. PO II. befest auch, dass Schreiber von Enns (scirba Anasi, bzw. wen er sein wird, Provinzrichter (iudex provinzialis) weiter die Voigten deises Stiftes nicht sein werden.", "beschenkte_institution_text": "St. Florian, Augustiner Chorrherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "12. oder 19.4.1256+", "lokalitat_name": "Praha", "cs-verze": "PO II daruje Břevnovskému klášteru a opatovi Martinovi, jeho kaplanovi (capelano nostro) za účelem komunikace v obci Podmokly na poli v obci Kuromrtvy, které v současné době svěřuje komoře Bavora ze Strakonic in beneficium (ob sue probitatis merita in beneficium contuleramus)", "kurzes_regest": "PO II schenkt dem Kloster Břevnov und dem dortigen Abt Martin, seinen Kaplan (capelano nostro) wegen der Komunikation in das Dorf Podmokly Feld in Dorf Kuromrtvy, das er derzeit dem Kammer Bavor von Strakonice in beneficium (ob sue probitatis merita in beneficium contuleramus)", "beschenkte_institution_text": "Břevnov, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "9.6.1256", "lokalitat_name": "Wien", "cs-verze": "PO II potvrzuje biskupovi Konrádovi z Freisingu na jeho žádost svobodu jeho dvora ve Vídni, jeho obyvatel a nevolníků.", "kurzes_regest": "PO II bestätigt dem Bischof Konrad von Freising auf dessen Bitte die Geritchsfreiheiten dessen Hofes zu Wien, der Bewohner und der Hörigen desselben.", "beschenkte_institution_text": "Freising, Bistum und Bischof Konrad", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "16.7.1256", "lokalitat_name": "Opava", "cs-verze": "PO II potvrzuje olomouckému biskupovi Brunovi inzerované privilegium Přemysla Otakara I.", "kurzes_regest": "PO II bestätigt dem Bischof Bruno von Olomouc/Olmütz das inserierte Privilegium Přemysl Ottokars I.", "beschenkte_institution_text": "Olomouc, Bistum und Bischof Bruno", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "18.7.1256", "lokalitat_name": "Opava", "cs-verze": "PO II prohlašuje, že Mistr řádu pro Čechy, Moravu a Plenjojonita v Grobnikách daroval na doživotí obec Újezd olomoucké/olomoucké komoře Pardus, a PO II to potvrzuje", "kurzes_regest": "PO II. erklärt, dass Ordensmeister für Böhmen, Mähren und PlenJohanniter in Grobniki das Dorf Újezd dem Olomoucer/Olmützer Kammer Pardus für sein Lebenszeit gegeben habem, und PO II. dies bestätigt", "beschenkte_institution_text": "Ordensmeister für Böhmen, Mähren und Polen, und Johanniter in Grobniki bei Hlubčice, damals Troppauland", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "(wahrscheinlich 1.8. aber in der Urk. ist)19.7.1256", "lokalitat_name": "Wien", "cs-verze": "PO II dosvědčuje, že Berthold miles de Ernstbrunn se souhlasem Přemyslem Ottokarem a podle rozsudku zemských soudců v Rakousku určil řečené panství (Domusselsdorf a ves ve Werihcu, qua a comité palation tenuit; curia in Ernstprunn) jako věno své nové manželky Margarety, dcery Konrada militis von Greifenstein.", "kurzes_regest": "PO II. bezeugt, dass Berthold miles de Ernstbrunn mit der Ottokars Zustimmung und nach dem Ausspruch der Provinzialrichter in Österreich die genannte Gütter ( Domusselsdorf und einDorf in Werihc, qua a comite palation tenuit; curia in Ernstprunn) als Mitgift seiner neuen Gattin Margareta, Tochter Konrads militis von Greifenstein bestimmt.", "beschenkte_institution_text": "Berthold miles de Ernstbrunn, Margareta, Tochter Konrads militis von Greifenstein", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "17.7.-10.8.1256", "lokalitat_name": "Praha", "cs-verze": "Konrád, arcibiskup kolínský, je od 17. červenec do 10 srpna. V Praze byl přítomen roku 1256 z důvodu jednání s Odp. II. o záležitostech říše, pravděpodobně v otázce volby římského krále.", "kurzes_regest": "Konrad, Erzbischof von Köln, ist von17. Juli bis 10 aug. 1256 in Prag anwesend wegen der Verhandlungen mit dem PO II. über die Reichangelegenheiten, wohl die Frage der Wahl des römischen Königs.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "Nach wohl 1.8.-vor. 9.8.1256", "lokalitat_name": "Praha", "cs-verze": "PO II. Praha pravděpodobně vstoupí.", "kurzes_regest": "PO II. tritt Prag wohl ein.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "Vor 4.9.1256", "lokalitat_name": null, "cs-verze": "Dne 4.9.1256 dává šlechtic Ulrich von Regensberg svolení svým správcům prodat svůj majetek u Curychu v době jeho nepřítomnosti, kdy byl \"in curia illustris regis Boemie extra provinincia agente\".", "kurzes_regest": "Die Edle Ulrich von Regensberg gibt am 4.9.1256 seine Genehmigung dazu, dass seine Verwalter in seiner Abwessenheit, als er \"in curia illustris regis Boemie extra provinincia agente\" war, sein Besitz in der Nähe von Zürich verkauft haben.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 5.0, "Periode": "Rakousko, české země", "Datum": "6.11.1256+", "lokalitat_name": null, "cs-verze": "Bruno, biskup olomoucký, kapitula v Litomyšli a za svědka Wilhelmus notarius ducis, Arnoldus similiter notarius ducis. Ale Urk. Neuvěřitelný", "kurzes_regest": "Bruno Bischof von Olomouc/Olmütz dem Kapitel in Litomyšl, und unter Zeugen Wilhelmus notarius ducis Arnoldus similiter notarius ducis. Aber Urk. Unglaublich", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "14.11.1256", "lokalitat_name": "Krems", "cs-verze": "PO II benediktinského kláštera sv. Petra v Salcburku a jeho opat Richer potvrzuje inzerované privilegium vévody Leopolda a jeho privilegium vévody Fridricha II.", "kurzes_regest": "PO II dem Benediktinerkloster St. Peter in Salzburg und seinen Abt Richer konfirmiert das inserierte Privilegium von Herzog Leopold und sas Privilegium vom Herzog Friedrich II.", "beschenkte_institution_text": "Salzburg, Benediktinerkloster St. Peter", "poII_aussteller": "ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "30.11.1256", "lokalitat_name": "Wien", "cs-verze": "PO II restituován na žádost svého kaplana Leopolda, probošta fóra Ardagger Markt v Ardaggeru.", "kurzes_regest": "PO II restituert auf der Bitte seinem Kaplan Leopold , Probst von Ardagger Markt forum in Ardagger.", "beschenkte_institution_text": "Ardagger, Kollegiatstift St. Margarethe", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "10.12.1256", "lokalitat_name": "Wien", "cs-verze": "PO II, na žádost opata Ortolfa pro Melk (per magnificum et speciale Medlicensis monasterium), potvrzuje všechna práva a majetek podle privilegií markraběte Leopolda [III], jeho syna Leopolda [IV], vévody Leopolda [VI] a jeho syna Fridricha [II]. Zejména potvrzuje svobodu soudu s výjimkou případů krádeží, násilných činů a vražd, dále osvobození od mýtného, krmiva a svobody pozemkových feniků. Pravidlo bailiwick je vykonáváno výhradně vévodou.", "kurzes_regest": "PO II bestätigt auf Bitte des Abtes Ortolf für Melk (per magnificum et speciale Medlicensis monasterium) alle Rechte und Besitzungen, gemäß den Privilegien von Markgraf Leopold [III.], dessen Sohn Leopold [IV.], des Herzogs Leopold [VI.] und dessen Sohn Friedrich [II.]. Insbesondere bestätigt er die Gerichtsfreiheit außer bei Diebstahl, Gewalttaten und Mord, desweiteren Mautfreiheit, Marchfutter- und Lanndpfennigfreiheit. Die Vogtherrschaft übt ausschließlich der Herzog aus.", "beschenkte_institution_text": "Melk, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "16.12.1256", "lokalitat_name": "Wien", "cs-verze": "Willelmus canonicus sancti Dyonisii Leodenensis, procurator et nuntius domini Petri sancti Georgii ad velum aureum diaconi cardinalis, se dohoduje s biskupem Ottou z Pasova, kterého dal povolat do Říma pražským biskupem za 200 marek ryzího stříbra, že bývalý pasovský biskup musí přísahat Rüdiger..., pro quibus Medlicensem (Medling), Kotwicensem (Gotweig) et prepositus Sancti Floriani St. Florian.", "kurzes_regest": "Willelmus canonicus sancti Dyonisii Leodenensis, procurator et nuntius domini Petri sancti Georgii ad velum aureum diaconi cardinalis, trifft mit dem Bischofe Otto von Passau, den er durch den Bishof von Prag wegen 200 Mark reinen Silbers nach Rom citieren liess, das Übereinkommen, dass der vormalige Bischof von Passau Rudiger schwören müsse..., pro quibus Medlicensem (Medling), Kotwicensem (Gotweig) et prepositus Sancti Floriani St. Florian.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "18. 12.1256", "lokalitat_name": "Wien", "cs-verze": "PO II daruje různé výtěžky cisterciáckému klášteru v Heiligenkreuzu a tamnímu opatovi (Heinrichovi) v Höfteinu a Hainburgu", "kurzes_regest": "PO II schenkt dem Zisterzienserkloster Heiligenkreuz und dem dortigen Abt (Heinrich) verschiedene Einkünfte zu Höftein und Hainburg", "beschenkte_institution_text": "Heiligenkreuz, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "26.12.1256 (ganz auschliessen ist auch nicht 26.12.1255)", "lokalitat_name": null, "cs-verze": null, "kurzes_regest": "PO II. verlegt auf Bitten des Propstes K(onrad) und des Konventes des Stiftes Klosterneuburg (Niunburch) den Markt (forum) in Klosterneuburg von Sonntag, der der feierlichen Ruhe dient, auf Montag.", "beschenkte_institution_text": "Klosterneuburg, Augustiner-Chorherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "28.12.1256", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II konfiermiert dem St. Franziskus-Spital in Prag das inserierte Privilegium seines Vaters Königs Wenzels I. Zwei exemplare der Urkunde.", "beschenkte_institution_text": "Praha, St. Franciskus-Spital in Prag; Franziskaner", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "vor 28.12.1256", "lokalitat_name": null, "cs-verze": "PO II, pravděpodobně žádají papeže Alexandra IV. o povolení pro Jindřicha, syna Smila z Lichtenburka a Domaslavy, dcery Přemysla Otakara z Bavora ze Strakonic,", "kurzes_regest": "PO II bitten den Papst wohl Alexander IV um Dispenz für Heinrich, den Sohn von Smil von Lichtenburk und Domaslava, Tochter Ottokars Kammer Bavors von Strakonice,", "beschenkte_institution_text": "Smil von Lichtenburk; Bavor von Strakonice", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "Um 1252 - um 1256", "lokalitat_name": "???", "cs-verze": "PO II založila město Litovel a předala soudcovství ve městě Litovli s přidruženým majetkem lokátorovi (fundátorovi) Heinrichu Epichovi.", "kurzes_regest": "PO II. gründet die Stadt Litovel und übergab dem Lokator (fundator) Heinrich Epich das Richteramt in der Stadt Litovel mit dem dazu gehörenden Besitz.", "beschenkte_institution_text": "Litovel, Stadt, - Richter der Stadt Litovel Heinrich Epich", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": 1256, "lokalitat_name": "Linz", "cs-verze": "Soudce Siboto a komunita občanů Lince potvrzují, že opat Bozlaus von Zwettl von Hz. Ottokar obdržel obnovení privilegia pro svůj klášter, ročně 2 tal. provádět sůl bez vody a hradního mýta; stalo se tak v době, kdy dominus Wocco pořádal v Linci provinciale iudicium.", "kurzes_regest": "Richter Siboto und die Gemeinde der Bürger von Linz beurkunden, daß Abt Bozlaus von Zwettl von Hz. Ottokar für sein Kloster die Erneuerung des Privilegs erhielt, jährlich 2 tal. Salz frei von Wasser- und Burgmaut durchzuführen; dies geschah als dominus Wocco in Linz provinciale iudicum hielt.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "1256 oder in vorigen Jahren", "lokalitat_name": "Kühnring", "cs-verze": "Eufemie von Kuenring, sestra zemřelého Heinricha a Hadmarra von Kuenring, žalovala klášter Zwettl a opata Bohuslava před PO II a zemskými soudci Rakouska (iudicibus provincialibus [Austrie]) kvůli obci (Ober- nebo Nieder)Strahlbach", "kurzes_regest": "Eufemie von Kuenring, Schwester von gestorbenen Heinrich und Hadmarr von Kuenring verklagte vor PO II. und Provinzrichtern Österreichs (iudicibus provincialibus [Austrie]) das Kloster Zwettl und den Abt Bohuslav wegen das dorf (Ober- oder Nieder)Strahlbach", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "cca 1256 (1055-1056)+", "lokalitat_name": null, "cs-verze": "PO II \"rex Boemorum\" přikazuje svým fojtům ve svém království, aby respektovali bezcelní povahu obyvatel Břevnovského kláštera a nebrali od nich daně (mandát)", "kurzes_regest": "PO II \"rex Boemorum\" gebietet seien Stadtvoigten in seinem Königreich, damit sie die Mautfreiheit der Leute Břevnover Klosters respektieren und keine Abgaben von ihnen nehmen (Mandat)", "beschenkte_institution_text": "Břevnov, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "(1256, oder um 7.1.1256, sicher 1251-1261) (ganz unmögliche Datierung 1245", "lokalitat_name": null, "cs-verze": "PO II \"rex Bohemiae\" přebírá johanitské domy a statky do ochrany.", "kurzes_regest": "PO II. \"rex Bohemiae\" nimmt in den Schutz die Johanniter Häuser und Besitze.", "beschenkte_institution_text": null, "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "7.1.1257", "lokalitat_name": "Praha", "cs-verze": "PO II potvrzuje nemocnici Panny Marie apud pedem pontis v Praze zvláštní svobodu, že nikdo ze šlechty, soudců a úředníků (nullus baronum regni nostri sive militium aut iudicum aut offitialium) nemůže nocovat na svých statcích a vesnicích, že si nikdo nemůže uzurpovat jejich majetek. Občanská platforma by předala předchozí osoby požívající těchto práv a zločince komoře královského soudu (regalis aule camerario).", "kurzes_regest": "PO II bestätigt dem Johanniter St.Maria-Spital apud pedem pontis in Prag besondere Freiheit, dass niemand aus Edlen, Richtern und Beamtern (nullus baronum regni nostri sive militium aut iudicum aut offitialium) kann in ihren Höfen und Dörfern übernachten, dass niemand kann ihre Besitze usurpieren. Vorige Benitzer dieser Rechte und Verbrecher werde PO dem Kammer der königlichen Hofes (regalis aule camerario) übergeben.", "beschenkte_institution_text": "Praha, Johanniter St. Maria-Spital apud pedem pontis", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "12.1.1257", "lokalitat_name": "Praha", "cs-verze": "PO II daruje obec Plchov nemocnici bratří sv. Františka \"ordinis Stelliferorum\" v Praze za záchranu jeho duše a duše jeho otce krále Václava I.", "kurzes_regest": "PO II schenkt dem Brüder St. Franziscus-Spitals \"ordinis Stelliferorum\"in Prag Das Dorf Plchov für die Erlösung seiner Seele und Seele seines Vaters Königs Wenzels I.", "beschenkte_institution_text": "Praha, St. Franciskus-Spital; Franziskaner in Prag - Bruder \"stelliferorum\" Brüder mit dem (roten) Stern.", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "5 oder 4.2.1257", "lokalitat_name": "Praha", "cs-verze": "PO II potvrzuje vlastnictví kaple sv. Václava v Praze (v kostele sv. Víta na Pražském hradě) a osvobozuje její majetek od daní pro královskou komoru.", "kurzes_regest": "PO II bestätigt die Besize der St. Wenzel-Kapelle, in Prag (in St. Veitskirche in Prager Burg) und befreit ihre Besitze von Abgaben in königliche Kammer.", "beschenkte_institution_text": "Praha, St.Wenzelkapelle in St. Veitskirche in Prager Burg (Prager Kapitel) deren custos und magister", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "13.2.1257", "lokalitat_name": "Praha", "cs-verze": "PO II daruje svému kaplanovi Bartolomějovi/Bartoloměji, kustodovi a kanovníkovi vyšehradského kostela, kapli na návrší sv. Štěpána na Zlíchově (in monte sancti Stephani de Zlíchov) s patronátním právem drženým PO II, se souhlasem pražského biskupa Mikuláše. K tomuto účelu byla určena PO II, aby vyšehradští kustodi mohli mít dvě krčmy s medovým vínem (jednu od svých předků, druhou od Přemysla Otakara). Biskup Mikuláš také tento dokument zpečetil svým potvrzením", "kurzes_regest": "PO II schenkt seinem Kaplan Bartolomeus/Bartoloměj Kustod und Kanoniker der Vyšehrader Kirche das Kapelle in Stephansberg in Zlíchov (in monte sancti Stephani de Zlíchov) mit dem Patronatsrecht, der PO II. hielt, mit der Zustimmung der Prager Bischof Nikolaus. Dazu PO II bestimmt, damit Vyšehrader Kustoden zwei Kneipen mit Honigwein halten können (einer von seinen Vorfahren, die zweite vom Ottokar). Bischof Nikolaus diese Urkunde besiegelt auch mit seiner Koroboration", "beschenkte_institution_text": "Bartholomeus, Ottokars Kapelan, Kustod in Vyšehrad, Erzdiakon in Olomouc,", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "13.2.1257", "lokalitat_name": "Praha", "cs-verze": "V tento den pražský biskup Mikuláš nejen pečetí Přemyslův spis (viz výše - CDB V/1, č. 119) a zvláštním dokumentem (CDB V/1, č. 120) potvrzuje Přemyslův dokument, ale také potvrzuje patronátní právo nad nemocnicí sv. Františka v Praze", "kurzes_regest": "Bischof Nikolaus von Prag besiegelt am diesen Tag nicht nur Ottokars Urkunde (siehe oben-CDB V/1, Nr. 119), und mit besonderen Urkunde (CDB V/1, Nr. 120) bestättigt die Ottokars Urkunde, sondern auch bestätigt den St. Franziskus-Spital in Prag Patronatsrecht", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "23.4.1257", "lokalitat_name": "Linz", "cs-verze": "PO II slibuje podporovat pasovského biskupa Ottu proti bavorským vévodům s plnou (vojenskou) silou (totis viribus). Přemysl Otakar ponechal svá města a hrady otevřené (pro Ottu) a neuzavřel mír, příměří ani smlouvu, zejména s bavorskými vévody, bez souhlasu pasovského biskupa Otty", "kurzes_regest": "PO II verspricht dem Bischof Otto von Passau gegen Herzöge von Bayern mit vollen (Militär)Kraft (totis viribus) zu unterschützen. Ottokar liess seine Städte und Burgen (für Otto) geöffnet und werde kein Fried, Waffenstillstand oder Vergrag besonders mit Herzögen von Bayern ohne Zustimmung Bischofs Otto von Passau schliessen", "beschenkte_institution_text": "Passau, Bistum und Bischof Otto", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "23.4.1257", "lokalitat_name": "Linz", "cs-verze": "Biskup Otto z Pasova slibuje rakouskému vévodovi, že podpoří Občanskou platformu II proti bavorským vévodům s plnou (vojenskou) silou (totis viribus). Biskup Otto nechal otevřít svá města a hrady (pro Přemysla Otakara) a neuzavřel mír, příměří ani rezignaci, zejména s bavorskými vévody, bez souhlasu vévody Přemysla Otakara", "kurzes_regest": "Bischof Otto von Passau verspricht dem Herzog von Österreich PO II gegen Herzöge von Bayern mit vollen (Militär)Kraft (totis viribus) zu unterschützen. Bischof Otto liess seine Städte und Burgen (für Ottokar) geöffnet und werde kein Fried, Waffenstillstand oder Vergrag besonders mit Herzögen von Bayern ohne Zustimmung Herzogs Ottokar schliessen", "beschenkte_institution_text": "PO II", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "9.5.1257", "lokalitat_name": "Wiener Neustadt", "cs-verze": "Král Otacharus potvrzuje majetek, práva a svobody kláštera Lilienfeld (Linveld) podle základů vévodů Leopod a Fridrich", "kurzes_regest": "König Otacharus bestätigt Besitz, Rechte und Freiheiten des Klosters Lilienfeld (Linveld) gemäß den Stiftungen der Herzöge Leopod und Fridrichs", "beschenkte_institution_text": "Lilienfeld, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "9.5.1257+ (wohl kurz danach", "lokalitat_name": "Wiener Neustadt", "cs-verze": null, "kurzes_regest": "PO II. bestätigt Besitz, Rechte und Freiheiten des Klosters Lilienfeld (Linveld) gemäß den Stiftungen der Herzöge Leopod und Fridrichs (verdachte version der Vorigen Urkunde, die aber wohl im denselben Jahr verfasst wurde)", "beschenkte_institution_text": "Lilienfeld, Zisterzienserkloster", "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "9.5.1257 oder kurz danach", "lokalitat_name": "Münchendorf", "cs-verze": null, "kurzes_regest": "PO II. bestätigt Besitz, Rechte und Freiheiten des Klosters Lilienfeld (Linveld) gemäß den Stiftungen der Herzöge Leopod und Fridrichs . Dieser verdachte II Version der vorigen Urkunde hat in der Datierung nicht nur WIener Neustadt, aber auch späteres Austellungsort Münchendorf (primo in Noua civitate, postea in Mynchendorf). Dieser Urkunde wurde aber wohl im denselben Jahr verfasst,bzw. verfalscht. Diese verdachte Urkunde aus dem selben Jahr, gibt uns mindesens informationüber Ottokars Aufenthalt.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "19.7.1257", "lokalitat_name": "Lilienfeld", "cs-verze": "PO II potvrzuje (a zviditelňuje) inzerované privilegium Fridricha II., římského krále a krále sicilského, k opatství Lilienfeld", "kurzes_regest": "PO II konfirmiert (und vidimiert) dem Kloster Lilienfeld das inserierte Privilegum Friedrichs II., römischen Königs und Königs von Sizilien", "beschenkte_institution_text": "Lilienfeld, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "in der Hälfte August 1257", "lokalitat_name": null, "cs-verze": "PO II se měl ve Wellsu v Horních Rakousích přát s vévodou Jindřichem Bavorským, ale Přemysl Otakar tajně procházel zemí pasovského biskupa a vpadl do Bavorska a táhl", "kurzes_regest": "PO II soll in Wells in Oberösterreich mit dem Herzog Heinrich von Bayern hadeln, Ottokar zog aber geheim durch dass Land der Passauer Bischofs und fiel in Bayern ein un zog", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "in der Hälfte August 1257", "lokalitat_name": null, "cs-verze": "Po invazi do Bavorska se PO II přesunul \"per pagos enim qui dcuntur Chunzgaev et Vilstal\" do Hermannsu z Niederalteich \"per vallem Vilse fluminis\", tj. přes Vilstal do Landshuhtu", "kurzes_regest": "Nach deum Einfall in Bayern zog PO II. \"per pagos enim qui dcuntur Chunzgaev et Vilstal\" nach Hermanns von Niederalteich \"per vallem Vilse fluminis\", also durch Vilstal bis zum Landshuht", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "24. 8.1257 und ein Paar Tage vorher", "lokalitat_name": null, "cs-verze": "Dne 24.8.1257 uzavřel PO II příměří s bavorskými vévody a v noci se tajně přesunul do Mühldorfu, v držení salcburského biskupa Filipa", "kurzes_regest": "PO II. hat am 24.8.1257 mit den Herzogen von Bayern Waffenstillstandgeschlossen und in der Nacht zogt geheim zum Mühldorf, ins Besitz des Salzburger Rrzbischofs Philip", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "25.8.1257", "lokalitat_name": "Mühldorf", "cs-verze": "Most s přemyslovským vojskem byl proražen a Pád II byl rozdělen částmi jeho vojáků na druhý břeh Innu", "kurzes_regest": "Die Brücke mit den Ottokars Truppen wurde durchgebrochen und PO II. wurde von Teile seiner Soldaten auf den anderen Ufer von Inn abgeteilt", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "Nach 25.8.1257", "lokalitat_name": "Tittmoning", "cs-verze": "PO II táhl s malými zbytky svého vojska z Mühldorfu do Tittmoningu (Tytmaenige), majetku salcburských arcibiskupů", "kurzes_regest": "PO II. zog mit kleinen Überresten seiner Truppen von Mühldorf nach Tittmoning (Tytmaenige), Besitz der Salzburger Erzbischöfe", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "Nach 25. 8.1257 später", "lokalitat_name": "Laufen", "cs-verze": "PO II táhl s malými zbytky svého vojska z Tittmoningu do Laufenu severně od Salcburku, majetku salcburských arcibiskupů", "kurzes_regest": "PO II. zog mit kleinen Überesten seiner Truppen von Tittmoning nach Laufen nordlich von Salzburg, Besitz der Salzburger Erzbischöfe", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "Nach 25.8.1257 noch später", "lokalitat_name": "Vöcklabruck", "cs-verze": "PO II táhl s malými zbytky svých vojsk od Laufenu k Vöcklabrucku (Vekelaerprukke), který byl již v držení Přemysla Ottokara v Horních Rakousích", "kurzes_regest": "PO II zog mit kleinen Überresten seiner Truppen von Laufen nach Vöcklabruck (Vekelaerprukke), schon in Ottokars Besitz in Oberösterreich", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "Zwischen September und vor 14.10.1257", "lokalitat_name": null, "cs-verze": "Annales Matseenses, str. 494, zmiňuje, že let PO II. do Vöcklabrucku, tj. do jeho země, Horního Rakouska. Totéž potvrzuje Annales Sancti Rudberti Salisburgensis, MGH SS IX, s. 794, podle kterého PO II \"rediere in terra sua\" a Continuatio Lambacensis, MGH SS IX, s. 560: \"ad propria revertitur\" Chronica Magni presbiteri continuatio A, MGH SS XVII, s. 530: \"ad propria repedavit\" Žádný pramen nezmiňuje, že v pozdějších dobách se Pád II přesunul do Bavorska,  proto se od začátku září 14.10.1257 přesunul z Vöcklabrucku do Plasy přes Horní Rakousko a jižní Čechy", "kurzes_regest": "Annales Matseenses, S. 494, erwähnen, dass PO II. Flug nach Vöcklabruck also in seinem Land Oberösterreich. Dasselbe bestätigt auch Annales Sancti Rudberti Salisburgensis, MGH SS IX, s. 794, nach welcher PO II. \"rediere in terra sua\" und Continuatio Lambacensis, MGH SS IX, s. 560: \"ad propria revertitur\" Chronica Magni presbiteri continuatio A, MGH SS XVII, s. 530: \"ad propria repedavit\" Keine Quelle erwähnt, dass in späteren Zeit zog PO II. in Bayern, also er zog zwischen Anfang September 14.10.1257 vomn Vöcklabruck nach Plasy durch Oberösterreich und Südböhmen", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "(15. 10.1257 oder kurz vorher)", "lokalitat_name": "Plasy", "cs-verze": "PO II nařizuje biskupovi Brunovi z Olomouce, Jindřichu z Lichtenštejna, Vilémovi Hustopečskému, komořímu Pardusovi a jeho bratru Sudomirovi, soudci Janu z Vyšňového, aby založili město u Uherského Hradiště", "kurzes_regest": "PO II. gebietet den Bischofs Bruno von Olomouc/Olmütz dem Heinrich von Liechtenstein, Wilhem von Hustopeče, dem Kammerherr Pardus und seinem Bruder Sudomir, dem Richter Johann von Vyšňové die Stadtgründung bei Velehrad (Uherské Hradiště)", "beschenkte_institution_text": "Bischofs Bruno von Olomouc/Olmütz dem Heinrich von Liechtenstein, Wilhem von Hustopeče, dem Kammerherr Pardus und seinem Bruder Sudomir, dem Richter Johann von Vyšňové, Velehrad, Zisterzienserkloster", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "15.10.1257", "lokalitat_name": "Plasy", "cs-verze": "PO II, na žádost velehradského kláštera a zdejšího opata Hartleba, vyhlašuje a potvrzuje řád a nařízení biskupa Bruna z Olomouce Jindřichovi z Lichtenštejna (Heinrico de Lihtenstein), Vilémovi Hustopečskému (Wilhelmo de Hvztopetz), komořímu Pardusovi a jeho bratru Sudomirovi (Parduzzoni camerario Zvdemiro fratri suo), soudci Janu z Vyšňového (Iohanni de Wissenowe,  iudicio nostro) pečovat o polohu města Uherské Hradiště na \"dědičném\" majetku velehradského kláštera na řád Přemysla Otakara (dantes in mandatis), kde PO II přikazuje založení města (contra terminos Vngarorum munitionem unam seu oppidum pro necessitate ac conservatione terre nostre preparari et edificari iussimus) a toto město má být osídleno lidmi z velehradského kláštera z obce Velehrad a z Kunovic. PO II potvrzuje patronátní právo velehradského kláštera v městských kostelech.", "kurzes_regest": "PO II auf der Bitte des Klosters Velehrad und des dortigen Abtes Hartleb erklärt und bestätigt die Anordnung und Bestimmunngen Bischofs Bruno von Olomouc/Olmütz dem Heinrich von Liechtenstein (Heinrico de Lihtenstein), Wilhem von Hustopeče (Wilhelmo de Hvztopetz), dem Kammerherr Pardus und seinem Bruder Sudomir (Parduzzoni camerario Zvdemiro fratri suo), dem Richter Johann von Vyšňové (Iohanni de Wissenowe, iudicio nostro) die Lokierung der Stadt Uherské Hradiště auf dem Besitz \"hereditate\" des Klostes Velehrad auf dem Ottokars Befehl (dantes in mandatis) besorgen, wo PO II. gebietet die Stadgründung (contra terminos Vngarorum munitionem unam seu oppidum pro necessitate ac conservatione terre nostre preparari et edificari iussimus) und diese Stadt sollen Leute des Klosters Velehrad aus dem Dorf Weligrad und aus Kunovic besiedeln sollen. PO II. bestätigt dem Kloster Velehrad Patronatsrecht in den Stadtkirchen.", "beschenkte_institution_text": "Velehrad, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "24.10.1257", "lokalitat_name": "Plasy", "cs-verze": "Druhý zákon uděluje cisterciáckému klášteru v Plasích, jako jeho otci králi Václavu I., privilegium světských soudců, zejména v Plzni, Miesu/Stříbře a Rakovníku, a osvobozuje obyvatele kláštera od daní za rány předem uštědřené soudcům.", "kurzes_regest": "PO II bewilligt dem Zisterzienserkloster Plasy als sein Vater König Wenzel I. die Imunität von weltlichen Richtern vor allem in Pilsen/Plzeň, Mies/Stříbro und Rakovník und befreit die Leute des Klosters von Abgaben für Verwundung, die den Richtern voher bezahlt wurden.", "beschenkte_institution_text": "Plasy, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "(um Oktober) 1257", "lokalitat_name": null, "cs-verze": "PO II nařizuje Ratmiru purkrabímu z Přimdy (Frimiberk/Pfrimberg), aby nezasahoval do nového kostelního domu bratří a sester v Böhmischbrücku (v Ponte Boemico) (v Bavorsku). V roce 1257 pak v Lestkově u Tachova vydal Ratmir mandát z Přemyslova rozkazu (ex iniuncto regis Boemorum)", "kurzes_regest": "PO II. gebietet dem Ratmir Burggraf von Přimda (Phrimberch/Pfrimberg), um kein das neues Kichenhaus der Brüder und Schwester in Böhmischbrück (in Ponte Boemico) (in Bayern) eingreift. Danach im Lestkov bei Tachov im Jahre 1257 hat Ratmir darüber ein Mandat aus Ottokars Befähl (ex iniuncto regis Boemorum) ausgestellt", "beschenkte_institution_text": "Böhmischbruck Spital - Přimda, Ratmir Burggraf von", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "Um 11.11.1257", "lokalitat_name": "Cham", "cs-verze": "Přemyslovi radní vyjednali mír s falckým hrabětem Ludvíkem a vévodou Jindřichem Bavorským: PO II musela ustoupit městu Ried na tehdejší hornorakousko-bavorské hranici, stejně jako PO II musela jít do Sušice/Sušicka a povolat do Imberchu (podle Raucha Neunburga am Inn) a Scherdingu. Smlouva byla zpečetěna. Tyto oblasti byly dobyty bavorskými vévody po smrti rakouského vévody Heřmanna Bádenského.Neuburg byl enklávou pod Pasovem", "kurzes_regest": "Ottokars Räter verhandelten mit dem dem Pfalzgraf Ludwig und Herzog Heinrich von Bayern den Frieden: PO II. muss an der Stadt Ried bei der damaligen oberösterreichisch-bayerischen Grenze resignieren, so wie musste PO II an Sušice/Sušicko und Aufforderung z Imberch (laut Rauch Neunburg am Inn) und Scherding. Der Vertrag wurde besiegelt. Diese Bereiche erobern bayerische Herzoge nach dem Tod des österreichischen Herzogs Hermann von Baden.Neuburg ist Enklave unter Passau", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "Vor 27.12.1257", "lokalitat_name": null, "cs-verze": null, "kurzes_regest": "PO II bestimmt iudices und auditores Otto von Maissau (Ottonem de Meyssowe) und Konrad von Zagginge (Chunradum Chaekkinge/Zekkinge), die in Krems am 27.12.1257 mit bischof Otto von Passau verhandelten wegen über Besatzung der vakanten Kirchen", "beschenkte_institution_text": null, "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": 1257, "lokalitat_name": "Krems", "cs-verze": null, "kurzes_regest": "Heinrich von Schwarzensee,von PO II delegierte in dieser Angelegenheit Kastellan und Richter (a domino meo illustri duce Austrie domino regni Bemie et Marchione Morauie judex delegatus et constitutus in causa, que occasione cuiudam Molendiini siti in Chrems ) schlichtet den um eine Mühle daselbst entstandenen Streit zwischen Abt Heinrich von Cluny (Heinricusm abbatem Cluniensem), Konrad Probst von Berchtesgaden (Chunradum prepositum de Perchezgaden), Probst Engelbert von Werde (Werde), Irnfried (Irnfriedum) ) Domherr von Passau Dekan von Krems (dominum Irnfridum canonicum Patauiensem et decanum in Chrems) auf einer Seite, und Hermann von Rechtberg (Rechtperg) und dominum Ortolfum Niedoarium", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": 1257, "lokalitat_name": "???", "cs-verze": "PO II zakládá město Malá Strana.", "kurzes_regest": "PO II. gründet die Stadt Prager Kleinseite (Malá Strana).", "beschenkte_institution_text": "Praha, Malá strana, Stadt", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "Oktober 1253-vor 17.1.1258", "lokalitat_name": null, "cs-verze": "PO II se souhlasem pražského biskupa Nikolause předává proboštovi jezdeckého řádu Božího hrobu ve Zderazu patronátní právo nad kostelem Panny Marie v Mostě/Brüxu", "kurzes_regest": "PO II. übergibt dem mit dem Zustimmung des Bischofs NIkolaus von Prag dem Probstei des Ritterordens vom Heiligen Grab in Zderaz das Patronatsrecht zur Marienkirche in Most/Brüx", "beschenkte_institution_text": "Zderaz Probstei, Ritterorden vom Heiligen Grab zu Jerusalem,", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "Vor 1.2.1258", "lokalitat_name": "Praha", "cs-verze": "Arnold Probst od sv. Floriána žádá v Praze PO II, aby obnovil privilegium, které pro jeho kostel projevil rakouský vévoda Leopold VII.", "kurzes_regest": "Arnold Probst von St. Florian bittet den PO II, in Prag, um das gezeigte Privilegium des Herzogs Leopold VII. von Österreich für seine Kirche zu erneuern.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "1.2.1258", "lokalitat_name": "Wien", "cs-verze": "PO II potvrzuje a obnovuje privilegium rakouského vévody Leopolda VII. pro klášter sv. Floriána, které tamní probošt Arnold ukázal PO II v Praze s prosbou o potvrzení. Leopoldův dokument z roku 1208 byl inzerován v Přemyslově dokumentu.", "kurzes_regest": "PO II bestätigt und erneuert das Privilegium Herzog Leopolds VII. von Österreich für die Stift St. Florian, das der dortige Probst Arnold mit der Bitte um Bestätigung dem PO II in Prag gezeigt. Die Leopolds Urkunde von 1208 wurde in Ottokars Urkunde inseriert.", "beschenkte_institution_text": "St. Florian, Augustiner Chorrherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "9.2.1258", "lokalitat_name": "Linz", "cs-verze": "Vok z Rožmberka zapisuje památku, že Werner Rughalm a Meinhard von Rotenstein drželi v lénu pánů ze Schaumbergu državy Oberschwandt, Unterschwandt a Freudenthal", "kurzes_regest": "Vok von Rosenberg/Rožmberka macht die Memoria, dass Werner Rughalm und Meinhard von Rotenstein im Lehen Besitze Oberschwandt, Unterschwandt und Freudenthal von Herren von Schaumberg halten", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "(Kurz vor 12.2.1258 oder genau am 12.2.1258)", "lokalitat_name": "Wien", "cs-verze": "PO II vydal listinu (listinu) o državách u Türnitz (u Lilienfeldu), kterých se bratři
