<style>
:root {

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Lora', Georgia, serif; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; min-height: 100vh; }

.header { background: var(--accent); color: white; padding: 24px; border-radius: 8px; margin-bottom: 24px; }
.header h1 { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 4px; }

.filters { background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; align-items: flex-end; }
.filter-group { display: flex; flex-direction: column; gap: 6px; }
.filter-group label { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; font-family: 'Montserrat', sans-serif; letter-spacing: 0.5px; }
.filter-group select, .filter-group input { padding: 8px 12px; border: 1px solid var(--border2); border-radius: 4px; font-family: 'Lora', serif; font-size: 13px; color: var(--text); background: white; cursor: pointer; width: 100%; }
.filter-group input { cursor: text; }
.filter-group select:focus, .filter-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

.btn-reset { padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; text-transform: uppercase; white-space: nowrap; height: fit-content; width: 100%; }
.btn-reset:hover { background: var(--accent2); }

.table-info { font-size: 12px; color: var(--text3); margin-bottom: 12px; padding: 12px; background: var(--card); border-radius: 4px; }

.table-wrapper { overflow-x: auto; background: white; border: 1px solid var(--border); border-radius: 8px; }
.data-table { width: 100%; font-size: 12px; border-collapse: collapse; }
.data-table th { background: var(--card); border-bottom: 2px solid var(--border2); padding: 10px; text-align: left; font-weight: 600; color: var(--accent); font-family: 'Montserrat', sans-serif; text-transform: uppercase; font-size: 11px; }
.data-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.data-table tr:hover { background: var(--card); }

.pagination { display: flex; justify-content: center; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
.pagination button, .pagination span { padding: 6px 10px; border: 1px solid var(--border2); border-radius: 4px; background: white; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; }
.pagination button:hover { background: var(--accent-bg); border-color: var(--accent); }
.pagination button.active { background: var(--accent); color: white; border-color: var(--accent); }
.pagination span { border: none; color: var(--text3); cursor: default; }

@media (max-width: 1024px) {
  .filters { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 640px) {

const ALL_DATA = [{"sicherheit": 3.0, "Periode": "Rakousko", "Datum": "(Erste Hälfte Novembers) 1251", "lokalitat_name": "Netolice", "cs-verze": "PO II potvrzuje johanitům ve Strakonicích darování zmíněných vesnic, které jim daroval Bavor ze Strakonic a jeho manželka Dobroslava. Sám PO II daruje vesnici Makarov", "kurzes_regest": "PO II. bestättigt den Johanniten in Strakonice die Schenkung der genannten Dörfer, die von Bavor von Strakonice und dessen Eheweib Dobroslava ihnen geschenkt wurden. PO II. schenkt selbst Dorf Makarov", "beschenkte_institution_text": "Strakonice, Johanniten", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "(circa 16.11.1251, oder kurz vor 16. November)", "lokalitat_name": "Enns", "cs-verze": "PO II byl v té době v Ennsu, kde si Wernhard, opat z Lambachu, stěžoval králi v Gundakaru von Starkenberg na Voigtamta.", "kurzes_regest": "PO II. war in dieser Zeit in Enns, wo Wernhard Abt von Lambach dem König an Gundakar von Starkenberg über Voigtamt sich beklagte.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "16. 11.1251", "lokalitat_name": null, "cs-verze": "PO II potvrdil osvobození kláštera Baumgartenberg od všech soukromých fojtů a vzal klášter pod svou ochranu.", "kurzes_regest": "PO II. bestätigt die Freiheit des Klosters Baumgartenberg von aller Privatsvogtei und nahm das Kloster in seiner Protektion.", "beschenkte_institution_text": "Baumgartenberg, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "(Zwischen cca 16.11.-6.12.)1251", "lokalitat_name": "Krems", "cs-verze": "I. PO II. vypověděl, že s jeho souhlasem Konrad von Steinkirchen se svým synem Konrádem podle Phillipsovy závěti prodali Archelekten ze Salcburku \"feuda\" Waltersberg (neznámý) Rapoto von Neunkirchen. II. Prodaný Konrad von Steinkirchen vydal o tom také druhý dokument. Oba dokumenty jsou však na pergamenu", "kurzes_regest": "I. PO II. bezeugte, dass mit seiner Zustimmung Konrad von Steinkirchen mit seinem Sohn Konrad nach der Wille Phillips Erzelekten von Salzburg \"feuda\" Waltersberg (unbekannt)Rapoto von Neunkirchen verkaufen. II. Darüber hat auch der Verkaufte Konrad von Steinkirchen die zweite Urkunde austgestellt. Beide Urkunden sind aber auf einem Pergamen", "beschenkte_institution_text": "Rapoto von Neunchirchen (Neunkirchen)", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "6. 12.1251", "lokalitat_name": "Korneuburg", "cs-verze": "PO II potvrzuje listinu rakouského vévody Leopolda z 23. února 1225 pro klášter Niederaltaich (BUB II, č. 255, s. 84) o fojviku v Absdorfu a Kirchheimu", "kurzes_regest": "PO II. bestättigt die Urkunde des Herzogs Leopold von Österreich vom 23 Februar 1225 für das Kloster Niederaltaich (BUB II, Nr. 255, S. 84) über die Vogtei von Absdorf und Kirchheim", "beschenkte_institution_text": "Niederaltaich, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "6.12.1251 (früher schlecht zu 7.12.)", "lokalitat_name": "Korneuburg", "cs-verze": "Na žádost opata z Dolního Dolního Jádra Heřmana obnovuje PO II. klášteru Doldolního Rakouska stará privilegia, která poskytuje Vévoda v Dolním Hajdaru Niederabsdorf", "kurzes_regest": "PO II. erneuert dem Kloster Niederaltaich auf dem Bitte des Abtes von Niederaltaich Hermann die alten Privilegien, die das Voigtamt in Niederabsdorf besorgen. Niederabsdorf", "beschenkte_institution_text": "Niederaltaich, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "6. 12.1251", "lokalitat_name": "Korneuburg", "cs-verze": "Druhý občanský zákon poskytuje klášteru Niederalteich volný průchod pro potraviny na panovnických celních úřadech, s výjimkou odvodu 64 denárů na prvním celním úřadě, duae pelues, duae cyrotecae, piperis libra una na druhém celním úřadě. V Linci se nesmí dávat nic.", "kurzes_regest": "PO II. verleiht dem Kloster Niederalteich für seine victualia an den landesherrlichen Zollstätten freien Durchgang mit Ausnahme von einer Abgabe von 64 Denaren an der ersten, von duae pelues, duae cyrotecae, piperis libra una an der zweiten Zollstelle. In Linz darf nichts gegeben werden.", "beschenkte_institution_text": "Niederaltaich, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "(6. 12) 1251", "lokalitat_name": "Korneuburg", "cs-verze": "PO II poskytuje klášteru Niederaltaich volný průchod pro své potraviny přes panovnické celní úřady, s výjimkou odvodu 64 denárů na prvním celním úřadě ve Steinu, duae pelues, duae cirothecae, piperis libra una na druhém celním úřadě v Ybbsu na Dunaji Ips, 24 denárů na celním úřadě v Mauthausenu, v Linci se nesmí nic doručit.", "kurzes_regest": "PO II. verleiht dem Kloster Niederaltaich für seine victualia durch die landesherrlichen Zollstätten freien Durchgang ausgenommen einer Abgabe von 64 Denaren an der ersten Zollstätte in Stein, von duae pelues, duae cirothecae, piperis libra una an der zweiten Zollstätte in Ybbs an der Donau Ips, von 24 Denaren an der Zollstätte in Mauthausen, in Linz darf nichts gereicht werden.", "beschenkte_institution_text": "Niederaltaich, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "6. 12.(1251)", "lokalitat_name": "Korneuburg", "cs-verze": "Občan II. nařizuje svým celním a mýtným úředníkům, aby od členů kláštera Niederaltaich nevybírali žádné clo za průvoz jejich potravin, s výjimkou 64 denárů na prvním celním úřadě ve Steinu, duae pelues duae cirothecae et piperis libra una na druhém celním úřadě v Ybbsu, 24 denárů na třetím celním úřadě v Mautthausenu. V Linci se nesmí nic podávat. Mandát jako celní úředník a mýtný úředník ve Steinu, Ybbs an der Donnau, Mautthausen, v Linci", "kurzes_regest": "PO II. gebietet seinen Zoll- und Mautbeamten, von den Angehörigen des Klosters Niederaltaich bei der Durchfuhr ihrer victualia keine Abgaben zu erheben, ausgenommen 64 Denare an der ersten Zollstätte in Stein, duae pelues duae cirothecae et piperis libra una an der zweiten Zollstätte in Ybbs, 24 Denare an der dritten Zollstätte in Mautthausen. In Linz darf nichts gereicht werden. Mandat zu Zoll- und Mautbeamten in Stein, Ybbs an der Donnau, Mautthausen, in Linz", "beschenkte_institution_text": "Niederaltaich, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "(6.-11. 12) 1251 wahscheinlicher ist aber die Datierung 6-9.12.1251,", "lokalitat_name": "Korneuburg", "cs-verze": "PO II potvrzuje svobodu kláštera Lambach od všech soukromých fojtů na žádost místního opata Wernharda proti Gundakaru von Starhemberg, který jej zprostředkovává. Konkrétně Přemysl Otakar potvrdil vévodovi Fridrichovi privilegium z 26. září 1232. Již v polovině listopadu 1251 navštívil opat Wernhard von Lambach Ottakar v Ennsu v této záležitosti. Existují tři kopie tohoto dokumentu, jedna je spojena s rokem 1252 a je spojena s rakouským titulem s novou pečetí", "kurzes_regest": "PO II. bestätigt die Freiheit des Klosters Lambach von aller Privatvogtei auf Aufforderung der dortigen Abtes Wernhard gegen Gundakar von Starhemberg, der es usupiert. Konkret bestätigte Ottokar das Herzogs Friedrich Privilegium von 26. September 1232. Schon in der Mitte Novembers 1251 besuchte der Abt Wernhard von Lambach dieses Saches wegen den Ottakar in Enns. Gibt es drei Exemplare dieser Urkunde, eine ist mit dem Jahr 1252 verbunden und mit dem Neuen Siegel mit der österreichischen titulatur verbunden", "beschenkte_institution_text": "Lambach, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "(6-11.12.1251) ? Warscheinlicher ist aber die Die Datierung vor. 9.12.1251aber schon Mitte Novembes oder anderer Zeit ist nicht ganz ausgeschlossen", "lokalitat_name": "Korneuburg", "cs-verze": "PO II potvrzuje klášteru Lambach na žádost opata Wernharda osvobození od mýta na Dunaji, což je potvrzeno již privilegiem vévody Fridricha (1242). Datum do 6.11. prosince je podpořeno skutečností, že v Klosterneuburgu toto privilegium získaly jiné kláštery, ale již dříve jiné, jako například Baumgartenberg", "kurzes_regest": "PO II. bestätigt dem Kloster Lambach auf der Bitte des Abtes Wernhard die Mautfreiheit auf der Donau, was schon das Privilegium von Herzogs Friedrich bestättigt (1242) Zur Datierung zu 6.11. Dezember spricht es, dass andere Klöster dieses Privilegiums in Klosterneuburg bekammen, aber andere asl Baumgartenberg schon früher", "beschenkte_institution_text": "Lambach, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "9.12.1251 oder ein Paar Tagen vorher", "lokalitat_name": "Wien", "cs-verze": "Pasovský biskup Berthold, který byl v předchozích dnech v Klosterneuburgu s PO II, vydal 9.12. listinu pro Niederaltaich, ale již ve Vídni. Zdá se tedy, že celá skupina s biskupy pasovským a Přemyslem Otakarem byla v tento den ve Vídni.", "kurzes_regest": "Bischof Berthold von Passau, der in Klosterneuburg bei PO II. war in vorigen Tagen, hat am 9.12 eine Urkunde für Niederaltaich ausgestellt, aber schon in Wien. Scheint es also, dass die ganze Gruppe mit Bischofs von Passau und Ottokar zu diesem Tag in Wien War.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "12.12.1251 +", "lokalitat_name": "Wien", "cs-verze": null, "kurzes_regest": "PO II. bestättigt dem Kloster in Příbor (claustrum regularium) in Příbor/Freiberg in Mähren die Übergabe der (Pfarr)Kirche, die ist die neue Fundation von Franco (von Příbor/ Frank von Hückenswagen). PO II. gab der Kirche Freiheiten", "beschenkte_institution_text": "Příbor, Kloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "21.12.1251", "lokalitat_name": "Wien", "cs-verze": null, "kurzes_regest": "PO II. verkündet dem Kloster Heiligenkreuz allen seinem Maut- und Zolleinnehmern an der Donnau und am Inn, er habe nach Beispiele Herzogs Friedrich der Abei Heiligenkreuz die Mauthfreiheit für deren von Salzburg jährlich zu beziehendes Salz bestätigt. (Zwei Urkunden Exemplare", "beschenkte_institution_text": "Heiligenkreuz, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "27.12. (1251) (Nicht ausgeschlossen ist auch das Jahr 1252", "lokalitat_name": "Wien", "cs-verze": "PO II se podílí na tom, že mýtný úředník a soudce v Rakousku osvobozuje kanovníky arcibiskupství salcburského, kteří cestují přes Rakousko, od mýta a jiných darů a přikazuje jim, aby se řídili jeho příkazem.", "kurzes_regest": "PO II. beteiligt Mautbeamter und Richter in Österreich, dass er die Kanoniker der Erzstift Salzburg, die durch Österreich reisen, von Maut und andere Gabe befreit, und gebietet Ihnen seine Anordnung einzuhalten.", "beschenkte_institution_text": "Salzburg, Domkapitel", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "29.12.(1251)", "lokalitat_name": "Wien", "cs-verze": "PO II. informoval své úředníky v Ybbsu ve Steinu (pravděpodobně Steinu mezi Ybbsem a Baumgartenbergem), že vzal opata a císařský klášter Mondsee pod svou ochranu a že od tohoto kláštera získal osvobození od mýta za potraviny, které k němu patří. Nenařizuje úředníkům v Ybbsu a Stienovi, aby tento příkaz neobviňovali a nenarušovali", "kurzes_regest": "PO II. beteiligt seinen Beamtern in Ybbs in Stein (wahrschielinch Stein zwischen Ybbs und Baumgartenberg), dass er den Abt und das Reichskloster Mondsee in seinem Schutz nahm, und dass er diesem Kloster die Mautfreiheit für die demselben zugehörigen Victualien erthielt. Er gebietet den Beamtern in Ybbs und in Stien nicht diese Anordung nicht zu belasten und stören", "beschenkte_institution_text": "Mondsee, Benediktinerkloster - Beamter in Ybbs an der Donau - Beamter in Stein an der Donau", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko", "Datum": "30.12.1251", "lokalitat_name": "Wien", "cs-verze": "Filip, arcibiskup salcburský, byl koncem roku 1251 ve Vídni, kde byl v té době také Přemysl Otakar. Toho dne vydal Urk, ve kterém jsou různí svědkové", "kurzes_regest": "Phillip Erzbischof von Salzburg war am Ende J.s 1251 in Wien, wo in diesen Tagen auch Ottokar war. In desem Tag hat er die Urk ausgestellt, in welcher sind verschiedene Zeugen", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "1251 (Ende), ++", "lokalitat_name": "Wien", "cs-verze": "PO II, na žádost občanů Wiener Neustadtu, kteří se podřídili jeho vládě, potvrdil inzerované privilegium císaře Fridricha II.", "kurzes_regest": "PO II. auf Bitte der Bürger von Wiener Neustadt, die sich unter seine Herrschaft unterstellen, das inserierte Privilegium des Kaisers Friedrich II. (Falsum), konfirmiert.", "beschenkte_institution_text": "Wiener Neustadt, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko", "Datum": "1251 (Ende)++", "lokalitat_name": "Wien", "cs-verze": "Podle padělaného Urk ++ na žádost Ottokara svědčili o dokumentu PO II Filip Elekt ze Salcburku, Berthold biskup z Pasova, Konrad biskup Freising, občané Wiener Neustadtu.", "kurzes_regest": "Laut der verfälsschter Urk ++, auf der Forderung Ottokars, Phillip Elekt von Salzburg, Berthold Bischof von passau, Konrad Bischof Freising, Bürger von Wiener Neustadt bezeugten die Urkunde von PO II.", "beschenkte_institution_text": "Wiener Neustadt, Stadt", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "(Ende 1251)+", "lokalitat_name": "Wien", "cs-verze": "PO II prohlašuje, že občané Wiener Neustadtu, kteří jej přijali za Pána, naléhavě žádají, aby toto právo bylo ve všech věcech vyhrazeno říši a dědicům, které je tímto slavnostně zaručeno", "kurzes_regest": "PO II. erklärt, dass die Bürger von Wiener Neustadt, welche Ihn zum Herrn angenommen, doch dringend verlangt haben, dass dem Reich und den Erben das gbühredne Recht in Allem vorbehalten bleibe, was hiermit feierlich gewährleistet wird", "beschenkte_institution_text": "Wiener Neustadt, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko", "Datum": "1251 (November Dezember)", "lokalitat_name": null, "cs-verze": "Wichard z Thernu (Tyrna) předává patronátní právo nad kostelem ve Vratěníně na Moravě premonstrátskému klášteru Geras v Rakousku", "kurzes_regest": "Wichard von Thern (Tyrna) übergibt Patronatsrecht der Kirche in Vratěnín Mähren dem Premonstratenserstift Geras In Österreich", "beschenkte_institution_text": "Geras, Prämonstratenser-Chorherren-Stift", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "3.1.1252", "lokalitat_name": "Wien", "cs-verze": "PO II dal augustiniánskému klášteru v Ebersbergu a jeho opatovi (proboštovi) Heinrichovi právo dodávat mu každoročně víno prostřednictvím všech mýtných a celních úřadů zdarma a bez placení.", "kurzes_regest": "PO II. gab dem Augustiner-Chorherrenstift Ebersberg und ihrem Abt (Probst) Heinrich das Recht um ihm jährlich Wein durch alle Mautt- und Zollstätte frei ohne Bezahlung zuliefern.", "beschenkte_institution_text": "Ebersberg, Augustiner-Chorherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "11.2.1252", "lokalitat_name": "Hainburg", "cs-verze": "PO II. se oženil s Markétou Babenberskou dne 11. února 1252 v hradní kapli v Hainburgu.", "kurzes_regest": "PO II. wurde am 11. Februar 1252 mit Margarete von Babenberg in der Burgkapelle von Hainburg verheiratet.", "beschenkte_institution_text": "xxx", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "16.02. 1252", "lokalitat_name": "Hainburg", "cs-verze": "PO II osvobozuje klášter Waldhausen od rozdělování březnového krmiva", "kurzes_regest": "PO II. befreit das Kloster Waldhausen von der Abgabe des Marchfutters", "beschenkte_institution_text": "Waldhausen in Strugengau, Augustiner Chorrherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "16.02.1252", "lokalitat_name": "Hainburg", "cs-verze": "PO II, vévoda rakouský a štýrský, markrabě moravský, zakazuje svrchovaným soudcům v Machlandu a ve svém městě Laa jakoukoli jurisdikci nad obyvateli kláštera Waldhausen", "kurzes_regest": "PO II. Herzog von Österreich und Steiermark, Markgraf von Mähren untersagt den landesfürstlichen Richtern im Machland und zu in seiner Stadt Laa alle Gerichtsbarkeit über die Leute des Klosters Waldhausen", "beschenkte_institution_text": "Waldhausen in Strugengau, Augustiner Chorrherrenstift - Richter im Machland", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "5.3.1252", "lokalitat_name": "Hainburg", "cs-verze": "PO II (neobvykle s titulem iuvenis rex Bohemie v názvu), sliboval v rukou biskupa Konráda z Freisingu, biskupa Bertolda z Pasova a biskupa Albrechta z Řezna, že k určitému datu (sv. Jiří) osvobodí od všech panovnických daní některé vesnice Michelhowsen, Mitterendorf (Mitterndorf), Micheldorf (Michelndorf), Spültal (Spital), Azzelindorf (Atzelsdorf u Tullnu), Possendorf a Burestal. Tyto statky pocházejí od komořího z Walkungskirchenu a jeho ministerského úřadu Wigarda Osenbühela.", "kurzes_regest": "PO II. (unüblich mit dem Titel iuvenis rex Bohemie in der Titulatur, versprach in Händen Bischofs Konrad von Freising, Bischofs Bertolds von Passau und Bischofs Albrechts von Regensburg, , dass er bestimmte Dörfer Michelhowsen, Mitterendorf (Mitterndorf), Micheldorf (Michelndorf), Spültal (Spital), Azzelindorf (Atzelsdorf bei Tulln), Possendorf und Burestal von allen landesfürstlichen Abgabenim bestimmten Termin (Georgstag) befreit. Diese Güter stammen von dem Kämmerer von Walkungskirchen und seinem Ministeriale Wigard Osenbühel.", "beschenkte_institution_text": "Regensburg, Bischof Albrecht und seine Kirche", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "15.3.1252", "lokalitat_name": "Wiener Neustadt", "cs-verze": "Občanské sdružení II zakazuje soudcům a starostům obtěžovat bratry Řádu německých rytířů ve Vídeňském Novém Městě a prohlašuje je i s jejich nevolníky za osvobozené od daní.", "kurzes_regest": "PO II. verbietet den Richtern und Schultheißen, die Brüder des Deutschen Ordens in Wiener Neustadt zu belästigen und erklärt sie und ihre Hörigen für steuerfrei.", "beschenkte_institution_text": "Wiener Neustadt, Brüder der Deutsches Ordens", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "19.3.1252", "lokalitat_name": "Krems", "cs-verze": "PO II potvrzuje privilegium vévody Fridricha II. Rakouského pro klášter Ternsee a potvrzuje jeho svobody.", "kurzes_regest": "PO II. konfirmiert das Privilegium des Herzogen Friedrich II. von Österreich für das Kloster Ternsee und selbst bestättigt ihre Freiheiten.", "beschenkte_institution_text": "Tegernsee, Benediktinerkloster in Bayern", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "19.3.1252", "lokalitat_name": "Krems", "cs-verze": null, "kurzes_regest": "PO II. bestätigt die Mautfreiheit des Klosters Metten, dem Abt Albero namentlich an den Mautstätten Enns, Mauthausen und Linz.", "beschenkte_institution_text": "Metten, Benediktinerkloster in Niederbayern", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "19.3.1252", "lokalitat_name": "Krems", "cs-verze": null, "kurzes_regest": "PO II. teilt seinen Richter und Zollbeamter die Mautfreiheit mit, die er dem kloster Metten bestättigt.", "beschenkte_institution_text": "Metten, Benediktinerkloster in Niederbayern", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "19.3.1252", "lokalitat_name": "Krems", "cs-verze": "PO II svěřuje (Eisenreichdornach) statky kláštera Metten Alberovi von Kuenring (Kühring) a předává opatovi Albertu von Metten právo zvolit nového Voigta v případě, že Albero zneužije svého úřadu proti obyvatelům kláštera.", "kurzes_regest": "PO II. vertraut (Eisenreichdornach) die Güter des Klosters Metten dem Albero von Kuenring (Kühring) an ud übergab dem Abt Alberto von Metten das Recht einen anderen Voigt zuwählen, falls Albero sein Amt gegen die Leute des Klosters missbraucht.", "beschenkte_institution_text": "Metten, Benediktinerkloster in Niederbayern; Albrero von Kuenring-Dürnstein", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "(19.3.) 1252", "lokalitat_name": "Krems", "cs-verze": "Albert von Kuenring (Kühnring) vysvětluje, že mu PO II svěřil (Eisenreichdornach) Isenrichsdornu, panství kláštera Metten.", "kurzes_regest": "Albert von Kuenring (Kühnring ) erklärt, dass PO II. ihm (Eisenreichdornach) Isenrichsdorna, das Gut des Klosters Metten anvertraute.", "beschenkte_institution_text": "Metten, Benediktinerkloster in Niederbayern", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "21.3.1252", "lokalitat_name": "Krems", "cs-verze": "PO II potvrzuje privilegium rakouského vévody Leopolda pro klášter Ternsee a potvrzuje její vlastní svobody.", "kurzes_regest": "PO II. konfirmiert das Privilegium des Herzogen Leopolds von Österreich für das Kloster Ternsee und selbst bestättigt ihre Freiheiten.", "beschenkte_institution_text": "Tegernsee, Benediktinerkloster in Bayern", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 5.0, "Periode": "Rakousko", "Datum": "12.4.1252+++ (Totales Falsum)", "lokalitat_name": "Praha", "cs-verze": "PO II pro Nemocnici sv. Františka v Praze", "kurzes_regest": "PO II. Für St. Franz-Spital in Prag", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko", "Datum": "14.5.1252", "lokalitat_name": "???", "cs-verze": "Na schůzi děkanátního duchovenstva, která se sešla v Kremži, protestuje královna Margarethe prostřednictvím vyslanců proti vybírání legátní daně, která začala bez jejího souhlasu a souhlasu jejího manžela", "kurzes_regest": "Königin Margarethe erhebt auf einer n Krems einberufenen Versammlung des Dekanatsklerus durch Gesandte Protest gegen die ohne ihre und ihres Mannes Zustimmung begonnene Erhebung einer Legatensteuer", "beschenkte_institution_text": "Krems an der Donau, Dekanat", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko", "Datum": "(wohl 22.3.-5.6.)1252", "lokalitat_name": "Brno", "cs-verze": "PO II, vévoda rakouský a markrabě moravský (bez štýrského titulu) potvrzuje založení a darování cisterciáckého kláštera ve Žďáru nad Sázavou, který založili Boček hrabě z Pernecku, purkrabí znojemský, jeho nevlastní matky Sibyla, vdova po Přibislavovi, a jejich dcera EUfemia, manželka Boška a Alžběty. Tento klášter byl filiací kláštera Nepomuckého", "kurzes_regest": "PO II. Herzog von Österreich und Markgraf von Mähren (ohne dne steiererischen Titel) bestätigt die Fudation ud donation des Zisterziener Klosters Žďár nad Sázavou, der Boček, graf von Perneck, Burggraf von Znaim (Znojmo), seine Stiefmuter Sibila, Witwe nach Přibislav, und ihre tochter EUfemia, Gattin Boškos und Elisabeth gegründet hatten. Dieses Kloster war Filiation des Klosters Nepomuk", "beschenkte_institution_text": "Ždár nad Sázavou, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko", "Datum": "(wohl 22.3.-5.6.)1252+", "lokalitat_name": "Brno", "cs-verze": "PO II potvrzuje práva a svobody augustiniánského / dominikánského kláštera v Brně Herburgu a žádá olomouckého biskupa Bruna o potvrzení těchto svobod, ale tento pergamen Bruno nikdo nepotvrdil svou pečetí.", "kurzes_regest": "PO II. bestätigt dem Augustinianer / Dominikanerstift in Brno der Herburg seine Rechte und Freiheiten und bittet den Bischof Bruno von Olomouc (Olmütz) um seine Bestätigung dieser Freiheiten, aber dieses Pergamen Bruno niemand bestätigte durch seinen Siegel.", "beschenkte_institution_text": "Brno, Herburger Kloster (cella b. Marie V.), Dominikanerinstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko", "Datum": "(Novermber 1251-22.9.1253, es ist möglich die Datierung zwischen 22.3.-5.6.1252)", "lokalitat_name": null, "cs-verze": "PO II přikazuje všem šlechticům na Moravě a jejich úředníkům (beneficiariis), aby se svobody požívající některému z majetků cisterciáckého kláštera na Velehradě vztahovaly i na obyvatele tohoto kláštera v Dormu Žalkovice, v majetku Břestovi, v obcích převovské provincie, protože předtím úředníci v přerovském okrese zatěžovali lid kláštera v obci Žalkovice.", "kurzes_regest": "PO II. gebietet allen Edlen in Mähren und seinen Beamter (beneficiariis, damit die Freiheiten, die manche Besitze desl Cisterzienzerkloster Velehrad geniessen, auch an die Leute dieses Klosters im Dorm Žalkovice, in Besitz bei Břest, in Dörfern Přerover Provinz gelten sollen, weil vorher die Beamter in Přerover Provinz die Leute ders Klosters im Dorf Žalkovice belastet hatten.", "beschenkte_institution_text": "Velehrad, Zisterzienserkloster; Ottokars Beamten", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "6.6.1252+", "lokalitat_name": "Znojmo", "cs-verze": "Sv. Biskupství II. udělil kostelu sv. Himpolitána v Hradišti u Znojma a dalším kostelům patřícím ke špitálu sv. Františka v Praze svobodu udělit kostel sv. Františka v Praze", "kurzes_regest": "PO II. übergab der Kirche St. Hipolitskirche im dem Hradiště bei Znojmo und anderen Kirchen, die dem Skt. Franciscus-Spital in Prag gehörten, die Freiheiten, ten", "beschenkte_institution_text": "Hradiště bei Znojmo, Hippolitskirche", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko", "Datum": "15.6.1252", "lokalitat_name": "Wien", "cs-verze": "Běla IV. Uherský král udělil osvědčení svým velmožům při příležitosti války proti Pádu II.", "kurzes_regest": "Bela IV. König von Ungarn gab seinen Magnaten die Urkunde bei der Gelegenheit des Krieges gegen PO II.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "16.6.1252", "lokalitat_name": "Krems", "cs-verze": "Markéta (Markéta) z Babenberku, \"omanorum quondam regina, ducissa Austriae et Stiriae ac marionissa Moraviae\" přikazuje všem mýtným úředníkům v zemi, aby získali práva kostela v Ardaggeru. (na žádost probošta Leopolda, královnina Kappelera, protože tento kostel byl zničen Bavorskem v minulé válce)", "kurzes_regest": "Margaret (Markéta) von Babenberg, \"omanorum quondam regina, ducissa Austriae et Stiriae ac marionissa Moraviae\" gebietet allen Mautbeamter im Land, um die Rechte der Kirche in Ardagger zu erhalten .(auf der Bitte der Ardagger Probst Leopold, Kappeler der Königin , weil diese Kirche von Bayern in vorigen Krieg zerstört wurde)", "beschenkte_institution_text": "Ardagger, Kollegiatstift St. Margarethe", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "30.8.1252", "lokalitat_name": "Linz", "cs-verze": "PO II potvrzuje svou smlouvu s Dietmarem von Steyrem (městské ministerstvo ve Steyru) o postoupení města Stayer Přemyslům Ottokarům, jmenovitě \"Burglehenu\". PO II dal Dietmarovi jeho práva v Losensteinu.", "kurzes_regest": "PO II. bestätigt sein Vertrag mit dem Dietmar von Steyr (Stadtministerial im Steyr) wegen Auslieferung der Stadt Stayer dem Ottokar, namentlich \"Burglehen\". PO II. gab dem Dietmar sein Recht in Losenstein.", "beschenkte_institution_text": "Dietmar von Stayer", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko", "Datum": "(Januar - September )1252", "lokalitat_name": null, "cs-verze": "Václav I. potvrzuje milientům a občanům Vídeňského Nového Města svou ochranu a všechny svobody.", "kurzes_regest": "Wenzel I. Bestätigt dem milites und Bürger der Wiener Neustadt sein Schütz und alle Freiheiten.", "beschenkte_institution_text": "Wiener Neustadt, Stadt", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko", "Datum": "(Oktober - 28.11.) 1252", "lokalitat_name": "Graz", "cs-verze": "PO II, vévoda rakouský, štýrský, markrabě moravský, osvobozuje statky nebo tzv. sklepa kláštera Rein/Reun ve Štýrském Hradci a Wiener Neustadtu a jejich vesnic od občanských daní, dvorského nástupnictví a stráže a zaručuje jim svobodu a právo na azyl.", "kurzes_regest": "PO II. Herzog von Österreich, Steiermark, Markgraf von Mähren befreit die Höfe oder sogenanter Keller (cellaria) des Klosters Rein/Reun zu Graz und Wiener Neustadt und ihren Dörfern von der bürgerlichen Steuer, Gerichtsfolge und Scharwache, und gewährt denselben Freiung und Asylrecht.", "beschenkte_institution_text": "Rein, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "23.11.1252", "lokalitat_name": "Krems", "cs-verze": null, "kurzes_regest": "Margaretha von Babenberk konfirmiert dem Stift Stifte Altenburg dieSchenkung der Pfarre Röhrenbach. )zwei exemplare", "beschenkte_institution_text": "Altenburg, Benediktinerkloster", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "28.11.1252", "lokalitat_name": "Linz", "cs-verze": null, "kurzes_regest": "PO II. bestätigt dem Zisterziencer-Stift Wilhering das Privilegium Herzogs Friedrich II. von Österreich über die Mautfreiheit unter anderen auch Salz.", "beschenkte_institution_text": "Wilhering, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "28.11.1252", "lokalitat_name": "Linz", "cs-verze": "PO II potvrzuje privilegium Fridricha Rakouského nad svobodou kláštera Wilhering od fojství a ochranu", "kurzes_regest": "PO II. bestätigt das Privilegium Friedrichs von Österreich über die Freiheit des Klosters Wilhering von der Vogtei, und die Protektion", "beschenkte_institution_text": "Wilhering, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "28.11.1252", "lokalitat_name": "Linz", "cs-verze": "PO II: potvrzuje dar rakouského vévody Fridricha II. opatství Wilhering nad farním kostelem v Gramastettenu", "kurzes_regest": "PO II: bestätigt die Schenkung, welche Herzog Friedrich II. von Österreich dem Kloster Wilhering über die Pfarrkirche Gramastetten gamacht hatte", "beschenkte_institution_text": "Wilhering, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "(28.11.)1252", "lokalitat_name": "Linz", "cs-verze": "PO II . potvrzuje privilegium Fridricha II. Rakouského nad darováním vesnic a statků klášteru Wilhering.", "kurzes_regest": "PO II . konfirmiert dem Kloster Wilhering das Privilegium Friedrichs II. von Österreich über die Donation der Dörfer und Höfen.", "beschenkte_institution_text": "Wilhering, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "(circa 28.11.) 1252", "lokalitat_name": "Linz", "cs-verze": "PO II zanechává klášteru všechna svá práva in placitis et in persolutione avene in (Klein-) Zwettl ke spáse své duše a duší svých rodičů jako náhradu za škodu, kterou klášteru způsobil Ulrich von Chungesprunne.", "kurzes_regest": "PO II. überläßt zu seinem und seiner Eltern Seelenheil dem Kloster Zwettl alle seine Rechte in placitis et in persolutione avene in (Klein-) Zwettl zum Ersatz der Schäden, die Ulrich von Chungesprunne dem Kloster zugefügt hat.", "beschenkte_institution_text": "Zwettl, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "(circa 28.11.) 1252", "lokalitat_name": "Linz", "cs-verze": "PO II uděluje klášteru Zwettl osvobození od mýta ve výši 2 tal. Salz maioris ligaminis in Danubio per terre nostre districtum.", "kurzes_regest": "PO II. gewährt dem Kloster Zwettl Mautfreiheit für jährlich 2 tal. Salz maioris ligaminis in Danubio per terre nostre districtum.", "beschenkte_institution_text": "Zwettl, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "29.11.(1252)", "lokalitat_name": "Linz", "cs-verze": "PO II potvrzuje klášteru Seitenstätten dar statku v Altenhofenu Heinrichem von Wasenem a svolení jeho ministeriales k tomu, aby mu darovali.", "kurzes_regest": "PO II. bestätigt dem Stifte Seitenstätten die Schenkung des Hofes zu Altenhofen durch Heinrich von Wasen und die Erlaubnis zu Vergabungen seitens seiner Ministerialen an dasselbe.", "beschenkte_institution_text": "Seitenstetten, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 5.0, "Periode": "Rakousko", "Datum": "4.12.1252+++", "lokalitat_name": "Brno", "cs-verze": "Občané a porotci města Brna v tomto falsumu říkají, že v té době byl Přemysl Otakar v Brně, ex mandato regie maiestatis Ottackaris, eo tempore fountain existentis anno 1252", "kurzes_regest": "Bürger und Geschworene der Stadt Brünn in diesem Falsum sagen, dass in dieser Zeit Ottokar in Brno war, ex mandato regie maiestatis Ottackaris, eo tempore Brunne existentis anno 1252", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "9.12.1252", "lokalitat_name": "Krems", "cs-verze": "PO II potvrzuje mýtné právo na kostel v Osterhofenu v Bavorsku, které bylo již schváleno vévodou Leopoldem.", "kurzes_regest": "PO II. bestätigt der Kirche Osterhofen in Bayern das Mautrecht, welche schon Herzog Leopold bewiligt.", "beschenkte_institution_text": "Osterhofen, Prämonstratenserchorherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "20. 1. 1253", "lokalitat_name": "Wien", "cs-verze": "PO II potvrzuje, že biskup Konrad von Freising (žadatel) oddělil fojtství z Enzersdorfu (Groß-enzerdorf, Großenzerdorf) od oholeného Oldřicha z Pillichsdorfu, jehož synové byli přítomni v PO II.), a že vzhledem k tomu, že toto fojství nyní připadlo jemu, nechtěl si z něj brát více než 30 liber vídeňských feniků ročně.", "kurzes_regest": "PO II. beurkundet, dass Bischof Konrad von Freising (petent) die Vogtei Enzersdorf (Groß-enzerdorf, Großenzerdorf) von geschorbenen Ulrich von Pillichsdorf gelöst habe, )dessen Söhne bei PO II. anwesend waren), und dass, da diese Vogtei nun an ihn gekommen, er nicht mehr als jährlich 30 Pfund Wiener Pfennig Gebühr davon nehmen wolle.", "beschenkte_institution_text": "Freising, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "18.2.1253", "lokalitat_name": "Wien", "cs-verze": "PO II. potvrzuje nemocnici pro záchranu. Geiste na řece Vídeň (Heiligengeistspital) obdrželo privilegium udělené vévodou Fridrichem II. na svobodné zásobování potravinami (solí atd.), které nakupuje z almužen získaných pro potřeby chudých a které jsou do něj přiváděny po vodě nebo po zemi.", "kurzes_regest": "PO II. bestätigt dem Hospitale zum heil. Geiste am (Heiligengeistspital) Wienflusse das von Herzog Friedrich II. verliehene Privilegium der Maautfreiheit für Lebensmittel (Salz u.a.), welche es von den erhaltenen Almosen zur Notdurf der Armen erkauft, und die ihm zu Wasser oder zu Lande zugeführt werden.", "beschenkte_institution_text": "Wienflusse, Hospitale zum heil. Geiste", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 5.0, "Periode": "Rakousko", "Datum": "4.3.1253 ALE V CDB V/3, Nr. 1004, s. 47 zum 4.3 1254", "lokalitat_name": "Krems", "cs-verze": "PO II prohlašuje, že na žádost tamních opatů bere klášter Mondsee pod svou zvláštní ochranu a uděluje mu osvobození od mýta, a proto nařizuje svému úředníkovi (ministerialium, mutatorium, judicum), aby tomuto právu nebránil.", "kurzes_regest": "PO II. erklärt, dass er das Kloster Mondsee auf der Bitte der dortigen Abbtes in seinem besonderen Schutz nimt und ihm Mautfreiheit erteilt, also gebietet er seinen Beamter (ministerialium,, mutatorium, judicum diesem Recht nicht hindern.", "beschenkte_institution_text": "Mondsee, Benediktinerkloster; Königsbeamter", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "Vor 25.3.1253 und danach", "lokalitat_name": "Křivoklát", "cs-verze": "Při Zvěstování Panny Marie navštívil krále Václava I. zvolený arcibiskup Filip Salcburský, biskup Bertold z Pasova, biskup Albert z Řezna, biskup Jindřich z Bambergu, biskup Konrád z Bamberku, biskup Brunno z Olomouce a další [z dalších biskupů, jak ukazuje následující dokument, také biskup Oldřich ze Seckau a biskup Konrád z Freisingu]. Podle CHroniku byl však tento proces tajný.", "kurzes_regest": "Bei Mariä Verkündigung den König Wenzel I. besuchten Elekt-Erzbischof Phillip von Salzburg, Bischof Bertold von Passau, Bischof Albert von Regensburg, Bischof Heinrich von Bamberg, Bischof Konrad von Bamberg, , Bischof Brunno von Olmutz (Olomouc) und andere [unter den anderen Bischofen ist wie die folgende Urkunde zeigen auch Bischof Ulrich von Seckau und Bischof Konrad von Freising]. Laut der CHronik war aber diese Verhandlung geheim.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "1.4.1253", "lokalitat_name": "Praha", "cs-verze": "PO II., na radu a se souhlasem svého otce, krále Václava I., se podřizuje prohlášení biskupa Jindřicha Bamberského, biskupa Konráda z Freisingu a biskupa Oldřicha ze Seckau o lénech držených biskupstvím pasovským, která byla po smrti vévody Fridricha II. předána pasovskému biskupovi. Rozsudek, který byl potvrzen výše zmíněnými biskupy v Bečově dne 27. března 1253, je zaznamenán v této listině. Podle tohoto prohlášení má pasovský biskup opevnit svá města Eferding u Lince. Hagenowský ostrov, který patří pasovskému biskupovi. Linec a Wels však zůstávají vévodovi PO II. a biskupovi s 3000 librami stříbra a polovinou Mautha v Linci. PO II skládá přísahu a skládají ji i tzv. biskupové a také (pravděpodobně Přemyslovi emisaři v Bečově) Boško (Boček), pincerna de Habesbach, Wichardus te tirnah, Benisch, magister Wilhelmus scriba Ducis, Witigo scriba Styrie., Ottokarova listina zapečetěná na žádost přemyslovského krále Václava I., dále biskupa Heinricha z Bamberku, biskupa Oldřicha ze Seckau, a ztratila se pravděpodobně poslední pečeť biskupa Konráda z Freisingu.", "kurzes_regest": "PO II. unterwirft sich nach dem Rat und mit dem Zustimmung seines Vaters König Wenzels I. dem von Bischof Heinrich von Bamberg, Bischof Konrad von Freising und Bischof Ulrich von Seckau gethanen Auspruch wegen der vom Bistums Passau innehabenden Lehen, welche sind nach dem Todt Herzogs Fridrichs II. dem Bischof von Passau zugerichtet sind. Der Auspruch, der von genannten Bischöfen in Bečov 27. März 1253 bestätigt wurde, wurde in dieser Urkunde inseriert. Nach desem Ausspruch soll Bischof von Passau seine Städte Eferding bei Linz befestigen. Insel Hagenowe dem Passauer Bischof gehört. Aber linz und Wels bleiben dem Herzog.PO II. gam dem bischof 3000 Pfund Silber und die Hälfte von Mauth in Linz. PO II. leistet ein Eid und es machen auch genanten Bischofe und auch (wohl Ottokars Emissaren in Bečov) Bosko (Boček), pincerna de Habesbach, Wichardus te tirnah, Benisch, magister Wilhelmus scriba Ducis, Witigo scriba Styrie., Die Ottokars Urkunde auf der Bitte Ottokars König Wenzel I. besiegelt, sowie Bischof Heinrich von Bamberg, Bischof Ulrich von Seckau, und die leztete Siegel wohl Bischofs Konrads von Freising ist verloren Zwei Originalen der Urkunde ausgestellt wurden.", "beschenkte_institution_text": "Passau, Bistum und Bischof Bertold von Passau", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko", "Datum": "1247 (kurz vor 27 März)-6.4.1253", "lokalitat_name": null, "cs-verze": "PO II dal (ústně nebo písemně) souhlas k tomu, aby šašek (iokulátor Zwnglo) prodal svůj majetek v Chemotizu a dvě pozemky ve městě Znojmě františkánovi v Praze.", "kurzes_regest": "PO II. gab die (mündliche oder schriftliche) Zustimmung, dass der Narr (ioculator Zwnglo) sein Besitz in Chemotiz und zwei arealen in der Stadt Znojmo (Znaim) dem Franziskaner in Prag verkauft.", "beschenkte_institution_text": "Narr (ioculator Zwnglo)", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "6.4.1253", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II. besiegelt und dadurch bestätigt die Urkunde Königs Wenzels, in der König dem St.Franciscus-Spital in Prag seine Gütter bestätigt und andere Besitze und Freiheiten ihm übergibt. Mit PO II. besiegelt und bestätigt die Konigsurkunde auch Nikolaus Bischof von Prag.", "beschenkte_institution_text": "Praha, Franziskaner St. Franziskus-Spital/bzw. wohl Brüder mit dem (roten) Stern", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "20.4.1253", "lokalitat_name": "Passau", "cs-verze": null, "kurzes_regest": "Bertold , Bischof von Passau, erklärt, dem PO II. als dem neuen Herzog von Österreich jene Lehen seines Bistums in Österreich und Steiermark, welche dessen Vorgänger innegehabt, verleihen zu wollen. In dieser Urkunde ist auch die Pfarr Hollabrun erwänt", "beschenkte_institution_text": "PO II.", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko", "Datum": "die erste Hälfte des Jahres 1253", "lokalitat_name": null, "cs-verze": "válečné spojenectví uherského krále Belase Daniela Romanoviče z Halice, Otty Bavorského a slezských knížat Boleslava Stýdlivého, vévody krakovského/krakovského a Vladislava opolského, došlo k povstání rakouské a starrické šlechty. Jako první táhli proti Opavě Daniel Romanovič z Halice, Boelslav Štýdlivý a Vladislav Opolský. Kapitánem v Opavě Opavě byl Ondřej a jeho bratr Beneš. Beneš s Ondřejem mají v Násilém vězně z Ruše, ale Danielem Danem je osvobodí. Beneš pak přitáhl do Hlubčic a Rusen přitáhl do Hlubčic V boji var také Herbolrd z Fulštejna (Fulstein) dapifer biskupBruno", "kurzes_regest": "die Kriegsallianz Belas von Ungarn Daniel Romanovič von Halitsch, Otto von Bayern, und schleschische Fürsten Boleslav Stydlivý Herzog von Krakau/Krakov und Vladislav von Oppeln Opolsko und kam es zum Aufstand der österreichischen und starerischen aristokraten . Als Erste Daniel Romanovič von Halitsch, Boelslav sStydlivý und Vladislav von Oppeln zogen gegen Troppau. Hauptmann i nTroppau Opava war Ondřej und sein Bruder Beneš. Vorstadt und zwei Torren in Opava verbrannt wurden Beneš und Ondřej haben die ruschische Gefanggenommene in Násilé, aber von Daniel dan befreit wurden. Beneš dann kam in Hlubčice und Rusen kamen zu Hlubčice Im kampf var auch Herbolrd von Fulštejn (Fulstein) dapifer BischofsBruno", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "29.4.1253", "lokalitat_name": "Wiener Neustadt", "cs-verze": "Občan Vídeňského Nového Města přiznává po svém podrobení svobodu uzavírat sňatky se svými dcerami a pokrevními příbuznými, marky, porážky, osvobození od cla a daní, vlastní střežení svého torru, žádné opevnění ve městě ani budování odpočinku kolem dokola, a potvrzuje jejich dopisy od císaře Fridricha II. a vévodů Leopolda a Fridricha II. Rakouského.", "kurzes_regest": "PO II. erteilt dem Ministerialen (militibus) und Bürger in Wiener Neustadt, nach ihrer Unterwerfung, die Freiheit der Verheiratung ihrer Töchter und Blutsverwandten, Mark, Niederlage, Zoll- und Steuer-freiheit, eigene Bewachung ihrer Torr, keine Feste in der Stadt noch ringsum auf eine Raste weit zu bauen, und bestätigt ihre Briefe vom Kaiser Friedrich II. und den Herzogen Leopold und Friedrich II. von Österreich.", "beschenkte_institution_text": "Wiener Neustadt, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "17.5.1253", "lokalitat_name": "Leoben", "cs-verze": "PO II převádí na diecézi Seckau a místního biskupa Ulricha statky Leibnitz a S. Gerogen an der Stiefing, které byly kdysi v držení hrabat z Plain jako léna, a PO II daruje biskupovi Oldřichovi von Seckau také ves Rasnitz u Knittelfeldu.", "kurzes_regest": "PO II. überträgt dem Bistums Seckau und hiesigen Bischof Ulrich die Besitzungen bei Leibnitz und S. Gerogen an der Stiefing, welche einstmals die Grafen von Plain lehenweise besessen, und auch PO II. schenkt das Dorf Rasnitz bei Knittelfeld dem Bischof Ulrich von Seckau.", "beschenkte_institution_text": "Seckau, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "5.6.1253", "lokalitat_name": "Krems", "cs-verze": "PO II s manželkou Markétou Babenberskou předána Dietrichu z Hohenbergu (?) (Hohemberg) hrad Krummau am Kamp a Altpölle, Ramsau a Winkl jako léna. Tento dokument byl zapečetěn nejen PO II, ale i jeho manželkou Margaretou.", "kurzes_regest": "PO II. mit seine Gattin Margaret von Babenberg übergeben Dietrich von Hohenberg (?) (Hohemberg) die Burg Krummau am Kamp und Altpölle, Ramsau und Winkl als Lehen. Diese Urkunde besiegelte nicht nur PO II. sonder auch seine Gattin Margareta.", "beschenkte_institution_text": "Dietreich von Hohenberg", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko", "Datum": "Kurz vor 13.6.1253", "lokalitat_name": "???", "cs-verze": "Královna Markéta se rozhodne navštívit kláštery klarisek na Přemyslových panstvích, v té době alespoň kláštery klarisek v Praze a Judenburgu (severní Štýrsko) a požádá o to papeže Inocence IV.", "kurzes_regest": "Königin Margarete entscheidet die Klausuren der Klarissen in Ottokars Ländern zu besuchen, in dieser Zeit mindestens Klarissenklöster in Prag und Judenburg (Nordsteiermark) und bittet darum den Papst Innozenz IV.", "beschenkte_institution_text": "Praha, Klarissen in Franziskanerkloster, - Judenburg, Klarissenkloster", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko", "Datum": "(Zwischen November 1251 und circa 22.9.1253; möglicherweisum 20.1.1253 oder 5.6.1253)", "lokalitat_name": null, "cs-verze": "PO II s Titteln dux Austrie et Stirie, markýza Moravie dává klášteru Sancti Hippolyti St. Pölten různá práva, především svobodu před soudci z Tullnu a s Voigtamtem. PO II slíbil, že tento úřad nesvěří nikomu jinému a převzal klášter ve svém Schützu", "kurzes_regest": "PO II. mit den Titteln dux Austrie et Stirie, marchio Moravie gibt dem Kloster Sancti Hippolyti St. Pölten verschiedene Rechte, vor allem Freiheit vor den Richtern aus Tulln, und mit dem Voigtamt. PO II. versprach deises Amt keinem Anderen anvertrauen und übernimt das Kloster in seinem Schütz", "beschenkte_institution_text": "St. Pölten, Augustiner Chorrherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "25.6.1253", "lokalitat_name": "Olomouc", "cs-verze": "Maďarské a kummanské oddíly táhly do jižního Štýrska a na Moravu. Dne 25. června 1253 došlo k bitvě u Olomouce, v níž se moravští vojáci utopili v řece Moravě. Béla se pokusil oblehnout Olomouc. Velké škody na Rajhradě, Tišnově, Přerově Čejči.", "kurzes_regest": "Ungarische und Kummanische Truppen zogen nach Südsteiermark und Mähren. Am 25. Juni 1253 kam es Schlacht bei Olomouc, und mährische Soldatenhaben sind im Fluss Morava ertrunkt. Bela versuchte Olomouc belagern. Grosse schaden i nRajhrad, Tišnov, Přerov Čejč.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "1.7.1253", "lokalitat_name": null, "cs-verze": "Papež Inocenc IV. píše Václavu I. a žádá ho, aby zastavil válku mezi jeho synem Pádem II. a Bělou IV. a aby bratrovi zajistil Velascum poenitentiarium suum, menšinový mír. Papež také napsal tento dopis Občanské rodině II. a uherskému králi Bélovi IV.", "kurzes_regest": "Papst Innozenz IV schreibt an Wenzel I. und fordert ihn auf, damit der Krieg, der zwischen sein Sohn PO II. und Bela IV. ist, aufhört und deshalt sichikt er den Bruder Velascum poenitentiarium suum , Minoritum Frieden versichern. Dieses brief schrieb der Papst auch an dem PO II. und König Bela IV. von Ungarn", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "5.7.1253", "lokalitat_name": "Assisi", "cs-verze": "Papež Inocenc IV. přikazuje Po. II. a jeho manželce Markétě, aby augustiniánský klášter v Klosterneuburgu vrátili na hrad Kahlenberg a požádali je, aby požádali svého vazala Jindřicha z Lichtenštejna, aby vrátil obec Köllnbrunn augustiniánskému klášteru v Klosterneuburgu. Probošt (Konrád) tohoto augustiniánského kláštera se písemně modlil k papeži o pomoc a stěžoval si, že Občanská pobočka II. nezákonně obsadila jejich hrad Kahlenberg a Jindřich z Lichtenštejna obsadil vesnici Kollnbrunn.", "kurzes_regest": "Papst Innozenz IV. gebietet PO II. und seiner Gattin Margaretha um sie die Augustinianer- Stift in Klosterneuburg die Burg Kahlenberg zu restituieren und um sie ihren Vassalen Heinrich von Liechtenstein aufzufordern, damit er der Augustinianer-Stift in Klosterneuburg das Dorf Kollnbrunn restituiert. Der Probst (Konrad) dieses Augustinianer- Stifts hat den Papst um die Hilfe schriftlich gebetten und hat geklaget, dass PO II. unrechtlich ihre Burg Kahlenberg okkupiert hat, sowie Henrich von Liechtenstein das Dorf Kollnbrunn.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "13.7.1253", "lokalitat_name": "Brno", "cs-verze": "PO II předává kostel v obci Myslová premonstrátskému klášteru Geras.", "kurzes_regest": "PO II. übergibt dem Prämonstratenserstift Geras die Kirche im Dorf (Kostelní) Myslová als Besitz.", "beschenkte_institution_text": "Geras, Prämonstratenser-Chorherren-Stift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "5.8.1253", "lokalitat_name": "Olomouc", "cs-verze": "PO II udělil olomoucké nemocnici a jejímu \"Johanni procuratori hospitalis infirmorum\" patronátní právo nad farním kostelem Panny Marie v Olomouci na žádost olomouckého biskupa Bruna, Přemysla Otakarova notáře Viléma a Bočka a dalších", "kurzes_regest": "PO II.gab dem Spital in Olomouc (Olmütz) und dessen \"Johanni procuratori hospitalis infirmorum\" auf Bitte von Bischof Bruno von Olmutz, Ottokars Notar Wilhelm und Bočko und anderen das Patronatrecht der St.Maria-Pfarrkirche in Olomouc", "beschenkte_institution_text": "Olomouc, Spital", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "(um 5.8) 1253", "lokalitat_name": "Olomouc", "cs-verze": "Řád II. PO daroval ves Všksko (Wsische) v dědičné držbě (iure hereditario) olomoucké komoře Pardus se vším, co patří k dolní komoře a komornímu úřadu a darovacímu úřadu (omnibus attinentiis suis et hiis, que ad camerarium, ad subcamerarium et ad dapiferum pertinere noscebantur ibidem, iure hereditario eidem contulimus possidendam,)", "kurzes_regest": "PO II. gab in erblichen Besitz (iure hereditario) dem Olmützer Kammer Pardus das dorf Vskisko (Wsische) mitt Allem, was zum Unterkammer- und Kammer- und zum Schenkamt gehört (cum omnibus attinentiis suis et cum hiis, que ad camerarium, ad subcamerarium et ad dapiferum pertinere noscebantur ibidem, iure hereditario eidem contulimus possidendam,)", "beschenkte_institution_text": "Olomouc, Pardus Kammer", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "18.8.1253 (acta)", "lokalitat_name": null, "cs-verze": "PO II. dává Armenhausen St. Egidii v Pasově a jejich majetek v Hohenwartu osvobození a imunity, před jakoukoli výjimkou a osvobozuje tento dům od jeho soudců, které Fridrich II. Sporný předal chudobinci dne 15. června 1241.", "kurzes_regest": "PO II. übergibt Armenhausen St. Egidii in Passau und ihren Besitzen in Hohenwart Freiheiten und Imuniten, vor alem Exemption und er befreit dieses Haus von seinen Richter, die Friedrich II. Streitbare am 15 Juni 1241 dem Armenhaus übergab.", "beschenkte_institution_text": "Passau, Armenhaus St. Egidii", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "6.9.1253++", "lokalitat_name": "Praha", "cs-verze": "PO II \"iuvenis rex Boemorum dux Austrie et Stirie marionatusque Moravie gubernátor\" dal benediktinskému mnichu břevnovského kláštera a jeho opatovi Martinovi na jejich žádost povolení přemístit forum regium Provodov, které darovali Přemys Otakar I. a Václav I., do obce Police nad Metují v provinciea Gradcensi (Hradec Králové Königgr§atz) a zřídit zde fórum. PO II potvrzuje privilegia jeho děda PO I. a Václava I. nad těmito dary a dává k tomuto majetku svobody.", "kurzes_regest": "PO II. \"iuvenis rex Boemorum dux Austrie et Stirie marionatusque Moravie gubernator\" gab dem Benediktiner von Kloster Břevnov und dessen Abt Martin auf ihren Bitten na die Bewilligum um sie forum regium Provodov, die von Přemys Ottokar I. und Wenzel I. geschenkt wurden, in provinciea Gradcensi (Hradec Králové Königgr§atz) nach Ort Police nad Metují zu übetragen und hier forum zu errichten. PO II. bestätigt die Privilegien seines Grossvaters PO I. un Wenzel I. über diese Schenkungen und gegebene Freiheiten für dieses Besitz.", "beschenkte_institution_text": "Břevnov, Benediktinerkloster - Police nad Metují, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "17.9.12(5)3", "lokalitat_name": "Krems", "cs-verze": null, "kurzes_regest": "PO II. versprichtschrieb dem Papstlegaten Velasco auf der Seite der Kirch und deutsch-römischen König Wilhelm bleiben, Es. Versprach dem Valasco im Anwesenheit Bischof Konrad von Freising, Bischof Albert von Regensburg, Berthold von Passau, Bruder Fridrichch Minoritenvon Stein (guardiano fratrum Minorum de Stein); Bruder Meinhart Dominikaner in Krems (fratre Meinhartdo suppriore fratrum Predicatorum de Chrems).", "beschenkte_institution_text": "Papstlegat Velasco", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "20.9.1253", "lokalitat_name": "Kleinweikersdorf", "cs-verze": null, "kurzes_regest": "PO II. teilt dem Richter und den Mautern in Horn mit, daß das Kloster Zwettl dessen Bruder und Abt von aller Maut in Horn befreit ist.", "beschenkte_institution_text": "Zwettl, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko", "Datum": "circa 22.-29.9.1253", "lokalitat_name": null, "cs-verze": "Bavoři vpadli do Rakouska a Bella Uherská chtěla oblehnout město Vídeň. Bavorská vojska pochodovala přes St. Gallen do Uher. Bavorská vojska táhla do Horních Rakous, ale musela ustoupit", "kurzes_regest": "Bayern sind nach Österreich eingefallen und Bella von Ungarn die Stadt Wien belagern wollte. Bayerische Truppen Zogen durch sterierische Tallen nach Ungarn. Bayerische truppen zogen nach Oberösterreich, aber mussten sie sich zurückziehen", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko", "Datum": "(Die lezte Jahren Wenzels Regierung vor 22.9.1253++)", "lokalitat_name": null, "cs-verze": "Václav I. přikázal purkrabímu z Veveří Ratiboriovi, aby odehnal klášter v Doubrovníku, a zejména zdejšímu proboštovi Albertovi [z Mendlova] z \"tyranyde sinees\", bratru Emerammovi (de Mendlos) a jeho tchyni Semislovi [z Borkovic]. Probošt Albert si na to stěžuje u Wenzela.", "kurzes_regest": "Wenzel I. gebietet dem Burggraf von Veveří Ratiborio, um Kloster in Doubrovník und besonders den dortigen Probst Albert [von Mendlov] von \"tyranyde sinees Bruders Emerammus (de Mendlos) und dessen Schwiegermutter Semisla [von Borkovice] abzuwehren. Probst Albert beklaget sich daran bei Wenzel.", "beschenkte_institution_text": "Doubravník, Kloster; Ratibor Burggraf von Veveří.", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko", "Datum": "11.2.1251-22.9.1253", "lokalitat_name": null, "cs-verze": "PO II předal statek Wiesenfeld (Vuizevelt) Hermannu von Henneberg (Honbek). Tento dar potvrzuje i královna Markéta Babenberská. (Podle vzorce)", "kurzes_regest": "PO II. übergab dem Hermann von Henneberg (Honbek) den Hof Wiesenfeld (Vuizevelt). Diese Schenkung bestätigt auch die Königin Margareta von Babenberg. (Laut Formelstück)", "beschenkte_institution_text": "Hermann von Henneberg (Honbek), Beistzer des Hofes Hof Wiesenfeld", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko", "Datum": "11.2.1251-22.9.1253", "lokalitat_name": null, "cs-verze": "Král Václav a Pád II. jako rakouský vévoda darují Vilémovi Hustopečskému údolí údolí Gebolfovy údolí (vallis Gebolfi), řeku Svratku (ve skutečnosti pravděpodobně Dyji)", "kurzes_regest": "König Wenzel und PO II. als Herzog von Österreich erteilen dem Wilhem von Hustopeče den Tal des Gebolfstals (vallis Gebolfi), von Fluss Svratka (real wohl Dyje)", "beschenkte_institution_text": "Hustopeče, Wilhelm von", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "22.9.1253", "lokalitat_name": "Beroun", "cs-verze": "Václav I. zemřel, ale jeho smrt byla utajena a v dalším dokumentu PO II nebyl označen za vládce Čech", "kurzes_regest": "Wenzel I. ist gestorben, aber sein Todt ein Zeit geheimniss war un in der nächste Urkunde wurde PO II. nicht als Herrscher von Böhmen tituliert", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko", "Datum": "27.9.1253", "lokalitat_name": "Wien", "cs-verze": "PO II s Titteln dux Austrie et Stirie, markýza Moravie uděluje cisterciáckému opatství Aldersbach svobodu, aby mohlo svobodně prodávat potraviny (potraviny), které jsou v jejich vlastnictví v Rakousku, bez vodního mýta (naulo).", "kurzes_regest": "PO II. mit den Titteln dux Austrie et Stirie, marchio Moravie bewilligt dem Zisterzenserabtei Aldersbach die Freiheit, damit sie die Lebensmittel (victualia), die in ihren Besitzen in Österreich, ohne Wassermaut (naulo) frei aufführen können.", "beschenkte_institution_text": "Aldersbach, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "17.10.1253", "lokalitat_name": "Praha", "cs-verze": "Přemyslův slavnostní vjezd do Prahy.", "kurzes_regest": "Ottokars feierlicher Eingang in Prag.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "8.11.1253", "lokalitat_name": "Praha", "cs-verze": "Odp. II., poprvé jako heres et dominus regni Bohemiae, slíbil papežskému poslu minoritovi bratru Velascusovi, že bude pomáhat svaté církvi a římskému králi Vilémovi. A o této věci Ottokar ujišťuje papeže Innocence IV.", "kurzes_regest": "PO II., zum erstenmal als heres et dominus regni Bohemiae, versprach dem päpstlichen Boten Minoritenbruder Velascus, dass er der heiligen Kirche und dem römischen König Wilhelm helfen will. Und über diese Sache versichert Ottokar dem Papst Innocenc IV..", "beschenkte_institution_text": "Papst Innozenz IV.", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "14.11.1253", "lokalitat_name": "Praha", "cs-verze": "PO II. převzal vilémovský klášter pod svého protektora a osvobodil vilémovský klášter i se všemi jeho poddanými (subditos od všech výdajů.", "kurzes_regest": "PO II. nahm das Kloster Vilemov in seinen Schütz und befreit das Kloster Vilémov und alle seine Untertanen (subditos von allen Ausgaben.", "beschenkte_institution_text": "Vilémov, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "20.11.1253", "lokalitat_name": "Praha", "cs-verze": "PO II. vyjímá pražskou církev a ostatní církve od všech povinností obtěžování a potvrzuje všechna privilegia", "kurzes_regest": "PO II. Exemíert die Prager Kirche und andere Kirche von allen Pflichten vexationibus und alle Privilegien konfirmiert", "beschenkte_institution_text": "Praha, Domkapitel", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "20.11.1253", "lokalitat_name": "Praha", "cs-verze": "PO II potvrzuje vyšehradské církvi a ostatním církvím všechny svobody, imunity a privilegia.", "kurzes_regest": "PO II. bestättige der Wischehrader (Vyšehrader) Kirche und anderen Kirchen, alle Freiheiten, Imunitionen und Privilegien.", "beschenkte_institution_text": "Vyšehrad, Kapitel", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "20.11.1253", "lokalitat_name": "Praha", "cs-verze": "PO II potvrdil benediktinskému opatství v Břevnově a dalším církvím všechny svobody, imunity a privilegia.", "kurzes_regest": "PO II. bestättige der Benediktinerabtei in Břevnov und anderen Kirchen, alle Freiheiten, Imunitionen und Privilegien.", "beschenkte_institution_text": "Břevnov, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "20.11.1253", "lokalitat_name": "Praha", "cs-verze": "PO II, premonstrátský klášter na Strahově (Sion/Syon) a další církve potvrdily všechny svobody, imunity a privilegia.", "kurzes_regest": "PO II. bestättige der Premonstratenserstift in Strahov (Sion/Syon) und anderen Kirchen, alle Freiheiten, Imunitionen und Privilegien.", "beschenkte_institution_text": "Strahov, Prämonstratenserstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "20.11.1253", "lokalitat_name": "Praha", "cs-verze": "PO II potvrzuje benediktinskému opatství v Opatovicích zakládací privilegium krále Vratislava I. na žádost opatovického opata. PO II také žádá o potvrzení papežský stolec", "kurzes_regest": "PO II. konfirmiert der Benediktinerabtei in Opatovice das Gründungsprivilegium von dem König Vratislav I. auf der Bitte der Opatovicer Abt. PO II. bittet auch um die Bestätigung den päpstlichen Stuhl", "beschenkte_institution_text": "Opatovice, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "Zwischen 2-7.12.1253", "lokalitat_name": "Jablonné v Podještědí", "cs-verze": null, "kurzes_regest": "PO II. gibt den Bürger von Litoměřice/Leitmeritz und anderen, die im St. Stephan-Berg bei Litoměřice Ihre Wohnung bautem, für 7 Jahren Freiheit von Abgaben, und anderen Leuten, die zu diesem Ort rückzogen, gab PO II. vier Dörfer Hrušovany, Vrutice, Svářenice und Polepy laut der Ordnung und Teilung von Leopold Richter (Liutoldi iudici),Johannis de Myssena, Heinrich von Friedberg, sogennanter König (Henrici de Vridberch, qui Rex dicitur,)", "beschenkte_institution_text": "Litoměřice, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "wohl zwischen 20.11.1253 und.2-7.12.1253, oder zwischen 2-7.12.1253 und 17.12.1253", "lokalitat_name": "Bautzen", "cs-verze": null, "kurzes_regest": "PO II. war wahrscheinlich in Bautzenland, das in dieser Zeit dem Schwagerbruder Otto Markgraf von Brandenburg als Morgengut übergab, weill PO II. am Anfang Dezembers 1253 am böhmisch-bautzener Gränze in Jablonné bei Landestor an der Lausitzerweg war. (weiter siehe vorige Urk.)", "beschenkte_institution_text": "Otto Markgraf von Brandenburg", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "17.12.1253", "lokalitat_name": "Praha", "cs-verze": "PO II. předal hrad Halbenrein (Haldenrayn) svému písaři Vítkovi (Landesrchreiber ve Štýrsku) a svému bratru Rüdigerovi, kteří mohou tento hrad prodat, ale budou patřit na stranu Přemysla Ottokara", "kurzes_regest": "PO II. seinem Schreiber Witigo (Landesrchreiber in Steiermark) und seinem Bruder Rudiger die Burg Halbenrein (Haldenrayn) ganz übergab und sie können diese Burg verkaufen, aber wird zum Ottokars Seite gehören", "beschenkte_institution_text": "Witigo Steierische Landschreiber und Rudiger/Rüdiger (später von Halbenrein genannt)", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "26.12.1253", "lokalitat_name": "Kladruby", "cs-verze": "PO II potvrzuje konstituce svého otce Václava I. Pro špitál při kostele sv. Jakuba ve Stříbře, který založil měšťan Oldřich ze Stříbra ve vile cladrubiensis a poté byl přenesen do Stříbra, byla údajně tato nemocnice podřízena frfanciskému klášteru v Praze. PO II předává nemocnici obec Bítov a osvobozuje nemocnici od jejího úředníka.", "kurzes_regest": "PO II. bestätigt die Anordnung (constitutiones) seines Vaters Wenzels I. Für das Spital bei der St. Jakob-Kirche in Stříbro (Mies), das Bürger Ulrich von Střibro in villa cladrubiensis gegrüdnet hat und dan nach Stříbro übergegragen, Dieses Spital sollm dem Frfanziskanerkloster in Prag untergeworfen war PO II. übergibt dem Spital das Dorf Bítov (Bitkow) und befreit das Spital von seinem Beamter.", "beschenkte_institution_text": "Stříbro, Franziskaner Spital bei der St. Jakob-Kirche", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "26.12.1253", "lokalitat_name": "Kladruby", "cs-verze": "PO II potvrzuje premonstrátský klášter v Chotěšově jeho otce Václava I. Donace vesnic Červený Újezd, Zbůch.", "kurzes_regest": "PO II. bestätigt der Prämonstratenserinnen-Stift Chotěšov seines Vaters Wenzel I. Schenkung der Dörfer Červený Újezd, Zbůch.", "beschenkte_institution_text": "Chotěšov, Prämonstratenserinnenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země", "Datum": "25.1.1254", "lokalitat_name": null, "cs-verze": "PO II nechal Boreše z Rýzmberka uvěznit a držet ve vězení v Praze.", "kurzes_regest": "PO II. liess den Boreš von Riesenberg gefangnehmen und ihn in Gefängnis in Prag wachen.", "beschenkte_institution_text": "Boreš von Rýzmburk", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "3.3.1254", "lokalitat_name": "Krems", "cs-verze": "PO II. Potvrzuje darování kostela v Röhrenbachu klášteru Altenburg.", "kurzes_regest": "PO II. Bestätigt dem Kloster Altenburg die Schenkung der Kirche in Röhrenbach.", "beschenkte_institution_text": "Altenburg, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "4.3 125(4)", "lokalitat_name": "Krems", "cs-verze": "PO II prohlašuje, že na žádost tamních opatů bere klášter Mondsee pod svou zvláštní ochranu a uděluje mu osvobození od mýta, a proto nařizuje svému úředníkovi (ministerialium, mutatorium, judicum), aby tomuto právu nebránil.", "kurzes_regest": "PO II. erklärt, dass er das Kloster Mondsee auf der Bitte der dortigen Abbtes in seinem besonderen Schutz nimt und ihm Mautfreiheit erteilt, also gebietet er seinen Beamter (ministerialium,, mutatorium, judicum diesem Recht nicht hindern.", "beschenkte_institution_text": "Mondsee, Benediktinerkloster; Königsbeamter", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "31.3.1254", "lokalitat_name": "Wien", "cs-verze": "PO II. se souhlasem a vůlí své manželky Margarety převádí řečené služebnictvo zemřelého hraběte Albrechta z Visly a plně bezplatnou (nobili viri dicti) cenu, diecézi Freising, jako náhradu za škodu, kterou utrpěli Maďaři. Obdarovanými služebníky jsou: Alkerus de Reutenberch (Reutenberg/Čretež pri Kržkem), , Heinrich se svým bratrem de Werde (Verd u Vrhniky), Rudolfus de Nazenvelt (Nassenfeld/Dolenje Mokro Polje), Ulrich , Gotfridus, Markward et Wulfinus de Preisekke (Preisseck/Prežek), Judge Gebhard se svým bratrem von Gutenwerde, (Gutenwörth/Dobrava pri Škocjanu) t uviversis qui sunt de duabus parentalis, quorum qidam dicuntur Chauzer et quidam alii qui sunt de Preitenawe (Breitenau/Dvorec Zalog).  Margareta si tyto lidi ponechá v Kraňsku jako svou dědičku.", "kurzes_regest": "PO II. überträgt mit der Zustimmung und der Wille von seiner Gattin Margareta als Ersatz des von den Ungarn erlittenen Schaden die genannte Dienstleute des gestorebenen Grafen Albrecht von Weichselberg nd den Vollfreien (nobili viri dicti) Preis, das Bistum Freising. Die geschenkte Dienstleute sind: Alkerus de Reutenberch (Reutenberg/Čretež pri Kržkem), , Heinrich mit seinem Bruder de Werde (Verd bei Vrhnika), Rudolfus de Nazenvelt (Nassenfeld/Dolenje Mokro Polje), Ulrich , Gotfridus, Markward et Wulfinus de Preisekke (Preisseck/Prežek), Richter Gebhard mit seinem bruder von Gutenwerde ,(Gutenwörth/Dobrava pri Škocjanu) t uviversis qui sunt de duabus parentalis, quorum qidam dicuntur Chauzer et quidam alii qui sunt de Preitenawe (Breitenau/Dvorec Zalog). Diese Leute in Krain hält Margareta als Erbe.", "beschenkte_institution_text": "Freising, Bistum und Bischof Konrad", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "31.3.1254", "lokalitat_name": "Wien", "cs-verze": "Margareta, domina regni Bohemie ducisa Austrie et Styrie, se souhlasem a z vůle své manželky, má mutatis mutandis zcela totožné Urk. (jako dříve).", "kurzes_regest": "Margareta, domina regni Bohemie ducisa Austrie et Styrie, mit Zustimmung und von der Wille ihres Gattin hat mutatis mutandis vollkommen gleich lautende Urk. (als vorige) ausgestellt.", "beschenkte_institution_text": "Freising, Bistum und Bischof Konrad", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "31.3.1254", "lokalitat_name": "Wien", "cs-verze": "PO II oznamuje služebníkům Alkero de Revtenberch (Reutenberg/Čretež pri Kržkem), Heinrico et fratri suo de Werd (Verd near Vrhnika), Rudolfo de Nazzenvelt (Nassenfeld/Dolenje Mokro Polje), Vlrico, Gotfrido, Marquardo et Wlwingo de Presseke (Preisseck/Prežek), Gerhardo iudici et fratri suo de Gůtewerde (Gutenwörth/Dobrava pri Škocjanu) et illis singulis et uviversis qui sunt de duabus parentalis,  quorum qidam dicuntur Chauzer et quidam alii qui sunt de Preitenawe (Breitenau/Dvorec Zalog), které byly dříve podřízeny hraběti Albrechtovi z Weichselbergu a plné bezplatné (nobili viri dicti) ceně, kterou převedl na biskupství ve Freisingu.", "kurzes_regest": "PO II. verkündet den Dienstleuten Alkero de Revtenberch (Reutenberg/Čretež pri Kržkem), Heinrico et fratri suo de Werd (Verd bei Vrhnika), Rudolfo de Nazzenvelt (Nassenfeld/Dolenje Mokro Polje), Vlrico, Gotfrido, Marquardo et Wlwingo de Presseke (Preisseck/Prežek), Gerhardo iudici et fratri suo de Gůtewerde (Gutenwörth/Dobrava pri Škocjanu) et illis singulis et uviversis qui sunt de duabus parentalis, quorum qidam dicuntur Chauzer et quidam alii qui sunt de Preitenawe (Breitenau/Dvorec Zalog), diese alle ehemals der Untertanschaft zu Graf Albrecht von Weichselberg und den Vollfreien (nobili viri dicti) Preis, dass er sie an das Bistum Freising übertragen habe.", "beschenkte_institution_text": "Dienstleuten Alkero de Revtenberch (Reutenberg/Čretež pri Kržkem), Heinrico et fratri suo de Werd (Verd bei Vrhnika), Rudolfo de Nazzenvelt (Nassenfeld/Dolenje Mokro Polje), Vlrico, Gotfrido, Marquardo et Wlwingo de Presseke (Preisseck/Prežek), Gerhardo iudici et fratri suo de Gůtewerde (Gutenwörth/Dobrava pri Škocjanu) et illis singulis et uviversis qui sunt de duabus parentalis, quorum qidam dicuntur Chauzer et quidam alii qui sunt de Preitenawe (Breitenau/Dvorec Zalog), Konrad Bischof von Freising", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "3.4.1254", "lokalitat_name": "Buda", "cs-verze": "Arbitři uzavírají mír mezi Občanskou platformou II a uherským králem Bélou IV. Přemyšlovými rozhodčími byli: biskup Bruno z Olomouce, Vítek z Hradce/Jindřichova Hradce (de Noua Domo), Otto z Maissau (Otthone de Messo), Sirotek Kadolt (Kadoldo Orpano), Vicard/Wikard z Tyrny/Tirny (Wykardo de Terna). Přemysl se vzdal ve prospěch uhrů štýrska. Kromě Hrabství Pitten a Traungau.", "kurzes_regest": "Arbiter schliessen den Fried zwischen PO II. und König Bela IV. von Ungarn. Ottokars Arbiter waren: Bischof Bruno von Olomouc/Omütz, Vítek von Neuhaus/Hradce/Jindřichův Hradec (de Noua Domo), Otto von Maissau (Otthone de Messo), Kadolt der Waise/Sirotek (Kadoldo Orpano), Vikard/Wikard von Tyrna/Tirna (Wykardo de Terna). Přemysl se vzdal ve prospěch uhrů štýrska. Kromě Hrabství Pitten a Traungau.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "15.4.1254", "lokalitat_name": "Krems", "cs-verze": "PO II potvrzuje práva a mýta a další svobody kláštera sv. Floriána na žádost tamního probošta a přikazuje jeho soudcům a mýtním úředníkům, aby do těchto svobod nezasahovali.", "kurzes_regest": "PO II. bestätigt die Rechte und Maut- und andere Freiheiten des Stiftes St. Florian auf der Bitte des dortigen Probst, und gebietet seinen Richtern und Mautbeamter, diese Freiheiten nicht zu stören.", "beschenkte_institution_text": "St. Florian, Augustiner Chorrherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země", "Datum": "Nach 15.4.1254. Sicher vor 1.5.1254", "lokalitat_name": "Bratislava", "cs-verze": "Občanská konference a uherský král Běla IV. jednali v Bratislavě", "kurzes_regest": "PO II. und König Bela IV. von Ungarn verhandelten in Bratislava", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země", "Datum": "Zwischen Oktober 1253 - 1. Mai 1254", "lokalitat_name": null, "cs-verze": "PO II. dominus regni Bohemie, dux Austrie et Stirie, markýza Moravie oznamuje H. Voigtovi ve Welsu a H. zvanému Salzmair, že chce jako Voigt chránit klášter sv. Petra v Salcburku, a PO II. přikazuje H. a H., aby byli pomocníky a ochránci kláštera v lese Goza.", "kurzes_regest": "PO II. dominus regni Bohemie, dux Austrie et Stirie , marchio Moravie verkündet dem H. Voigt in Wels, und dem H. genanten Salzmair, dass er für dasl Kloster St. Petri in Salzburg als Voigt schützen will, und PO II. gebieten H. und H. , damit sie Hilfer und Beschützer des Kloster in Wald Goza sind.", "beschenkte_institution_text": "Salzburg, Benediktinerkloster St. Peter, Voigt in Wels, und dem H. genanten Salzmair", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země", "Datum": "1.5.1254", "lokalitat_name": "Wien", "cs-verze": "PO II, dominus regni Boemie, dux Austrie et Stirie, mar
