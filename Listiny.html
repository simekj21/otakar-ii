fa, norimberského purkrabího Fridricha Zollerna a odmítl požadavek na vydání svých pozemků", "kurzes_regest": "PO II. empfang in Wien den Bote des Königs Rudolfs, den Burggraf von Nürnberg Friedrich von Zollern und lehnt die Forderung zu Übergabe seiner Länder", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "kurz vor 15.8.1275", "lokalitat_name": "???", "cs-verze": "PO II velí svému kapitánovi v zemi nad Ensem (capitaneo Anasi) Purkard von Klingenberg/Zvíkov (von Janovic), takže nový dar Poppo von Grvnenpurch pro klášter Gleink umisťuje patronátní právo kostela v Haidershofenu, pod královský voigtei (regis aduocatia), jako je klášter.", "kurzes_regest": "PO II. gebietet seinem Hauptman in der Land ob der Ens (capitaneo Anasi) Purkard von Klingenberg/Zvíkov (von Janovic), damit die neue von Poppo von Grvnenpurch durchgeführte Schenkung für das Kloster Gleink, das Patronatsrecht der Kirche in Haidershofen, unter der Königs Voigtei (regis aduocatia), wie das Kloster ist, stellt.", "beschenkte_institution_text": "Gleink, Benediktinerkloster", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "8/30/(1975)", "lokalitat_name": "Veveří", "cs-verze": "II. PO nařizuje Milotovi z Dědic, aby platil klášteru Rein 50 marek stříbra ročně z příjmů ze soli.", "kurzes_regest": "PO II befehlt Milota von Dědice, dem Kloster Rein jährlich 50 Mark Silber aus Salzeinkommen zu zahlen.", "beschenkte_institution_text": "Rein, Zisterzienserkloster - Hauptmann in Steiermark Milota von Dědice", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 158457600000, "lokalitat_name": "Kenenhicz", "cs-verze": null, "kurzes_regest": "PO II erneuert die Rechte der Bürger von Glubczycze", "beschenkte_institution_text": "Glubczycze, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 187315200000, "lokalitat_name": "Kamýk nad Vltavou", "cs-verze": null, "kurzes_regest": "PO II erneuert dem Kloster Waldsassen die von sinem Vater erteilten Privilegien", "beschenkte_institution_text": "Waldsassen, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "9/30/1975", "lokalitat_name": "Brno", "cs-verze": null, "kurzes_regest": "PO II erteilt Eberhard und ... die Münzprägung in Jihlava", "beschenkte_institution_text": "Jaroš Sohn des Münzmeisters Eberhard - Hartmud aus aus Jihlava/Iglau Eberhard. Die Münzstätte in Jihlava", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "kurz vor 3.11.1275", "lokalitat_name": "???", "cs-verze": "PO II pověřuje Zašita z Kurovic rozhodcem ve sporu mezi budišským proboštem Klášterního Hradiska a občany města Olomouce o majetek Hejčín a hospody v obcích Náklo a Lašťany. PO II poslal Zašita k občanům Olmcu, aby tyto statky převedli na klášter Klašterní Hradisko a určili hranice obce Bystrovany", "kurzes_regest": "PO II. delegiert den Zašit von Kurovice als Schiedrichter ind der Streit zwischen Budiš Probst von Klášterní Hradisko und Bürger der Stadt Olomouc/Olmütz über Besitze Hejčín, und Kneipen in Dörfern Náklo, und Lašťany. PO II. schicke den Zašit zu den Olmtzer Bürger um diese Güter dem Stift Klašterní Hradisko in das Besitz übergeben zu werden und die Grenze des Dorfes Bystrovany zu bestimmen", "beschenkte_institution_text": "Klášterní Hradisko, Prämonstratenser-Chorherren-Stift; Olomouc, Stadt", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1266-vor 13.11.1275", "lokalitat_name": "???", "cs-verze": "PO II v reakci na stížnosti pasovského biskupa Petra nařizuje svému komorníkovi (ve Vídni) Otto von Hohenmarkt ve Vídni (de Foro), aby vrátil obilí zakoupené od pasovských občanů", "kurzes_regest": "PO II. gebietet auf Klagen des Bischofs Peter von Passau seinem Kammermeister (in Wien) Otto von Hohenmarkt in Wien (de Foro) um Rückerstattung des abgenommenen Getreides den Passauer Bürgern", "beschenkte_institution_text": "Ottokars Kammermeister (in Wien) Otto von Hohenmarkt in Wien", "poII_aussteller": "M", "verfalscht": "aus Formelstück"}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Vor 11.12.1275", "lokalitat_name": "???", "cs-verze": "Pád II drží Heinricha von Kuenring-Weitra s novým úřadem hejtmana Rakouska (tj. stále vládou jako ve Štýrsku a Korutanech).", "kurzes_regest": "PO II. bekleidet den Heinrich von Kuenring-Weitra mit dem neuen Amt des Hauptmanns Österreichs, (also Still der Regierung als in Steiermark und Kärnten).", "beschenkte_institution_text": "Heinrich von Kuenring-Weitra", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "kurz vor 11.12.1275", "lokalitat_name": "???", "cs-verze": "PO II (pravděpodobně z Čech nebo Moravy) pověřil svého okresního soudce Rakouska Otto von Haslau, aby vyřešil spor mezi Německým domem ve Vídni a Elblin von Arberg z důvodu desátku z Gumpoldskirchenu.", "kurzes_regest": "PO II. vertraut (wohl aus Böhmen oder Mähren) seinem Landrichter von Österreich Otto von Haslau den Streit zuschlichten, der wegen der Gumpoldskirchner Zehnte zwischen dem Deutschen Haus in Wien und Elblin von Arberg.", "beschenkte_institution_text": "Deutschorden in Wien - Elblin von Arberg. - Landrichter von Österreich Otto von Haslau", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "kurz vor 19.12.1275", "lokalitat_name": "Praha", "cs-verze": "PO II byl v Praze a v jeho přítomnosti Bohuslav, syn zemřelého Sulislava z Trnovan, porovnával svého otce Sulislava s jeho bratry Sulislavem, Petrem a Závišem při přemyslovské přítomnosti při dělení dědictví.", "kurzes_regest": "PO II. war in Prag und bei seiner Anwesendheit verglich Bohuslav, Sohn des gestorbenen Sulislav´s von Trnovany bei der Ottokars Anwesendheit in der der Teilung des Erbes nach dem Vater Sulislav mit seinem Brüdern Sulislav, Peter und Záviš.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "12/19/1975", "lokalitat_name": "Křivoklát", "cs-verze": "PO II potvrzuje, že Bohuslav, syn Sulislava z Trnovan, si domluvil setkání se svými bratry.", "kurzes_regest": "PO II bestätigt, das Bohuslav, sohn des Sulislav´s von Trnovany, sich mit seinen Brüdern verabredet hat.", "beschenkte_institution_text": "Bohuslav, sohn des Sulislav´s von Trnovany", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "vor 25.12.1275", "lokalitat_name": "???", "cs-verze": "PO II nařizuje svému okresnímu soudci v Rakousku, Otto von Haslau, aby rozhodl ve prospěch opatství Svatého Kříže spor mezi klášterem Heiligenkreuz a Mazellinovými syny o léno ve Winden am See (v západním Maďarsku okupovaném PO II).", "kurzes_regest": "PO II. gebietet seinem Landrichter in Österreich Otto von Haslau den Streit zwischen dem Kloster Heiligenkreuz und Söhne Mazellin's über das Lehen in Winden am See (in von PO II. besetzen Westungarn)‚ zu Gunsten der Abbtei heiligen Kreuz zu entscheiden.", "beschenkte_institution_text": "Heiligenkreuz, Zisterzienserkloster; Söhne Mazellin's - Landrichter in Österreich Otto von Haslau", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "30. 12. 1971, 1272, oder 1275", "lokalitat_name": "Praha", "cs-verze": "PO II rozhoduje, že žádný františkán nemá platit clo, když jde do Rakouska z českých zemí nebo naopak.", "kurzes_regest": "PO II entscheidet, das kein Franziskaner, wenn er aus den Böhmischen Ländern nach Österreich geht oder umgekehrt, das Zoll bezahlen sollte.", "beschenkte_institution_text": "Praha, St. Franciskus-Spital in Prag; Franziskaner/?? Brüder mit dem (roten) Stern", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 1275, "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. verheiratet seine Tochter Elisabet mit dem Heinrich V. dem Jüngeren von Kuenring und Weitra, den PO II. mit dem Amt Hauptmann Österreichs bekleidet.", "beschenkte_institution_text": "Heinrich V. der Jüngere von Kuenring und Weitra.", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "um 1275", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. lies den Bürger von Krems Gozzo mit seinem Verwandten (bis 1277) inhaftieren", "beschenkte_institution_text": "Gozzo Bürger in Krems an der Donau", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Jahren 1275- 1276", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. besorgt die Befestigung der Stadt Wien, und liess den Wiener Burg (Hofburg) bauen,", "beschenkte_institution_text": "Wien", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Jahren 1275-1276", "lokalitat_name": "???", "cs-verze": "PO II rozmístil svou věrnou posádku na rakouských hradech a městech a vzal rukojmí z rakouských měst (také z Vídně).", "kurzes_regest": "PO II. setzte seine treue Besatzung in den österreichischen Burgen und Städte und nimmt aus den österreichischen Städten die Geisel (auch aus Wien).", "beschenkte_institution_text": null, "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Jahren 1275-1276", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II nimmt aus der Stadt Sopron und am wahrscheinlichsten auch aus anderen besetzten westungarischen Städte die Geisel.", "beschenkte_institution_text": "Sopron", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Vor 6.1.1276", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. bewilligt dem Spital am Semmering und dem dortigen Rektor Wernhard unter anderen seines Hauses in Wien dem österreichischen Landschreiber und Kammergrafen Magister Konrad zu verkaufen.", "beschenkte_institution_text": "Spital am Semmering, Spital - österreichischer Landschreiber und Kammergrafen Magister Konrad", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "8.2.1276 (nicht ganz ausgeschlossen 1277)", "lokalitat_name": "Praha", "cs-verze": "PO II obnovil privilegia udělená tepelskému klášteru jeho otcem", "kurzes_regest": "PO II erneurte die dem Kloster Teplá von seinem Vater erteilten Privilegien", "beschenkte_institution_text": "Teplá, Prämonstratenser-Chorherren-Stift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "2/25/1976", "lokalitat_name": "Praha", "cs-verze": "PO II dává Theodericu von Gurkovi práva na hrad Anderburg.", "kurzes_regest": "PO II gibt Theoderic von Gurk die Rechte in Burg Anderburg.", "beschenkte_institution_text": "Gurk, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "3/13/1976", "lokalitat_name": "Praha", "cs-verze": "PO II obnovil privilegia udělená doksanskému klášteru svým otcem", "kurzes_regest": "PO II erneurte die dem Kloster Doksany von seinem Vater erteilten Privilegien", "beschenkte_institution_text": "Doksany, Zisterzienserinnenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "3/13/1976", "lokalitat_name": "Praha", "cs-verze": "PO II obnovil privilegia udělená doksanskému klášteru jeho dědečkem", "kurzes_regest": "PO II erneurte die dem Kloster Doksany von seinem Grosvater erteilten Privilegien", "beschenkte_institution_text": "Doksany, Zisterzienserinnenkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "3/15/1976", "lokalitat_name": "Praha", "cs-verze": "PO II zakazuje svým zástupcům rušit Klosters Vilémov.", "kurzes_regest": "PO II verbietet seinen Beuaftragten, Klosters Vilémov zu stören.", "beschenkte_institution_text": "Vilémov, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "wohl Anfang des Jahres 1276, vor 28.4.1276, nicht ganz ausgeschlossen nach 9.7.- vor 6.10.", "lokalitat_name": "Praha", "cs-verze": "PO II. povolal do Prahy vídeňské měšťany a \"milites\", aby krále ujistil o věrnosti města Vídně. Paltram před hřbitovem (před Freithofem) a jeho synovec, radní Vatz u Otakara na Otakarovu žádost, přijeli do Prahy s početným doprovodem. Paltram má pravděpodobně slíbit loajalitu prostřednictvím dokumentu, jak ukazuje kus vzorce.", "kurzes_regest": "PO II. lud die Wiener Bürger und \"milites\", nach Prag vor, m sie dem König die Treue der Stadt Wien zu versichern. Nach Prag kamen vor allem Paltram vor dem Friedhof (vor dem Freithof) und und dessen Neffe, der Rat Vatz u auf Wunsch Otakars mit einem großen Gefolge. Paltram sollwohl durch die Urkunde die Treue versprechen, wie ein Formelstückt zeigt.", "beschenkte_institution_text": "Wien", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "2.4.1276, oder auch möglich 1275", "lokalitat_name": "Poděbrady", "cs-verze": "PO II zakazuje kastelánům zasahovat do veškerého obchodu na Dunaji a na Dunaji a odkazuje je na žalobu u rakouského župního písaře Conrada s jakýmikoli nároky.", "kurzes_regest": "PO II. verbietet den Kastellanen alle Belästigung des Handelsverkehres an und auf der Donau und verweist sie mit allfälligen Ansprüchen auf den Rechtsweg vor dem österreichischen Landschreiber Konrad.", "beschenkte_institution_text": "Kastellanen in Burgen bei Donau", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "4/28/1976", "lokalitat_name": "Brno", "cs-verze": "PO II potvrzuje rozhodnutí ve sporu mezi klášterem Hradisko a občany Olomouce.", "kurzes_regest": "PO II bestätigt die Entscheidung im Streit zwischen dem Kloster Hradisko and den Bürgern von Olomouc.", "beschenkte_institution_text": "Klášterní Hradisko, Prämonstratenser-Chorherren-Stift, Stadt Olomouc", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "April oder kurz danach 1276", "lokalitat_name": "???", "cs-verze": "Ve dnech 28.3., 14.14 a 30.4.1276 byla Vídeň zasažena ničivými požáry města. Král Přemysl Otakar podporoval dlouho trpící město, udělil clo a osvobození od cla na pět let, zakázal řemeslnické spolky — s výjimkou členů domácnosti Münzerových — aby všichni Vídeňané mohli v uvedeném období požívat určité svobody obchodu, dal měšťanům les a konečně jim udělil právo pořádat trh, který měl trvat čtyři týdny.", "kurzes_regest": "In den Tagen 28.3., 14. und 30. 4.1276 wurde Wien von verheerenden Stadtbränden heimgesucht. König Ottokar unterstützte die leidgeprüfte Stadt, er gewährte für fünf Jahre Abgaben und Zollfreiheit, verbot die Einungen von Handwerkern — die Münzer Hausgenossen ausgenommen —, so daß allen Wienern in dem genannten Zeitraum eine gewisse Handelsfreiheit zugute kommen sollte, schenkte den Bürgern einen Wald und verlieh ihnen schließlich das Recht eines Jahrmarkts, der jeweils vier Wochen dauern sollte.", "beschenkte_institution_text": "Wien", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 189648000000, "lokalitat_name": "Brno", "cs-verze": "PO II osvobozuje statky diecéze Freising od marichfuteru.", "kurzes_regest": "PO II befreit die Güter des Bistum Freising von marichfuter.", "beschenkte_institution_text": "Freising, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 189648000000, "lokalitat_name": "Brno", "cs-verze": null, "kurzes_regest": "PO II ernannte Magister Heinirucs, Propst in Werden, dem Verweser der Güter der Freisinger Kirche.", "beschenkte_institution_text": "Bistum Freising - Probste Heinrich von Maria Wörth", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 194832000000, "lokalitat_name": "Brno", "cs-verze": null, "kurzes_regest": "PO II ordnet Milota von Dědice an, den Urteil im Streit zwischen Heinrich von Massenberg und Ortolf, Probst in Seckau zu respektieren.", "beschenkte_institution_text": "Seckau, Propstei; Heinrich von Massenburg", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1262- um 3.5.1276", "lokalitat_name": "Brno", "cs-verze": "PO II nařizuje svému \"granatorovi\" - správci sýpek (v Rakousku), aby přijel do Brna bezprostředně před ním k předložení účtů", "kurzes_regest": "PO II. gebietet seinem \"granator\" - Verwalter der Speicher (in Österreich ), unverzüglich vor ihn nach Brünn zur Rechnungslegung zu kommen", "beschenkte_institution_text": "Verwalter der Speicher (in Österreich)", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "5/27/1976", "lokalitat_name": "Znojmo", "cs-verze": "PO II potvrzuje dar katedrále v Olomouci", "kurzes_regest": "PO II bestätigt die Schenkung an die Kathedrale in Olomouc", "beschenkte_institution_text": "Olomouc, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "5/28/1976", "lokalitat_name": "Znojmo", "cs-verze": "PO II přiznává obecnímu rozhodci právo rozhodovat v bezprostřední blízkosti,", "kurzes_regest": "PO II erteilt dem städtische Geschiedsricht das Recht, in nahligendem Umgebung,", "beschenkte_institution_text": "Brno, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "5/31/1976", "lokalitat_name": "Znojmo", "cs-verze": null, "kurzes_regest": "PO II ordnet seinen Beamten an, die Privilegien des Klosters Klosterneuburg zu respektieren.", "beschenkte_institution_text": "Klosterneuburg, Augustiner-Chorherrenstift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 192412800000, "lokalitat_name": "Znojmo", "cs-verze": "PO II potvrzuje nákup zboží od biskupa Konráda z Freisingu", "kurzes_regest": "PO II bestätigt Ankauf von Gütern bei dem Bischof Konrad von Freising", "beschenkte_institution_text": "Freising, Bistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 194918400000, "lokalitat_name": "Znojmo", "cs-verze": "PO II dává arcidiecézi Salcburk dcery Eccarda z Dobrenje.", "kurzes_regest": "PO II schenkt dem Erzbistum Salzburg die Töchter Eccards der Dobrenje.", "beschenkte_institution_text": "Salzburg, Erzbistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 194918400000, "lokalitat_name": "Znojmo", "cs-verze": "PO II daruje arcibiskupství salcburskému syna Nikolause von Stadow.", "kurzes_regest": "PO II schenkt dem Erzbistum Salzburg dem Sohn Nikolaus von stadow.", "beschenkte_institution_text": "Salzburg, Erzbistum", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 194918400000, "lokalitat_name": "Znojmo", "cs-verze": "PO II nařizuje Burchardovi von Zvíkov, jeho hejtmanovi v Horních Rakousích, aby nerušil dům salcburské kapituly v Linci.", "kurzes_regest": "PO II ordnet Burchard von Zvíkov, seinem Hauptman in Oberösterreich, das Haus des Salzburger Kapitels in Linz nicht zu stören.", "beschenkte_institution_text": "Salzburg, Domkapitel -Engelbert Skolar aus Linz - Purkard von Klingenberg, Hauptmann in Oberösterreich", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 202867200000, "lokalitat_name": "Přištpo", "cs-verze": "PO II dává svobodu klášteru Nová Říše", "kurzes_regest": "PO II erteilt die Freiheiten dem Kloster Nová Říše", "beschenkte_institution_text": "Nová Říše, Prämonstratenser-Chorherren-Stift", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Juny 1276", "lokalitat_name": "???", "cs-verze": "Arcibiskup Fridrich Salcburský prohlašuje všechny přísahy složené proti králi Přemyslu Otakarovi proti říši za přísahy proti Bohu a spravedlnosti a za vynucené a neplatné, každého z nich osvobozuje a přikazuje jim vrátit se na cestu pravdy (srov. MHDC č. 210, s. 139", "kurzes_regest": "Erzbischof Friedrich von Salzburg erklärt alle König Ottokar geleisteten gegen das Reich gerichteten Eide als wider Gott und Recht und als erzwungen und ungültig, entbindet jedermann davon und gebietet, auf den Weg der Wahrheit zurückkehren (vgl MHDC Nr. 210, s. 139", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 205545600000, "lokalitat_name": "Freistadt", "cs-verze": "PO II osvobozuje od daní nádvoří kláštera Baumgartenberg.", "kurzes_regest": "PO II befreit das Hof des Klosters Baumgartenberg von Abgaben.", "beschenkte_institution_text": "Baumgartenberg, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 205545600000, "lokalitat_name": "Freistadt", "cs-verze": "PO II osvobozuje od daní nádvoří kláštera Baumgartenberg.", "kurzes_regest": "PO II befreit das Hof des Klosters Baumgartenberg von Abgaben.", "beschenkte_institution_text": "Baumgartenberg, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "8.7.1276", "lokalitat_name": "Freistadt", "cs-verze": "PO II uděluje privilegia klášteru Gleink.", "kurzes_regest": "PO II gibt dem Kloster Gleink die Privilegien.", "beschenkte_institution_text": "Gleink, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "July 1276", "lokalitat_name": "???", "cs-verze": "PO II velí svému vojsku v opatství Teplá v jihozápadních Čechách, protože Rudolf shromažďuje své vojsko u Nürenberggu v červenci 1276.", "kurzes_regest": "PO II. gebietet seine Truppen bei Kloster Tepla in Südwestböhmen, weil Rudolf in July 1276 bei Nürenbergg seine Truppen versammelt.", "beschenkte_institution_text": "Teplá, Prämonstratenser-Chorherren-Stift", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 192585600000, "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II nimmt das Kloster S. Katharina in Stainz in seinem Schutz.", "beschenkte_institution_text": "Stainz, Augustiner-Chorherrenstift S. Katharina", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "8/26/(1976)", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II ordnet dem Abt in Kremsmünster, die Zehent Garsten von solchen Leuten sammeln zu lassen, die das Spital nicht beschädigen werden.", "beschenkte_institution_text": "Spital am Pyhrn, Kolegiatstift/Chorherrenstift Spital", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "8/30/1976", "lokalitat_name": "Praha", "cs-verze": "PO II daruje nemocnici ve Spital am Pyhrn", "kurzes_regest": "PO II beschenkt Spital in Spital am Pyhrn", "beschenkte_institution_text": "Spital am Pyhrn, Kolegiatstift/Chorherrenstift Spital", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Länger vor 1.9.1276 (sicher nach 1.9.1275)", "lokalitat_name": "???", "cs-verze": "PO II přikazuje Purchardovi z Klingenbergu/Zvíkova (pozdějšímu Janovicovi), aby jako soudce rozhodl spor mezi klášterem Admont a zdejším opatem Heinrichem na jedné straně a Truchsassenem von Dobrach, Dietrichem a jeho bratry, nebo jejich otcem Dietrichem z Dobrachu na straně druhé o panství sv. Petra v Au-Marktu.", "kurzes_regest": "PO II. gebietet dem Purchard von Klingenberg/Zvíkov (später Janovic) um als Richter den Streit zwischen dem Kloster Admont und dem dortigen Abt Heinrich auf einer Seite und Truchsassen von Dobrach, Dietrich und seinen Brudern, bzw ihren noch ihren Vater Dietrich von Dobrach auf anderer Seite über das Gut St. Peter in der Au-Markt zu entscheiden.", "beschenkte_institution_text": "Admont, Benediktinerkloster, Dietriech Schenk von Dobra und seine Familie", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Ende Augusts September 1276", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "Beginn der tatsächlichen Feldzuges gegen Ottokar. Burggraf Friedrich von Nünberg versucht die Besetzung des Egerlandes, um den geplanten Angriff des Hauptheeres unter Rudolf und dem Pfalzgrafen Ludwig auf Böhmen selbst zu ermöglichen. Anderseits dringt Graf Meinhard von Tirol nach Kärnten ein, Graf Albert von Görz, unterstützt vonm Patriarchen vo Aquileja in der Windischen Mark und in Krain. Die böhmischen Hauptleute und Besatzungen räumen zumeinst kampflos die Plätze und ziehen sich nach Steiermark zurück. Vor allem, weil Ulrich von Heunburg und (wohl ehemaliger - sihe Tangl) Hauptmann Heinrich von Pfannberg ubergingnen, Sowie besetz auch Steiermark. sowie Steiermark und belagert Graz (aus welcher Hauptmann Milota geheim flog). OttokarsBurgen Offenberg, Kaiserberg, Neu Wildon , Eppenstein und andere sind gefallen. Hauptmann Milota von Dědice musste nach Norden ziehen un in seiner Macht noch Burgen in Ennstall bleiben.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 205718400000, "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II erteilt den Bürgern der Stadt Judenburg das Verkaufsmonopol.", "beschenkte_institution_text": "Judenburg, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1276 (nicht ganz ausgeschlossen 1275", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. delegiert den Burggraf in Litoměřice/Leitmeritz Lupus/Vlk (?) und Leitmeritzer Provinzrichter Poto von Mšené den Streit zwischen Probst Johann von Doksany und Probst Budislav von Mělník über Grenze ihrer Gütter bei Brozany nad Ohří zu enscheiden", "beschenkte_institution_text": "Doksany, Prämonstraterinnenstift; Mělník, Chorherrenstift; Burgraf und Provinzrichter in Litoměřice", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "19.9.1276", "lokalitat_name": "Rein", "cs-verze": "Šlechtici a ministeriálové ze Štýrska a Korutan v klášteře Rein vyhlásili mimo jiné vzpouru proti Přemyslu Otakarovi a věrnost králi Rudolfovi jako císařští vazalové. (Stejně jako biskup ze Seckau konvertuje k Rudolfovi - srov. UB Steiermark IV, č. 596, s. 354, č. 598355-356 - ale ve vydání datovaném Sommerem, ale v srpnu byl Seckau na přemyslovské straně)", "kurzes_regest": "Adeligen und Ministerialen aus Steiermark und Kärnten im Klostern Rein deklarieren unter Anderen den Aufstand gegen Ottokar und die Treue zu dem König Rudolf als Reichsvassalen. (Sowie auch Bischof von Seckau übertritt zum Rudolf - vgl. UB Steiermark IV, Nr. 596, S. 354, Nr. 598355-356 - aber in der Edition datiert in Sommer, aber in August war Seckau auf Ottokarsseite )", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "24.9.1276", "lokalitat_name": "???", "cs-verze": "Král Rudolf nařizuje hrabatům, šlechticům, ministeriálům a vazalům v Korutanech a Kraňsku, aby poslouchali svého vévodu Filipa, který jim odpouští, že byli odvedeni od své poslušnosti, pokud se nyní podvolí.", "kurzes_regest": "König Rudolf befiehlt den Grafen, Edlen, Ministerialen und Vasallen in Kärnten und Krain ihrem Herzog Philipp zu gehörchen, der ihnen verzeiht, dass sie von ihrem Gehorsam abgelenkt wurden, wenn sie sich nunmehr unterwerfen.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "vor 26.9.1274", "lokalitat_name": "???", "cs-verze": "PO II svěřuje zámek Neuburgg am Inn pánu z Tannbergu/Tannenbergu", "kurzes_regest": "PO II. vertraut den Burg Neuburgg am Inn dem Herren von Tannberg/Tannenberg", "beschenkte_institution_text": "Herr von Tannberg/Tannenberg", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "nach Dezember 1251- länger vor Herbst 1276", "lokalitat_name": "???", "cs-verze": "Pád II. předává markraběti Jindřichu IV. Mocnému míšeňsko-ostmarkovskému (Dolní Lužice a Dolní Lužice) město Sajda a hrad Purschenstein, který dříve patřil k Čechám, jako náhradu za jeho majetek a nároky v Rakousku.", "kurzes_regest": "PO II. übergibt dem Markgrafen Heinrich IV. dem Erlauchten von Meissen und Ostmark (Niederlausitz und Niederlausitz die Stadt Sayda und Burg Purschenstein, die zum Böhmen voher gehörten, als Ersatz für seine Besitze und Ansprüche in Österreich.", "beschenkte_institution_text": "Heinrich IV. dem Erlauchten von Meissen und Ostmark", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Zwischen November 1251-vor 26.9.1276", "lokalitat_name": "???", "cs-verze": "PO II daruje sousední ostrov \"fóru\" Trübensee, které patří pasovským biskupům, ve prospěch občanů Trübensee.", "kurzes_regest": "PO II. schenkt dem ,\"forum\" Trübensee, das dem Bischöfen von Passau gehört die nebenliegende Insel, zugunsten der Bürger in Trübensee.", "beschenkte_institution_text": "Trübensee Markt/Stadt", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "26.9.1276", "lokalitat_name": "???", "cs-verze": "Rudolf táhl proti proudu Dunaje a koncem září v Pasově a pasovský biskup obdržel od krále Rudolfa privilegia. Pasovský biskup se začal aktivně angažovat v konfliktu. Nejpozději v této době došlo ke kolizi (feudálních) povinností Záviše z Falkenštejna/Falkenštejna z Pasova a českého krále", "kurzes_regest": "Rudolf zog aufwärts Donau und am Ende Semptembers in Passau war und Bischof von Passau bekamn von dem König Rudolf die Privilegien. Bischof von Passau beginn in der Konflikt aktiv angagieren. Spätestens in dieser Zeit kam es zur Kollision der (Lehns)pflichten von Zaviš von Falkenstein/Falkenštejn zu Passau und zum König von Böhmen", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "zwischen um 1273- wohl vor 29.9.1276", "lokalitat_name": "???", "cs-verze": "PO II odebral Oldřichovi z Lobensteinu léno ve vesnici Ottenschlag v Mühlviertelu, které mu udělil rakouský vévoda Fridrich II. a které Oldřich držel více než 30 let.", "kurzes_regest": "PO II. entzog dem Ulrich von Lobenstein das Lehen im Dorf Ottenschlag in Mühlviertel, das Herzog Friedrich II. von Österreich ihm erteilt, und das Ulrich über 30 Jahren hielt.", "beschenkte_institution_text": "Ulrich von Lobenstein", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1262-September 1276", "lokalitat_name": "???", "cs-verze": "PO II nařizuje soudcům, soudcům a obcím města v Rakousku, aby si u sebe ponechali výrobce dobyvačných machiens (magistri machinarum) a nechali je vyrábět větší stroje až do jeho návratu do Rakouska", "kurzes_regest": "PO II. beauftragt Richter Richter und Gemeinder einer Stadt in Österreich die Macher der Eroberungsmachienn (magistri machinarum) bei sich zu behalten und sie grössere Maschinen anfertigen bis zu seiner Rückkehr nach Österreich zu lassen", "beschenkte_institution_text": null, "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Dezember 1251-September 1276", "lokalitat_name": "???", "cs-verze": "PO II předává benediktinskému klášteru v Prüfeningu a tamnímu opatovi daně kolem Kremže, tzv. \"Burgrecht\" pro veškerý majetek kláštera v Persenbeugu.", "kurzes_regest": "PO II. übergibt dem Benediktiner Kloster Prüfening ud dortigen Abt die Abgaben um Krems, genannten \"Burgrecht\" für alle Besitze des Kloster in Persenbeug.", "beschenkte_institution_text": "Prüfening, Benediktinerkloster", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach 30.8.1252 - September 1276", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. verleiht als Lehen dem Perchtold Preuhafen den Hof in Jägerberg bei Steyr", "beschenkte_institution_text": "Perchtold Preuhafen", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach 30.8.1252 - September 1276", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. vereihlt als Lehen dem Engelschalk den Hof in Ternberg (nw. Faulnbaum).", "beschenkte_institution_text": "Engelschalk", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "29.9. und 5.10.1276", "lokalitat_name": "Linz", "cs-verze": null, "kurzes_regest": "König Rudolf tritt am 29.9. Oberösterreich. ein und erobert am 5.10.1276 Linz, 15. 10 bei Ens, sowie Wels Zum Rudolf übergingen Gundakar von Stahremberg, Ulrich von Kapellen (Kapling) Konrad von Summerau.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "die Wende Septembers und Oktobers 1276", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. gebietet sienen Truppen im Südwestböhmen bei Tepla zu Drossendorf durch Södböhmen ziehen", "beschenkte_institution_text": null, "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "um 6.10.1276", "lokalitat_name": "Freistadt", "cs-verze": null, "kurzes_regest": "PO II. zog aus Böhmen zu Freistadt. Nach der Continuatio Vindobonensis, MGH SS IX, s. 708,", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": 203212800000, "lokalitat_name": "Freistadt", "cs-verze": "PO II dává Albertovi von Puchheim místo číšníka ve Valticích.", "kurzes_regest": "PO II gibt Albert von Puchheim die Position des Mundschenks in Valtice.", "beschenkte_institution_text": "Albert von Puchheim", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach 5.10.1276", "lokalitat_name": null, "cs-verze": "Rudolfova vojska bojovala u Ens a Ens, Trungau, Ybbs a Tulln byly předány Rudolfovi. Enns byl dán Rudolfovi Konradem von Summerau. Klosterneuburg (Neuburg ex parte claustri) také konvertuje k Rudolfovi. s nímž byl spojen biskup Bruno olomoucký.", "kurzes_regest": "Rudolfs Truppen kämpften bei Ens und Ens, Trungau, Ybbs und Tulln wurden dem Rudolf übergegeben. Enns wurde von Konrad von Summerau dem Rudolf ubergegeben. Zum Rudolf übertritt auch Klosterneuburg (Neuburg ex parte claustri). bei dem Bischof Bruno von Olomouc/Olmütz war.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Kurz nach 6.10.1276", "lokalitat_name": "Zwettl", "cs-verze": "PO II. táhl se svým vojskem (pravděpodobně jen s částí svého vojska) ke klášteru Zwettl a slíbil tamnímu opatovi Ebru zboží, pokud porazí krále Rudolfa. Opat Ebro přesvědčil krále svou prosbou, aby město Zwettl neničil. Je to pravděpodobně otázka ochrany před oloupenými vojáky. Nelze vyloučit ani rudolfínský odpor občanů Zwettlu. Přemyslovská vojska poškodila i klášterní majetek, což je pravděpodobně důvod, proč Př. Ó. slíbil klášteru náhradu.", "kurzes_regest": "PO II. zog mit seinem Truppen (wohl nur mit Teil seiner Truppen) zum Kloster Zwettl und versprach dem dortigen Abt Ebro die Gütter, wen er den König Rudolf besiegte. Abt Ebro überzeuge den König mit seinem Bitten um er die Stadt Zwettl nicht zu zerstören. Wohl handelt es sich um den Schutz vor plünderten Soldaten. Wir können nicht auschliessen, den rudolfinischer Widerstand der Zwettler Bürger. Ottokars Truppen beschädigten auch die klosterliche Gütter, deshalb PO II. wohl versprach dem Stift die Kompensation.", "beschenkte_institution_text": "Zwettl, Zisterzienserkloster", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Länger nach 6.10.1276", "lokalitat_name": "Drosendorf", "cs-verze": "PO II pochodoval ke svým jednotkám u Drossendorfu.", "kurzes_regest": "PO II. zog zu seinem Truppen bei Drossendorf.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Um die Mitte Oktobers und die zweite Hälfte von Oktober, bis zum Ende Novembers 1276", "lokalitat_name": "Korneuburg", "cs-verze": "PO II a jeho vojsko čekají v táborech na severním břehu Dunaje u Vídně. Podle Continuatio Vindobonensis, MGH SS IX, s. 708 v Ganserfeldu před Korneuburgem. Podle Continuatio Praedicatorum Vindobonensium, MGH SS IX, s. 730, byl v Marchuelde tábor severovýchodně od Vídně", "kurzes_regest": "PO II. und seine Truppen warten in Lagern auf Nordufer von Donau bei Wien. Nach Continuatio Vindobonensis, MGH SS IX, S. 708 in Ganserfeld vor Korneuburg. Nach Continuatio Praedicatorum Vindobonensium, MGH SS IX, S. 730 war ein Lager nordöstlich von Wien im Marchuelde", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach 7.9.1272- vor 18.10.1276", "lokalitat_name": "???", "cs-verze": "PO II uděluje Martinu Richerovi (Riccario) ze Štýrského Hradce dvě vinice v Rettenbachu u Grazu, z důvodu smrti pasovského děkana, magistra Ulricha von Nerting(en), na které PO II připadl", "kurzes_regest": "PO II. verleiht dem Martin Richer (Riccario) von Graz die zwei Weingärten zu Rettenbach bei Graz, durch den Tod des Passauer Dekan magister Ulrich von Nerting(en) an dem PO II. heimfielen", "beschenkte_institution_text": "Graz, Martin Richer (Riccario) von Graz", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Zwischen März 1260 -um 18.10.1276", "lokalitat_name": "???", "cs-verze": "PO II potvrzuje občanům Fürstenfeldu stejnou svobodu od mýta a cel v Rakousku a Štýrsku pro jejich obchodní zboží, jakou měli od dob vévody Leopolda VI.", "kurzes_regest": "PO II. bestätigt den Bürgern von Fürstenfeld für ihre Kaufmannswaren dieselbe Freiheit von Maut und Zoll in Österreich und Steiermark, wie sie selbe seit Herzog Leopold VI. hatten.", "beschenkte_institution_text": "Fürstenfeld", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Zwischen März 1260 -um 18.10.1276, möglicherweise schon 1252-1254", "lokalitat_name": "???", "cs-verze": "Druhý bod Občanské unie uděluje synovi Gottschalka von Baumkirchen léno Weißkirchen ve Štýrsku (u Judenburgu)", "kurzes_regest": "PO II. verleiht dem Sohn des Gottschalks von Baumkirchen das Lehen bei Weißkirchen in Steiermark (bei Judenburg)", "beschenkte_institution_text": "Sohn des Gottschalk von Baumkirchen", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "1270-vor 18.10.1276", "lokalitat_name": "???", "cs-verze": "PO II nařizuje nejmenované osobě, aby žádným způsobem neobtěžovala bratra svého bývalého úředníka Sidlina kvůli Sidlinově vině a aby mu odškodnila za víno, které mu bylo odebráno", "kurzes_regest": "PO II. gebietet einem Ungenannten, den H. Bruder seines ehemaligen Ladschreibers Sidlin wegen einer Schuld des Sidlins in keinerlei Weise zu belästigen und ihm fortgenomennen Wein zu ersetzen", "beschenkte_institution_text": "H. Bruder seines ehemaligen Ladschreibers Sidlin", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach 2.6.1276 vor 18. Oktober 1276 (nicht ganz ausgeslchossen vor April 1277)", "lokalitat_name": "???", "cs-verze": "Pád II. obsazuje (nezákonně - preter iusticiam)\" vesnice Probstdorf, Urfar a Schönau biskupa Konráda II. z Freisingu v Marchfeldu, které biskupové Konrád I. (1230-1258) a Konrád II. z Freisingu (1258-1279) dříve drželi jako državy.", "kurzes_regest": "PO II. besetzt (unrechtlich - preter iusticiam)\" die Dörfer Probstdorf, Urfar und Schönau des Bischofs Konrad II. von Freising , im Marchfeld, die Bischöfe Konrad I. (1230-1258) und Konrad II von Freising (1258-1279) früher als Besitz hielten.", "beschenkte_institution_text": "Freising, Bistum", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach Dezember 1251-vor 18.10.1276", "lokalitat_name": "???", "cs-verze": "PO II předán templářskému řádu na rakouských statcích ve Schwechat a v Rauchenwarthu.", "kurzes_regest": "PO II. übergab dem Templerorden in Österreich Güter in Schwechat und in Rauchenwarth.", "beschenkte_institution_text": "Templerorden in Österreich", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach 25.12.1261 vor 18. Oktober 1276.", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. gebietet die Untusuchungeines an dem Juden Suezlin Sohn des Leublins begangenen Diebstahls und danchach dankt einem Richter und einer Stadtgemeinde in Österreich für den Eifer bei dieser Untesuchung und ersucht um weitere Verfolgung der Sache", "beschenkte_institution_text": "Ein Stadt in Österreich, Jude Suezlin", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Nach 1268 - vor Oktober 1276/bzw. Sommer 1277", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. schenkt der Stadt Marchegg das Dorf \"Chundorf\" (abgekommen, einst an der March unterhalb Zwerndorf, bei Marchegg gellegen)", "beschenkte_institution_text": "Marchegg, Stadt", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "von Anfang 1275 bis Oktober 1276", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. gebietet eiem Ritter , die dem Kämmerer (Konrad) von Tulln verlheihenen Güter in Bellreis und Stammersdorf dessen Schwiegersohn Gottfried zu übergeben", "beschenkte_institution_text": "Kämmerer (Konrad) von Tulln", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 4.0, "Periode": "Rakousko, české země, Štýrsko, Korutany", "Datum": "Um 1275, vor 18.10.1276", "lokalitat_name": "???", "cs-verze": "PO II uděluje Gütterovi určité statky Dietrichu von Fulm/Fülme, purkrabímu z Offenburgu, které otec, bratři a přátelé Dietrichovy manželky již dříve předali králi Přemyslu Otakarovi.", "kurzes_regest": "PO II. erteilt Gütter dem Dietrich von Fulm/Fülme, Burggraf von Offenburg bestimmte Güter, die der Vater, die Bruder und Freunde der Dietrichs Gattin vorher dem König Ottokar übergaben.", "beschenkte_institution_text": "Dietrich von (Fulm/FülmeBurggraf auf Offenburg", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": null, "Periode": "České země", "Datum": "18.10.1276", "lokalitat_name": "???", "cs-verze": "Dne 18.10 byl Rudolf u Vídně a začal město obléhat po dobu pěti týdnů. Uherský král Ladislav Uherský táhl z východu do jižního Dolního Rakouska. Občanská zóna II byla oddělena od pozdějších mocenských bodů jižně od Dunaje. PO II nemohla pomoci ani obleženému městu Vídni.", "kurzes_regest": "Am 18.10 war Rudolf bei Wien und beginn die Stadt für fünf wochen belagern. König Ladislav von Ungarn zog na südlichen Niederösterreich von Ost. PO II. war von den lezten sienen Machtpunkten südlich von Donau abgeteilt. PO II. konnte nicht auch den belagerten Stadt Wien helfen.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "České země", "Datum": "Wohl im Oktober und November 1276", "lokalitat_name": "???", "cs-verze": "Witigonen a Boreš z Rýzmburka pravděpodobně zradili krále v době jeho velké nouze a loupení, proti králi povstal i jejich přítel Boreš z Rýzmburka.", "kurzes_regest": "Witigonen und Boreš von Rýzmburk verräten den König wohl in der Zeit seiner grossen Bedürfniss und plünderten und auch ihr Freund Boreš von Riesenburg/Rýzmburg stand gegen König auf.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "České země", "Datum": "wohl Oktober, November", "lokalitat_name": "???", "cs-verze": "Druhý Pád II. ztratil západní Maďarsko jižně od Dunaje (severně od Dunaje stále zůstával v jeho moci). Uherský král Ladislav zvítězil v Šoproni.", "kurzes_regest": "PO II. verlor Westungarn südlich von der Donau (nordlich von Donau blieb noch in seiner Macht). König Ladislav von Ungarn gewannSopron.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "České země", "Datum": "30.10.1276", "lokalitat_name": "Wien", "cs-verze": null, "kurzes_regest": "König Rudolf bestätigt auf Bitten des Klosters Admont die inserirte Urkunde des Kaisers Friedrich II.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "České země", "Datum": "21.11.1276", "lokalitat_name": "Wien", "cs-verze": "Biskup Bruno a Otto markrabě Braniborský jako zástupce Přemysla Otakara a Bertold biskup würzburský a Ludvík falcký hrabě Rein a vévoda bavorský určují podmínky rozhodčího soudu. Mimo jiné PO II předané králi Rudolfovi, Rakousko, Štýrsko, Korutany, Kraňsko, Vidic March, Cheb. Rudolf dal své dceři věnem 40 000 stříbrných marek, které jsou zapsány proti příjmu 4000 stříbrných marek v Rakousku u Dunaje kromě Kremže na Dunaji a Steinu na Dunaji. Všechen majetek v této části země má zůstat v rukou bývalých vlastníků. Pokud však byly příjmy z výše uvedené částky pro Přemysla Otakara malé, měla by PO II: dominovat i oblastem jižně od Dunaje. Pokud Přemyslův syn zemře, stane se toto venkovské údolí Přemyslovou zástavou. Privilegia a práva vídeňských občanů Platrama a magistra Konráda notáře, města Vídně, jakož i Ulrichova notářského faráře ve Vídni by měla zůstat zachována. PO II má vrátit okupované západní Maďarsko uherskému králi Ladislavovi.", "kurzes_regest": "Bischof Bruno und Otto Markgraf von Brandenburg als Ottokar Vertreter und Bertold Bischof von Würzburg und Ludwig Pfalzgraf von Rein und Herzog von Bayern legen die Bedinungen des Schiedgerichtes fest. Unter anderen PO II. übergab dem König Rudolf, Österreich, Steiermark, Kärnten, Krain, widische Mark, Eger. Rudolf gab als Mitgift seiner Tochter 40 000 Silber Mark, die an die Einkünfte 4000 SIlber Mark in Österreich über Donau ausser Krems an der Donau und Stein an der Donau geschrieben sind. alle Besitze in diesem Landteil sollen in der Hand der vorigen Beistzer bleiben. Wenn aber die Einkünfte für die genannte SUmme für Ottokar wenig waren, soll PO II: auch Bereichen südlich Donau beherschen. Falls Ottokars Sohn sterben wird, soll dieser Landtal zum Ottokars Pfand werden wird. Die Privilegien und Rechte den Wiener Bürgern Platram und Magister Konrad Notar , der Stadt Wien , sowie dem Ulrich Notar Pfarrer in WIen bleiben sollen. PO II. soll die okupierte Westungarn dem König Ladislav von Ungarn zurückgeben.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": null, "Periode": "České země", "Datum": "24.11.1276", "lokalitat_name": "Wien", "cs-verze": "Král Rudolf (I) obnovuje přemístění trhu (fóra) v Klosterneuburgu z neděle na pondělí, které bylo dříve na žádost mnoha lidí zrušeno. Klosterneuburg, ale pravděpodobně patří do ostokarské části Rakouska", "kurzes_regest": "König Rudolf (I.) erneuert die von König Ottokar bestimmte Verlegung des Marktes (forum) in Klosterneuburg von Sonntag auf Montag, die zuvor durch die Bitte vieler Personen rückgängig gemacht worden war. Klosterneuburg, aber gehört wahrcheinlich zu den Ottokars Teil Österreichs", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "České země", "Datum": "25.11.1276", "lokalitat_name": "Wien", "cs-verze": "PO II překračuje Dunaj a před Rudolfem rezignovaně předává vlajky Rakousku, Štýrsku, Korutanům, Kraňsku, Windische Mark, Egeru, Pordenone. Král Rudolf uděluje Přemyslu Otakarovi léno s Čechami a Čechami předáním praporů a vydává o nich listinu. (V Přemyslově moci však Rakousko zůstalo skutečné na sever od Dunaje, s výjimkou Kremže a Steinu na Dunaji a západního Maďarska severně od Dunaje.)", "kurzes_regest": "PO II. übertritt Donau und vor dem Rudolf resigniert auf Österreich, Steiermark, Kärnten, Krain, Windische Mark, Eger, Pordenone die Übergabe der Fahnen. König Rudolf belehnt den Ottokar mit Böhmen und Böhmen durch die Übergabe der Fahnen und stellt darüber die Urkunde aus. (Im Ottokars Macht blieb aber real Österreich nordlich Donau ausser Krems und Stein an der Donau sowie Westungarn nordlich Donau)", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "České země", "Datum": "26.11.1276", "lokalitat_name": "Wien", "cs-verze": "Pád II a král Rudolf potvrzují inzerovanou mírovou smlouvu mezi nimi uzavřenou jejich zástupci.", "kurzes_regest": "PO II. und König Rudolf konfirmieren den inserierten - von ihren Vertretern geschlossenen Friedvertrag zwischen ihnen.", "beschenkte_institution_text": null, "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": null, "Periode": "České země", "Datum": "30.11.1276", "lokalitat_name": "Wien", "cs-verze": "Rudolfovi lidé, Lev, biskup řezenský, falcký hrabě Ludvík Heirich, lankrabě hessenský, byli ve Vídni a zde vystavují spis o míru. Rudolf byl ve Vídni již 29.11.", "kurzes_regest": "Rudolfs Leute Leo Bischof von Regensburg, Pfalzgraf Ludwig Heirich Landgraf von Hessen waren in Wien ud hier stellen die Ürkunde über den Fried aus. Rudolf war in Wien schon 29.11.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "wohl Dezember 1276", "lokalitat_name": "Praha", "cs-verze": "PO II se přesunul z tábora u Vídně, resp. Kornneuburgu do Prahy", "kurzes_regest": "PO II. zog aus Lager bei Wien, bzw Kornneuburg nach Prag", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "wohl Mitte Dezembers 1276,", "lokalitat_name": "Wien", "cs-verze": "Občanská pobočka II nechtěla předat Chebsko Občanské pobočce II a hájí svá práva v severozápadním Dolním Rakousku. Podle formule se v dopise králi Rudolfovi brání vydání Chebska, manželského statku své matky, protože si v něm koupil několik stálých míst. Od uzavření míru proti němu, jako násilné dobytí hradů Pernegg (severně od Hornu) a \"Wikhartslag\", pokračující loupeže na Moravě, které toleroval, aby se vyhnul byť jen zdání porušení míru, i když jim dokázal zabránit, a konečně propuštění jeho protonotáře Oldřicha z držby vídeňské farnosti, což bylo v rozporu se smlouvou.", "kurzes_regest": "PO II. wollte nicht Egerland dem PO II. übergeben und wehrt seine Rechte in Nordwestniederösterreich. Laut dem Formelstück sträubt er sich in einem Briefe an König Rudolf gegen Herausgabe des Egerlandes, des Heiratsgutes seiner Mutter, da er mehrere feste Plätze darin käuflich an sich gebracht habe. as seit dem Friedensschluss wider denselben geschehen, so die gewaltsame Entreissung der Burgen Pernegg (nördl. Horn) und \"Wikhartslag\", die fortdauernden räubereien in Mähren, welche er um auch den Schein eines Friedensbruches zu vermeiden geduldet, obwol er sie hindern konnte, endlich die vertragswidrige Entsetzung seines protonotars Ulrich aus dem Besitz der Pfarrei Wien.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Um Februar 1277, sicher vor Mitte März", "lokalitat_name": "???", "cs-verze": "Vojska krále Rudolfa dobývala s novou dobyvačnou mašinérií, tzv. \"Kater\" Osmanské hrady a města v části Rakouska severně od Dunaje, která má být manželským panstvím Přemyslova syna Václava. PO II táhl s početným vojskem a také s novými dobyvačnými stroji, tzv. \"Kater\" do Rakouska severně od Dunaje.", "kurzes_regest": "Die Truppen Königs Rudolf erobert mit der neuen Eroberungsmaschienen sgn. \"Kater\" die Ottokars Burgenund Städte im Teil Österreichs nordlich Donau, der als Heiratsgut für Ottokars Sohn Wenzel sein soll. PO II. zog mit der grossen Truppe und auch mit der neuen Eroberungsmaschienen sgn. \"Kater\" nach Österreich nordlich Donau.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Nach 27.3- kurz vor 20.4.1277", "lokalitat_name": "Opava", "cs-verze": null, "kurzes_regest": "PO II. verhandelt ïn Troppau/Opava mit dem Emissar des Königs Rudolf Burggraf von Nürnberg Friedrich von Zollern vor dem Verhandlung über den zweiten Friedvertrag, die wurde später am 6.1.1277 geschlossen.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "České země", "Datum": "4/20/1977", "lokalitat_name": "Brno", "cs-verze": null, "kurzes_regest": "PO II schenkt den Bürgern von Opava die Wald in der Nähe von Dorf Skřípov.", "beschenkte_institution_text": "Opava, Bürger", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Im April und in vorigen Monaten 1277", "lokalitat_name": "???", "cs-verze": "PO II přikazuje Českému Krumlovu, aby si podrobil Vítka z Krumlova, Záviše z Falkštejna a jeho bratry Vítka, Voka, Budivoje a Hencelina", "kurzes_regest": "PO II. gebietet Český Krumlov des Vítek von Krumlov, des Záviš von Falkštejn/Falkenstein und siener Brüder Vítek, Vok, Budivoj und Hencelin erobern", "beschenkte_institution_text": "Vítek von Krumlov - Záviš von Falkenstein/Falkenštejn und seine Brüder", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Im April und in vorigen Monaten 1277", "lokalitat_name": "???", "cs-verze": "PO II velí dobytí hradu Jindřichův Hradec", "kurzes_regest": "PO II. gebietet den Burg Jindřichův Hradec/Neuhaus des Ulrichs von Hradec/Jindřichův Hradec/Neuhaus erobern", "beschenkte_institution_text": "Ulrich von Hradec/Jindřichův Hradec/Neuhaus", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Im April und in vorigen Monaten 1277", "lokalitat_name": "???", "cs-verze": "PO II přikazuje Trhovým Svinům dobýt Ojíř/Hoger od Trhových Svinů (Lomnice a Třeboň)", "kurzes_regest": "PO II. gebietet Trhové Sviny des Ojíř/Hoger von Trhové Sviny (Lomnice und Třeboň) erobern", "beschenkte_institution_text": "Ojíř/Hoger von Trhové Sviny (Lomnice und Třeboň)", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Im April und in vorigen Monaten 1277", "lokalitat_name": "???", "cs-verze": "PO II nařídil majitelům bratří Jindřicha a Vítka z Rožmberka vyplenit panství, kteří vyplenili i královské statky", "kurzes_regest": "PO II. gebietet die Besitze der Brüder Heinrich und Vítek von Rožmberk/Rosenberg plündern, die auch die königliche Gütter plündern", "beschenkte_institution_text": "Brüder Heinrich und Vítek von Rožmberk/Rosenberg", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "České země", "Datum": "zwischen 20.-27.4. 1277", "lokalitat_name": "Brno", "cs-verze": null, "kurzes_regest": "PO II. sendte den Bischof Bruno von Olomouc, den Burggraf in Bítov, Smil von Bílkov und Notar Meister Ulrich nach Wien um den zweiten Fried zwischen PO II. und König Rudolf verhandeln.", "beschenkte_institution_text": "Bischof Bruno von Olomouc, den Burgraf in Bítov, Smil von Bílkov und Notar Meister Ulrich", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "České země", "Datum": "zwischen 20.-27.4. 1277", "lokalitat_name": "Brno", "cs-verze": "PO II oznamuje Fridrichovi Norimberskému příjezd svých vyslanců do Znojma a žádá ho, aby je doprovodil před krále Rudolfa", "kurzes_regest": "PO II. bennachrichtigt den Burgraffen Friedrich von Nürnberg über Ankunft seiner Gesandten in Znaim/Znojmo und bittet ihn sie vor König Rudolf zu geleiten", "beschenkte_institution_text": "Friedrich von Zollern Burggraf von Nürnberg", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 2.0, "Periode": "České země", "Datum": 221270400000, "lokalitat_name": "Brno", "cs-verze": "PO II zaměňuje panství s břevnovským klášterem.", "kurzes_regest": "PO II verwechselt die Güter mit dem Kloster Břevnov.", "beschenkte_institution_text": "Břevnov, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "Nach 1.5.1277- länger vor 30.6.1278.", "lokalitat_name": "???", "cs-verze": "PO II prodává poprvé sedleckému klášteru les Bor mezi Kolínem a Čáslaví, jehož hranici vymezili Domaslav český komoří a Onšo zemskými soudci.", "kurzes_regest": "PO II verkauft zum ersten Mal dem Kloster Sedlec das Wald Bor zwischen Kolín und Čáslav, dessen Grenze Domaslav Kämmerer Böhmen und Onšo Provinzrichter definierten.", "beschenkte_institution_text": "Sedlec, Zisterzienserkloster", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "České země", "Datum": "14.5.1277 oder ein Tag, bzw ein Par Tagen danach (siehe Komentar)", "lokalitat_name": "???", "cs-verze": "PO II uzavírá mír s králem Rudolfem. Podmínky mírové smlouvy z 6. května 1277 byly: Obě strany musí propustit rukojmí 23. května. Manželský majetek Rudolfovy dcery, která měla stejné jméno, není Dolní Rakousko severně od Dunaje, ale jako zástava za 10 000 známek Silber Egerland, které Přemysl Otakar stále držel. PO II má vrátit hrady a města, které držel v Rakousku, a stará hranice mezi Čechami, Moravou a Rakouskem má být obnovena. PO II má mít Mikulov držen jako léno Fridricha z Lichtenštejna. Rakouský maršálek Heinrich von Kuenring-Weitra má vrátit zámek Drnholec svému tchánovi Přemyslu Otakarovi a PO II má vypořádat majetek z manželství své dcery. Rytířem Alexe Ottokara je získat Martinice zpět. PO II má amnestovat své hosty a vrátit jim jejich majetek. Pád II má také vrátit obsazené hrady a města v západním Maďarsku uherskému králi Ladislavovi.", "kurzes_regest": "PO II. schliest das Frieden mit dem König Rudolf ab. Bedinungen des Friedvertragers aus dem 6.5. 1277 waren: Beide Seiten müssen Geiseln am 23.5. freilassen. Das Heiratsgut der Rudolfs Tochter, die den ist schon nicht Niederösterreich nordlich Donau, sondern als Pfand für 10 000 Marken SIlber Egerland, das Ottokar noch hielt. PO II. soll die Burgen und Städte, die er in Österreich hielt, zurückgeben, sowie die alte Grenze zwischen Böhmen, Mähren und Österreich erneuert werden sollen. PO II. soll Mikulov als Lehen des Friedrich von Liechtenstein halten lassen. Marschall Österreichs Heinrich von Kuenring-Weitra soll seinem Schwiegervater Přemysl Ottokar die Burg Drnholec zurückgeben und PO II. soll die Heirtasgut seiner Tochter vergleichen. Alex Ottokars Ritter soll Martinice zurück bekommen. PO II. soll seine Gägner amnestieren und ihre Besitze restitueren. PO II. soll auch die besetzen Burgen und Städte in Westungarn dem ungarischen König Ladislav zurückgeben.", "beschenkte_institution_text": "König Rudolf", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "České země", "Datum": "14.5.1277", "lokalitat_name": "Jindřichův Hradec", "cs-verze": "PO II. napsal purkrabímu Fridrichu Norimberskému: Biskup Bruno z Olomouce k němu přišel satis tarde večer 13. května a podal mu podrobnou zprávu o mírové smlouvě (ze dne 6. května) brzy ráno následujícího dne. Ottokar vysvětluje a ujišťuje . PO II žádá purkrabího, aby se přimluvil zejména u krále Rudolfa za propuštění Konráda z Bzence/Bisenze a za to, aby Jindřichovi z Hainburgu zůstalo v klidu jeho dědictví a statky. Jak mu již sdělil v dřívějším dopise, opakoval, že ihned poté, co se od Smila von Bílkova dozvěděl o mírové smlouvě, zastavil pronásledování Vítkovců, zatímco Záviš z Falkenštejna a jeho druhové, ačkoli se o míru dozvěděli o čtyři dny dříve, pokračovali v pustošení, jak nejlépe dovedli. Ve všech těchto záležitostech poslal ke králi Rudolfovi již zmíněného Smilova z Bílkova a také ho ověřil purkrabímu.", "kurzes_regest": "PO II. schreib an den Burggrafen Friedrich von Nürnberg: Bischof Bruno von Olmütz/Olomouc sei am 13. Mai abends zu ihm, satis tarde, gekommen und habe ihm am andern tage früh genauen Bericht über den Friedensvertrag (vom 6. mai) erstattet. Ottokar erklärt und versichert . PO II. bittet den Burggrafen sich im besondern bei König Rudolf für die Freilassung des Konrad von Bzenec/Bisenz und dafür zu verwenden, dass Heinrich von Hainburg im ruhigen Besitze seines erbes und seiner Güter belassen werde. Wie er ihm bereits in seinem früheren schreiben mitgeteilt, wiederhole er, dass er augenblicklich nachdem er durch Smil von Bílkov vom Friedensschluss erfahren, von der verfolgung der Witigonen abgelassen habe, während Záviš von Falkenštejn/Falkenstein und seine Genossen, obwol sie vier Tage früher Kunde vom Frieden erhalten hatten, ihre Verwüstungen nach Kräften fortsetzten. Er sende in all diesen Angelegenheiten den genannten Smilov von Bílkov an König Rudolf und beglaubigt ihn auch bei dem Burggrafen.", "beschenkte_institution_text": "Friedrich von Zollern Burggraf von Nürnberg", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "18.5.1277 (nicht ganz ausgeschlossen 17.6.1277)", "lokalitat_name": "Praha", "cs-verze": "PO II (purkrabímu Fridrichovi Norimberskému): ihned po zjištění uzavření míru zastavil veškeré nepřátelství proti Vítkům (ad destructionem Witkonidum) a musel si proto o to více stěžovat na to, že služebníci Jindřicha a Vítka (pueri) z Rožmberka a lidé Hoyerovi/OJíře ze Svin/Lomnice/Třeboně zpustošili jeho statky a na svatodušní svátky (16.5.) vypálili město České Budějovice; Kromě toho se Vítkovci snaží obviňovat jeho, Přemysla Otakara, ze svých každodenních zločinů před králem Rudolfem a obviňují ho, zatímco oni sami jsou zločinci. Ať purkrabí krále posvítí a ať oba neposlouchají těchto překrucování. kéž by to král Rudolf také nepřičítal zlé vůli, kdyby všichni rukojmí nedorazili do Znojma příští neděli (23. května); neboť to bylo zčásti nemožné, i když všude vyslal posly, protože byl velmi daleko. Ve všech těchto záležitostech poslal Všebora z Náměště ke králi Rudolfovi, kterého také ověřil purkrabímu.", "kurzes_regest": "PO II. an den (Burggrafen Friedrich von Nürnberg): er habe sogleich nachdem er vom Abschluss des Friedens erfahren, alle Feindseligkeiten gegen die Witigonen (ad destructionem Witkonidum) eingestellt und müsse sich daher um so mehr darüber beklagen, dass die Diener des Heinrichs und Víteks (pueri) von Rosenberg/Rožmberk und die leute des Hoyer/OJíř von Sviny/Lomnice/Třeboň seine Güter verwüsten und am Pfingsttage (16.5.) die tadt Budweis verbrannt haben; zudem suchen die Witigonen diese ihre Tagtäglichen Missethaten vor könig Rudolf ihm, Ottokar, zuzuwälzen und klagen ihn an, während doch sie selber die Übelthäter sind. Da möge denn der Burggraf den könig aufklären und sie beide sollen doch diesen Verdrehungen kein Gehör schenken. Auch möge es König Rudolf keinem bösen Willen zuschreiben, wenn die Geiseln nicht alle am kommenden Sonntag (23.Mai) in Znaim/Znojmo eingetroffen sein worden; denn dies sei obwol er überallhin Boten gesandt, wegen der grossen Entfernung zum theil unmöglich. In all diesen Angelegenheiten sende er den Všebor von Náměšť an den König Rudolf, den er auch beim burggrafen beglaubigt.", "beschenkte_institution_text": "Friedrich von Zollern Burggraf von Nürnberg", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "(Zweite Hälfte Mai 1277)", "lokalitat_name": "???", "cs-verze": "II. člen Tribunálu nařizuje bypurovi ze Zvíkova propustit rukojmí, jak vysvětluje v dopise olomouckému biskupovi Brunovi ve svém dopise.", "kurzes_regest": "PO II. gebietet dem Burgraf von Zvíkov/ Klingenberg dei Geisel freilassen, wie er in einem Brief dem Bischof Bruno von Olmütz/Olomouc in seinem Brief erklärt.", "beschenkte_institution_text": "Burggraf von Zvíkov", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "26.5.(1277)", "lokalitat_name": "Hradec Králové", "cs-verze": "PO II žádá krále Rudolfa, aby pomohl Herwordu Tousenphuntovi na jeho statky v Rakousku a ochránil ho před pronásledováním.", "kurzes_regest": "PO II. ersucht den König Rudolf, dem Herword Tousenphunt zu seinen Gütern in Österreich zu verhelften un ihn vor Belästigung zu schützen.", "beschenkte_institution_text": "König Rudolf", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 1.0, "Periode": "České země", "Datum": "5/30/1977", "lokalitat_name": "Praha", "cs-verze": "PO II vrátil klášteru obec Řeporyje a klášteru nahradil škody.", "kurzes_regest": "PO II gibt dem Kloster das Dorf Řeporyje zurück und kompensiert dem Kloster die Schaden.", "beschenkte_institution_text": "Plasy, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "České země", "Datum": 221356800000, "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II entschädigt das Kloster Ostrov für Zbraslav.", "beschenkte_institution_text": "Ostrov, Benediktinerkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "20.6.(1277)", "lokalitat_name": "Uničov", "cs-verze": null, "kurzes_regest": "PO II. an den burggrafen Friedrich von Nürnberg: dankt diesem für dessen ratschläge und erklärt, dass er nun alles im frieden bestimmte erfüllt habe, indem er die geiseln, die gefangenen und die festen die er in seiner gewalt hatte, zurückgegeben oder zurückzugeben befohlen habe. Er bittet den burggrafen wiederholt zu ihm zu kommen, da er ihm vorschläge zu machen habe, die könig Rudolf zur ehre und Friedrich zum nutzen gereichen werden, und ersucht ihn den pfalzgrafen Ludwig zu bewegen solange bei könig Rudolf zu bleiben, bis er (der burggraf) wieder von ihm (Ottokar) zurückgekehrt wäre.", "beschenkte_institution_text": "Friedrich von Zollern Burggraf von Nürnberg", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "26.6.(1277)", "lokalitat_name": "Hradec nad Moravicí", "cs-verze": null, "kurzes_regest": "PO II. ersucht den Burggraf von Nürnberg dahin zu wirken, dass Herword Tousentphunt zum ruhigen Besitze seiner Güter in Österreich gelange", "beschenkte_institution_text": "Friedrich von Zollern Burggraf von Nürnberg", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "30.6.(1277)", "lokalitat_name": "Hradec nad Moravicí", "cs-verze": null, "kurzes_regest": "PO II. ersucht den Burggrafen Friedrich von Nürnberg zu veranlassen, dass dem Konrad von Walterskirchen die Burg Dürnholz überantwortet werde, im Geist des Vertrages zwischen Rudolf und PO II.", "beschenkte_institution_text": "Friedrich von Zollern Burggraf von Nürnberg", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Ende Mai oder Juni1277", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. schrieb dem König Ruldolf wegen der Respektierung der südlichen Grenze seiner Königreich, sowie zugehörende Teile Österreichs. Das von Heinrich von Weitra (Kuenring) besetzte gebiet müsse er als einen schon seit den zeiten der herzoge Leopold und Friedrich von seinen vorfahren ruhig innegehabten besitz in anspruch nehmen, da er, trotzdem Heinrich seine tochter zur frau habe, eine verletzung seiner grenzen durch ihn nicht dulden könne; er ersucht weiter neuerlich um die schon wiederholt erbetene wiedereinsetzung des magisters Ulrich in die pfarrei von Wien, sowie endlich dass seinem auf der heimreise von den Kremser bürgern festgenommenen und beraubten dienstmann L. von Tyrnstein freiheit und vermögen zurückgegeben werde.", "beschenkte_institution_text": null, "poII_aussteller": "Ja", "verfalscht": "Formelstück unsicher"}, {"sicherheit": null, "Periode": "České země", "Datum": "12.7.1277", "lokalitat_name": null, "cs-verze": null, "kurzes_regest": "Rudolf schrieb dem König von Ungarn und aus dem Worten dieses Briefes, zeigt es, dass PO II. zum 12.7.1277 die besetze Bürger und Städte in Westungarn dem Ladislav noch nicht übergab : ,ltem promittimus et promisimus modo consimili data fide, ut omnia castra, municiones, oppida, villas, terras et alia, que predictus rex Boemie occuparat vel fecerat occupari vel nostris temporibus Australes et Stirienses, Karinthani occuparant et detinent occupata nec adhuc reddidimus vel reddi fecimus, restitui faciemus .. .'. Deshalb schicken der König Rudolf und König Ladilav an den PO II. Botten, dass er, dass derselbe an Ungarn entzogenes zurückgebe und für zugefügten schaden ersatz leiste. Ebenso sollen zwischen Ungarn einer- und Oesterreich, Steier und Kärnten andrerseits die alten grenzen wieder hergestellt werden.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "15.7.1277", "lokalitat_name": "Wrocław", "cs-verze": "PO II purkrabímu Fridrichu Norimberskému. Poté, co Smil purkrabí z Bítov a Všebor z Náměště přešli od krále Rudolfa na PO II. PO II, vystřídal burkrout krále Rudolfa ve slíbeném propuštění Konráda z Bzence.", "kurzes_regest": "PO II. an t den Burggrafen Friedrich von Nürnberg. Nach dem Smil Burggraf von Bítov und Všebor von Náměšť kamen von dem König Rudolf zum PO II. PO II, eruscht den Burgraf, König Rudolf zur versprochenen Freigebung des Konrads von Bzenec/Bisenz zu vermögen.", "beschenkte_institution_text": "Burgraf Friedrich von Nürnberg", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "um 15.7.1277", "lokalitat_name": "Wrocław", "cs-verze": "PO II vyjednává s vévodkyní z Breslau ve Vratislavi a očekává příjezd Burgrafena Friedricha von Nürnbergt, protože PO II píše purkrabímu Friedrichu von Breslau.", "kurzes_regest": "PO II. verhandelt in Breslau mit der Herzogin von Breslau und erwartet hier die Ankunft des Burgrafen Friedrich von Nürnbergt, wie PO II. dem Burggraf Friedrich von Breslau schreib.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Nach Mitte Juli", "lokalitat_name": "Wrocław", "cs-verze": "PO II s lítostí píše Burgrafu Fridrichovi Norimberskému o Fridrichově nemoci, která zpozdila styky s vévodkyní z Vratislavi, a zde očekává příjezd Burgraffa Fridricha Norimberského.", "kurzes_regest": "PO II. schreibt dem Burgraf Friedrich von Nürnberg bedauernd Friedrichs Krankheit, durch welche die Verhalndlungen mit der Herzogin von Breslau verzögert worden, und erwartet hier die Ankunft des Burgrafen Friedrich von Nürnberg.", "beschenkte_institution_text": "Burgraf Friedrich von Nürnberg", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Zweite Hälfte July 1277", "lokalitat_name": "???", "cs-verze": "PO II napsal biskupovi Brunovi z Olomouce na Moravě o obvinění krále Rudolfa, že PO II již dříve ovládal hrady a města v Rakousku severně od Dunaje, které byly stále v jeho moci. (Tento mandát však ukazuje, že tyto hrady a města byly stále v jeho moci. Pak napište biskupovi, aby se k němu dostavil.", "kurzes_regest": "PO II. schrieb dem Bischof Bruno von Olomouch na Mähren wegen der Vorwürfe von König Rudolf, dass PO II. schon früher gebietet die Burgen und Städte in Österrreich nordlich Donau, die noch in seiner Macht waren, übergeben. (Dieser mandat zeigt aber, dass diese Burgen und Städte noch in seiner Macht waren. Dann schreib dem Bischof um zu ihm zu fahren.", "beschenkte_institution_text": "Bischof Brunno von Olomouc/Olmütz", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "15.8.(1277)", "lokalitat_name": "Hradec nad Moravicí", "cs-verze": "PO II píše olomouckému biskupovi Brunovi o svém uzdravení 12. srpna díky relikvii mikulášského oleje, kterou poslal král Karel Neapolský. PO II také deklaruje a o záměrech ohledně možného setkání s polskými vévodkyněmi, které však nechtějí jet do Opavy/Troppau za ním a Ratibořem/Ratibořem/Ratibořem jako místem setkání Po II trvá na Opavě a pak se chystal odstěhovat do Čech", "kurzes_regest": "PO II. schreibt dem Bischof Bruno von Olmütz über siene Genesung am 12 August dank des Reliquie des Öls des heiligen Nikolaus, das König Karl von Neapol schickte. PO II. erklärt auch und über Absichten betreffs einer allfälligen Zusammenkunft mit den polnischen Herzoginnen, die aber nach Opava/Troppau zu ihm fahren nicht wollen und als Treffunspunkt der Verhandlung Ratiboř/Ratibor/Racibórz. Po II. beharrt auf Opava, und dann wollte er gerade nach Böhmen ziehen", "beschenkte_institution_text": "Bischof Brunno von Olomouc/Olmütz", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Mitte August 1277", "lokalitat_name": "???", "cs-verze": "PO II informuje purkrabího Fridricha Norimberského o svém uzdravení.", "kurzes_regest": "PO II. teilt dem Burggrafen Friedrich von Nürnberg seine Wiedergenesung mit.", "beschenkte_institution_text": "Burgraf Friedrich von Nürnberg", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "kurz vor September 1277", "lokalitat_name": "???", "cs-verze": "PO II rozhoduje o tom, že jeho vypleněný klášter Zlatá Koruna (Sancta Corona) je přeložen do jiného města a ptá se na to generální kapituly cisterciáckého řádu v Citeaux.", "kurzes_regest": "PO II. entscheidet, dass sein geplündertes Kloster Zlatá Koruna (Sancta Corona/Goldenkron) in anderen Ort übertragen wird und bittet darüber den Generalkapitel des Zisterzienserordens in Citeaux.", "beschenkte_institution_text": "Zlatá Koruna, Zisterzienserkloster", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "České země", "Datum": "4.9.1277", "lokalitat_name": "Praha", "cs-verze": "PO II daruje řečkovické panství a ves Jundrov své kapli sv. Jana Křtitele v Brně a daruje tuto kapli proboštovi Jindřichovi z Doubravníku a jeho nástupcům.", "kurzes_regest": "PO II gibt seiner Johannes-des-Täufers Kapelle in Brno das Hof Řečkovice und das Dorf Jundrov und schenkt diese Kapelle dem Probst Heinrich von Doubravník und seinen Nachfolgern.", "beschenkte_institution_text": "Doubravník, Propstei", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "České země", "Datum": "8.9.1277", "lokalitat_name": "Praha", "cs-verze": "PO II. slavnostně předává svou dceru františkánskému řádu Klarisek v pražském klášteře za přítomnosti pěti biskupů.", "kurzes_regest": "PO II. übergibt feierlich bei Anwesendheit der fünf Bischöfe seine Tochter dem Franziskanerorden der heliligenk Klara im Kloster in Prag.", "beschenkte_institution_text": "Praha, St. Franciskus-Spital in Prag; Franziskanerbzw. Klarissenkloster", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "České země", "Datum": 250473600000, "lokalitat_name": "Praha", "cs-verze": "Občanská platforma II a Rudolf von Habsburg uzavřou mírovou smlouvu.", "kurzes_regest": "PO II und Rudolf von Habsburg schliessen den Friedensvertrag ab.", "beschenkte_institution_text": "König Rudolf", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "České země", "Datum": "10/16/1977", "lokalitat_name": "Litoměřice", "cs-verze": null, "kurzes_regest": "PO II gibt den Hörigen des Vyšehrader Propstes verschiedene Freiheiten.", "beschenkte_institution_text": "Vyšehrad, Stiftskapitel - Bewohner der Vostadt bei Litoměřice", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "České země", "Datum": "10/31/(1977)", "lokalitat_name": "Poděbrady", "cs-verze": null, "kurzes_regest": "PO II beschwert sich dem König Rudolf an Witigonen", "beschenkte_institution_text": "König Rudolf", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "November und Dezember wohl 1277", "lokalitat_name": "???", "cs-verze": "PO II nařizuje vpád do Rakouska a Rudolfova vojska padají od Rakouska severně od Dunaje na Moravu.", "kurzes_regest": "PO II. gebietet nach Österreich einfallen, und Rudolfs Truppen fallen aus Österreich nordlich Donau nach Mähren.", "beschenkte_institution_text": null, "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Ende 1277", "lokalitat_name": "Opava", "cs-verze": null, "kurzes_regest": "PO II. handelt mit den polnischen Herzöge in Troppau", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "Zwischen
