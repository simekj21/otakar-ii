 1.5.1277- 25./31.12.1277", "lokalitat_name": "???", "cs-verze": "PO II pověřuje svého komorníka Království českého Domaslava rozhodčím soudem ve sporu mezi proboštem Petrem z Vyšehradu, královským kancléřem na jedné straně a děkanem a kapitulou na Vyšehradě na straně druhé. Král jmenuje revizory Martina opata břevnovského a probošta Gottfrieda ze Strahova.", "kurzes_regest": "PO II. vertraut seinem Kämmerer des Königreichs Böhmen Domaslav das Schiedgericht im Streit zwischen Probst Peter von Vyšehrad, königlicher Kanzler auf einer Seite und Dekan und Kapitel in Vyšehrad auf zweiter Seite. König bestimmt ach den Martin Abt von Břevnov und den Probst Gottfried von Strahov als auditores Schiedrichter (auditores).", "beschenkte_institution_text": "Vyšehrad, Kapitel - Kämmerer des Königreichs Böhmen Domaslav - Martin Abt von Benediktinerkloster Břevnov - Probst Gottfried von Augustinerchorrherrenstift Strahov -", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Ende des Jahres 1277-vor 10.1.1278", "lokalitat_name": "???", "cs-verze": "PO II zajal Boreše z Rýzmburka, zabavil mu majetek a pravděpodobně nařídil jeho popravu.", "kurzes_regest": "PO II. hat den Boreš von Rýzmburk gefanggenomenn, siene Besitze konfisziert und wahrscheinlich hinrichten gebietet.", "beschenkte_institution_text": "Boreš von Rýzmburk", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "wende 1277 und 1278", "lokalitat_name": "???", "cs-verze": "Královna Kunhuta píše olomouckému biskupovi Brunovi o zpustošení svých statků a dalších křivdách v Olomouci, Znojmě a brněnské části Moravy", "kurzes_regest": "Königin Kunigunde schreibt dem Bischof Bruno von Olmütz/Olomouc über Verwüstung ihrer Güter und andere Beschwerden in Olmüzter, Znaimer und Brünner Teil Mährens", "beschenkte_institution_text": "Bischof Brunno von Olomouc/Olmütz", "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "České země", "Datum": 276048000000, "lokalitat_name": "Olomouc", "cs-verze": "PO II daruje městu Uherský Brod statky Boreše z Krkonošského hradu, které mu propadly zastoupením.", "kurzes_regest": "PO II beschenkt die Stadt Uherský Brod mit den an ihm durch Vertrat heimgefallen Güter von Boreš von Riesenburg.", "beschenkte_institution_text": "Uherský Brod, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "České země", "Datum": "Kurz vor 21.1.1278", "lokalitat_name": "???", "cs-verze": "PO II deleguje bítovského komorníka Hartleba (z Dubna), maršálka moravského Všebora z Náměště na Hané (syna Jiljíse/Egídia ze Švábenic), jako soudce ve sporu mezi dvěma sestrami z Moravských Málkovic na jedné straně a klášterem Žďár nad Sázavou a zdejším opatem Janem na straně druhé o rozdělení obcí Kučerov a Lhota", "kurzes_regest": "PO II. delegiert den Kämmerer von Bítov Hartleb (von Dubno), Marschall Mährens Všebor von Náměšť na Hané (Sohn des Jiljís/Egidius´von Švábenice), als Richter in der Streit zwischen den zwei Schwestern von Moravské Málkovice auf einer Seite und dem Kloster Žďár nad Sázavou und dem dortigen Abt Johann auf zweiter Seite über die Teilung der Dörfer Kučerov und Lhota", "beschenkte_institution_text": "Žďár nad Sázavou, Zisterzienserkloster - Schwester von Moravské Málkovice - Všebor von Náměšť na Hané, Marschall Mährens - Kämmerer von Bítov Hartleb von Dubna", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "České země", "Datum": "Kurz vor 21.1.1278", "lokalitat_name": "???", "cs-verze": "PO II delegáty u příležitosti Všeobecného soudu moravského na hradě Brněnském Špilberku komořího bitovského Hartleba z Dubna, komorníka brněnského Hartmanna z Čeblovic, maršálka moravského Všebora z Náměště na Hané, jako soudce ve sporu mezi Pardusem, synem Neplachovým a premonstrátským klášterem Klášterní Hradisko a tamním proboštem Budišem. O rozdělení obce", "kurzes_regest": "PO II. delegiert bei der Gelegenheit des Generalgericht Mährens in der Brünner Burg Špilberk den Kämmerer von Bítov Hartleb von Dubno, Kämmerer in Brno/Brünn Hartmann von Čeblovice, Marschall Mährens Všebor von Náměšť na Hané, als Richter in der Streit zwischen Pardus Sohn des Neplachs und Prämonstratenserstift Klášterní Hradisko und dem dortigen Probst Budiš. über die Teilung des Dorfes", "beschenkte_institution_text": "Klášterní Hradisko, PrämonstratenserChorherrenstift Pardus Sohn von Neplach - Kämmerer von Bítov Hartleb von Dubno - Kämmerer in Brno/Brünn Hartmann von Čeblovice - Marschall Mährens Všebor von Náměšť na Hané", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "České země", "Datum": "1/24/1978", "lokalitat_name": "Brno", "cs-verze": "PO II nařizuje kladskému purkrabímu Richardovi a okresnímu soudci Rudlinovi, aby chránili minority v Kladsku.", "kurzes_regest": "PO II befehlt dem Glatzer Burggraf Richard und dem Landrichter Rudlin, die Minoriten in Kłodzko zu schützen.", "beschenkte_institution_text": "Kłodzko,Minoritenkloster/Franziskaner", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "7.2.1278", "lokalitat_name": "Praha", "cs-verze": "Rulco z Biebersteinu slíbil králi sloužit z hradu Frýdlantu, který podle zvyků Českého království koupil Pád II. Vzhledem k tomu, že tento dokument, který potvrzuje přísahu Přemyslu Otakarovi, byl sepsán v královské kanceláři, zdá se velmi pravděpodobné, že sám král PO II. byl této přísaze a vydání osvědčení v Praze dne 7.2.1278 přítomen.", "kurzes_regest": "Rulco von Bieberstein versprach aus der Burg Frýdlant, die von dem PO II. kaufte, dem König nach dem Gewohnheiten des Königreichs Böhmen dienen. Weil diese Urkunde, die dem Ottokar den Schwur bestätigt, wurde in der königlicher Kanzlei verfertigt, scheint es sehr wahrscheinlich, dass bei dieser Schwur und Austellung der Urkunde in Prag am 7.2.1278 auch selbst König PO II. anwesend war.", "beschenkte_institution_text": "Rulco von Bieberstein und Frýdlant", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "4.3.(1278)", "lokalitat_name": "Praha", "cs-verze": "PO II daruje duchovenstvo Ludvíka biskupovi Janu Pražskému za kostel v Trhových Svinech, který král zkonfiskoval Ojířovi, Trhovým Svinům, Třeboni, Lomnici.", "kurzes_regest": "PO II präsentiert dem Bischof Johann von Prag den Kleriken Ludwig für die Kirche in Trhové Sviny/Schweinitz, die der König dem Ojíř/Hoger, von Trhové Sviny, Třeboň, Lomnice konfisziert.", "beschenkte_institution_text": "Trhové Sviny, Kirche", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 1.0, "Periode": "České země", "Datum": "3/26/1978", "lokalitat_name": "Praha", "cs-verze": "Občanská iniciativa II uděluje městu Mostu svobody.", "kurzes_regest": "PO II erteilt der Stadt Most die Freiheiten.", "beschenkte_institution_text": "Most, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 1.0, "Periode": "České země", "Datum": "6/30/1978", "lokalitat_name": "Praha", "cs-verze": "PO II daruje les Bor mezi Kolínem a Čáslaví sedleckému klášteru.", "kurzes_regest": "PO II schenkt dem Kloster Sedlec das Wald Bor zwischen Kolín und Čáslav.", "beschenkte_institution_text": "Sedlec, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "České země", "Datum": "am 30.6.1278 oder ein Paar Tagen danach", "lokalitat_name": "Praha", "cs-verze": null, "kurzes_regest": "PO II. zog aus Prag nach Krieg und bei seinem Abzug aus der Prager Stadt wurde von der Prozession der Geistlichen begleitet.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "Vor 13.7.1278", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. begnädigt den Heinrich von Rosenberg/Rožmberk, der in nach Herbst 1276 als andere Witigonen gegen den König aufstand, plünderte siene Güter, sowie Rosenberger die Gütter des Königs und anderen.", "beschenkte_institution_text": "Jindřich von Rožmberk", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Kurz nach 30.6.1278- kurz vor 15.7.1278", "lokalitat_name": "Brno", "cs-verze": null, "kurzes_regest": "PO II. kam nach Brno, wo der Versammlungsort seiner Truppen war, wovon er am 16.7. nach Österreich ziehen will", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": "Formelstück"}, {"sicherheit": 2.0, "Periode": "České země", "Datum": "Um 25.7.1278, hier blieb bis zum um10.8.1278", "lokalitat_name": "Drossendorf", "cs-verze": null, "kurzes_regest": "PO II. übertritt die Grenze nach Österreich und nach der Belagerung der Stadt Drosendorf 16 Tage (?) Stephan von Maissau kapitulert und übergab die Stadt dem Ottokar", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "Wohl länger vor 8.8.1278", "lokalitat_name": "???", "cs-verze": "PO II zakazuje průjezd vozů přes hranici (alespoň na jižní Prachatické stezce do Pasova - Geldener Steig)", "kurzes_regest": "PO II. verbotet den Durchgang mit Wagen durch Grenze (mindestens auf südlichen Prachatitzer Weg nach Passau - Geldener Steig)", "beschenkte_institution_text": null, "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "České země", "Datum": "um 8.8. oder 10.8.1278", "lokalitat_name": "Laa an der Thaya", "cs-verze": "PO II se přesunul od dobytého Drosendorfu k městu Laa an der Thaya (12 dní), které několik dní obléhalo.", "kurzes_regest": "PO II. zog von erobertem Drosendorf zur Stadt Laa an der Thaya (12 Tage), die ein Paar Tagen belagerte.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": null, "Periode": "České země", "Datum": "12.8.1278", "lokalitat_name": "???", "cs-verze": "To, že byl Heinrich von Kuenring-Weitra na Přemyslově straně, ukazuje, že král Rudolf mu uděluje jeho majetek a zmiňuje se o něm jako o bývalém rakouském maršálkovi.", "kurzes_regest": "Wie Heinrich von Kuenring-Weitra auf der Ottokars Seite war zeigt, dass König Rudolf seine Besitze verleiht und ihn als ehelmaligen Marschall Österreichs erwähnt.", "beschenkte_institution_text": null, "poII_aussteller": "Nein", "verfalscht": null}, {"sicherheit": 2.0, "Periode": "České země", "Datum": "um 20.8, oder 23.8. 1278", "lokalitat_name": "Jedenspeigen", "cs-verze": null, "kurzes_regest": "Als PO II. kennenlernte, dass König Rudolf übertritt am 14. August Donau von Hainburg zum Marchegg, zog von Laa zum Dorf durch Prinzendorf an der Zaya zu Jedenspeigen, wo sein Lager errichtet.", "beschenkte_institution_text": null, "poII_aussteller": "-", "verfalscht": null}, {"sicherheit": 3.0, "Periode": "České země", "Datum": "Kurz vor 26.8.1278", "lokalitat_name": "???", "cs-verze": "PO II získává změnou od pražského biskupa dvě čtvrtiny obce Železná (bie Unhošť), ale náhrada za pražského biskupa nebyla dána kvůli smrti Přemysla Otakara.", "kurzes_regest": "PO II. gewinnt durch den Wechsel von dem Prager Bischof zwei Viertel des Dorfes Železná (bie Unhošť), aber der Ersatz für den Bischof von Prag wurde wegen des Ottokars Todes nicht gegeben.", "beschenkte_institution_text": "Praha, Prager Bistum", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "wohl um 30.6.1278 - vor 26.8.1278", "lokalitat_name": "???", "cs-verze": "PO II zabírá od cisterciáckého kláštera v Sedlci bez náhrady obec Ždánice u Kouřimi", "kurzes_regest": "PO II. nimmt dem Zisterzienserkloster Sedlec das Dorf Ždánice bei Kouřim ohne einem Ersatz", "beschenkte_institution_text": "Sedlec, Zisterzienserkloster", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "wohl nich lang vor 26.8.1278", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. gebietet zugunsten der Prager Bürger dem Johann von Ocquier, Bürger von Huy das Recht zu Tuchhandel in Prag", "beschenkte_institution_text": "Staré město Pražské, Praha, Prager Altstadt", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "Oktober 1253- Länger vor 26.8.1278", "lokalitat_name": "???", "cs-verze": "PO II uděluje občanům Ústí nad Labem městská práva, pravděpodobně především právo stavět zdi", "kurzes_regest": "PO II. erteilt den Bürgern Ústí nad Labem Stadtrechte, wohl vor allem das Recht Mauern zu bauen", "beschenkte_institution_text": "Ústí nad Labem", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "Zwischen 25.11.1276-26.8.1278", "lokalitat_name": "???", "cs-verze": "PO II prodlužuje na občany Ústí nad Labem lhůtu dříve stanovenou pro opevnění jejich města a převádí na ně svahy městského soudu", "kurzes_regest": "PO II. verlängert den Bürgern von Ústí nad Labem die ihnen früher bestimmte Frist zur Befestigung ihrer Stadt und überweist ihnen die Gefälle des Stadtgerichts", "beschenkte_institution_text": "Ústí nad Labem", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "Zwischen September 1277-26.8.1278", "lokalitat_name": "???", "cs-verze": "PO II vyzývá generální kapitulu cisterciáckého řádu v Citeaux, aby přenesla otcovství nad klášterem Zlatá Koruna z kláštera Heiligenkreuz na klášter Plasy.", "kurzes_regest": "PO II. fordert den Generalkapitel des Zisterzienserordens in Citeaux um die Paternität über dem Kloster Zlatá Koruna/Goldenkron von Kloster Heiligenkreuz zum Kloster Plasy zuübertragen.", "beschenkte_institution_text": "Zlatá Koruna, Zisterzienserkloster - Plasy, Zisterzienserkloster", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "Zwischen November 1276-vor.26.8.1278", "lokalitat_name": "???", "cs-verze": "PO II nařizuje určité osobě, aby se postarala o opravu příkopů města Čáslavi a vyslala k určité osobě (hrad nebo hrad u Čáslavi?).", "kurzes_regest": "PO II. gebietet einem gewissen Person um die Reparierung der Graben der Stadt Čáslav zu besorgen und Leute, die dem gewissen Person (Burgraf von einem Burg in der Nähe von Čáslav?), zu dieser Arbeiten zu schicken.", "beschenkte_institution_text": "Čáslav, Stadt", "poII_aussteller": "Ja", "verfalscht": "Formelstück"}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "Nach 25. 4. 1278- vor 26.8.1278", "lokalitat_name": "???", "cs-verze": "Dle II. DP osvobozuje město Olomouc od placení cla a daní (a precariarum et censuum servicio) od příštího svátku sv. Marka (25.4.1279) na jeden rok.", "kurzes_regest": "PO II. befreit die Stadt Olomouc von Bezahlung der Abgaben bzw. Steuer (a precariarum et censuum servicio) von den nächsten St. Markus-Tag (25.4.1279) für ein Jahr.", "beschenkte_institution_text": "Olomouc, Stadt", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "Kurz vor 29.9.1277-26.8.1278", "lokalitat_name": "???", "cs-verze": "PO II osvobozuje město Głubczyce od placení cla nebo daní po dobu jednoho roku od příštího Dne svatého Marka (25.4.1279) po dobu jednoho roku.", "kurzes_regest": "PO II. befreit die Stadt Głubczyce/Hlubčice von Bezahlung der Abgaben bzw. Steuer für einem Jahr von den nächsten St. Markus-Tag (25.4.1279) für ein Jahr.", "beschenkte_institution_text": "Głubczyce, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "Um 1275- vor 26.8.1278", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. bezahlt dem Albert von Žeberk eine Summe für seine Ansprüche zur Burg und Stadt Tachov.", "beschenkte_institution_text": "Albert von Žeberk, Bezister, Burggraf von Tachov??)", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "um 1260- 26.8.1278", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. erteilt der Stadt Kadaň in einer -nicht erhaltenen- Urkunde die Rechte und Freiheiten, (die wohl mit der Gründung der Stadt durch den König Ottokar zusammenhängen).", "beschenkte_institution_text": "Kadaň, Stadt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "um 1260- 26.8.1278", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. schenkt der Bürgerin von Kadaň Isintrud und ihrem Sohn Otto das Dorf", "beschenkte_institution_text": "Kadaň, die Bürgerin Isintrud und ihr Sohn Bürger Otto aus Kadaň", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "1267-26.8.1278", "lokalitat_name": "???", "cs-verze": "Poté, co probošt Budiš z Hradiska předstoupil před krále PO II. a ukázal mu svá privilegia vyplývající z pohraničního hvozdu mezi Knínicemi u Boskovic a Konicemi, o které se přeli Albrecht z Lešan a opatství Hradisko, přikázal PO II. Albrechtovi z Lešan, aby respektoval hranice opatství Hradisko.", "kurzes_regest": "Nachdem Probst Budiš von Hradisko zum König PO II. kam und zeigt ihm siene Privilegien wegen des Grenzwaldes zwischen Knínice u Boskovic und Konice, die zwischen dem Albert von Lešany und dem Stift Hradisko streitig war, gebietet PO II. dem Albert von Lešany um die Grenze des Stiftes Hradisko zu respektieren.", "beschenkte_institution_text": "Klášterní Hradisko, Prämonstratenserchorherrenstift - Albert von Lešany", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "wohl 70. Jahren - vor 26-8-1278", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. stimmt zu, dass Sezema von Třebelovic (bzw. Třebelic, nich existierte bei Hojanovice) vor dem König seinem Neffen Dětoch von Třebelovice das Marktdorf Žiželice mit 12 Dörfern und die Burg Hořebník (heute Březina bzw. Burg Konipas), sowie die Hälfte der Stadt Hořepník vermachte", "beschenkte_institution_text": "Sezema von Hořepník - Dětoch von Třebelovice", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "wohl nach 3.8.1268- vor 26.8.1278", "lokalitat_name": "???", "cs-verze": "PO II přebírá od biskupa Jana Pražského ves Lipenice, statky Vidim, Sadová, Žabovřesky, Lahovice, Rváčov, Bezděkov, Řeka Hvožďany jako směnku (Václav II. později nahrazen)", "kurzes_regest": "PO II. übenimmt von dem Prager Bischof Johann das Dorf Lipenice, Besitze in Vidim, Sadová, Žabovřesky, Lahovice, Rváčov, Bezděkov, Řeka Hvožďany als Wechsel (Ersatz gab Wenzel II. später)", "beschenkte_institution_text": "Praha, Bistum", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "um 1271/1272-26.8.1278", "lokalitat_name": "???", "cs-verze": "PO II předává veleheradskému klášteru výtěžek z cel vybraných na týdenních trzích v Uherském Brodě.", "kurzes_regest": "PO II. übergibtt dem Kloster Veleherad den Ertrag aus Zoll, die bei den Wochenmarkten in Uherský Brod ausgezogen wird.", "beschenkte_institution_text": "Velehrad, Zisterzienserkloster", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "zwischen um 1273- vor 26.8.1278", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. verheiratet seine Tochter mit dem Vok von Kravař und Benešov", "beschenkte_institution_text": "Vok von Kravař und Benešov", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "Nach 16.10.1271-vor 26.8.1278", "lokalitat_name": "???", "cs-verze": "PO II zabírá od Svatojiřského kláštera na Pražském hradě bez náhrady obce Beňovvy, Novákovice a Hórky", "kurzes_regest": "PO II. nimmt dem St. Georg-Kloster in der Prager Burg die Dörfer Beňovvy, Novákovice a Hórky ohne einem Ersatz", "beschenkte_institution_text": "Praha, St. Georg-Kloster, Prager Burg", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "Nach 16.10.1271-vor 26.8.1278", "lokalitat_name": "???", "cs-verze": null, "kurzes_regest": "PO II. gab der Stadt Klatovy, (die von ihm gegründet wurde die Dörfer Beňovvy, Novákovice a Hórky, die PO II. dem Benediktinerkloster St.Georgs in der Prag ohne einem Ersatz abgenommen hat.", "beschenkte_institution_text": "Klatovy, Stadt", "poII_aussteller": "M", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "wohl um 1270-vor 26.8.1278", "lokalitat_name": "???", "cs-verze": "PO II promíjí městu Klatovy jistý přestupek a slibuje občanům, že město Klatovy zůstalo v jeho moci", "kurzes_regest": "PO II. begnadigt die Stadt Klatovy für einen gewissen Verstoss und verspricht den Bürgern dass die Stadt Klatovy in seiner Macht blieb", "beschenkte_institution_text": "Klatovy, Stadt", "poII_aussteller": "M", "verfalscht": "aus Formelstück"}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "wohl um 1270-vor 26.8.1278", "lokalitat_name": "???", "cs-verze": "PO II zakládá město Nymburk a předává pozemek v nově založeném městě dominikánům.", "kurzes_regest": "PO II. gründet die Stadt Nymburk und übergab den Dominikaner die Parzelle in der neugegründeten Stadt.", "beschenkte_institution_text": "Nymburk, Stadt", "poII_aussteller": "M", "verfalscht": "Formelstück"}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "wohl um 1253-vor 26.8.1278", "lokalitat_name": "???", "cs-verze": "PO II určuje majitele (?) Soudního úřadu v (nově založeném městě) Čáslavi a příjmy tohoto úřadu", "kurzes_regest": "PO II. bestimmt den Besitzer (?) der Richtamt in der (neu gegründten Stadt) Čáslav und die Einkünfte diesers Amtes", "beschenkte_institution_text": "Čáslav, Richteramt", "poII_aussteller": "Ja", "verfalscht": null}, {"sicherheit": 4.0, "Periode": "České země", "Datum": "wohl um 1253-vor 26.8.1278", "lokalitat_name": "???", "cs-verze": "Zákon PO II zřizuje město Chrudim a osvobozuje měšťany na určitou d let currentPage = 1;
const itemsPerPage = 50;

const PERIODS = [
  { label: "1246-1251", start: 1246, end: 1251 },
  { label: "1251-1253", start: 1251, end: 1253 },
  { label: "1253-1260", start: 1253, end: 1260 },
  { label: "1260-1270", start: 1260, end: 1270 },
  { label: "1270-1276", start: 1270, end: 1276 },
  { label: "1276-1278", start: 1276, end: 1278 }
];

function extractYear(datum) {
  if (!datum) return null;
  const match = datum.toString().match(/\d{4}/);
  if (match) {
    const year = parseInt(match[0]);
    if (year > 1200 && year < 1400) return year;
  }
  return null;
}

function initFilters() {
  // Periody
  const select = document.getElementById('periode-select');
  PERIODS.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.label;
    opt.textContent = p.label;
    select.appendChild(opt);
  });
  
  // Místa
  const places = new Set();
  ALL_DATA.forEach(d => {
    if (d.lokalitat_name && d.lokalitat_name !== '???') {
      places.add(d.lokalitat_name);
    }
  });
  const placeSelect = document.getElementById('place-select');
  Array.from(places).sort().forEach(place => {
    const opt = document.createElement('option');
    opt.value = place;
    opt.textContent = place;
    placeSelect.appendChild(opt);
  });
  
  // Instituce
  const institutions = new Set();
  ALL_DATA.forEach(d => {
    if (d.beschenkte_institution_text) {
      let inst = d.beschenkte_institution_text;
      if (inst.length > 40) {
        inst = inst.substring(0, 37) + '...';
      }
      institutions.add(inst);
    }
  });
  const instSelect = document.getElementById('institution-select');
  Array.from(institutions).sort().forEach(inst => {
    const opt = document.createElement('option');
    opt.value = inst;
    opt.textContent = inst;
    instSelect.appendChild(opt);
  });
}

function getFilteredData() {
  const periode = document.getElementById('periode-select').value;
  const issuer = document.getElementById('issuer-select').value;
  const place = document.getElementById('place-select').value;
  const regestSearch = document.getElementById('regest-search').value.toLowerCase();
  const institution = document.getElementById('institution-select').value;
  
  return ALL_DATA.filter(d => {
    if (issuer && d.poII_aussteller !== issuer) return false;
    
    if (periode) {
      const period = PERIODS.find(p => p.label === periode);
      if (period) {
        const year = extractYear(d.Datum);
        if (!year || year < period.start || year > period.end) return false;
      }
    }
    
    if (place && d.lokalitat_name !== place) return false;
    
    if (regestSearch) {
      const regest = (d.kurzes_regest || '').toLowerCase();
      const csVerze = (d['cs-verze'] || '').toLowerCase();
      if (!regest.includes(regestSearch) && !csVerze.includes(regestSearch)) {
        return false;
      }
    }
    
    if (institution) {
      let instCheck = d.beschenkte_institution_text;
      if (instCheck && instCheck.length > 40) {
        instCheck = instCheck.substring(0, 37) + '...';
      }
      if (instCheck !== institution) return false;
    }
    
    return true;
  });
}

function updateTable() {
  currentPage = 1;
  const data = getFilteredData();
  const totalPages = Math.ceil(data.length / itemsPerPage);
  const start = (currentPage - 1) * itemsPerPage;
  const pageData = data.slice(start, start + itemsPerPage);
  
  document.getElementById('table-count').textContent = data.length + ' listin';
  document.getElementById('table-pages').textContent = totalPages + ' stran';
  
  const rows = pageData.map(d => `
    <tr>
      <td><strong>${d.Datum || '?'}</strong></td>
      <td>${d.lokalitat_name || '?'}</td>
      <td><small>${(d.kurzes_regest || '').substring(0, 80)}</small></td>
      <td><small>${(d.beschenkte_institution_text || '').substring(0, 50)}</small></td>
      <td>${d.verfalscht ? '✗' : '✓'}</td>
    </tr>
  `).join('');
  
  document.getElementById('table-body').innerHTML = rows || '<tr><td colspan="5" style="text-align: center; padding: 20px;">Žádné listiny</td></tr>';
  
  updatePagination(totalPages);
}

function updatePagination(totalPages) {
  const paginationDiv = document.getElementById('pagination');
  
  if (totalPages <= 1) {
    paginationDiv.innerHTML = '';
    return;
  }
  
  let html = '';
  
  if (currentPage > 1) {
    html += `<button onclick="goToPage(${currentPage - 1})">← Pred</button>`;
  }
  
  const startPage = Math.max(1, currentPage - 2);
  const endPage = Math.min(totalPages, currentPage + 2);
  
  if (startPage > 1) {
    html += '<button onclick="goToPage(1)">1</button>';
    if (startPage > 2) html += '<span>...</span>';
  }
  
  for (let i = startPage; i <= endPage; i++) {
    if (i === currentPage) {
      html += `<button class="active" onclick="goToPage(${i})">${i}</button>`;
    } else {
      html += `<button onclick="goToPage(${i})">${i}</button>`;
    }
  }
  
  if (endPage < totalPages) {
    if (endPage < totalPages - 1) html += '<span>...</span>';
    html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
  }
  
  if (currentPage < totalPages) {
    html += `<button onclick="goToPage(${currentPage + 1})">Dal →</button>`;
  }
  
  paginationDiv.innerHTML = html;
}

function goToPage(page) {
  currentPage = page;
  const data = getFilteredData();
  const totalPages = Math.ceil(data.length / itemsPerPage);
  const start = (currentPage - 1) * itemsPerPage;
  const pageData = data.slice(start, start + itemsPerPage);
  
  const rows = pageData.map(d => `
    <tr>
      <td><strong>${d.Datum || '?'}</strong></td>
      <td>${d.lokalitat_name || '?'}</td>
      <td><small>${(d.kurzes_regest || '').substring(0, 80)}</small></td>
      <td><small>${(d.beschenkte_institution_text || '').substring(0, 50)}</small></td>
      <td>${d.verfalscht ? '✗' : '✓'}</td>
    </tr>
  `).join('');
  
  document.getElementById('table-body').innerHTML = rows;
  updatePagination(totalPages);
  document.querySelector('.table-wrapper').scrollIntoView({ behavior: 'smooth' });
}

function resetFilters() {
  document.getElementById('periode-select').value = '';
  document.getElementById('issuer-select').value = '';
  document.getElementById('place-select').value = '';
  document.getElementById('regest-search').value = '';
  document.getElementById('institution-select').value = '';
  updateTable();
}

document.getElementById('periode-select').addEventListener('change', updateTable);
document.getElementById('issuer-select').addEventListener('change', updateTable);
document.getElementById('place-select').addEventListener('change', updateTable);
document.getElementById('regest-search').addEventListener('input', updateTable);
document.getElementById('institution-select').addEventListener('change', updateTable);

initFilters();
updateTable();
</script>
